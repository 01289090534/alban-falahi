<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0877b9">
<title>ألبان فلاحي | دخول العميل</title>
<link rel="stylesheet" href="brand.css">
<script src="customer-branding.js?v=20260919-1245"></script>
<style>
:root{--b:#0877b9;--t:#16b8b0;--ink:#17324a;--muted:#778990}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:linear-gradient(145deg,#eefbfc,#f8fbfc);color:var(--ink);display:grid;place-items:center;padding:18px}
.wrap{width:min(470px,100%)}.brand{display:flex;justify-content:center;margin-bottom:14px}.brand img{width:78px;height:78px;border-radius:22px;object-fit:contain;background:#fff;border:1px solid #dcecef;box-shadow:0 10px 28px #0877b914}
.card{background:#fff;border:1px solid #dcecef;border-radius:28px;padding:26px 20px 22px;box-shadow:0 18px 55px #0877b914}
h1{text-align:center;color:var(--b);font-size:25px;margin:0 0 7px}p{text-align:center;color:var(--muted);font-size:12px;line-height:1.7;margin:0 0 20px}
label{display:block;font-size:12px;font-weight:900;margin:11px 0 6px}.field{width:100%;height:52px;border:1px solid #d9eaed;border-radius:15px;padding:0 13px;outline:0;background:#fbfeff}.field:focus{border-color:#79cbd1;box-shadow:0 0 0 3px #16b8b014}
.go{width:100%;height:54px;border:0;border-radius:15px;background:linear-gradient(135deg,var(--b),var(--t));color:#fff;font-weight:950;font-size:15px;margin-top:16px;cursor:pointer}.go:disabled{opacity:.65}
.err{display:none;background:#fff1f1;color:#a00000;padding:10px 11px;border-radius:11px;font-size:12px;margin-top:10px}
.note{text-align:center;color:#91a0a5;font-size:10px;margin-top:15px}
.lang{display:block;margin:0 auto 12px;border:1px solid #dcecef;background:#fff;color:var(--b);border-radius:12px;padding:8px 12px;font-weight:900}
</style>
<link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="manifest" href="manifest.webmanifest"></head>
<body>
<main class="wrap">
<button class="lang" id="langBtn" type="button" onclick="toggleLanguage()">English</button>
<div class="brand"><img class="afp-logo-img" src="https://qxwvuxkbcghbkztjrzon.supabase.co/storage/v1/object/public/product-images/customer-branding/logo-1789649767844-766cb413-5329-412c-b6ce-cbe417806311.jpg" alt="ألبان فلاحي"></div>
<section class="card">
<h1 id="title">دخول العميل</h1>
<p id="sub">ادخل رقم الموبايل والـPIN للمتابعة إلى الصفحة الرئيسية</p>
<div id="nameField" style="display:none"><label id="nameLabel">الاسم</label><input id="name" class="field" autocomplete="name" placeholder="الاسم"></div>
<label id="mobileLabel">رقم الموبايل</label>
<input id="mobile" class="field" inputmode="tel" autocomplete="tel" placeholder="01xxxxxxxxx">
<label id="pinLabel">الـPIN (6 أرقام)</label>
<input id="pin" class="field" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password" placeholder="••••••">
<div id="err" class="err"></div>
<div id="confirmField" style="display:none"><label id="confirmLabel">تأكيد الـPIN</label><input id="confirmPin" class="field" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password" placeholder="••••••"></div>
<button id="loginBtn" class="go" type="button" onclick="submitAuth()">دخول إلى ألبان فلاحي</button>
<button id="switchBtn" type="button" style="width:100%;height:46px;border:1px solid #dcecef;border-radius:15px;background:#fff;color:var(--b);font-weight:900;font-size:13px;margin-top:10px;cursor:pointer" onclick="toggleMode()">إنشاء عميل جديد</button>
<div class="note" id="note">بعد تسجيل الدخول هتنتقل تلقائيًا إلى الصفحة الرئيسية</div>
</section>
</main>
<script>
const U='https://qxwvuxkbcghbkztjrzon.supabase.co';
const API=U+'/functions/v1/customer-auth';
let lang=localStorage.getItem('alban_lang')||'ar';
let registerMode=false;
function toggleMode(){registerMode=!registerMode;document.getElementById('err').style.display='none';apply()}
function apply(){
 document.documentElement.lang=lang;document.documentElement.dir=lang==='en'?'ltr':'rtl';
 document.getElementById('langBtn').textContent=lang==='en'?'العربية':'English';
 document.getElementById('title').textContent=lang==='en'?(registerMode?'Create Customer Account':'Customer Login'):(registerMode?'إنشاء حساب عميل جديد':'دخول العميل');
 document.getElementById('sub').textContent=lang==='en'?(registerMode?'Enter your name, mobile number and PIN':'Enter your mobile number and PIN to continue to the home page'):(registerMode?'ادخل اسمك ورقم الموبايل والـPIN':'ادخل رقم الموبايل والـPIN للمتابعة إلى الصفحة الرئيسية');
 document.getElementById('mobileLabel').textContent=lang==='en'?'Mobile number':'رقم الموبايل';
 document.getElementById('pinLabel').textContent=lang==='en'?'PIN (6 digits)':'الـPIN (6 أرقام)';
 document.getElementById('nameLabel').textContent=lang==='en'?'Name':'الاسم';
 document.getElementById('confirmLabel').textContent=lang==='en'?'Confirm PIN':'تأكيد الـPIN';
 document.getElementById('loginBtn').textContent=lang==='en'?(registerMode?'Create Account':'Enter Alban Falahi'):(registerMode?'إنشاء الحساب':'دخول إلى ألبان فلاحي');
 document.getElementById('switchBtn').textContent=lang==='en'?(registerMode?'I already have an account':'Create new customer'):(registerMode?'عندي حساب بالفعل':'إنشاء عميل جديد');
 document.getElementById('nameField').style.display=registerMode?'block':'none';
 document.getElementById('confirmField').style.display=registerMode?'block':'none';
 document.getElementById('note').textContent=lang==='en'?(registerMode?'After creating your account, you will enter the home page':'After login, you will be redirected automatically to the home page'):(registerMode?'بعد إنشاء الحساب هتدخل تلقائيًا للصفحة الرئيسية':'بعد تسجيل الدخول هتنتقل تلقائيًا إلى الصفحة الرئيسية');
}
function toggleLanguage(){lang=lang==='en'?'ar':'en';localStorage.setItem('alban_lang',lang);apply()}
function normalizePhone(v){let p=String(v||'').replace(/\D/g,'');if(p.startsWith('20')&&p.length===12)p='0'+p.slice(2);return p}
async function submitAuth(){
 const mobile=normalizePhone(document.getElementById('mobile').value),pin=document.getElementById('pin').value.trim(),err=document.getElementById('err'),btn=document.getElementById('loginBtn');
 const name=document.getElementById('name').value.trim(),confirmPin=document.getElementById('confirmPin').value.trim();
 err.style.display='none';
 if(registerMode&&!name){err.textContent=lang==='en'?'Enter your name':'اكتب اسمك';err.style.display='block';return}
 if(!/^01[0125]\d{8}$/.test(mobile)||!/^[0-9]{6}$/.test(pin)){err.textContent=lang==='en'?'Check your mobile number and 6-digit PIN':'راجع رقم الموبايل والـPIN المكون من 6 أرقام';err.style.display='block';return}
 if(registerMode&&pin!==confirmPin){err.textContent=lang==='en'?'PINs do not match':'تأكيد الـPIN غير مطابق';err.style.display='block';return}
 btn.disabled=true;
 try{
  const body=registerMode?{action:'register',full_name:name,phone:mobile,pin}:{action:'login',phone:mobile,pin};
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const d=await r.json();
  if(!r.ok||!d.success)throw Error(d.error||'تعذر إتمام العملية');
  if(registerMode){
   const lr=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',phone:mobile,pin})});
   const ld=await lr.json();
   if(!lr.ok||!ld.success)throw Error(ld.error||'تم إنشاء الحساب لكن تعذر تسجيل الدخول تلقائيًا');
   localStorage.setItem('alban_auth_session',JSON.stringify(ld.session));
   localStorage.setItem('alban_customer_id',ld.customer.id);
   localStorage.setItem('alban_customer_name',ld.customer.full_name||name);
   localStorage.setItem('alban_customer_phone',ld.customer.phone||mobile);
  }else{
   localStorage.setItem('alban_auth_session',JSON.stringify(d.session));
   localStorage.setItem('alban_customer_id',d.customer.id);
   localStorage.setItem('alban_customer_name',d.customer.full_name||'');
   localStorage.setItem('alban_customer_phone',d.customer.phone||mobile);
  }
  location.replace('index.html');
 }catch(e){err.textContent=e.message;err.style.display='block'}
 finally{btn.disabled=false;apply()}
}

async function login(){
 const mobile=normalizePhone(document.getElementById('mobile').value),pin=document.getElementById('pin').value.trim(),err=document.getElementById('err'),btn=document.getElementById('loginBtn');
 err.style.display='none';
 if(!/^01[0125]\d{8}$/.test(mobile)||!/^\d{6}$/.test(pin)){err.textContent=lang==='en'?'Check your mobile number and 6-digit PIN':'راجع رقم الموبايل والـPIN المكون من 6 أرقام';err.style.display='block';return}
 btn.disabled=true;btn.textContent=lang==='en'?'Signing in...':'جاري الدخول...';
 try{
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',phone:mobile,pin})});
  const d=await r.json();
  if(!r.ok||!d.success)throw Error(d.error||'تعذر تسجيل الدخول');
  localStorage.setItem('alban_auth_session',JSON.stringify(d.session));
  localStorage.setItem('alban_customer_id',d.customer.id);
  localStorage.setItem('alban_customer_name',d.customer.full_name||'');
  localStorage.setItem('alban_customer_phone',d.customer.phone||mobile);
  location.replace('index.html');
 }catch(e){err.textContent=e.message;err.style.display='block'}
 finally{btn.disabled=false;apply()}
}
try{
 const s=JSON.parse(localStorage.getItem('alban_auth_session')||'null');
 if(s&&s.access_token) location.replace('index.html');
}catch(e){localStorage.removeItem('alban_auth_session')}
apply();
</script>
</body>
</html>
