name: Attach admin categorized products
on:
  push:
    branches: [main]
jobs:
  patch-admin:
    if: ${{ !contains(github.event.head_commit.message, '[admin-products-categories]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Attach categorized products script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('admin/index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="/admin/products-categories.js?v=1"></script>'
          if tag not in s:
              marker='</script></body></html>'
              if marker not in s:
                  raise SystemExit('admin closing marker not found')
              s=s.replace(marker,'</script>'+tag+'</body></html>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/index.html
          git diff --cached --quiet || git commit -m 'Attach categorized admin products [admin-products-categories]'
          git push
