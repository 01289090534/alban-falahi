name: Install PWA shells
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ github.event.head_commit.message != 'chore: add PWA shells to all root pages' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch root HTML pages
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for p in Path('.').glob('*.html'):
              s=p.read_text(encoding='utf-8')
              if 'pwa-install.js' in s:
                  continue
              role='driver' if 'driver' in p.name.lower() else ('store' if p.name.lower().startswith('admin') else 'customer')
              manifest={'driver':'driver-manifest.webmanifest','store':'store-manifest.webmanifest','customer':'manifest.webmanifest'}[role]
              s=s.replace('<link rel="manifest" href="manifest.webmanifest">',f'<link rel="manifest" href="{manifest}">',1)
              if '<head>' in s:
                  s=s.replace('</head>', '<script src="pwa-install.js?v=1" defer></script></head>', 1)
                  p.write_text(s,encoding='utf-8')
          PY
      - name: Commit PWA shell changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html'
          git diff --cached --quiet && exit 0
          git commit -m 'chore: add PWA shells to all root pages'
          git push
