name: temp-extend-prep-fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'Fix shop extend prep action'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch extendOrder
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('admin/index.html')
          s=p.read_text(encoding='utf-8')
          old="function extendOrder(id){const o=orders.find(x=>x.id===id);if(!o)return;const current=new Date(o.prep_deadline_at||Date.now()).getTime();updateOrder(id,'preparing',{prep_deadline_at:new Date(current+10*60000).toISOString()})}"
          new="async function extendOrder(id){const o=orders.find(x=>x.id===id);if(!o)return;const current=new Date(o.prep_deadline_at||Date.now()).getTime();try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify({action:'extend_prep',order_id:id,minutes:10})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.success)throw Error(d.error||d.message||'تعذر إضافة الوقت');await loadOrders()}catch(e){alert(e.message)}}"
          if old not in s:
              raise SystemExit('target not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/index.html
          git commit -m 'Fix shop extend prep action'
          git push