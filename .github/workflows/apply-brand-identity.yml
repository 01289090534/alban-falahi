name: Apply Alban Falahi brand identity
on:
  push:
    paths:
      - brand.css
      - favicon.svg
      - manifest.webmanifest
      - .github/workflows/apply-brand-identity.yml
permissions:
  contents: write
jobs:
  brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject brand assets into HTML pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for p in Path('.').glob('*.html'):
              s=p.read_text(encoding='utf-8')
              changed=False
              if '<link rel="stylesheet" href="brand.css">' not in s:
                  s=s.replace('</head>','<link rel="stylesheet" href="brand.css"></head>',1)
                  changed=True
              if '<link rel="icon" href="favicon.svg"' not in s:
                  s=s.replace('</head>','<link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="manifest" href="manifest.webmanifest"></head>',1)
                  changed=True
              if changed:
                  p.write_text(s,encoding='utf-8')
          PY
      - name: Commit branded pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html'
          git diff --cached --quiet || git commit -m 'Apply unified Alban Falahi visual identity'
          git push
