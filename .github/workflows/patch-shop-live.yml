name: patch shop live updates
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply live order fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('admin/index.html')
          s=p.read_text()
          old="const sb=window.supabase.createClient(SUPA,KEY);"
          new="const sb=window.supabase.createClient(SUPA,KEY,{accessToken:async()=>session?.access_token||null});"
          if old in s: s=s.replace(old,new,1)
          old="async function loadOrders(){orders=await api({action:'orders'});render();if(enabledSound)syncPendingAlarm()}"
          new="async function loadOrders(){try{orders=await api({action:'orders'});render();if(enabledSound)syncPendingAlarm()}catch(e){console.error('loadOrders',e)}}"
          if old in s: s=s.replace(old,new,1)
          old="}).subscribe((status,err)=>{if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'){console.error(status,err);liveRetry=setTimeout(startLiveOrders,2000)}})}catch(e){console.error(e);liveRetry=setTimeout(startLiveOrders,2000)}}"
          new="}).subscribe((status,err)=>{if(status==='SUBSCRIBED'){loadOrders();if(enabledSound)syncPendingAlarm()}else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'||status==='CLOSED'){console.error(status,err);liveRetry=setTimeout(startLiveOrders,1000)}})}catch(e){console.error(e);liveRetry=setTimeout(startLiveOrders,1000)}}"
          if old in s: s=s.replace(old,new,1)
          old="if(session&&me){render();document.getElementById('modal').classList.remove('hidden');loadOrders();startLiveOrders();setInterval(()=>{if(document.visibilityState==='visible')loadOrders()},5000)}else showLogin();"
          new="if(session&&me){render();document.getElementById('modal').classList.remove('hidden');loadOrders();startLiveOrders();let shopPollBusy=false;setInterval(async()=>{if(document.visibilityState!=='visible'||shopPollBusy)return;shopPollBusy=true;try{await loadOrders()}finally{shopPollBusy=false}},1000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){loadOrders();startLiveOrders()}});window.addEventListener('focus',()=>{loadOrders();startLiveOrders()})}else showLogin();"
          if old not in s: raise SystemExit('target startup block not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit and remove patch workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/index.html .github/workflows/patch-shop-live.yml
          git rm .github/workflows/patch-shop-live.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: keep shop orders live without refresh'
          git push
