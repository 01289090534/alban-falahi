name: Attach menu availability
on:
  push:
    branches: [main]
jobs:
  patch-menu:
    if: ${{ !contains(github.event.head_commit.message, '[menu-availability]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Attach availability script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('menu.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="menu-availability.js"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'</body>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add menu.html
          git diff --cached --quiet || git commit -m 'Attach menu availability [menu-availability]'
          git push