          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add menu.html admin/index.html
          git diff --cached --quiet || git commit -m 'Fix shop prep deadline triple alerts [menu-availability]'
          git push
EOF
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add menu.html admin/index.html .github/workflows/attach-menu-availability.yml
