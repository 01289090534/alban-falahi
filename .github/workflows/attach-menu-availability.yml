          replacement="""function prepAlertKey(o){return 'af_prep_alert_'+o.id+'_'+String(o.prep_started_at||'')}\nfunction prepAlertState(o){try{return JSON.parse(localStorage.getItem(prepAlertKey(o))||'{}')}catch{return {}}}\nfunction savePrepAlertState(o,state){try{localStorage.setItem(prepAlertKey(o),JSON.stringify(state))}catch{}}\nfunction triplePrepBeep(){beep(560,.25);setTimeout(()=>beep(560,.25),350);setTimeout(()=>beep(560,.25),700)}\nfunction updateTimers(){orders.filter(o=>o.status==='preparing').forEach(o=>{const el=document.getElementById('timer-'+o.id);if(!el)return;el.textContent=timerText(o);el.classList.toggle('dangerTimer',o.prep_deadline_at&&new Date(o.prep_deadline_at).getTime()<=Date.now());const start=new Date(o.prep_started_at).getTime(),initial=start+Number(o.prep_initial_minutes||15)*60000,final=o.prep_deadline_at?new Date(o.prep_deadline_at).getTime():initial,now=Date.now();if(enabledSound&&now>=initial){const st=prepAlertState(o),minute=Math.floor((now-initial)/60000),deadlineKey=String(final);if(!st.initial){triplePrepBeep();st.initial=true;st.lastMinute=minute;st.lastFinalAlert=deadlineKey;savePrepAlertState(o,st)}else if(now>=final&&st.lastFinalAlert!==deadlineKey){triplePrepBeep();st.lastFinalAlert=deadlineKey;st.lastMinute=minute;savePrepAlertState(o,st)}else if(minute>0&&minute!==st.lastMinute){beep(420,.35);st.lastMinute=minute;savePrepAlertState(o,st)}}});setTimeout(updateTimers,1000)}"""
          ns,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('shop prep alert block not found')
