name: keep shop print settings
on:
  push:
    paths:
      - '.github/workflows/keep-shop-print-settings.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch shop print settings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('admin/index.html')
          s=p.read_text()
          old="<div class=\"settingsRow\"><div><b>مقاس ورقة التحضير</b><div class=\"muted\" style=\"font-size:13px;margin-top:4px\">اختر المقاس المناسب للطابعة الحرارية.</div></div><select id=\"printSize\" class=\"field\" style=\"width:125px;margin:0\" onchange=\"savePrintSettings()\"><option value=\"58\">58 مم</option><option value=\"80\">80 مم</option></select></div><div class=\"actions\" style=\"justify-content:flex-end\">"
          new="<div class=\"settingsRow\"><div><b>مقاس ورقة التحضير</b><div class=\"muted\" style=\"font-size:13px;margin-top:4px\">اختر المقاس المناسب للطابعة الحرارية.</div></div><select id=\"printSize\" class=\"field\" style=\"width:125px;margin:0\" onchange=\"savePrintSettings()\"><option value=\"58\">58 مم</option><option value=\"80\">80 مم</option></select></div><div class=\"settingsRow\"><div><b>اسم الطابعة</b><div class=\"muted\" style=\"font-size:13px;margin-top:4px\">يتم حفظ الاسم ليظهر لك بنفس الاختيار كل مرة.</div></div><input id=\"printPrinter\" class=\"field\" style=\"width:180px;margin:0\" placeholder=\"اسم الطابعة\" onchange=\"savePrintSettings()\" oninput=\"savePrintSettings()\"></div><div class=\"actions\" style=\"justify-content:flex-end\">"
          if old not in s: raise SystemExit('print size UI pattern not found')
          s=s.replace(old,new,1)
          old="function getPrintSettings(){try{return Object.assign({autoPrint:false,size:'80'},JSON.parse(localStorage.getItem('af_shop_print_settings')||'{}'))}catch{return {autoPrint:false,size:'80'}}}"
          new="function getPrintSettings(){try{return Object.assign({autoPrint:false,size:'80',printer:''},JSON.parse(localStorage.getItem('af_shop_print_settings')||'{}'))}catch{return {autoPrint:false,size:'80',printer:''}}}"
          if old not in s: raise SystemExit('getPrintSettings pattern not found')
          s=s.replace(old,new,1)
          old="function savePrintSettings(){const s=getPrintSettings();s.size=document.getElementById('printSize')?.value||s.size;s.autoPrint=document.getElementById('autoPrintSwitch')?.classList.contains('on')??s.autoPrint;localStorage.setItem('af_shop_print_settings',JSON.stringify(s));updatePrintSettingsUI()}"
          new="function savePrintSettings(){const s=getPrintSettings();s.size=document.getElementById('printSize')?.value||s.size;s.printer=document.getElementById('printPrinter')?.value??s.printer;s.autoPrint=document.getElementById('autoPrintSwitch')?.classList.contains('on')??s.autoPrint;localStorage.setItem('af_shop_print_settings',JSON.stringify(s));updatePrintSettingsUI()}"
          if old not in s: raise SystemExit('savePrintSettings pattern not found')
          s=s.replace(old,new,1)
          old="function updatePrintSettingsUI(){const s=getPrintSettings(),sw=document.getElementById('autoPrintSwitch'),sel=document.getElementById('printSize');if(sw)sw.classList.toggle('on',!!s.autoPrint);if(sel)sel.value=s.size||'80'}"
          new="function updatePrintSettingsUI(){const s=getPrintSettings(),sw=document.getElementById('autoPrintSwitch'),sel=document.getElementById('printSize'),pr=document.getElementById('printPrinter');if(sw)sw.classList.toggle('on',!!s.autoPrint);if(sel)sel.value=s.size||'80';if(pr)pr.value=s.printer||''}"
          if old not in s: raise SystemExit('updatePrintSettingsUI pattern not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: persist shop printer name and paper size'
          git push
