name: Attach shop order action selects
on:
  push:
    branches: [main]
jobs:
  patch-shop:
    if: ${{ !contains(github.event.head_commit.message, '[order-action-selects]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Attach dropdown script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('admin/index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="/admin/order-action-selects.js?v=1"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'</body>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/index.html .github/workflows/attach-order-action-selects.yml
          git diff --cached --quiet || git commit -m 'Attach shop order action selects [order-action-selects]'
          git push
      - name: Remove one-shot workflow
        run: |
          git rm .github/workflows/attach-order-action-selects.yml
          git commit -m 'chore: remove order action selects workflow [order-action-selects]' || true
          git push || true
