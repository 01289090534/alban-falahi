name: Attach dynamic delivery ETA
on:
  push:
    paths:
      - delivery-eta.js
      - .github/workflows/inject-delivery-eta.yml
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for other menu writers
        run: sleep 45
      - name: Attach ETA script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('menu.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<span id="eta">🕐 20 - 30 دقيقة</span>','<span id="eta">🕐 جاري حساب وقت التوصيل...</span>',1)
          tag='<script src="delivery-eta.js?v=3"></script>'
          if 'delivery-eta.js' not in s:
              s=s.replace('</body>',tag+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add menu.html
          git diff --cached --quiet || git commit -m 'Fix dynamic delivery ETA display'
          git push