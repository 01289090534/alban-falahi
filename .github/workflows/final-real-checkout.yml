name: Final real checkout
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finalize checkout
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('menu.html');s=p.read_text(encoding='utf-8')
          fn="""async function submitOrder(){if(!cart.length)return;const selectedAddress=savedAddresses.find(x=>Number(x.id)===Number(selectedAddressId)),address=selectedAddress?addressToText(selectedAddress):document.getElementById('newAddressLine').value.trim(),branchId=document.getElementById('branch').value;if(!branchId||!address){showError('من فضلك اختر الفرع واكتب العنوان');return}const btn=document.getElementById('confirmBtn');btn.disabled=true;hideError();const payload={customer_id:customerId,customer_name:customerName,customer_phone:localStorage.getItem('alban_customer_phone')||'',branch_id:Number(branchId),customer_address:address,payment_method:selectedPayment,tip_amount:tipAmount,promo_code:document.getElementById('promoCode').value.trim(),delivery_notes:document.getElementById('deliveryNotes').value.trim(),items:cart.map(x=>({product_id:x.product_id,quantity:x.quantity,notes:x.note||''}))};try{const endpoint=selectedPayment==='card'?'card-order':'create-order';const r=await fetch(API+endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}),d=await r.json();if(!r.ok||!d.success){showError(d.error||'تعذر إنشاء الطلب');btn.disabled=false;return}if(selectedPayment==='card'){if(!d.checkout_url){showError('تعذر فتح الدفع بالبطاقة حاليًا');btn.disabled=false;return}window.location.href=d.checkout_url;return}localStorage.removeItem(CART_KEY);cart=[];document.getElementById('cartBox').classList.remove('open');document.getElementById('cartBar').classList.remove('show');document.getElementById('orderSuccess').style.display='block';document.getElementById('orderNumber').innerHTML='رقم الطلب: '+d.order.id+(d.order.estimated_delivery_at?'<br><strong>🕐 موعد التوصيل: '+new Date(d.order.estimated_delivery_at).toLocaleString('ar-EG')+'</strong>':'');window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}"""
          s=re.sub(r'async function submitOrder\(\)\{.*?\}\s*function showError',fn+'function showError',s,count=1,flags=re.S)
          s=re.sub(r'<!-- ALBAN_FINAL_CUSTOMER_UI_V1 -->','',s)
          s=re.sub(r'\n<!-- ALBAN_CUSTOMER_REAL_V1 -->','',s)
          s+='\n<!-- ALBAN_CUSTOMER_REAL_V1 -->\n'
          p.write_text(s,encoding='utf-8')
          PY
          rm -f .github/workflows/final-card-fix.yml .github/workflows/finalize-real-customer.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add menu.html .github/workflows
          git commit -m "Finalize real customer checkout behavior [skip ci]" || exit 0
          git push
