name: Inject menu rating widget
on:
  push:
    paths:
      - menu-rating-widget.js
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject script into menu.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('menu.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="menu-rating-widget.js"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'</body>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add menu.html
          git diff --cached --quiet || git commit -m 'Show latest 10 rating summary on menu'
          git push
