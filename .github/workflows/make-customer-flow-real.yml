name: Make customer flow real
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch real customer flows
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('menu.html')
          s=p.read_text(encoding='utf-8')
          old="const payload={customer_id:customerId,branch_id:Number(branchId),customer_address:address,payment_method:selectedPayment,tip_amount:tipAmount,promo_code:document.getElementById('promoCode').value.trim(),delivery_notes:document.getElementById('deliveryNotes').value.trim(),items:cart.map(x=>({product_id:x.product_id,quantity:x.quantity,notes:x.note||''}))};"
          new="const payload={customer_id:customerId,customer_name:customerName,customer_phone:localStorage.getItem('alban_customer_phone')||'',branch_id:Number(branchId),customer_address:address,payment_method:selectedPayment,tip_amount:tipAmount,promo_code:document.getElementById('promoCode').value.trim(),delivery_notes:document.getElementById('deliveryNotes').value.trim(),items:cart.map(x=>({product_id:x.product_id,quantity:x.quantity,notes:x.note||''}))};"
          if old in s: s=s.replace(old,new,1)
          old2="const r=await fetch(API+'create-order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}),d=await r.json();if(!r.ok||!d.success){showError(d.error||'تعذر إنشاء الطلب');btn.disabled=false;return}localStorage.removeItem(CART_KEY);cart=[];document.getElementById('cartBox').classList.remove('open');document.getElementById('cartBar').classList.remove('show');document.getElementById('orderSuccess').style.display='block';document.getElementById('orderNumber').innerHTML='رقم الطلب: '+d.order.id+(d.order.estimated_delivery_at?'<br><strong>🕐 موعد التوصيل: '+new Date(d.order.estimated_delivery_at).toLocaleString('ar-EG')+'</strong>':'');window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})"
          new2="const endpoint=selectedPayment==='card'?'card-order':'create-order';const r=await fetch(API+endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}),d=await r.json();if(!r.ok||!d.success){showError(d.error||'تعذر إنشاء الطلب');btn.disabled=false;return}if(selectedPayment==='card'&&d.checkout_url){window.location.href=d.checkout_url;return}localStorage.removeItem(CART_KEY);cart=[];document.getElementById('cartBox').classList.remove('open');document.getElementById('cartBar').classList.remove('show');document.getElementById('orderSuccess').style.display='block';document.getElementById('orderNumber').innerHTML='رقم الطلب: '+d.order.id+(d.order.estimated_delivery_at?'<br><strong>🕐 موعد التوصيل: '+new Date(d.order.estimated_delivery_at).toLocaleString('ar-EG')+'</strong>':'');window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})"
          if old2 in s: s=s.replace(old2,new2,1)
          s=s.replace("const avg=Number(d.summary?.average||0),count=Number(d.summary?.count||0);if(count)box.textContent='⭐ '+avg.toFixed(1)+'/5 ('+count+' تقييم)';","const avg=Number(d.summary?.average||0),count=Number(d.summary?.count||0);box.textContent=count?'⭐ '+avg.toFixed(1)+'/5 ('+count+' تقييم)':'⭐ —/5 (لسه مفيش تقييمات)';")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add menu.html
          git commit -m "Make customer payment and rating flows real [skip ci]" || exit 0
          git push
