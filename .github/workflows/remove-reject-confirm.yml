name: Remove reject confirmation
on:
  push:
    branches: [hr-system]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove confirmation dialog
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('hr-system/src/pages/EmployeeReview.tsx')
          s=p.read_text()
          old="if(!confirm('تأكيد رفض الإضافي/الحضور خارج الموعد؟'))return;"
          if old not in s:
              raise SystemExit('target text not found')
          p.write_text(s.replace(old,''))
          PY
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hr-system/src/pages/EmployeeReview.tsx
          git commit -m 'Remove reject confirmation dialog'
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/remove-reject-confirm.yml
          git commit -m 'Remove temporary reject fix workflow'
          git push
