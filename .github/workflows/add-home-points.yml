name: Add customer points badge to homepage

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  add-points-badge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add homepage points badge if missing
        shell: python
        run: |
          from pathlib import Path
          p = Path('menu.html')
          s = p.read_text(encoding='utf-8')
          marker = 'ALBAN_HOME_POINTS_BADGE_V1'
          if marker in s:
              print('Points badge already installed')
              raise SystemExit(0)

          css = '<style id="alban-home-points-style">.home-points{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:8px 11px;border-radius:999px;background:#fff8df;border:1px solid #f0d98a;color:#7a5600;font-size:13px;font-weight:900}.home-points strong{font-size:14px}</style>'
          js = """/* ALBAN_HOME_POINTS_BADGE_V1 */
          (async function(){
            try{
              const r=await fetch(API+'customer-account',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customer_id:customerId,action:'get'})});
              const d=await r.json();
              if(!r.ok||!d.success)return;
              const points=Number(d.points?.total_points??0);
              const value=Number(d.points?.value_egp??(points*0.005));
              const box=document.createElement('div');
              box.className='home-points';
              box.innerHTML='⭐ نقاطك: <strong>'+points+' نقطة = '+value.toFixed(2)+' ج</strong>';
              const name=document.getElementById('customerName');
              if(name&&name.parentNode)name.insertAdjacentElement('afterend',box);
            }catch(e){}
          })();
          """

          s = s.replace('</style></head>', css + '</style></head>', 1)
          s = s.replace('</script></body></html>', js + '</script></body></html>', 1)
          p.write_text(s, encoding='utf-8')

      - name: Commit homepage points badge
        shell: bash
        run: |
          if git diff --quiet -- menu.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add menu.html
          git commit -m "Add customer points badge to homepage [skip ci]"
          git push
