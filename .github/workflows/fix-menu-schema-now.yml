name: Fix current menu schema
on:
  push:
    paths:
      - '.github/workflows/fix-menu-schema-now.yml'
      - 'menu.html'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch menu to current Supabase schema
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('menu.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("$('eta').textContent='🕐 '+20 - 30 دقيقة", "$('eta').textContent='🕐 20 - 30 دقيقة'")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patched menu
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add menu.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix menu ETA rendering'
          git push
