name: Fix current menu schema
on:
  push:
    paths:
      - '.github/workflows/fix-menu-schema-now.yml'
      - 'menu.html'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch menu to current Supabase schema
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('menu.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('opening_time,closing_time,manual_status,rush_active,rush_minutes,eta_min_minutes,eta_max_minutes','opens_at,closes_at')
          s=s.replace('b.opening_time','b.opens_at').replace('b.closing_time','b.closes_at')
          s=s.replace("(num(b.eta_min_minutes)||20)+' - '+(num(b.eta_max_minutes)||30)+' دقيقة'","20 - 30 دقيقة")
          s=s.replace('money(p.price)','money(p.base_price)')
          s=s.replace('num(p.price)','num(p.base_price)')
          s=s.replace('money(p?.price||0)','money(p?.base_price||0)')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patched menu
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add menu.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix menu branch and product schema'
          git push
