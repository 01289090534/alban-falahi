<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ألبان فلاحي | شاشة السائق</title><link rel="stylesheet" href="driver.css?v=10"></head><body><main id="app"><div class="login"><div class="card"><div class="head"><h1>ألبان فلاحي</h1><div class="muted">جاري الاتصال...</div></div></div></div></main><script>const SB='https://qxwvuxkbcghbkztjrzon.supabase.co',KEY='sb_publishable_JI9lC4YPTCQ8CwMxzvHNIA_C24ULpWH',API=SB+'/functions/v1/driver-api',app=document.getElementById('app');let token=localStorage.getItem('af_driver_token')||'';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const h=()=>({Authorization:'Bearer '+token,apikey:KEY,'Content-Type':'application/json'});async function main(){if(!token){location.replace('driver-login.html?v=3');return}try{const r=await fetch(API,{headers:h()});const t=await r.text();let d={};try{d=JSON.parse(t)}catch{}if(!r.ok)throw Error(d.message||'تعذر الاتصال بخادم السائق ('+r.status+')');if(!d.driver)throw Error('بيانات السائق غير متاحة');const os=Array.isArray(d.orders)?d.orders:[];app.innerHTML='<div class="wrap"><div class="head top"><div><h1>ألبان فلاحي</h1><div>'+esc(d.driver.name_ar||'السائق')+' — '+(d.driver.is_available?'متاح':'مشغول')+'</div></div><button class="small" id="logout">خروج</button></div><div class="location"><span>●</span> <b>شاشة السائق تعمل</b></div><div class="card"><div class="row"><b>الطلبات الحالية</b><span class="badge">'+os.length+'</span></div>'+(!os.length?'<div class="empty">لا توجد طلبات مسندة إليك حاليًا</div>':os.map(o=>'<div class="order"><div class="orderTitle"><h3>طلب #'+esc(o.order_number||String(o.id).slice(-8))+'</h3><span class="status">'+(o.status==='assigned'?'تم التعيين':'خرج للتوصيل')+'</span></div><div class="row"><span>الإجمالي</span><b>'+esc(o.total)+' جنيه</b></div><button class="btn" data-id="'+o.id+'" data-status="'+(o.status==='assigned'?'out_for_delivery':'delivered')+'">'+(o.status==='assigned'?'🚗 بدء التوصيل':'✅ تم التسليم')+'</button></div>').join('')+'</div><button class="btn alt" id="refresh">تحديث الطلبات</button></div>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>change(b.dataset.id,b.dataset.status));document.getElementById('refresh').onclick=main;document.getElementById('logout').onclick=()=>{localStorage.removeItem('af_driver_token');location.replace('driver-login.html?v=3')}}catch(e){app.innerHTML='<div class="login"><div class="card"><div class="head"><h1>ألبان فلاحي</h1><div class="muted">تعذر تشغيل شاشة السائق</div></div><div class="error">'+esc(e.message)+'</div><button class="btn" id="retry">إعادة المحاولة</button><button class="btn alt" id="login">تسجيل الدخول من جديد</button></div></div>';document.getElementById('retry').onclick=main;document.getElementById('login').onclick=()=>{localStorage.removeItem('af_driver_token');location.replace('driver-login.html?v=3')}}}async function change(id,status){try{const r=await fetch(API,{method:'PATCH',headers:h(),body:JSON.stringify({order_id:id,status})});const t=await r.text();let d={};try{d=JSON.parse(t)}catch{}if(!r.ok)throw Error(d.message||'تعذر تحديث الطلب');main()}catch(e){alert(e.message)}}main();</script></body></html>
