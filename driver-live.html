<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ألبان فلاحي | السائق</title><style>body{font-family:Arial,sans-serif;background:#f4f7fb;margin:0;padding:20px;color:#172033}.card{max-width:560px;margin:20px auto;background:#fff;border-radius:18px;padding:22px;box-shadow:0 6px 24px #0001}.field{margin:12px 0;text-align:right}label{display:block;font-weight:700;margin-bottom:6px}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ccd4df;border-radius:10px;font-size:16px}button{width:100%;border:0;border-radius:10px;padding:13px;margin-top:10px;font-size:16px;font-weight:700;cursor:pointer;background:#1769e0;color:#fff}.alt{background:#eef2f7;color:#172033}.err{background:#fff0f0;color:#b42318;padding:12px;border-radius:10px;margin-top:12px}.ok{background:#ecfdf3;color:#087443;padding:12px;border-radius:10px;margin-top:12px}.order{border:1px solid #e1e7ef;border-radius:14px;padding:14px;margin-top:12px}.row{display:flex;justify-content:space-between;gap:12px;margin:7px 0}.muted{color:#667085}.gps{background:#eef7ff;color:#155eef;padding:10px;border-radius:10px;margin-top:10px;font-size:13px}</style><link rel="stylesheet" href="brand.css"><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="manifest" href="manifest.webmanifest"></head><body><main id="app"><div class="card"><h1>🥛 ألبان فلاحي</h1><h2>شاشة السائق</h2><p class="muted">جاري التشغيل...</p></div></main><script>var API='https://qxwvuxkbcghbkztjrzon.supabase.co/functions/v1/driver-api';var AUTH='https://qxwvuxkbcghbkztjrzon.supabase.co/functions/v1/driver-auth';var KEY='sb_publishable_JI9lC4YPTCQ8CwMxzvHNIA_C24ULpWH';var app=document.getElementById('app');var gpsWatch=null;var lastSent=0;function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#39;')}function headers(token){return {'Authorization':'Bearer '+token,'apikey':KEY,'Content-Type':'application/json'}}function login(){stopGps();app.innerHTML='<div class="card"><h1>🥛 ألبان فلاحي</h1><h2>دخول السائق</h2><div class="field"><label>رقم الموبايل</label><input id="phone" inputmode="tel" placeholder="01xxxxxxxxx"></div><div class="field"><label>PIN</label><input id="pin" type="password" inputmode="numeric" maxlength="6" placeholder="6 أرقام"></div><button id="go">دخول</button><div id="msg"></div></div>';document.getElementById('go').onclick=doLogin}function doLogin(){var b=document.getElementById('go'),m=document.getElementById('msg'),phone=document.getElementById('phone').value.trim().replace(/\s/g,''),pin=document.getElementById('pin').value.trim().replace(/\s/g,'');if(!/^01\d{9}$/.test(phone)||!/^[0-9]{6}$/.test(pin)){m.innerHTML='<div class="err">رقم الموبايل أو PIN غير صحيح.</div>';return}b.disabled=true;b.textContent='جاري التحقق...';fetch(AUTH,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({phone:phone,pin:pin}),cache:'no-store'}).then(function(r){return r.text().then(function(t){var j={};try{j=JSON.parse(t)}catch(e){}if(!r.ok||!j.access_token)throw new Error(j.message||j.error_description||('رفض الخادم الطلب '+r.status));localStorage.setItem('af_driver_token',j.access_token);if(j.refresh_token)localStorage.setItem('af_driver_refresh',j.refresh_token);load()})}).catch(function(e){m.innerHTML='<div class="err">'+esc(e.message)+'</div>';b.disabled=false;b.textContent='دخول'})}function load(){stopGps();var token=localStorage.getItem('af_driver_token')||'';if(!token){login();return}app.innerHTML='<div class="card"><h1>🥛 ألبان فلاحي</h1><p>جاري تحميل بيانات السائق...</p></div>';fetch(API,{headers:headers(token),cache:'no-store'}).then(function(r){return r.text().then(function(t){var d={};try{d=JSON.parse(t)}catch(e){}if(!r.ok)throw new Error(d.message||('خطأ من الخادم '+r.status));if(!d.driver)throw new Error('لم تصل بيانات السائق');render(d)})}).catch(function(e){app.innerHTML='<div class="card"><h1>🥛 ألبان فلاحي</h1><h2>حدث خطأ</h2><div class="err">'+esc(e.message)+'</div><button id="retry">إعادة المحاولة</button><button class="alt" id="newlogin">تسجيل الدخول من جديد</button></div>';document.getElementById('retry').onclick=load;document.getElementById('newlogin').onclick=function(){localStorage.removeItem('af_driver_token');localStorage.removeItem('af_driver_refresh');login()}})}function render(d){var orders=Array.isArray(d.orders)?d.orders:[];var html='<div class="card"><div class="row"><div><h1>🥛 ألبان فلاحي</h1><div>'+esc(d.driver.name_ar||'السائق')+'</div></div><button id="logout" style="width:auto;padding:8px 14px;margin:0;background:#dc3545">خروج</button></div><div class="ok">تم الاتصال بنجاح بالسيرفر</div><h2>الطلبات الحالية ('+orders.length+')</h2>';if(!orders.length)html+='<p class="muted">لا توجد طلبات مسندة إليك حاليًا.</p>';var live=false;orders.forEach(function(o){var next=o.status==='assigned'?'out_for_delivery':'delivered';var label=o.status==='assigned'?'🚗 بدء التوصيل':'✅ تم التسليم';if(o.status==='out_for_delivery')live=true;html+='<div class="order"><div class="row"><b>طلب #'+esc(o.order_number||String(o.id).slice(-8))+'</b><span>'+esc(o.status)+'</span></div><div class="row"><span>الإجمالي</span><b>'+esc(o.total)+' جنيه</b></div><button data-id="'+esc(o.id)+'" data-status="'+next+'">'+label+'</button></div>'});if(live)html+='<div id="gps" class="gps">📍 مشاركة موقعك المباشر مفعلة أثناء التوصيل...</div>';html+='<button class="alt" id="refresh">تحديث</button></div>';app.innerHTML=html;document.getElementById('logout').onclick=function(){stopGps();localStorage.removeItem('af_driver_token');localStorage.removeItem('af_driver_refresh');login()};document.getElementById('refresh').onclick=load;Array.prototype.forEach.call(document.querySelectorAll('[data-id]'),function(x){x.onclick=function(){change(x.getAttribute('data-id'),x.getAttribute('data-status'))}});if(live)startGps();if(window.driverOrderEnhancement)setTimeout(window.driverOrderEnhancement,100)}function startGps(){stopGps();if(!navigator.geolocation)return;gpsWatch=navigator.geolocation.watchPosition(function(p){var now=Date.now();if(now-lastSent<5000)return;lastSent=now;var token=localStorage.getItem('af_driver_token')||'';fetch(API,{method:'POST',headers:headers(token),body:JSON.stringify({action:'location',latitude:p.coords.latitude,longitude:p.coords.longitude}),cache:'no-store'}).catch(function(){})},function(){var el=document.getElementById('gps');if(el)el.textContent='📍 فعّل الموقع لمشاركة موقعك مع العميل.'},{enableHighAccuracy:true,maximumAge:5000,timeout:15000})}function stopGps(){if(gpsWatch!==null&&navigator.geolocation)navigator.geolocation.clearWatch(gpsWatch);gpsWatch=null}function change(id,status){var token=localStorage.getItem('af_driver_token')||'';fetch(API,{method:'PATCH',headers:headers(token),body:JSON.stringify({order_id:id,status:status}),cache:'no-store'}).then(function(r){return r.text().then(function(t){var j={};try{j=JSON.parse(t)}catch(e){}if(!r.ok)throw new Error(j.message||'تعذر تحديث الطلب');load()})}).catch(function(e){alert(e.message)})}load();</script><script src="driver-enhancement.js?v=1"></script></body></html>
