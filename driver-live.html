<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ألبان فلاحي | السائق</title><style>body{font-family:Arial,sans-serif;background:#f4f7fb;margin:0;padding:20px;color:#172033}.card{max-width:560px;margin:20px auto;background:#fff;border-radius:18px;padding:22px;box-shadow:0 6px 24px #0001}h1{margin-top:0}.field{margin:12px 0;text-align:right}label{display:block;font-weight:700;margin-bottom:6px}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ccd4df;border-radius:10px;font-size:16px}button{width:100%;border:0;border-radius:10px;padding:13px;margin-top:10px;font-size:16px;font-weight:700;cursor:pointer;background:#1769e0;color:#fff}.alt{background:#eef2f7;color:#172033}.err{background:#fff0f0;color:#b42318;padding:12px;border-radius:10px;margin-top:12px}.ok{background:#ecfdf3;color:#087443;padding:12px;border-radius:10px;margin-top:12px}.order{border:1px solid #e1e7ef;border-radius:14px;padding:14px;margin-top:12px}.row{display:flex;justify-content:space-between;gap:12px;margin:7px 0}.muted{color:#667085}.status{font-weight:700}</style></head><body><main id="app"><div class="card"><h1>🥛 ألبان فلاحي</h1><h2>شاشة السائق</h2><p class="muted">جاري تشغيل الشاشة...</p></div></main><script>const API='https://qxwvuxkbcghbkztjrzon.supabase.co/functions/v1/driver-api',AUTH='https://qxwvuxkbcghbkztjrzon.supabase.co/functions/v1/driver-auth',KEY='sb_publishable_JI9lC4YPTCQ8CwMxzvHNIA_C24ULpWH',app=document.getElementById('app');const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));function login(){app.innerHTML='<div class="card"><h1>🥛 ألبان فلاحي</h1><h2>دخول السائق</h2><div class="field"><label>رقم الموبايل</label><input id="phone" inputmode="tel" placeholder="01xxxxxxxxx"></div><div class="field"><label>PIN</label><input id="pin" type="password" inputmode="numeric" maxlength="6" placeholder="6 أرقام"></div><button id="go">دخول</button><div id="msg"></div></div>';document.getElementById('go').onclick=doLogin}async function doLogin(){const b=document.getElementById('go'),m=document.getElementById('msg'),phone=document.getElementById('phone').value.trim().replace(/\s+/g,''),pin=document.getElementById('pin').value.trim().replace(/\s+/g,'');if(!/^01\d{9}$/.test(phone)||!/^[0-9]{6}$/.test(pin)){m.innerHTML='<div class="err">رقم الموبايل أو PIN غير صحيح.</div>';return}b.disabled=true;b.textContent='جاري التحقق...';try{const r=await fetch(AUTH,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({phone,pin}),cache:'no-store'}),t=await r.text();let j={};try{j=JSON.parse(t)}catch{}if(!r.ok||!j.access_token)throw Error(j.message||j.error_description||('رفض الخادم الطلب '+r.status));localStorage.setItem('af_driver_token',j.access_token);await load()}catch(e){m.innerHTML='<div class="err">'+esc(e.message)+'</div>';b.disabled=false;b.textContent='دخول'}}async function load(){const token=localStorage.getItem('af_driver_token')||'';if(!token){login();return}app.innerHTML='<div class="card"><h1>🥛 ألبان فلاحي</h1><p>جاري تحميل بيانات السائق...</p></div>';try{const r=await fetch(API,{headers:{Authorization:'Bearer '+token,apikey:KEY,'Content-Type':'application/json'},cache:'no-store'}),t=await r.text();let d={};try{d=JSON.parse(t)}catch{}if(!r.ok)throw Error(d.message||('خطأ من الخادم '+r.status));if(!d.driver)throw Error('لم تصل بيانات السائق');const orders=Array.isArray(d.orders)?d.orders:[];app.innerHTML='<div class="card"><div class="row"><div><h1>🥛 ألبان فلاحي</h1><div>'+esc(d.driver.name_ar||'السائق')+'</div></div><button id="logout" style="width:auto;padding:8px 14px;margin:0;background:#dc3545">خروج</button></div><div class="ok">تم الاتصال بنجاح بالسيرفر</div><h2>الطلبات الحالية ('+orders.length+')</h2>'+(!orders.length?'<p class="muted">لا توجد طلبات مسندة إليك حاليًا.</p>':orders.map(o=>'<div class="order"><div class="row"><b>طلب #'+esc(o.order_number||String(o.id).slice(-8))+'</b><span class="status">'+esc(o.status)+'</span></div><div class="row"><span>الإجمالي</span><b>'+esc(o.total)+' جنيه</b></div><button data-id="'+esc(o.id)+'" data-status="'+(o.status==='assigned'?'out_for_delivery':'delivered')+'">'+(o.status==='assigned'?'🚗 بدء التوصيل':'✅ تم التسليم')+'</button></div>').join('')+'<button class="alt" id="refresh">تحديث</button></div>';document.getElementById('logout').onclick=()=>{localStorage.removeItem('af_driver_token');login()};document.getElementById('refresh').onclick=load;document.querySelectorAll('[data-id]').forEach(x=>x.onclick=()=>change(x.dataset.id,x.dataset.status))}catch(e){app.innerHTML='<div class="card"><h1>🥛 ألبان فلاحي</h1><h2>حدث خطأ</h2><div class="err">'+esc(e.message)+'</div><button id="retry">إعادة المحاولة</button><button class="alt" id="newlogin">تسجيل الدخول من جديد</button></div>';document.getElementById('retry').onclick=load;document.getElementById('newlogin').onclick=()=>{localStorage.removeItem('af_driver_token');login()}}}async function change(id,status){try{const token=localStorage.getItem('af_driver_token')||'',r=await fetch(API,{method:'PATCH',headers:{Authorization:'Bearer '+token,apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({order_id:id,status}),cache:'no-store'}),t=await r.text();let j={};try{j=JSON.parse(t)}catch{}if(!r.ok)throw Error(j.message||'تعذر تحديث الطلب');load()}catch(e){alert(e.message)}}load();</script></body></html>
