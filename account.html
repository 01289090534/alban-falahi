<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>حسابي - ألبان فلاحي</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f4ee;color:#202020;font-family:Arial,Tahoma,sans-serif}.container{max-width:820px;margin:auto;padding:18px}.card{background:#fff;border-radius:22px;padding:20px;margin-bottom:16px;box-shadow:0 5px 22px rgba(0,0,0,.07)}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:24px;font-weight:800}.muted{color:#777;font-size:13px;margin-top:6px}.btn{border:0;border-radius:13px;padding:11px 16px;cursor:pointer;font-weight:700}.dark{background:#222;color:#fff}.light{background:#eee;color:#222}.actions{display:flex;gap:8px;flex-wrap:wrap}.hero{background:linear-gradient(135deg,#fff,#f1eadc);text-align:center}.section{font-size:21px;font-weight:800;margin-bottom:14px}.balance{font-size:42px;font-weight:900;margin:5px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.statbox{background:#fafafa;border:1px solid #eee;border-radius:16px;padding:14px;text-align:center}.statbox strong{display:block;font-size:21px;margin-top:6px}.warning{background:#fff7dd;color:#7a5b00;padding:13px;border-radius:14px;margin-top:14px;font-size:13px}.review-box{background:#fffaf0;border:1px solid #eee0bc}.stars{display:flex;direction:rtl;justify-content:center;gap:5px;margin:12px 0}.star{font-size:35px;color:#ccc;cursor:pointer;line-height:1}.star.active{color:#f5b400}.review-title{text-align:center;font-size:20px;font-weight:800}.review-label{font-weight:700;font-size:14px;margin-top:13px}.textarea{width:100%;min-height:90px;border:1px solid #ddd;border-radius:12px;padding:12px;font-size:15px;resize:vertical}.order{border:1px solid #e9e9e9;border-radius:17px;padding:15px;margin-top:11px}.order-head{display:flex;justify-content:space-between;gap:8px;align-items:center;font-weight:800}.tag{background:#f0f0f0;border-radius:999px;padding:6px 10px;font-size:12px}.item{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed #eee;font-size:14px}.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #eee}.history-row{padding:13px 0;border-bottom:1px solid #eee}.history-top{display:flex;justify-content:space-between;gap:10px}.earned{color:#16803c}.used{color:#b3261e}.empty,.loading{text-align:center;padding:28px;color:#777}.error{background:#fff0f0;color:#a40018}.small{font-size:12px;color:#888;margin-top:4px}.success{background:#ecfff2;color:#146c36;padding:12px;border-radius:12px;text-align:center;margin-top:12px}.public-review{border-top:1px solid #eee;padding:14px 0}.public-review:first-child{border-top:0}.public-stars{color:#f5b400;letter-spacing:2px;font-size:18px}.tracking{border:1px solid #e8e2d7;background:linear-gradient(180deg,#fff,#fcfaf6)}.tracking-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.live{font-size:11px;background:#e9fff1;color:#16723b;border-radius:999px;padding:6px 10px;font-weight:800}.timeline{margin-top:18px;position:relative}.step{display:flex;gap:12px;position:relative;padding-bottom:18px}.step:last-child{padding-bottom:0}.step:before{content:"";position:absolute;right:15px;top:31px;width:2px;height:calc(100% - 20px);background:#ddd}.step:last-child:before{display:none}.dot{width:32px;height:32px;min-width:32px;border-radius:50%;background:#eee;color:#999;display:flex;align-items:center;justify-content:center;font-size:16px;z-index:1}.step.done .dot{background:#222;color:#fff}.step.current .dot{background:#f5b400;color:#222;box-shadow:0 0 0 5px rgba(245,180,0,.14)}.step-title{font-weight:800}.step-desc{font-size:12px;color:#777;margin-top:4px}.eta{margin-top:16px;padding:14px;border-radius:15px;background:#f6f1e6;text-align:center}.eta strong{display:block;font-size:22px;margin-top:5px}.tracking-note{font-size:11px;color:#888;text-align:center;margin-top:10px}@media(max-width:600px){.container{padding:12px}.card{padding:16px;border-radius:18px}.top{align-items:flex-start}.brand{font-size:20px}.balance{font-size:36px}.stats{grid-template-columns:1fr}.order-head{align-items:flex-start;flex-direction:column}.star{font-size:32px}.tracking-head{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="container"><div class="card top"><div><div class="brand">🥛 ألبان فلاحي</div><div id="customer" class="muted">جاري تحميل الحساب...</div></div><div class="actions"><button class="btn light" onclick="location.href='menu.html'">🛒 المنيو</button><button class="btn dark" onclick="logout()">خروج</button></div></div><div id="loading" class="card loading">جاري تحميل بيانات حسابك...</div><div id="error" class="card error" style="display:none"></div><main id="content" style="display:none"><section id="trackingArea" class="card tracking" style="display:none"></section><section id="reviewArea" class="card review-box" style="display:none"></section><section class="card hero"><div class="section">⭐ رصيد نقاطك</div><div id="balance" class="balance">0.00 ج</div><div id="pointsText" class="muted"></div><div id="expiry" class="warning" style="display:none"></div></section><section class="card"><div class="section">📊 ملخص النقاط</div><div class="stats"><div class="statbox"><span class="muted">النقاط المتاحة</span><strong id="totalPoints">0</strong></div><div class="statbox"><span class="muted">قيمتها بالجنيه</span><strong id="value">0.00 ج</strong></div><div class="statbox"><span class="muted">تنتهي قريبًا</span><strong id="soon">0</strong></div></div></section><section class="card"><div class="section">📦 طلباتي السابقة</div><div id="orders"></div></section><section class="card"><div class="section">⭐ سجل النقاط</div><div id="history"></div></section></main></div><script>
const ACCOUNT_URL='https://qxwvuxkbcghbkztjrzon.supabase.co/functions/v1/customer-account',REVIEWS_URL='https://qxwvuxkbcghbkztjrzon.supabase.co/functions/v1/reviews-api',customerId=localStorage.getItem('alban_customer_id');if(!customerId)location.href='index.html';let foodRating=0,deliveryRating=0,lastOrderSnapshot='';
function money(n){return Number(n||0).toFixed(2)+' ج'}function num(n){return Number(n||0).toLocaleString('ar-EG')}function dateText(v){try{return new Date(v).toLocaleDateString('ar-EG',{year:'numeric',month:'long',day:'numeric'})}catch{return v||''}}function dateTime(v){try{return new Date(v).toLocaleString('ar-EG',{year:'numeric',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}catch{return v||''}}function statusText(s){return({new:'تم استلام الطلب',confirmed:'تم تأكيد الطلب',preparing:'جاري التحضير',ready:'الطلب جاهز',out_for_delivery:'المندوب استلم الطلب • في الطريق',delivered:'تم التوصيل',cancelled:'تم إلغاء الطلب'})[s]||s||''}function paymentText(s){return({cash:'كاش',card:'Visa',wallet:'محفظة'})[s]||s||''}function logout(){['alban_customer_id','alban_customer_name','alban_customer_phone'].forEach(k=>localStorage.removeItem(k));location.href='index.html'}function stars(n){n=Number(n||0);return '★'.repeat(n)+'☆'.repeat(5-n)}
const steps=[{key:'new',title:'تم استلام طلبك',desc:'وصل طلبك بنجاح وبدأنا متابعته',icon:'✓'},{key:'confirmed',title:'تم تأكيد الطلب',desc:'تم تأكيد الطلب من الفرع',icon:'✓'},{key:'preparing',title:'جاري التحضير',desc:'بنجهز طلبك الآن بأسرع وقت',icon:'👨‍🍳'},{key:'ready',title:'الطلب جاهز',desc:'طلبك أصبح جاهزًا للتسليم',icon:'📦'},{key:'out_for_delivery',title:'المندوب استلم الطلب',desc:'الطلب خرج من الفرع وفي الطريق إليك',icon:'🛵'},{key:'delivered',title:'تم التوصيل',desc:'استلمت طلبك بالهنا والشفا ❤️',icon:'✓'}];
function statusRank(s){const r={new:0,confirmed:1,preparing:2,ready:3,out_for_delivery:4,delivered:5};return r[s]??-1}
function renderTracking(orders){const active=orders.find(o=>!['delivered','cancelled'].includes(o.status));const area=document.getElementById('trackingArea');if(!active){area.style.display='none';return}area.style.display='block';const rank=statusRank(active.status);const eta=active.estimated_delivery_at;area.innerHTML=`<div class="tracking-head"><div><div class="section" style="margin-bottom:3px">📍 متابعة طلبك #${active.id}</div><div class="muted">${dateTime(active.created_at)} • ${active.branch_name||''}</div></div><span class="live">● متابعة تلقائية</span></div><div class="timeline">${steps.map((s,i)=>{const done=i<rank,current=i===rank;return `<div class="step ${done?'done':''} ${current?'current':''}"><div class="dot">${done?'✓':s.icon}</div><div><div class="step-title">${s.title}</div><div class="step-desc">${current?statusText(active.status):s.desc}</div></div></div>`}).join('')}</div>${eta?`<div class="eta">⏱️ متوقع وصول طلبك<strong>${dateTime(eta)}</strong></div>`:''}<div class="tracking-note">يتم تحديث حالة الطلب تلقائيًا أثناء تجهيز الطلب والتوصيل</div>`}
async function loadAccount(silent=false){try{const r=await fetch(ACCOUNT_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customer_id:customerId,ts:Date.now()})}),d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'تعذر تحميل الحساب');if(!silent){document.getElementById('loading').style.display='none';document.getElementById('content').style.display='block';document.getElementById('customer').textContent=`${d.customer.full_name||''} • ${d.customer.phone||''}`}else if(document.getElementById('content').style.display==='none'){document.getElementById('loading').style.display='none';document.getElementById('content').style.display='block'}const p=d.points||{};document.getElementById('balance').textContent=money(p.value_egp);document.getElementById('pointsText').textContent=`رصيدك ${num(p.total_points)} نقطة • كل نقطة = ${Number(p.point_value||.005).toFixed(3)} ج`;document.getElementById('totalPoints').textContent=num(p.total_points);document.getElementById('value').textContent=money(p.value_egp);document.getElementById('soon').textContent=num(p.expiring_soon_points);const soon=p.expiring_soon||[];const el=document.getElementById('expiry');if(soon.length){const totalSoon=soon.reduce((s,x)=>s+Number(x.points_remaining||0),0),nearest=soon[0];el.style.display='block';el.innerHTML=`⚠️ لديك <b>${num(totalSoon)} نقطة</b> (${money(totalSoon*Number(p.point_value||.005))}) ستنتهي قريبًا. أقرب انتهاء خلال <b>${num(nearest.days_remaining)} يوم</b> — ${dateText(nearest.expires_at)}.`}else el.style.display='none';renderTracking(d.orders||[]);renderOrders(d.orders||[]);renderHistory(d.points_history||[]);if(!silent)await loadPendingReviews()}catch(e){if(!silent){document.getElementById('loading').style.display='none';const el=document.getElementById('error');el.style.display='block';el.textContent='⚠️ '+(e.message||'حدث خطأ أثناء تحميل الحساب')}}}
function renderOrders(orders){const box=document.getElementById('orders');if(!orders.length){box.innerHTML='<div class="empty">لسه مفيش طلبات ❤️<br><button class="btn dark" style="margin-top:12px" onclick="location.href=\'menu.html\'">ابدأ أول طلب</button></div>';return}box.innerHTML=orders.map(o=>`<div class="order"><div class="order-head"><span>طلب #${o.id}</span><span class="tag">${statusText(o.status)}</span></div><div class="muted">${dateTime(o.created_at)} • ${o.branch_name||''}</div>${(o.items||[]).map(i=>`<div class="item"><span>${i.product_name||''} × ${num(i.quantity)}</span><strong>${money(i.line_total)}</strong></div>`).join('')}<div class="row"><span>المنتجات</span><strong>${money(o.subtotal)}</strong></div>${Number(o.promo_discount)>0?`<div class="row"><span>خصم الكود</span><strong>-${money(o.promo_discount)}</strong></div>`:''}<div class="row"><span>رسوم الخدمة</span><strong>${money(o.service_fee)}</strong></div><div class="row"><span>التوصيل</span><strong>${Number(o.delivery_fee)>0?money(o.delivery_fee):'مجاني 🎉'}</strong></div>${Number(o.tip_amount)>0?`<div class="row"><span>إكرامية</span><strong>${money(o.tip_amount)}</strong></div>`:''}<div class="row"><span>الإجمالي</span><strong>${money(o.total)}</strong></div><div class="small">الدفع: ${paymentText(o.payment_method)}${Number(o.points_earned)>0?' • ⭐ كسبت '+num(o.points_earned)+' نقطة':''}${o.estimated_delivery_at?' • ⏱️ متوقع '+dateTime(o.estimated_delivery_at):''}</div></div>`).join('')}
function renderHistory(rows){const box=document.getElementById('history');if(!rows.length){box.innerHTML='<div class="empty">لا يوجد سجل نقاط حتى الآن</div>';return}box.innerHTML=rows.map(r=>{const earned=Number(r.points_earned||0),used=Number(r.points_used||0),remaining=Number(r.points_remaining||0),state=r.expired?'منتهية':remaining>0?'متاحة':'مستهلكة';return `<div class="history-row"><div class="history-top"><strong>${earned>0?'➕ نقاط مكتسبة':'⭐ حركة نقاط'}</strong><strong class="${earned>0?'earned':'used'}">${earned>0?'+'+num(earned):'-'+num(used)} نقطة</strong></div><div class="muted">${dateTime(r.earned_at)}${r.order_id?' • طلب #'+r.order_id:''}</div><div class="small">المتبقي: ${num(remaining)} نقطة • الحالة: ${state} • انتهاء: ${dateText(r.expires_at)}${r.days_remaining>0?' • متبقي '+num(r.days_remaining)+' يوم':''}</div></div>`}).join('')}
function ratingStars(kind,current){return [1,2,3,4,5].map(n=>`<span class="star ${n<=current?'active':''}" onclick="setRating('${kind}',${n})">★</span>`).join('')}
function setRating(kind,n){if(kind==='food')foodRating=n;else deliveryRating=n;renderReviewArea()}
async function loadPendingReviews(){const r=await fetch(REVIEWS_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'pending',customer_id:customerId})}),d=await r.json();if(!r.ok||!d.success)return;const area=document.getElementById('reviewArea');if(!d.orders.length){area.style.display='none';return}area.style.display='block';renderReviewArea(d.orders)}
function renderReviewArea(orders){const o=orders[0];const area=document.getElementById('reviewArea');area.innerHTML=`<div class="review-title">⭐ مبسوط من طلبك؟ قيّمنا</div><div class="muted" style="text-align:center">طلب #${o.id} • ${dateText(o.created_at)}</div><div class="review-label">🍽️ تقييم الأكل</div><div class="stars">${ratingStars('food',foodRating)}</div><div class="review-label">📝 رأيك في الأكل <span class="muted">(اختياري)</span></div><textarea id="foodComment" class="textarea" maxlength="1000" placeholder="اكتب رأيك في الأكل..."></textarea><div class="review-label">🚚 تقييم خدمة التوصيل</div><div class="stars">${ratingStars('delivery',deliveryRating)}</div><button class="btn dark" style="width:100%;margin-top:12px" onclick="submitReview(${o.id})">إرسال التقييم ❤️</button><div id="reviewMsg"></div>`}
async function submitReview(orderId){if(!foodRating||!deliveryRating){alert('من فضلك قيّم الأكل والدليفري من 1 إلى 5 نجوم');return}const comment=document.getElementById('foodComment')?.value||'';const r=await fetch(REVIEWS_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'submit',customer_id:customerId,order_id:orderId,food_rating:foodRating,food_comment:comment,delivery_rating:deliveryRating})}),d=await r.json();const msg=document.getElementById('reviewMsg');if(!r.ok||!d.success){msg.className='error';msg.style.display='block';msg.textContent='⚠️ '+(d.error||'تعذر إرسال التقييم');return}msg.className='success';msg.style.display='block';msg.textContent='❤️ شكرًا ليك! تم تسجيل تقييمك بنجاح';setTimeout(()=>loadPendingReviews(),900)}
loadAccount();setInterval(()=>loadAccount(true),5000);
</script></body></html>
