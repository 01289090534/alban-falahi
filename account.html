<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>حسابي - ألبان فلاحي</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f4ee;color:#202020;font-family:Arial,Tahoma,sans-serif;padding-bottom:82px}.container{max-width:820px;margin:auto;padding:18px}.card{background:#fff;border-radius:22px;padding:20px;margin-bottom:16px;box-shadow:0 5px 22px rgba(0,0,0,.07)}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:24px;font-weight:800}.muted{color:#777;font-size:13px;margin-top:6px}.settings-btn{width:46px;height:46px;border:0;border-radius:14px;background:#f1eadc;font-size:24px;cursor:pointer}.section{font-size:21px;font-weight:800;margin-bottom:14px}.hero{text-align:center;background:linear-gradient(135deg,#fff,#f1eadc)}.balance{font-size:42px;font-weight:900;margin:5px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.statbox{background:#fafafa;border:1px solid #eee;border-radius:16px;padding:14px;text-align:center}.statbox strong{display:block;font-size:21px;margin-top:6px}.warning{background:#fff7dd;color:#7a5b00;padding:13px;border-radius:14px;margin-top:14px;font-size:13px}.row{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #eee;font-size:14px}.empty,.loading{text-align:center;padding:28px;color:#777}.error{background:#fff0f0;color:#a40018}.points-mini{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}.points-badge{display:inline-block;background:#fff7dd;border:1px solid #f0dfaa;color:#6d5200;border-radius:999px;padding:7px 11px;font-size:12px;font-weight:800}.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;padding:18px 12px;z-index:200;overflow:auto}.modal.show{display:flex}.settings-card{width:min(620px,100%);background:#fff;border-radius:24px;padding:20px;box-shadow:0 12px 40px rgba(0,0,0,.2);margin-bottom:30px}.settings-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.settings-title{font-size:22px;font-weight:900}.close-btn{border:0;background:#eee;border-radius:12px;width:40px;height:40px;font-size:20px;cursor:pointer}.subhead{font-size:18px;font-weight:900;margin:20px 0 12px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:13px;font-weight:700;color:#555}.field input,.field select{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;font-size:15px;background:#fff}.field input:disabled{background:#f4f4f4;color:#777}.save{width:100%;border:0;border-radius:13px;padding:13px;background:#d35400;color:#fff;font-weight:800;font-size:15px;cursor:pointer;margin-top:12px}.address-card{border:1px solid #eee;border-radius:16px;padding:13px;margin:9px 0;background:#fafafa}.address-top{display:flex;justify-content:space-between;gap:10px;align-items:center}.address-label{font-weight:900}.default{font-size:11px;background:#fff0df;color:#b54a00;border-radius:999px;padding:5px 8px}.address-text{margin:8px 0;color:#555;font-size:14px}.address-actions{display:flex;gap:7px}.small-btn{border:0;border-radius:10px;padding:8px 10px;font-weight:700;cursor:pointer;background:#eee}.small-btn.default-btn{background:#fff0df;color:#b54a00}.add-address{width:100%;border:1px dashed #d35400;color:#d35400;background:#fff8f3;border-radius:13px;padding:12px;font-weight:800;cursor:pointer}.logout{width:100%;border:0;border-radius:13px;padding:13px;background:#fff0f0;color:#b00020;font-weight:800;font-size:15px;cursor:pointer;margin-top:20px}.note{font-size:12px;color:#777;margin-top:7px}.bottom-nav{position:fixed;z-index:100;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;box-shadow:0 -4px 18px rgba(0,0,0,.1);height:68px}.bottom-inner{width:min(820px,100%);height:100%;margin:auto;display:grid;grid-template-columns:repeat(3,1fr)}.bottom-nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;color:#777;font-size:12px;font-weight:800;gap:3px}.bottom-nav a.active{color:#d35400}.icon{font-size:22px;line-height:1}@media(max-width:600px){.container{padding:12px}.card{padding:16px}.brand{font-size:20px}.stats{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}}</style></head><body><div class="container"><div class="card top"><div><div class="brand">🥛 ألبان فلاحي</div><div id="customer" class="muted">جاري تحميل الحساب...</div><div id="topPoints" class="points-mini" style="display:none"></div></div><button class="settings-btn" onclick="openSettings()" aria-label="الإعدادات">⚙️</button></div><div id="loading" class="card loading">جاري تحميل بيانات حسابك...</div><div id="error" class="card error" style="display:none"></div><main id="content" style="display:none"><section class="card hero"><div class="section">⭐ رصيد نقاطك</div><div id="balance" class="balance">٠٫٠٠ ج.م</div><div id="pointsText" class="muted"></div></section><section class="card"><div class="section">📊 ملخص النقاط</div><div class="stats"><div class="statbox"><span class="muted">النقاط المتاحة</span><strong id="totalPoints">٠</strong></div><div class="statbox"><span class="muted">قيمتها بالجنيه</span><strong id="value">٠٫٠٠ ج.م</strong></div><div class="statbox"><span class="muted">تنتهي قريبًا</span><strong id="soon">٠</strong></div></div></section><section class="card"><div class="section">⭐ سجل النقاط</div><div id="history"></div></section></main></div><div id="settingsModal" class="modal" onclick="if(event.target===this)closeSettings()"><div class="settings-card"><div class="settings-head"><div class="settings-title">⚙️ الإعدادات</div><button class="close-btn" onclick="closeSettings()">✕</button></div><div class="subhead">👤 معلومات الحساب</div><div class="form-grid"><div class="field"><label>الاسم الأول</label><input id="firstName"></div><div class="field"><label>الاسم الأخير</label><input id="lastName"></div><div class="field full"><label>الإيميل</label><input id="email" type="email" placeholder="اختياري"></div><div class="field"><label>رقم الهاتف</label><input id="phone" disabled></div><div class="field"><label>تاريخ الميلاد (اختياري)</label><input id="birthDate" type="date"></div><div class="field"><label>الجنس (اختياري)</label><select id="gender"><option value="">اختار</option><option value="male">ذكر</option><option value="female">أنثى</option></select></div><div class="field"><label>اللغة</label><select id="language"><option value="ar">العربية</option><option value="en">English</option></select></div><div class="field"><label>الدولة</label><select id="country"><option value="Egypt">مصر 🇪🇬</option><option value="Saudi Arabia">السعودية 🇸🇦</option><option value="United Arab Emirates">الإمارات 🇦🇪</option><option value="Kuwait">الكويت 🇰🇼</option><option value="Qatar">قطر 🇶🇦</option><option value="Bahrain">البحرين 🇧🇭</option><option value="Other">أخرى</option></select></div></div><button class="save" onclick="saveProfile()">💾 حفظ معلومات الحساب</button><div class="subhead">📍 عناوين التوصيل</div><div id="addresses"></div><button class="add-address" onclick="showAddressForm()">＋ إضافة عنوان جديد</button><div id="addressForm" style="display:none"><div class="form-grid" style="margin-top:12px"><div class="field"><label>اسم العنوان</label><input id="addressLabel" placeholder="البيت / الشغل"></div><div class="field full"><label>العنوان بالتفصيل</label><input id="addressText" placeholder="المنطقة، الشارع، رقم العقار، الدور، الشقة"></div></div><label style="display:flex;gap:8px;align-items:center;margin-top:10px;font-size:13px"><input id="addressDefault" type="checkbox"> اجعله العنوان الافتراضي</label><button class="save" onclick="saveAddress()">حفظ العنوان</button></div><div class="note">يمكنك حفظ أكثر من عنوان واختيار العنوان المناسب بسرعة وقت الطلب.</div><button class="logout" onclick="logout()">🚪 تسجيل الخروج</button></div></div><nav class="bottom-nav"><div class="bottom-inner"><a href="menu.html"><span class="icon">🏠</span><span>الرئيسية</span></a><a href="orders.html"><span class="icon">📦</span><span>طلباتك</span></a><a class="active" href="account.html"><span class="icon">⭐</span><span>حسابك</span></a></div></nav><script>const ACCOUNT_URL='https://qxwvuxkbcghbkztjrzon.supabase.co/functions/v1/customer-account',customerId=localStorage.getItem('alban_customer_id');let accountData=null;if(!customerId)location.href='index.html';function arabicDigits(v){return String(v??'').replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d])}function money(n){return arabicDigits(Number(n||0).toFixed(2).replace('.', '٫'))+' ج.م'}function num(n){return Number(n||0).toLocaleString('ar-EG')}function dateTime(v){try{return new Date(v).toLocaleString('ar-EG',{year:'numeric',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}catch{return v||''}}function openSettings(){document.getElementById('settingsModal').classList.add('show');fillSettings()}function closeSettings(){document.getElementById('settingsModal').classList.remove('show')}function fillSettings(){const c=accountData?.customer||{};firstName.value=c.first_name||'';lastName.value=c.last_name||'';email.value=c.email||'';phone.value=c.phone||'';birthDate.value=c.birth_date||'';gender.value=c.gender||'';language.value=c.language||'ar';country.value=c.country||'Egypt';renderAddresses(accountData?.addresses||[])}function renderAddresses(rows){const box=document.getElementById('addresses');if(!rows.length){box.innerHTML='<div class="empty">لا يوجد عناوين محفوظة حتى الآن</div>';return}box.innerHTML=rows.map(a=>`<div class="address-card"><div class="address-top"><span class="address-label">📍 ${escapeHtml(a.label||'عنوان')}</span>${a.is_default?'<span class="default">افتراضي</span>':''}</div><div class="address-text">${escapeHtml(a.address||'')}</div><div class="address-actions">${!a.is_default?`<button class="small-btn default-btn" onclick="setDefaultAddress('${a.id}')">جعله افتراضي</button>`:''}<button class="small-btn" onclick="deleteAddress('${a.id}')">حذف</button></div></div>`).join('')}function escapeHtml(s){return String(s).replace(/[&<>'"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[x]))}async function api(body){const r=await fetch(ACCOUNT_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...body,customer_id:customerId,ts:Date.now()})});const d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'حدث خطأ');return d}async function saveProfile(){try{const d=await api({action:'update_profile',first_name:firstName.value.trim(),last_name:lastName.value.trim(),email:email.value.trim(),birth_date:birthDate.value||null,gender:gender.value||null,language:language.value,country:country.value});accountData.customer=d.customer;localStorage.setItem('alban_customer_name',d.customer.full_name||[firstName.value,lastName.value].filter(Boolean).join(' '));document.getElementById('customer').textContent='أهلاً '+(d.customer.full_name||'');alert('تم حفظ معلومات الحساب بنجاح ✅')}catch(e){alert('⚠️ '+e.message)}}function showAddressForm(){document.getElementById('addressForm').style.display='block';document.getElementById('addressLabel').focus()}async function saveAddress(){try{const d=await api({action:'save_address',label:addressLabel.value.trim()||'عنوان',address:addressText.value.trim(),is_default:addressDefault.checked});if(!accountData.addresses)accountData.addresses=[];if(d.address.is_default)accountData.addresses=accountData.addresses.map(a=>({...a,is_default:false}));accountData.addresses.unshift(d.address);renderAddresses(accountData.addresses);addressLabel.value='';addressText.value='';addressDefault.checked=false;document.getElementById('addressForm').style.display='none';alert('تم حفظ العنوان ✅')}catch(e){alert('⚠️ '+e.message)}}async function deleteAddress(id){if(!confirm('حذف هذا العنوان؟'))return;try{await api({action:'delete_address',address_id:id});accountData.addresses=accountData.addresses.filter(a=>String(a.id)!==String(id));renderAddresses(accountData.addresses)}catch(e){alert('⚠️ '+e.message)}}async function setDefaultAddress(id){try{await api({action:'default_address',address_id:id});accountData.addresses=accountData.addresses.map(a=>({...a,is_default:String(a.id)===String(id)}));renderAddresses(accountData.addresses)}catch(e){alert('⚠️ '+e.message)}}function logout(){['alban_customer_id','alban_customer_name','alban_customer_phone'].forEach(k=>localStorage.removeItem(k));location.href='index.html'}function renderHistory(rows){const box=document.getElementById('history');if(!rows.length){box.innerHTML='<div class="empty">لا يوجد سجل نقاط حتى الآن</div>';return}box.innerHTML=rows.map(r=>`<div class="row"><span>${Number(r.points_earned)>0?'⭐ كسبت '+num(r.points_earned)+' نقطة':'➖ استخدمت '+num(r.points_used)+' نقطة'}</span><strong>${dateTime(r.earned_at||r.created_at)}</strong></div>`).join('')}async function loadAccount(){try{const d=await api({});accountData=d;document.getElementById('loading').style.display='none';document.getElementById('content').style.display='block';document.getElementById('customer').textContent='أهلاً '+(d.customer.full_name||'');const p=d.points||{};document.getElementById('topPoints').style.display='flex';document.getElementById('topPoints').innerHTML=`<span class="points-badge">⭐ ${num(p.total_points)} نقطة</span><span class="points-badge">💰 معاك ${money(p.value_egp)}</span>`;document.getElementById('balance').textContent=money(p.value_egp);document.getElementById('pointsText').textContent=`رصيدك ${num(p.total_points)} نقطة • كل نقطة = ${money(p.point_value||.005).replace(' ج.م','')} ج.م`;document.getElementById('totalPoints').textContent=num(p.total_points);document.getElementById('value').textContent=money(p.value_egp);document.getElementById('soon').textContent=num(p.expiring_soon_points);renderHistory(d.points_history||[])}catch(e){document.getElementById('loading').style.display='none';const el=document.getElementById('error');el.style.display='block';el.textContent='⚠️ '+e.message}}loadAccount();</script></body></html>
