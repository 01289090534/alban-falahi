<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>حسابي - ألبان فلاحي</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f4ee;color:#202020;font-family:Arial,Tahoma,sans-serif}.container{max-width:820px;margin:auto;padding:18px}.card{background:#fff;border-radius:22px;padding:20px;margin-bottom:16px;box-shadow:0 5px 22px rgba(0,0,0,.07)}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:24px;font-weight:800}.muted{color:#777;font-size:13px;margin-top:6px}.btn{border:0;border-radius:13px;padding:11px 16px;cursor:pointer;font-weight:700}.btn.dark{background:#222;color:#fff}.btn.light{background:#eee;color:#222}.actions{display:flex;gap:8px;flex-wrap:wrap}.hero{background:linear-gradient(135deg,#fff,#f1eadc);text-align:center}.section{font-size:21px;font-weight:800;margin-bottom:14px}.balance{font-size:42px;font-weight:900;margin:5px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.statbox{background:#fafafa;border:1px solid #eee;border-radius:16px;padding:14px;text-align:center}.statbox strong{display:block;font-size:21px;margin-top:6px}.warning{background:#fff7dd;color:#7a5b00;padding:13px;border-radius:14px;margin-top:14px;font-size:13px}.order{border:1px solid #e9e9e9;border-radius:17px;padding:15px;margin-top:11px}.order-head{display:flex;justify-content:space-between;gap:8px;align-items:center;font-weight:800}.tag{background:#f0f0f0;border-radius:999px;padding:6px 10px;font-size:12px}.item{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed #eee;font-size:14px}.item:last-child{border-bottom:0}.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #eee}.row:last-child{border-bottom:0}.history-row{padding:13px 0;border-bottom:1px solid #eee}.history-row:last-child{border-bottom:0}.history-top{display:flex;justify-content:space-between;gap:10px}.earned{color:#16803c}.used{color:#b3261e}.empty,.loading{text-align:center;padding:28px;color:#777}.error{background:#fff0f0;color:#a40018}.small{font-size:12px;color:#888;margin-top:4px}@media(max-width:600px){.container{padding:12px}.card{padding:16px;border-radius:18px}.top{align-items:flex-start}.brand{font-size:20px}.balance{font-size:36px}.stats{grid-template-columns:1fr}.order-head{align-items:flex-start;flex-direction:column}}
</style>
</head><body><div class="container">
<div class="card top"><div><div class="brand">🥛 ألبان فلاحي</div><div id="customer" class="muted">جاري تحميل الحساب...</div></div><div class="actions"><button class="btn light" onclick="location.href='menu.html'">🛒 المنيو</button><button class="btn dark" onclick="logout()">خروج</button></div></div>
<div id="loading" class="card loading">جاري تحميل بيانات حسابك...</div><div id="error" class="card error" style="display:none"></div>
<main id="content" style="display:none">
<section class="card hero"><div class="section">⭐ رصيد نقاطك</div><div id="balance" class="balance">0.00 ج</div><div id="pointsText" class="muted"></div><div id="expiry" class="warning" style="display:none"></div></section>
<section class="card"><div class="section">📊 ملخص النقاط</div><div class="stats"><div class="statbox"><span class="muted">النقاط المتاحة</span><strong id="totalPoints">0</strong></div><div class="statbox"><span class="muted">قيمتها بالجنيه</span><strong id="value">0.00 ج</strong></div><div class="statbox"><span class="muted">تنتهي قريبًا</span><strong id="soon">0</strong></div></div></section>
<section class="card"><div class="section">📦 طلباتي السابقة</div><div id="orders"></div></section>
<section class="card"><div class="section">⭐ سجل النقاط</div><div id="history"></div></section>
</main></div>
<script>
const ACCOUNT_URL='https://qxwvuxkbcghbkztjrzon.supabase.co/functions/v1/customer-account';const customerId=localStorage.getItem('alban_customer_id');if(!customerId)location.href='index.html';
function money(n){return Number(n||0).toFixed(2)+' ج'}function num(n){return Number(n||0).toLocaleString('ar-EG')}function dateText(v){try{return new Date(v).toLocaleDateString('ar-EG',{year:'numeric',month:'long',day:'numeric'})}catch{return v||''}}function dateTime(v){try{return new Date(v).toLocaleString('ar-EG',{year:'numeric',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}catch{return v||''}}function statusText(s){return({new:'جديد',confirmed:'تم التأكيد',preparing:'جاري التجهيز',out_for_delivery:'في الطريق',delivered:'تم التوصيل',cancelled:'ملغي'})[s]||s||''}function paymentText(s){return({cash:'كاش',card:'Visa',wallet:'محفظة'})[s]||s||''}function logout(){['alban_customer_id','alban_customer_name','alban_customer_phone'].forEach(k=>localStorage.removeItem(k));location.href='index.html'}
async function loadAccount(){try{const r=await fetch(ACCOUNT_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customer_id:customerId})});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.error||'تعذر تحميل الحساب');document.getElementById('loading').style.display='none';document.getElementById('content').style.display='block';document.getElementById('customer').textContent=`${d.customer.full_name||''} • ${d.customer.phone||''}`;const p=d.points||{};document.getElementById('balance').textContent=money(p.value_egp);document.getElementById('pointsText').textContent=`رصيدك ${num(p.total_points)} نقطة • كل نقطة = ${Number(p.point_value||.005).toFixed(3)} ج`;document.getElementById('totalPoints').textContent=num(p.total_points);document.getElementById('value').textContent=money(p.value_egp);document.getElementById('soon').textContent=num(p.expiring_soon_points);const soon=p.expiring_soon||[];if(soon.length){const totalSoon=soon.reduce((s,x)=>s+Number(x.points_remaining||0),0),nearest=soon[0],el=document.getElementById('expiry');el.style.display='block';el.innerHTML=`⚠️ لديك <b>${num(totalSoon)} نقطة</b> (${money(totalSoon*Number(p.point_value||.005))}) ستنتهي قريبًا. أقرب انتهاء خلال <b>${num(nearest.days_remaining)} يوم</b> — ${dateText(nearest.expires_at)}.`}renderOrders(d.orders||[]);renderHistory(d.points_history||[])}catch(e){document.getElementById('loading').style.display='none';const el=document.getElementById('error');el.style.display='block';el.textContent='⚠️ '+(e.message||'حدث خطأ أثناء تحميل الحساب')}}
function renderOrders(orders){const box=document.getElementById('orders');if(!orders.length){box.innerHTML='<div class="empty">لسه مفيش طلبات ❤️<br><button class="btn dark" style="margin-top:12px" onclick="location.href=\'menu.html\'">ابدأ أول طلب</button></div>';return}box.innerHTML=orders.map(o=>`<div class="order"><div class="order-head"><span>طلب #${o.id}</span><span class="tag">${statusText(o.status)}</span></div><div class="muted">${dateTime(o.created_at)} • ${o.branch_name||''}</div>${(o.items||[]).map(i=>`<div class="item"><span>${i.product_name||''} × ${num(i.quantity)}</span><strong>${money(i.line_total)}</strong></div>`).join('')}<div class="row"><span>المنتجات</span><strong>${money(o.subtotal)}</strong></div>${Number(o.promo_discount)>0?`<div class="row"><span>خصم الكود ${o.promo_code?'('+o.promo_code+')':''}</span><strong>-${money(o.promo_discount)}</strong></div>`:''}${Number(o.points_discount)>0?`<div class="row"><span>خصم النقاط</span><strong>-${money(o.points_discount)}</strong></div>`:''}<div class="row"><span>رسوم الخدمة</span><strong>${money(o.service_fee)}</strong></div><div class="row"><span>التوصيل</span><strong>${Number(o.delivery_fee)>0?money(o.delivery_fee):'مجاني 🎉'}</strong></div>${Number(o.tip_amount)>0?`<div class="row"><span>إكرامية</span><strong>${money(o.tip_amount)}</strong></div>`:''}<div class="row"><span>الإجمالي</span><strong>${money(o.total)}</strong></div><div class="small">الدفع: ${paymentText(o.payment_method)}${Number(o.points_earned)>0?' • ⭐ كسبت '+num(o.points_earned)+' نقطة':''}</div></div>`).join('')}
function renderHistory(rows){const box=document.getElementById('history');if(!rows.length){box.innerHTML='<div class="empty">لا يوجد سجل نقاط حتى الآن</div>';return}box.innerHTML=rows.map(r=>{const earned=Number(r.points_earned||0),used=Number(r.points_used||0),remaining=Number(r.points_remaining||0),state=r.expired?'منتهية':remaining>0?'متاحة':'مستهلكة';return `<div class="history-row"><div class="history-top"><strong>${earned>0?'➕ نقاط مكتسبة':'⭐ حركة نقاط'}</strong><strong class="${earned>0?'earned':'used'}">${earned>0?'+'+num(earned):'-'+num(used)} نقطة</strong></div><div class="muted">${dateTime(r.earned_at)}${r.order_id?' • طلب #'+r.order_id:''}</div><div class="small">المتبقي: ${num(remaining)} نقطة • الحالة: ${state} • انتهاء: ${dateText(r.expires_at)}${r.days_remaining>0?' • متبقي '+num(r.days_remaining)+' يوم':''}</div></div>`}).join('')}
loadAccount();
</script></body></html>
