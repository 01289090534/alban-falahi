<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حسابي - ألبان فلاحي</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f8f5ef;color:#222;font-family:Arial,sans-serif}.container{max-width:700px;margin:auto;padding:18px}.card{background:#fff;border-radius:22px;padding:20px;margin-bottom:15px;box-shadow:0 5px 20px rgba(0,0,0,.07)}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.logo{font-size:24px;font-weight:bold}.muted{color:#777;font-size:13px;margin-top:5px}.btn{border:0;background:#222;color:#fff;border-radius:12px;padding:11px 15px;cursor:pointer}.btn.light{background:#eee;color:#222}.points{font-size:32px;font-weight:bold;margin-top:8px}.points-label{font-size:14px;color:#777}.stat{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #eee}.stat:last-child{border-bottom:0}.section{font-size:20px;font-weight:bold;margin-bottom:12px}.order{border:1px solid #eee;border-radius:16px;padding:14px;margin-top:10px}.order-head{display:flex;justify-content:space-between;font-weight:bold}.tag{background:#f1f1f1;border-radius:10px;padding:5px 9px;font-size:12px}.item{display:flex;justify-content:space-between;padding:6px 0;color:#555;font-size:14px}.warning{background:#fff6dc;padding:12px;border-radius:12px;margin-top:12px;color:#8a6200;font-size:13px}.loading,.empty{text-align:center;padding:25px;color:#777}.error{background:#fff0f0;color:#b00020}</style>
</head><body><div class="container">
<div class="card top"><div><div class="logo">🥛 ألبان فلاحي</div><div id="customer" class="muted">جاري تحميل الحساب...</div></div><button class="btn light" onclick="location.href='menu.html'">المنيو</button></div>
<div id="loading" class="card loading">جاري تحميل بيانات حسابك...</div><div id="content" style="display:none">
<div class="card"><div class="section">⭐ رصيد نقاطك</div><div id="balance" class="points">0.00 ج</div><div id="pointsText" class="points-label"></div><div id="expiry" class="warning" style="display:none"></div></div>
<div class="card"><div class="section">📊 تفاصيل النقاط</div><div class="stat"><span>إجمالي النقاط المتاحة</span><strong id="totalPoints">0</strong></div><div class="stat"><span>قيمة النقاط</span><strong id="value">0.00 ج</strong></div><div class="stat"><span>النقاط التي ستنتهي قريبًا</span><strong id="soon">0</strong></div></div>
<div class="card"><div class="section">🧾 طلباتي</div><div id="orders"></div></div><div class="card"><div class="section">⭐ سجل النقاط</div><div id="history"></div></div></div>
<div id="error" class="card error" style="display:none"></div></div>
<script>
const ACCOUNT_URL='https://qxwvuxkbcghbkztjrzon.supabase.co/functions/v1/customer-account';const customerId=localStorage.getItem('alban_customer_id');if(!customerId)location.href='index.html';
function money(n){return Number(n||0).toFixed(2)+' ج'}function dateText(v){try{return new Date(v).toLocaleDateString('ar-EG',{year:'numeric',month:'long',day:'numeric'})}catch{return v||''}}function statusText(s){return({new:'جديد',confirmed:'تم التأكيد',preparing:'جاري التجهيز',out_for_delivery:'في الطريق',delivered:'تم التوصيل',cancelled:'ملغي'})[s]||s||''}
async function loadAccount(){try{const r=await fetch(ACCOUNT_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customer_id:customerId})});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.error||'تعذر تحميل الحساب');document.getElementById('loading').style.display='none';document.getElementById('content').style.display='block';document.getElementById('customer').textContent=`${d.customer.full_name||''} • ${d.customer.phone||''}`;const p=d.points||{};document.getElementById('balance').textContent=money(p.value_egp);document.getElementById('pointsText').textContent=`كل نقطة = ${Number(p.point_value||.005).toFixed(3)} ج`;document.getElementById('totalPoints').textContent=Number(p.total_points||0);document.getElementById('value').textContent=money(p.value_egp);document.getElementById('soon').textContent=Number(p.expiring_soon_points||0);const soon=p.expiring_soon||[];if(soon.length){const x=soon[0],el=document.getElementById('expiry');el.style.display='block';el.textContent=`⚠️ لديك ${Number(x.points_remaining||0)} نقطة ستنتهي خلال ${Number(x.days_remaining||0)} يوم.`}renderOrders(d.orders||[]);renderHistory(d.points_history||[])}catch(e){document.getElementById('loading').style.display='none';const el=document.getElementById('error');el.style.display='block';el.textContent='⚠️ '+(e.message||'حدث خطأ أثناء تحميل الحساب')}}
function renderOrders(orders){const box=document.getElementById('orders');if(!orders.length){box.innerHTML='<div class="empty">لسه مفيش طلبات ❤️</div>';return}box.innerHTML=orders.map(o=>`<div class="order"><div class="order-head"><span>طلب #${o.id}</span><span class="tag">${statusText(o.status)}</span></div><div class="muted">${dateText(o.created_at)} • ${o.branch_name||''}</div>${(o.items||[]).map(i=>`<div class="item"><span>${i.product_name||''} × ${i.quantity}</span><strong>${money(i.line_total)}</strong></div>`).join('')}<div class="stat"><span>الإجمالي</span><strong>${money(o.total)}</strong></div>${Number(o.points_earned||0)>0?`<div class="muted">⭐ كسبت ${o.points_earned} نقطة من الطلب</div>`:''}</div>`).join('')}
function renderHistory(rows){const box=document.getElementById('history');if(!rows.length){box.innerHTML='<div class="empty">لا يوجد سجل نقاط حتى الآن</div>';return}box.innerHTML=rows.map(r=>`<div class="stat"><div><strong>${r.expired?'نقاط منتهية':'نقاط متاحة'}</strong><div class="muted">${dateText(r.earned_at)} • تنتهي ${dateText(r.expires_at)}</div></div><strong>${Number(r.points_remaining||0)} نقطة</strong></div>`).join('')}
loadAccount();
</script></body></html>
