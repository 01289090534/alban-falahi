<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>حسابي - ألبان فلاحي</title><style>body{margin:0;background:#f7f4ee;color:#202020;font-family:Arial,Tahoma,sans-serif}.container{max-width:820px;margin:auto;padding:18px}.card{background:#fff;border-radius:22px;padding:20px;margin-bottom:16px;box-shadow:0 5px 22px rgba(0,0,0,.07)}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:24px;font-weight:800}.muted{color:#777;font-size:13px;margin-top:6px}.btn{border:0;border-radius:13px;padding:11px 16px;cursor:pointer;font-weight:700}.dark{background:#222;color:#fff}.light{background:#eee;color:#222}.actions{display:flex;gap:8px;flex-wrap:wrap}.points-mini{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}.points-badge{display:inline-block;background:#fff7dd;border:1px solid #f0dfaa;color:#6d5200;border-radius:999px;padding:7px 11px;font-size:12px;font-weight:800}.hero{text-align:center;background:linear-gradient(135deg,#fff,#f1eadc)}.section{font-size:21px;font-weight:800;margin-bottom:14px}.balance{font-size:42px;font-weight:900;margin:5px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.statbox{background:#fafafa;border:1px solid #eee;border-radius:16px;padding:14px;text-align:center}.statbox strong{display:block;font-size:21px;margin-top:6px}.warning{background:#fff7dd;color:#7a5b00;padding:13px;border-radius:14px;margin-top:14px;font-size:13px}.order{border:1px solid #e9e9e9;border-radius:17px;padding:15px;margin-top:11px}.order-head{display:flex;justify-content:space-between;gap:8px;align-items:center;font-weight:800}.tag{background:#f0f0f0;border-radius:999px;padding:6px 10px;font-size:12px}.item,.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #eee;font-size:14px}.empty,.loading{text-align:center;padding:28px;color:#777}.error{background:#fff0f0;color:#a40018}.small{font-size:12px;color:#888;margin-top:4px}.tracking{border:1px solid #e8e2d7;background:linear-gradient(180deg,#fff,#fcfaf6)}.tracking-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.live{font-size:11px;background:#e9fff1;color:#16723b;border-radius:999px;padding:6px 10px;font-weight:800}.timeline{margin-top:18px;position:relative}.step{display:flex;gap:12px;position:relative;padding-bottom:18px}.step:last-child{padding-bottom:0}.step:before{content:"";position:absolute;right:15px;top:31px;width:2px;height:calc(100% - 20px);background:#ddd}.step:last-child:before{display:none}.dot{width:32px;height:32px;min-width:32px;border-radius:50%;background:#eee;color:#999;display:flex;align-items:center;justify-content:center;font-size:16px;z-index:1}.step.done .dot{background:#222;color:#fff}.step.current .dot{background:#f5b400;color:#222}.step-title{font-weight:800}.step-desc{font-size:12px;color:#777;margin-top:4px}.eta{margin-top:16px;padding:14px;border-radius:15px;background:#f6f1e6;text-align:center}.eta strong{display:block;font-size:22px;margin-top:5px}@media(max-width:600px){.container{padding:12px}.card{padding:16px}.brand{font-size:20px}.stats{grid-template-columns:1fr}}</style></head><body><div class="container"><div class="card top"><div><div class="brand">🥛 ألبان فلاحي</div><div id="customer" class="muted">جاري تحميل الحساب...</div><div id="topPoints" class="points-mini" style="display:none"></div></div><div class="actions"><button class="btn light" onclick="location.href='menu.html'">🛒 المنيو</button><button class="btn dark" onclick="logout()">خروج</button></div></div><div id="loading" class="card loading">جاري تحميل بيانات حسابك...</div><div id="error" class="card error" style="display:none"></div><main id="content" style="display:none"><section id="trackingArea" class="card tracking" style="display:none"></section><section class="card hero"><div class="section">⭐ رصيد نقاطك</div><div id="balance" class="balance">0.00 ج</div><div id="pointsText" class="muted"></div><div id="expiry" class="warning" style="display:none"></div></section><section class="card"><div class="section">📊 ملخص النقاط</div><div class="stats"><div class="statbox"><span class="muted">النقاط المتاحة</span><strong id="totalPoints">0</strong></div><div class="statbox"><span class="muted">قيمتها بالجنيه</span><strong id="value">0.00 ج</strong></div><div class="statbox"><span class="muted">تنتهي قريبًا</span><strong id="soon">0</strong></div></div></section><section class="card"><div class="section">📦 طلباتي السابقة</div><div id="orders"></div></section><section class="card"><div class="section">⭐ سجل النقاط</div><div id="history"></div></section></main></div><script>const ACCOUNT_URL='https://qxwvuxkbcghbkztjrzon.supabase.co/functions/v1/customer-account',customerId=localStorage.getItem('alban_customer_id');if(!customerId)location.href='index.html';function money(n){return Number(n||0).toFixed(2)+' ج'}function num(n){return Number(n||0).toLocaleString('ar-EG')}function dateTime(v){try{return new Date(v).toLocaleString('ar-EG',{year:'numeric',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}catch{return v||''}}function statusText(s){return({new:'تم استلام الطلب',confirmed:'تم تأكيد الطلب',preparing:'جاري التحضير',ready:'الطلب جاهز',out_for_delivery:'المندوب استلم الطلب • في الطريق',delivered:'تم التوصيل',cancelled:'تم إلغاء الطلب'})[s]||s||''}function paymentText(s){return({cash:'كاش',card:'Visa',wallet:'محفظة'})[s]||s||''}function logout(){['alban_customer_id','alban_customer_name','alban_customer_phone'].forEach(k=>localStorage.removeItem(k));location.href='index.html'}const steps=[{key:'new',title:'تم استلام طلبك',icon:'✓'},{key:'confirmed',title:'تم تأكيد الطلب',icon:'✓'},{key:'preparing',title:'جاري التحضير',icon:'👨‍🍳'},{key:'ready',title:'الطلب جاهز',icon:'📦'},{key:'out_for_delivery',title:'المندوب استلم الطلب',icon:'🛵'},{key:'delivered',title:'تم التوصيل',icon:'✓'}];function statusRank(s){return({new:0,confirmed:1,preparing:2,ready:3,out_for_delivery:4,delivered:5})[s]??-1}function renderTracking(orders){const active=orders.find(o=>!['delivered','cancelled'].includes(o.status));const area=document.getElementById('trackingArea');if(!active){area.style.display='none';return}area.style.display='block';const rank=statusRank(active.status);area.innerHTML=`<div class="tracking-head"><div><div class="section" style="margin-bottom:3px">📍 متابعة طلبك #${active.id}</div><div class="muted">${dateTime(active.created_at)} • ${active.branch_name||''}</div></div><span class="live">● متابعة تلقائية</span></div><div class="timeline">${steps.map((s,i)=>`<div class="step ${i<rank?'done':''} ${i===rank?'current':''}"><div class="dot">${i<rank?'✓':s.icon}</div><div><div class="step-title">${s.title}</div><div class="step-desc">${i===rank?statusText(active.status):''}</div></div></div>`).join('')}</div>${active.estimated_delivery_at?`<div class="eta">⏱️ متوقع وصول طلبك<strong>${dateTime(active.estimated_delivery_at)}</strong></div>`:''}<div class="small" style="text-align:center">يتم تحديث حالة الطلب تلقائيًا</div>`}function renderOrders(orders){const box=document.getElementById('orders');if(!orders.length){box.innerHTML='<div class="empty">لسه مفيش طلبات ❤️</div>';return}box.innerHTML=orders.map(o=>`<div class="order"><div class="order-head"><span>طلب #${o.id}</span><span class="tag">${statusText(o.status)}</span></div><div class="muted">${dateTime(o.created_at)} • ${o.branch_name||''}</div>${(o.items||[]).map(i=>`<div class="item"><span>${i.product_name||''} × ${num(i.quantity)}</span><strong>${money(i.line_total)}</strong></div>`).join('')}<div class="row"><span>المنتجات</span><strong>${money(o.subtotal)}</strong></div><div class="row"><span>رسوم الخدمة</span><strong>${money(o.service_fee)}</strong></div><div class="row"><span>التوصيل</span><strong>${Number(o.delivery_fee)>0?money(o.delivery_fee):'مجاني 🎉'}</strong></div><div class="row"><span>الإجمالي</span><strong>${money(o.total)}</strong></div><div class="small">الدفع: ${paymentText(o.payment_method)}${Number(o.points_earned)>0?' • ⭐ كسبت '+num(o.points_earned)+' نقطة':''}</div></div>`).join('')}function renderHistory(rows){const box=document.getElementById('history');if(!rows.length){box.innerHTML='<div class="empty">لا يوجد سجل نقاط حتى الآن</div>';return}box.innerHTML=rows.map(r=>`<div class="row"><span>${r.points_earned>0?'⭐ كسبت '+num(r.points_earned)+' نقطة':'➖ استخدمت '+num(r.points_used)+' نقطة'}</span><strong>${dateTime(r.earned_at||r.created_at)}</strong></div>`).join('')}async function loadAccount(silent=false){try{const r=await fetch(ACCOUNT_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customer_id:customerId,ts:Date.now()})}),d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'تعذر تحميل الحساب');document.getElementById('loading').style.display='none';document.getElementById('content').style.display='block';document.getElementById('customer').textContent=`أهلاً ${d.customer.full_name||''}`;const p=d.points||{};const points=num(p.total_points),value=money(p.value_egp);document.getElementById('topPoints').style.display='flex';document.getElementById('topPoints').innerHTML=`<span class="points-badge">⭐ ${points} نقطة</span><span class="points-badge">💰 معاك ${value}</span>`;document.getElementById('balance').textContent=value;document.getElementById('pointsText').textContent=`رصيدك ${points} نقطة • كل نقطة = ${Number(p.point_value||.005).toFixed(3)} ج`;document.getElementById('totalPoints').textContent=points;document.getElementById('value').textContent=value;document.getElementById('soon').textContent=num(p.expiring_soon_points);renderTracking(d.orders||[]);renderOrders(d.orders||[]);renderHistory(d.points_history||[])}catch(e){if(!silent){document.getElementById('loading').style.display='none';const el=document.getElementById('error');el.style.display='block';el.textContent='⚠️ '+(e.message||'حدث خطأ')}}}loadAccount();setInterval(()=>loadAccount(true),5000);</script></body></html>
