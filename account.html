<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>حسابي - ألبان فلاحي</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f4ee;color:#202020;font-family:Arial,Tahoma,sans-serif;padding-bottom:82px}.container{max-width:820px;margin:auto;padding:18px}.card{background:#fff;border-radius:22px;padding:20px;margin-bottom:16px;box-shadow:0 5px 22px rgba(0,0,0,.07)}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:24px;font-weight:800}.muted{color:#777;font-size:13px;margin-top:6px}.actions{display:flex;gap:8px}.btn{border:0;border-radius:13px;padding:11px 16px;cursor:pointer;font-weight:700}.light{background:#eee;color:#222}.hero{text-align:center;background:linear-gradient(135deg,#fff,#f1eadc)}.section{font-size:21px;font-weight:800;margin-bottom:14px}.balance{font-size:42px;font-weight:900;margin:5px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.statbox{background:#fafafa;border:1px solid #eee;border-radius:16px;padding:14px;text-align:center}.statbox strong{display:block;font-size:21px;margin-top:6px}.warning{background:#fff7dd;color:#7a5b00;padding:13px;border-radius:14px;margin-top:14px;font-size:13px}.row{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #eee;font-size:14px}.empty,.loading{text-align:center;padding:28px;color:#777}.error{background:#fff0f0;color:#a40018}.points-mini{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}.points-badge{display:inline-block;background:#fff7dd;border:1px solid #f0dfaa;color:#6d5200;border-radius:999px;padding:7px 11px;font-size:12px;font-weight:800}.bottom-nav{position:fixed;z-index:100;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;box-shadow:0 -4px 18px rgba(0,0,0,.1);height:68px}.bottom-inner{width:min(820px,100%);height:100%;margin:auto;display:grid;grid-template-columns:repeat(3,1fr)}.bottom-nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;color:#777;font-size:12px;font-weight:800;gap:3px}.bottom-nav a.active{color:#d35400}.icon{font-size:22px;line-height:1}@media(max-width:600px){.container{padding:12px}.card{padding:16px}.brand{font-size:20px}.stats{grid-template-columns:1fr}}</style></head><body><div class="container"><div class="card top"><div><div class="brand">🥛 ألبان فلاحي</div><div id="customer" class="muted">جاري تحميل الحساب...</div><div id="topPoints" class="points-mini" style="display:none"></div></div><div class="actions"><button class="btn light" onclick="logout()">خروج</button></div></div><div id="loading" class="card loading">جاري تحميل بيانات حسابك...</div><div id="error" class="card error" style="display:none"></div><main id="content" style="display:none"><section class="card hero"><div class="section">⭐ رصيد نقاطك</div><div id="balance" class="balance">0.00 ج</div><div id="pointsText" class="muted"></div><div id="expiry" class="warning" style="display:none"></div></section><section class="card"><div class="section">📊 ملخص النقاط</div><div class="stats"><div class="statbox"><span class="muted">النقاط المتاحة</span><strong id="totalPoints">0</strong></div><div class="statbox"><span class="muted">قيمتها بالجنيه</span><strong id="value">0.00 ج</strong></div><div class="statbox"><span class="muted">تنتهي قريبًا</span><strong id="soon">0</strong></div></div></section><section class="card"><div class="section">⭐ سجل النقاط</div><div id="history"></div></section></main></div><nav class="bottom-nav"><div class="bottom-inner"><a href="menu.html"><span class="icon">🏠</span><span>الرئيسية</span></a><a href="orders.html"><span class="icon">📦</span><span>طلباتك</span></a><a class="active" href="account.html"><span class="icon">⭐</span><span>حسابك</span></a></div></nav><script>const ACCOUNT_URL='https://qxwvuxkbcghbkztjrzon.supabase.co/functions/v1/customer-account',customerId=localStorage.getItem('alban_customer_id');if(!customerId)location.href='index.html';function money(n){return Number(n||0).toFixed(2)+' ج'}function num(n){return Number(n||0).toLocaleString('ar-EG')}function dateTime(v){try{return new Date(v).toLocaleString('ar-EG',{year:'numeric',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}catch{return v||''}}function logout(){['alban_customer_id','alban_customer_name','alban_customer_phone'].forEach(k=>localStorage.removeItem(k));location.href='index.html'}function renderHistory(rows){const box=document.getElementById('history');if(!rows.length){box.innerHTML='<div class="empty">لا يوجد سجل نقاط حتى الآن</div>';return}box.innerHTML=rows.map(r=>`<div class="row"><span>${Number(r.points_earned)>0?'⭐ كسبت '+num(r.points_earned)+' نقطة':'➖ استخدمت '+num(r.points_used)+' نقطة'}</span><strong>${dateTime(r.earned_at||r.created_at)}</strong></div>`).join('')}async function loadAccount(){try{const r=await fetch(ACCOUNT_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customer_id:customerId,ts:Date.now()})}),d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'تعذر تحميل الحساب');document.getElementById('loading').style.display='none';document.getElementById('content').style.display='block';document.getElementById('customer').textContent='أهلاً '+(d.customer.full_name||'');const p=d.points||{};document.getElementById('topPoints').style.display='flex';document.getElementById('topPoints').innerHTML=`<span class="points-badge">⭐ ${num(p.total_points)} نقطة</span><span class="points-badge">💰 معاك ${money(p.value_egp)}</span>`;document.getElementById('balance').textContent=money(p.value_egp);document.getElementById('pointsText').textContent=`رصيدك ${num(p.total_points)} نقطة • كل نقطة = ${Number(p.point_value||.005).toFixed(3)} ج`;document.getElementById('totalPoints').textContent=num(p.total_points);document.getElementById('value').textContent=money(p.value_egp);document.getElementById('soon').textContent=num(p.expiring_soon_points);renderHistory(d.points_history||[])}catch(e){document.getElementById('loading').style.display='none';const el=document.getElementById('error');el.style.display='block';el.textContent='⚠️ '+e.message}}loadAccount();</script></body></html>
