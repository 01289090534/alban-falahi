<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>🌿 سيوة — من واحة سيوة إلى باب بيتك</title>
<meta name="description" content="منتجات سيوة الطبيعية المختارة بعناية">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#faf8f2;color:#26332b}button{cursor:pointer;border:0;border-radius:12px;padding:11px 16px;font-weight:700}.wrap{max-width:1180px;margin:auto;padding:18px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:25px;font-weight:800}.sub{color:#6d756e}.cart{background:#263f32;color:#fff}.hero{margin-top:18px;padding:34px;border-radius:24px;background:linear-gradient(135deg,#e9dfc7,#f8f3e7);display:flex;justify-content:space-between;gap:25px;align-items:center}.hero h1{font-size:38px;margin:0 0 10px}.hero p{font-size:18px;line-height:1.8}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-top:22px}.card{background:#fff;border:1px solid #eee8da;border-radius:18px;overflow:hidden;box-shadow:0 4px 16px #00000008}.card img{width:100%;height:190px;object-fit:cover;background:#f2eee4}.body{padding:14px}.name{font-size:17px;font-weight:800;min-height:45px}.price{margin:10px 0;font-size:18px}.old{text-decoration:line-through;color:#999;margin-left:8px;font-size:14px}.add{width:100%;background:#334f3e;color:white}.empty,.loading{padding:30px;text-align:center}.drawer{position:fixed;inset:0;background:#0007;display:none}.drawer.open{display:block}.panel{position:absolute;right:0;top:0;height:100%;width:min(460px,94%);background:#fff;padding:20px;overflow:auto}.row{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #eee}.qty button{padding:5px 10px}.total{font-size:20px;font-weight:800;margin:18px 0}.checkout{background:#334f3e;color:white;width:100%;font-size:17px}.notice{background:#f7f2e6;border-radius:12px;padding:12px;margin:12px 0;color:#5c5b50}
@media(max-width:650px){.hero{padding:24px;display:block}.hero h1{font-size:29px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card img{height:145px}.wrap{padding:12px}}
</style></head>
<body>
<div class="wrap">
<header class="top"><div><div class="brand">🌿 سيوة</div><div class="sub">من واحة سيوة إلى باب بيتك</div></div><button class="cart" id="cartBtn">🛒 السلة (<span id="count">0</span>)</button></header>
<section class="hero"><div><h1>منتجات سيوة الطبيعية</h1><p>منتجات مختارة بعناية من واحة سيوة — مربى، أعشاب، صابون ومنتجات طبيعية.</p></div></section>
<div id="status" class="loading">جارٍ تحميل منتجات سيوة...</div><main id="products" class="grid"></main>
</div>
<div id="drawer" class="drawer"><div class="panel"><div class="top"><h2>🛒 سلة سيوة</h2><button id="close">✕</button></div><div id="cart"></div><div class="notice">الشحن سيتم حسابه في خطوة العنوان قبل تأكيد الطلب.</div><div class="total">إجمالي المنتجات: <span id="subtotal">0.00</span> ج</div><button class="checkout" id="checkout">متابعة لإدخال العنوان والشحن</button></div></div>
<script>
const SUPA='https://qxwvuxkbcghbkztjrzon.supabase.co';
const FEED=SUPA+'/functions/v1/siwa-meta-catalog-feed';
let products=[],cart=JSON.parse(localStorage.getItem('siwa_cart')||'[]');
const money=n=>Number(n||0).toLocaleString('ar-EG',{minimumFractionDigits:2,maximumFractionDigits:2})+' ج';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function load(){try{const r=await fetch(FEED);if(!r.ok)throw Error('تعذر تحميل منتجات سيوة');const csv=await r.text();products=parseCSV(csv);document.getElementById('status').remove();drawProducts()}catch(e){document.getElementById('status').textContent=e.message}}
function parseCSV(s){const lines=s.trim().split(/\r?\n/);if(lines.length<2)return[];const parse=l=>{let a=[],v='',q=false;for(let i=0;i<l.length;i++){const c=l[i];if(c==='"'){if(q&&l[i+1]==='"'){v+='"';i++}else q=!q}else if(c===','&&!q){a.push(v);v=''}else v+=c}a.push(v);return a};const h=parse(lines[0]);return lines.slice(1).map(l=>{const a=parse(l),o={};h.forEach((k,i)=>o[k]=a[i]||'');return o})}
function drawProducts(){document.getElementById('products').innerHTML=products.map(p=>{const sale=Number(String(p.sale_price||'').replace(/[^0-9.]/g,''));const price=Number(String(p.price||'').replace(/[^0-9.]/g,''));return '<article class="card"><img src="'+esc(p.image_link)+'" alt="'+esc(p.title)+'"><div class="body"><div class="name">'+esc(p.title)+'</div><div class="price">'+(sale&&sale<price?'<span class="old">'+money(price)+'</span>':'')+money(sale||price)+'</div><button class="add" onclick="add(\''+esc(p.id)+'\')">إضافة للسلة</button></div></article>'}).join('')}
function add(id){const p=products.find(x=>x.id===id);if(!p)return;const x=cart.find(x=>x.id===id);if(x)x.qty++;else cart.push({id,title:p.title,price:Number(String(p.sale_price||p.price).replace(/[^0-9.]/g,'')),qty:1,image:p.image_link});save();openCart()}
function save(){localStorage.setItem('siwa_cart',JSON.stringify(cart));document.getElementById('count').textContent=cart.reduce((a,x)=>a+x.qty,0)}
function openCart(){document.getElementById('drawer').classList.add('open');drawCart()}
function drawCart(){const el=document.getElementById('cart');if(!cart.length){el.innerHTML='<div class="empty">السلة فارغة</div>';document.getElementById('subtotal').textContent='0.00';return}el.innerHTML=cart.map((x,i)=>'<div class="row"><div><b>'+esc(x.title)+'</b><br>'+money(x.price)+' × '+x.qty+'</div><div class="qty"><button onclick="chg('+i+',-1)">−</button> '+x.qty+' <button onclick="chg('+i+',1)">+</button></div></div>').join('');document.getElementById('subtotal').textContent=cart.reduce((a,x)=>a+x.price*x.qty,0).toFixed(2)}
function chg(i,d){cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1);save();drawCart()}
document.getElementById('cartBtn').onclick=openCart;document.getElementById('close').onclick=()=>document.getElementById('drawer').classList.remove('open');document.getElementById('checkout').onclick=()=>{if(!cart.length)return alert('أضف منتجًا إلى السلة أولًا');alert('الخطوة التالية: إدخال بيانات العميل والعنوان وحساب الشحن — سيتم تفعيلها بعد اعتماد قواعد الشحن.')}
save();load();
</script></body></html>
