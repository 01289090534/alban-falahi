name: HR CI
on:
  push:
    branches: [hr-system]
  pull_request:
    branches: [hr-system]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hr-system
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
