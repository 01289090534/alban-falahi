<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/><meta name="theme-color" content="#2993e3"/><meta name="description" content="ألبان فلاحي - نظام إدارة الموارد البشرية"/><meta name="apple-mobile-web-app-title" content="ألبان فلاحي HR"/><meta name="application-name" content="ألبان فلاحي HR"/><meta name="apple-mobile-web-app-capable" content="yes"/><meta name="mobile-web-app-capable" content="yes"/><link rel="manifest" href="/manifest.webmanifest"/><link rel="apple-touch-icon" href="/pwa-icon.svg"/><title>ألبان فلاحي - إدارة الموارد البشرية</title></head><body><div id="root"></div><div id="pwa-loading" style="position:fixed;inset:0;z-index:99999;background:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;font-family:Arial,sans-serif;color:#17324d"><img src="/pwa-icon.svg" alt="ألبان فلاحي" style="width:92px;height:92px;border-radius:22px"/><strong style="font-size:22px">ألبان فلاحي</strong><span style="font-size:14px;opacity:.7">جاري تحميل نظام الموارد البشرية...</span></div><div id="pwa-install" style="display:none;position:fixed;left:14px;right:14px;bottom:14px;z-index:100000;background:#fff;border:1px solid #d7e5f2;border-radius:18px;box-shadow:0 10px 35px rgba(0,0,0,.16);padding:16px;font-family:Arial,sans-serif;color:#17324d"><div style="display:flex;align-items:center;gap:12px"><img src="/pwa-icon.svg" alt="" style="width:52px;height:52px;border-radius:13px"><div style="flex:1"><strong style="display:block;font-size:17px">ثبّت برنامج ألبان فلاحي HR</strong><span id="pwa-install-text" style="display:block;margin-top:5px;font-size:13px;line-height:1.5;opacity:.75">ثبّت البرنامج على موبايلك للوصول إليه بسرعة.</span></div><button id="pwa-install-btn" style="border:0;border-radius:11px;background:#2993e3;color:#fff;padding:10px 15px;font-weight:700;font-size:14px">Install</button></div><button id="pwa-install-close" style="margin-top:10px;border:0;background:transparent;color:#6b7d8c;font-size:12px">إغلاق</button></div><script>window.addEventListener('load',function(){setTimeout(function(){var e=document.getElementById('pwa-loading');if(e)e.remove();var p=document.getElementById('pwa-install');if(p&&!window.matchMedia('(display-mode: standalone)').matches&&!window.navigator.standalone){p.style.display='block'}},450)});var deferredPrompt=null;window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredPrompt=e;var b=document.getElementById('pwa-install-btn'),t=document.getElementById('pwa-install-text');if(b)b.textContent='Install';if(t)t.textContent='ثبّت البرنامج على الشاشة الرئيسية واستخدمه كتطبيق.'});document.addEventListener('click',function(e){if(e.target&&e.target.id==='pwa-install-btn'){if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.finally(function(){deferredPrompt=null})}else{alert('على iPhone: اضغط مشاركة Safari ثم اختر Add to Home Screen.')}}if(e.target&&e.target.id==='pwa-install-close'){var p=document.getElementById('pwa-install');if(p)p.style.display='none'}});</script><script type="module" src="/src/main.tsx"></script></body></html>
