<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ألبان فلاحي — Smart Prep Timer Demo</title><style>body{font-family:Arial,Tahoma,sans-serif;background:#f5f1e9;margin:0;padding:18px;color:#222}.wrap{max-width:700px;margin:auto}.card{background:#fff;border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 4px 18px #0001}.timer{text-align:center;font-size:54px;font-weight:900;padding:16px;border-radius:18px;background:#faf4e6}.warn{background:#fff0c9;color:#805400}.over{background:#ffe0e0;color:#a00000}.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800;margin:4px;cursor:pointer}.green{background:#198754;color:#fff}.gold{background:#d69b25;color:#fff}.red{background:#c62828;color:#fff}.blue{background:#315f9e;color:#fff}.muted{color:#777}.row{display:flex;gap:8px;flex-wrap:wrap}.state{font-weight:800;margin-top:10px}</style><script src="./prep-timer-smart.js"></script><script src="./prep-timer-integration.js"></script><body><div class="wrap"><div class="card"><h2>🥛 ألبان فلاحي — اختبار مؤقت التجهيز</h2><p class="muted">نسخة Branch فقط — ليست النسخة المستقرة.</p><div id="timer" class="timer">15:00</div><div id="state" class="state">جاهز لبدء طلب تجريبي</div></div><div class="card"><b>طلب تجريبي #TEST-001</b><div class="row"><button class="btn green" id="start">▶️ بدء التجهيز 15 دقيقة</button><button class="btn gold" id="plus">➕ إضافة 5 دقائق</button><button class="btn red" id="stop">⛔ إيقاف</button><button class="btn blue" id="sound">🔊 اختبار الصوت</button></div></div><div class="card"><b>ما نختبره</b><p>بدء المؤقت → العد التنازلي → التحذير → انتهاء الوقت → إضافة وقت → إيقاف.</p></div></div><script>(function(){const id='TEST-001',T=window.AlbanFalahiPrepTimerIntegration,$=x=>document.getElementById(x);let iv=null;function beep(){try{const C=window.AudioContext||window.webkitAudioContext,c=new C,o=c.createOscillator(),g=c.createGain();o.frequency.value=880;g.gain.value=.12;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.25)}catch(e){}}function render(){const s=T.get(id);if(!s){$('timer').textContent='15:00';$('timer').className='timer';$('state').textContent='جاهز لبدء طلب تجريبي';return}const sec=Math.max(0,Math.ceil(s.remainingMs/1000));const m=Math.floor(sec/60),r=String(sec%60).padStart(2,'0');$('timer').textContent=m+':'+r;$('timer').className='timer '+(s.overdue?'over':s.warning?'warn':'');$('state').textContent=s.overdue?'🔴 انتهى وقت التجهيز — الطلب متأخر':s.warning?'🟡 اقترب انتهاء وقت التجهيز':'🟢 الطلب داخل وقت التجهيز';if(s.overdue)beep()}$('start').onclick=()=>{T.start(id,15);clearInterval(iv);iv=setInterval(render,1000);render()};$('plus').onclick=()=>{T.extend(id,5);render()};$('stop').onclick=()=>{T.stop(id);clearInterval(iv);render()};$('sound').onclick=beep;render()})()</script></body></html>
