<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Timer Full Test</title><style>body{font-family:Arial;padding:16px;max-width:850px;margin:auto;background:#f6f3ed}.card{background:#fff;padding:16px;margin:12px 0;border-radius:14px}.ok{color:green;font-weight:bold}.bad{color:#b00000;font-weight:bold}button{padding:10px;margin:4px;border:0;border-radius:8px;font-weight:bold}</style></head><body><h2>🧪 ألبان فلاحي — Smart Timer Full Test</h2><div class="card"><p><b>Branch:</b> feature/smart-prep-timer</p><button onclick="run()" style="background:#198754;color:#fff">▶ تشغيل اختبارات 1–7</button><button onclick="sound()">🔊 اختبار الصوت</button><button onclick="clearAll()" style="background:#c62828;color:#fff">مسح</button><pre id="out">لم يبدأ الاختبار.</pre></div><div class="card"><h3>8 — اختبار البرنامج الحقيقي (يدوي)</h3><p>قبول → 15:00 → جاهز بدون Refresh → طلبات جديدة → Push → الطلبات الحالية → التحصيل → تقفيل الوردية.</p><button onclick="manual()">✅ تأكيد نجاح 8</button><pre id="m">⚪ لم يتم التأكيد</pre></div><script src="./prep-timer-smart.js"></script><script src="./prep-timer-integration.js"></script><script>
const T=window.AlbanFalahiSmartPrep,I=window.AlbanFalahiPrepTimerIntegration;const ids=['T1','T2','T3','A5','A10','A15','T5','T6','T7A','T7B'];function clearAll(){ids.forEach(x=>T.stop(x));out.textContent='تم المسح.'}function ok(a,b){return a?'✅ PASS — '+b:'❌ FAIL — '+b}function run(){clearAll();let r=[];let n=1700000000000;let s=T.start('T1',15,n),q=T.snapshot('T1',n);r.push(ok(q.remainingMs===900000&&q.phase==='running','1: بداية 15:00 والحالة running'));n+=100000;T.start('T2',1,n);q=T.snapshot('T2',n+59000);r.push(ok(q.warning&&!q.overdue&&q.phase==='warning','2: التحذير قبل الانتهاء'));n+=100000;T.start('T3',1,n);let q1=T.snapshot('T3',n+60001),q2=T.snapshot('T3',n+70001);r.push(ok(q1.overdue&&q2.overdue&&q2.phase==='overdue','3: انتهاء الوقت يبقى overdue بعد إعادة القراءة'));[['A5',5],['A10',10],['A15',15]].forEach(([id,x])=>{let z=2000000000000;T.start(id,1,z);let old=T.snapshot(id,z).deadlineAt, e=T.extend(id,x,z+30000);r.push(ok(e.deadlineAt===Math.max(z+30000,old)+x*60000,'4: +'+x+' دقائق يحدد موعدًا واحدًا جديدًا'))});T.start('T5',1,2100000000000);T.acknowledge('T5');T.stop('T5');r.push(ok(T.get('T5')===null,'5: stop ينظف مؤقت الطلب'));let z=2200000000000;T.start('T6',15,z);let a=T.snapshot('T6',z+120000),b=T.snapshot('T6',z+120000);r.push(ok(a.remainingMs===780000&&b.remainingMs===780000&&b.startedAt===z,'6: Refresh/persistence يحسب من الوقت الحقيقي'));z=2300000000000;T.start('T7A',1,z);T.start('T7B',2,z);let x=T.snapshot('T7A',z+61000),y=T.snapshot('T7B',z+61000);r.push(ok(x.overdue&&!y.overdue&&y.remainingMs===59000&&I.active().includes('T7A')&&I.active().includes('T7B'),'7: طلبان مستقلان'));out.textContent=r.join('\n')+'\n\nملاحظة: الصوت واختبار 8 يحتاجان تأكيدًا يدويًا في المتصفح.'}function sound(){try{let C=AudioContext||webkitAudioContext,c=new C(),o=c.createOscillator();o.connect(c.destination);o.frequency.value=880;o.start();o.stop(c.currentTime+.3);out.textContent+='\n🔊 تم تشغيل النغمة — تأكد أنك سمعتها.'}catch(e){out.textContent+='\n❌ الصوت: '+e.message}}function manual(){m.textContent='✅ تم تأكيد اختبار 8 يدويًا.'}</script></body></html>
