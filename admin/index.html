<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ألبان فلاحي - برنامج المحل</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f5f1e9;color:#222}.wrap{max-width:1100px;margin:auto;padding:18px}.brand{display:flex;align-items:center;gap:12px;background:#fff;border-radius:20px;padding:14px 18px;box-shadow:0 4px 18px #00000010;position:sticky;top:8px;z-index:5}.brandLogo{font-size:26px;font-weight:900}.muted{color:#777}.spacer{flex:1}.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:#222;color:#fff}.green{background:#198754;color:#fff}.red{background:#c62828;color:#fff}.gold{background:#d69b25;color:#fff}.white{background:#fff;border:1px solid #ddd}.login{max-width:430px;margin:8vh auto;background:#fff;border-radius:26px;padding:28px;box-shadow:0 10px 35px #00000012}.login h1{text-align:center;margin:5px 0 4px}.login p{text-align:center;color:#777}.field{margin:14px 0}.field label{display:block;font-weight:800;margin-bottom:7px}.field input,.field select{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;font-size:16px}.err{background:#fff0f0;color:#a00000;border-radius:12px;padding:10px;display:none}.nav{display:flex;gap:8px;overflow:auto;margin:16px 0}.nav .btn{white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px}.card{background:#fff;border-radius:20px;padding:17px;box-shadow:0 4px 18px #0000000b}.orderHead{display:flex;align-items:center;gap:8px}.num{font-size:20px;font-weight:900}.badge{padding:6px 9px;border-radius:999px;background:#eee;font-size:12px;font-weight:800}.new{background:#ffe2e2;color:#a00000}.prep{background:#fff0c9;color:#8a5b00}.ready{background:#dcf8e7;color:#126b3b}.items{margin:12px 0;border-top:1px solid #eee}.item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #eee}.itemQty{font-size:22px;font-weight:900;min-width:34px;text-align:center}.itemX{font-size:18px;font-weight:900}.itemName{font-weight:700;flex:1}.itemPrice{font-weight:800}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.timer{font-size:28px;font-weight:900;text-align:center;padding:10px;border-radius:15px;background:#faf4e6;margin:10px 0}.dangerTimer{background:#ffe0e0;color:#a00000}.soundModal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}.soundBox{background:#fff;border-radius:24px;max-width:390px;width:100%;padding:28px;text-align:center;box-shadow:0 20px 70px #0005}.soundBox .icon{font-size:52px}.product{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #eee}.productInfo{flex:1}.toggle{min-width:105px}.empty{text-align:center;padding:45px;color:#777}.hidden{display:none!important}.printSheet{display:none}.printSettings{background:#fff;border-radius:24px;max-width:430px;width:100%;padding:24px;box-shadow:0 20px 70px #0005;text-align:right}.settingsRow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid #eee}.settingsRow:last-child{border-bottom:0}.switch{width:52px;height:30px;border-radius:999px;background:#ccc;position:relative;border:0;cursor:pointer}.switch.on{background:#198754}.switch i{position:absolute;width:24px;height:24px;border-radius:50%;background:#fff;top:3px;right:3px;transition:.2s}.switch.on i{right:25px}.printSheet{width:80mm;margin:0 auto;background:#fff;color:#000;padding:5mm;font-family:Arial,Tahoma,sans-serif}.printSheet.size58{width:58mm;padding:4mm}.printTitle{text-align:center;font-size:20px;font-weight:900;margin-bottom:5px}.printOrderNo{text-align:center;font-size:18px;font-weight:900;margin-bottom:8px}.printMeta{font-size:13px;line-height:1.7;margin-bottom:8px}.printItems{border-top:2px solid #000}.printItem{display:flex;gap:7px;padding:7px 0;border-bottom:1px solid #999;align-items:flex-start}.printQty{font-size:21px;font-weight:900;min-width:30px}.printX{font-size:18px;font-weight:900}.printName{font-size:16px;font-weight:800;flex:1}.printNote{font-size:12px;margin-top:3px}.printFooter{text-align:center;font-size:12px;font-weight:800;margin-top:10px}@media(max-width:600px){.wrap{padding:10px}.brand{position:static}.actions .btn{flex:1}.grid{grid-template-columns:1fr}}@media print{body{background:#fff!important}.wrap,#modal,#printSettingsModal{display:none!important}.printSheet{display:block!important}.printSheet.size58{width:58mm}.printSheet.size80{width:80mm}@page{margin:0}}
</style></head><body><div id="app"></div><div id="modal" class="soundModal"><div class="soundBox"><div class="icon">🔊</div><h2>تفعيل صوت التنبيهات</h2><p>لازم تفعّل الصوت علشان تسمع تنبيه الطلبات الجديدة.</p><button class="btn primary" style="width:100%;padding:15px" onclick="enableSound()">🔊 تفعيل الصوت</button></div></div><div id="printSettingsModal" class="soundModal hidden"><div class="printSettings"><h2 style="margin-top:0">🖨️ إعدادات الطباعة</h2><div class="settingsRow"><div><b>طباعة تلقائية عند قبول الطلب</b><div class="muted" style="font-size:13px;margin-top:4px">يطبع ورقة التحضير فور الضغط على قبول الطلب.</div></div><button id="autoPrintSwitch" class="switch" onclick="toggleAutoPrint()"><i></i></button></div><div class="settingsRow"><div><b>مقاس ورقة التحضير</b><div class="muted" style="font-size:13px;margin-top:4px">اختر المقاس المناسب للطابعة الحرارية.</div></div><select id="printSize" class="field" style="width:125px;margin:0" onchange="savePrintSettings()"><option value="58">58 مم</option><option value="80">80 مم</option></select></div><div class="settingsRow"><div><b>اسم الطابعة</b><div class="muted" style="font-size:13px;margin-top:4px">يتم حفظ الاسم ليظهر لك بنفس الاختيار كل مرة.</div></div><input id="printPrinter" class="field" style="width:180px;margin:0" placeholder="اسم الطابعة" onchange="savePrintSettings()" oninput="savePrintSettings()"></div><div class="actions" style="justify-content:flex-end"><button class="btn white" onclick="closePrintSettings()">إغلاق</button></div></div></div><div id="printArea"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPA='https://qxwvuxkbcghbkztjrzon.supabase.co',KEY='sb_publishable_JI9lC4YPTCQ8CwMxzvHNIA_C24ULpWH',AUTH=SUPA+'/functions/v1/shop-auth',API=SUPA+'/functions/v1/shop-api';
const sb=window.supabase.createClient(SUPA,KEY);let session=JSON.parse(localStorage.getItem('af_shop_session')||'null'),me=JSON.parse(localStorage.getItem('af_shop_user')||'null'),orders=[],view='orders',audioCtx=null,alarmTimer=null,alarmOrder=null,enabledSound=false;
const app=document.getElementById('app');
function getPrintSettings(){try{return Object.assign({autoPrint:false,size:'80',printer:''},JSON.parse(localStorage.getItem('af_shop_print_settings')||'{}'))}catch{return {autoPrint:false,size:'80',printer:''}}}
function savePrintSettings(){const s=getPrintSettings();s.size=document.getElementById('printSize')?.value||s.size;s.printer=document.getElementById('printPrinter')?.value??s.printer;s.autoPrint=document.getElementById('autoPrintSwitch')?.classList.contains('on')??s.autoPrint;localStorage.setItem('af_shop_print_settings',JSON.stringify(s));updatePrintSettingsUI()}
function updatePrintSettingsUI(){const s=getPrintSettings(),sw=document.getElementById('autoPrintSwitch'),sel=document.getElementById('printSize'),pr=document.getElementById('printPrinter');if(sw)sw.classList.toggle('on',!!s.autoPrint);if(sel)sel.value=s.size||'80';if(pr)pr.value=s.printer||''}
function openPrintSettings(){document.getElementById('printSettingsModal').classList.remove('hidden');updatePrintSettingsUI()}
function closePrintSettings(){document.getElementById('printSettingsModal').classList.add('hidden')}
function toggleAutoPrint(){const s=getPrintSettings();s.autoPrint=!s.autoPrint;localStorage.setItem('af_shop_print_settings',JSON.stringify(s));updatePrintSettingsUI()}
function printPreparationById(id){const o=orders.find(x=>x.id===id);if(o)printPreparation(o)}
function printPreparation(o){const s=getPrintSettings(),items=(o.order_items||[]).map(i=>'<div class="printItem"><span class="printQty">'+escapeHtml(i.quantity)+'</span><span class="printX">×</span><div class="printName">'+escapeHtml(i.product_name_ar||i.product_name_en||'منتج')+(i.notes?'<div class="printNote">ملاحظة: '+escapeHtml(i.notes)+'</div>':'')+'</div></div>').join('');const area=document.getElementById('printArea');area.innerHTML='<div class="printSheet size'+(s.size==='58'?'58':'80')+'"><div class="printTitle">ألبان فلاحي</div><div class="printOrderNo">ورقة تحضير #'+escapeHtml(o.order_number)+'</div><div class="printMeta"><b>العميل:</b> '+escapeHtml(o.customers?.profiles?.full_name||'عميل')+'<br><b>الموبايل:</b> '+escapeHtml(o.customers?.phone||'')+'<br><b>العنوان:</b> '+escapeHtml(o.addresses?.address_text||'غير محدد')+'<br><b>الوقت:</b> '+escapeHtml(fmtTime(o.created_at))+'</div><div class="printItems">'+items+'</div><div class="printFooter">تحضير فقط — ليست فاتورة</div></div>';const cleanup=()=>{area.innerHTML='';window.removeEventListener('afterprint',cleanup)};window.addEventListener('afterprint',cleanup);setTimeout(()=>window.print(),80)}
function showLogin(){document.getElementById('modal').classList.add('hidden');document.getElementById('printSettingsModal').classList.add('hidden');app.innerHTML='<div class="login"><div class="brandLogo" style="text-align:center">🥛 ألبان فلاحي</div><h1>برنامج المحل</h1><p>تسجيل الدخول برقم الموبايل وكلمة المرور</p><div class="field"><label>رقم الموبايل</label><input id="phone" inputmode="tel" autocomplete="tel"></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password"></div><div id="loginErr" class="err"></div><button class="btn primary" style="width:100%;padding:15px" onclick="login()">تسجيل الدخول</button></div>'}
function normalize(p){p=String(p||'').replace(/\D/g,'');return p.startsWith('20')&&p.length===12?'0'+p.slice(2):p}
async function login(){const phone=normalize(document.getElementById('phone').value),password=document.getElementById('password').value,err=document.getElementById('loginErr');err.style.display='none';try{const r=await fetch(AUTH,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone,password})});const d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'تعذر تسجيل الدخول');session=d.session;me=d.user;localStorage.setItem('af_shop_session',JSON.stringify(session));localStorage.setItem('af_shop_user',JSON.stringify(me));location.reload()}catch(e){err.textContent=e.message;err.style.display='block'}}
function enableSound(){enabledSound=true;audioCtx=new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume();document.getElementById('modal').classList.add('hidden');beep(660,.12)}
function beep(freq=880,dur=.18){if(!enabledSound||!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=freq;o.type='square';g.gain.setValueAtTime(.0001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.28,audioCtx.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur+.02)}
function startAlarm(order){if(!enabledSound)return;if(alarmOrder===order.id)return;stopAlarm();alarmOrder=order.id;beep(950,.25);alarmTimer=setInterval(()=>{beep(950,.25);setTimeout(()=>beep(700,.22),330)},850)}
function stopAlarm(){if(alarmTimer)clearInterval(alarmTimer);alarmTimer=null;alarmOrder=null}
async function api(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.message||'حدث خطأ');return d}
async function loadOrders(){orders=await api({action:'orders'});render()}
function money(v){return Number(v||0).toFixed(2)+' ج'}
function statusLabel(s){return ({pending:'جديد',confirmed:'مقبول',preparing:'جاري التجهيز',ready:'جاهز',assigned:'مع السائق',out_for_delivery:'خرج للتوصيل',delivered:'تم التسليم',cancelled:'ملغي',rejected:'مرفوض'})[s]||s}
function fmtTime(x){if(!x)return '';return new Date(x).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})}
function timerText(o){if(!o.prep_started_at)return '';const now=Date.now(),start=new Date(o.prep_started_at).getTime(),initialEnd=start+(Number(o.prep_initial_minutes||15)*60000),final=o.prep_deadline_at?new Date(o.prep_deadline_at).getTime():initialEnd;let target=final;let label='متبقي';if(now>=final){label='الوقت انتهى'}else if(now>=initialEnd){label='وقت إضافي متبقي'}let sec=Math.max(0,Math.floor((target-now)/1000)),m=Math.floor(sec/60),s=sec%60;return label+' '+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function card(o){const isNew=o.status==='pending',isPrep=o.status==='preparing';if(isNew)startAlarm(o);const cls=isNew?'new':isPrep?'prep':o.status==='ready'?'ready':'';let buttons='';if(isNew)buttons='<button class="btn green" onclick="acceptOrder(\''+o.id+'\')">✅ قبول الطلب</button><button class="btn red" onclick="rejectOrder(\''+o.id+'\')">❌ رفض</button><button class="btn gold" onclick="transferOrder(\''+o.id+'\')">🔄 تحويل لفرع</button>';if(isPrep)buttons='<button class="btn green" onclick="readyOrder(\''+o.id+'\')">📦 الطلب جاهز</button><button class="btn gold" onclick="extendOrder(\''+o.id+'\')">⏱️ إضافة وقت</button><button class="btn white" onclick="transferOrder(\''+o.id+'\')">🔄 تحويل</button>';if(o.status==='ready')buttons='<button class="btn primary" onclick="assignDriver(\''+o.id+'\')">🚗 تعيين سائق</button><button class="btn gold" onclick="transferOrder(\''+o.id+'\')">🔄 تحويل</button>';buttons+='<button class="btn white" onclick="printPreparationById(\''+o.id+'\')">🖨️ طباعة التحضير</button>';const items=(o.order_items||[]).map(i=>'<div class="item"><span class="itemQty">'+i.quantity+'</span><span class="itemX">×</span><span class="itemName">'+escapeHtml(i.product_name_ar||i.product_name_en||'منتج')+'</span><b class="itemPrice">'+money(i.line_total)+'</b></div>').join('');return '<div class="card"><div class="orderHead"><div class="num">#'+o.order_number+'</div><span class="badge '+cls+'">'+statusLabel(o.status)+'</span><span class="spacer"></span><span class="muted">'+fmtTime(o.created_at)+'</span></div><div style="margin-top:8px"><b>'+escapeHtml(o.customers?.profiles?.full_name||'عميل')+'</b> — '+escapeHtml(o.customers?.phone||'')+'</div><div class="muted" style="margin-top:5px">'+escapeHtml(o.addresses?.address_text||'استلام/عنوان غير محدد')+'</div><div class="items">'+items+'</div>'+(isPrep?'<div id="timer-'+o.id+'" class="timer '+(new Date(o.prep_deadline_at||0).getTime()<=Date.now()?'dangerTimer':'')+'">'+timerText(o)+'</div>':'')+'<div><b>الإجمالي: '+money(o.total)+'</b></div><div class="actions">'+buttons+'</div></div>'}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){if(!session||!me){showLogin();return}app.innerHTML='<div class="wrap"><div class="brand"><div><div class="brandLogo">🥛 ألبان فلاحي</div><div class="muted">برنامج المحل — '+escapeHtml(me.full_name||'')+'</div></div><span class="spacer"></span><span class="badge">'+escapeHtml(me.role||'')+'</span><button class="btn white" onclick="logout()">خروج</button></div><div class="nav"><button class="btn '+(view==='orders'?'primary':'white')+'" onclick="setView(\'orders\')">📦 الطلبات</button><button class="btn '+(view==='products'?'primary':'white')+'" onclick="setView(\'products\')">🟢🔴 توفر المنتجات</button><button class="btn white" onclick="openPrintSettings()">🖨️ إعدادات الطباعة</button><button class="btn white" onclick="loadOrders()">↻ تحديث</button></div><div id="content"></div></div>';if(view==='orders')renderOrders();else renderProducts()}
function renderOrders(){document.getElementById('content').innerHTML='<div class="grid">'+(orders.length?orders.map(card).join(''):'<div class="card empty">لا توجد طلبات حاليًا</div>')+'</div>';setTimeout(updateTimers,500)}
async function renderProducts(){const c=document.getElementById('content');c.innerHTML='<div class="card empty">جاري تحميل المنتجات...</div>';try{const ps=await api({action:'branch_products'});c.innerHTML='<div class="card"><h2 style="margin-top:0">توافر المنتجات</h2><p class="muted">التغيير يخص الفرع الحالي فقط.</p>'+(ps.length?ps.map(p=>'<div class="product"><div class="productInfo"><b>'+escapeHtml(p.products?.name_ar||p.products?.name_en||'منتج')+'</b><div class="muted">'+money(p.price_override??p.products?.base_price)+'</div></div><button class="btn toggle '+(p.is_available?'green':'red')+'" onclick="toggleProduct(\''+p.product_id+'\','+(!p.is_available)+')">'+(p.is_available?'متاح 🟢':'غير متاح 🔴')+'</button></div>').join(''):'<div class="empty">لا توجد منتجات مرتبطة بهذا الفرع</div>')+'</div>'}catch(e){c.innerHTML='<div class="card err" style="display:block">'+escapeHtml(e.message)+'</div>'}}
function setView(v){view=v;render()}
async function acceptOrder(id){try{const order=orders.find(o=>o.id===id);stopAlarm();await api({action:'accept',order_id:id});if(getPrintSettings().autoPrint&&order)printPreparation(order);await loadOrders()}catch(e){alert(e.message)}}
async function rejectOrder(id){const reason=prompt('سبب رفض الطلب؟')||'';try{stopAlarm();await api({action:'reject',order_id:id,reason});await loadOrders()}catch(e){alert(e.message)}}
async function readyOrder(id){try{await api({action:'mark_ready',order_id:id});await loadOrders()}catch(e){alert(e.message)}}
async function extendOrder(id){const x=prompt('أضف كام دقيقة؟','10');const minutes=Number(x);if(!minutes)return;try{await api({action:'extend_prep',order_id:id,minutes});await loadOrders()}catch(e){alert(e.message)}}
async function transferOrder(id){try{const branches=await api({action:'branches'});const other=branches.filter(b=>b.id!==me.branch_id);if(!other.length)return alert('لا يوجد فرع آخر متاح');const list=other.map((b,i)=>(i+1)+'. '+b.name_ar).join('\n');const n=Number(prompt('اختر رقم الفرع:\n'+list));const b=other[n-1];if(!b)return;const reason=prompt('سبب التحويل؟')||'';await api({action:'transfer',order_id:id,to_branch_id:b.id,reason});await loadOrders()}catch(e){alert(e.message)}}
async function assignDriver(id){try{const ds=await api({action:'drivers'});const avail=ds.filter(d=>d.is_active&&d.is_available);if(!avail.length)return alert('لا يوجد سائق متاح حاليًا');const list=avail.map((d,i)=>(i+1)+'. '+d.name_ar+' — '+d.phone).join('\n');const n=Number(prompt('اختر السائق:\n'+list));const d=avail[n-1];if(!d)return;await api({action:'assign',order_id:id,driver_id:d.id});await loadOrders()}catch(e){alert(e.message)}}
async function toggleProduct(id,on){try{await api({action:'availability',product_id:id,is_available:on});renderProducts()}catch(e){alert(e.message)}}
function prepAlertKey(o){return 'af_prep_alert_'+o.id+'_'+String(o.prep_started_at||'')}
function prepAlertState(o){try{return JSON.parse(localStorage.getItem(prepAlertKey(o))||'{}')}catch{return {}}}
function savePrepAlertState(o,state){try{localStorage.setItem(prepAlertKey(o),JSON.stringify(state))}catch{}}
function triplePrepBeep(){beep(560,.25);setTimeout(()=>beep(560,.25),350);setTimeout(()=>beep(560,.25),700)}
function updateTimers(){orders.filter(o=>o.status==='preparing').forEach(o=>{const el=document.getElementById('timer-'+o.id);if(!el)return;el.textContent=timerText(o);el.classList.toggle('dangerTimer',o.prep_deadline_at&&new Date(o.prep_deadline_at).getTime()<=Date.now());const start=new Date(o.prep_started_at).getTime(),initial=start+Number(o.prep_initial_minutes||15)*60000,final=o.prep_deadline_at?new Date(o.prep_deadline_at).getTime():initial,now=Date.now();if(enabledSound&&now>=initial){const st=prepAlertState(o),minute=Math.floor((now-initial)/60000),deadlineKey=String(final);if(!st.initial){triplePrepBeep();st.initial=true;st.lastMinute=minute;st.lastFinalAlert=deadlineKey;savePrepAlertState(o,st)}else if(now>=final&&st.lastFinalAlert!==deadlineKey){triplePrepBeep();st.lastFinalAlert=deadlineKey;st.lastMinute=minute;savePrepAlertState(o,st)}else if(minute>0&&minute!==st.lastMinute){beep(420,.35);st.lastMinute=minute;savePrepAlertState(o,st)}}});setTimeout(updateTimers,1000)}
function logout(){localStorage.removeItem('af_shop_session');localStorage.removeItem('af_shop_user');session=null;me=null;location.reload()}
if(session&&me){render();document.getElementById('modal').classList.remove('hidden');loadOrders();const ch=sb.channel('shop-orders').on('postgres_changes',{event:'*',schema:'public',table:'orders'},payload=>{loadOrders();if(payload.eventType==='INSERT'&&payload.new?.branch_id===me.branch_id){startAlarm(payload.new)}}).subscribe()}else showLogin();
</script></body></html>
