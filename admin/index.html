<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>ألبان فلاحي | برنامج المحل</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="manifest" href="/store-manifest.webmanifest"><style>body{margin:0;background:#f8f5ef;font-family:Arial,sans-serif;color:#222}.wrap{min-height:100vh;padding:18px;box-sizing:border-box}.card{max-width:700px;margin:30px auto;background:#fff;border-radius:20px;padding:22px;box-shadow:0 8px 30px #0001}.login{max-width:420px}.center{text-align:center}.field{margin:12px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:16px}.btn{border:0;border-radius:10px;padding:12px 18px;background:#222;color:#fff;font-weight:800;cursor:pointer}.msg{margin-top:12px;color:#b00020}.order{border:1px solid #eee;border-radius:16px;padding:16px;margin:12px 0}.order h3{margin:0 0 8px}.muted{color:#777}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.ready{background:#16803c}.danger{background:#a00}.hidden{display:none}</style></head><body><div id="app" class="wrap"><div class="card login"><div class="center"><h1>🥛 ألبان فلاحي</h1><h2>برنامج المحل</h2></div><div class="field"><label>البريد الإلكتروني</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password"></div><button class="btn" style="width:100%" id="login">دخول برنامج المحل</button><div id="msg" class="msg"></div></div></div><script>(()=>{const AUTH='https://qxwvuxkbcghbkztjrzon.supabase.co/functions/v1/admin-auth',API='https://qxwvuxkbcghbkztjrzon.supabase.co/functions/v1/shop-api',KEY='sb_publishable_JI9lC4YPTCQ8CwMxzvHNIA_C24ULpWH';let session=JSON.parse(localStorage.getItem('alban_admin_session')||'null');const app=document.getElementById('app'),esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));async function shop(body){const r=await fetch(API,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json',Authorization:`Bearer ${session?.access_token||''}`},body:JSON.stringify(body)});const t=await r.text();let d={};try{d=t?JSON.parse(t):{}}catch{}if(!r.ok)throw Error(d.message||'تعذر الاتصال ببرنامج المحل');return d}function login(){app.innerHTML='<div class="card login"><div class="center"><h1>🥛 ألبان فلاحي</h1><h2>برنامج المحل</h2></div><div class="field"><label>البريد الإلكتروني</label><input id="email" type="email"></div><div class="field"><label>كلمة المرور</label><input id="password" type="password"></div><button class="btn" style="width:100%" id="login">دخول برنامج المحل</button><div id="msg" class="msg"></div></div>';document.getElementById('login').onclick=doLogin}async function doLogin(){const msg=document.getElementById('msg'),btn=document.getElementById('login');btn.disabled=true;msg.textContent='جارٍ الدخول...';try{const r=await fetch(AUTH,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value})});const d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'بيانات الدخول غير صحيحة');session=d.session;session.user=d.user;localStorage.setItem('alban_admin_session',JSON.stringify(session));await render()}catch(e){msg.textContent=e.message}finally{btn.disabled=false}}async function status(id,s){await shop({action:'status',order_id:id,status:s});await render()}async function assign(id){const sel=document.getElementById('d_'+id);if(!sel?.value)return alert('اختر السائق أولًا');await shop({action:'assign',order_id:id,driver_id:sel.value});await render()}async function render(){if(!session?.access_token){login();return}try{const roles=await fetch('https://qxwvuxkbcghbkztjrzon.supabase.co/rest/v1/user_roles?select=role,branch_id&user_id=eq.'+encodeURIComponent(session.user?.id||session.user_id||''),{headers:{apikey:KEY,Authorization:`Bearer ${session.access_token}`}}).then(r=>r.json());const role=roles?.[0];if(!role){throw Error('الحساب غير مربوط ببرنامج المحل')}const orders=await shop({});const drivers=await shop({action:'drivers',branch_id:role.branch_id});const list=Array.isArray(orders)?orders:[];app.innerHTML='<div class="card"><div class="row" style="justify-content:space-between"><div><h1 style="margin:0">🥛 ألبان فلاحي</h1><h2 style="margin:5px 0">طلبات المحل</h2></div><button class="btn" id="refresh">تحديث</button></div><p class="muted">طلبات الفرع الجديدة تظهر هنا تلقائيًا.</p><div id="orders">'+(list.length?list.map(o=>{const c=o.customers||{},a=o.addresses||{};const ready=['preparing','confirmed'].includes(o.status),assignable=['ready','assigned'].includes(o.status);return '<div class="order"><h3>طلب #'+esc(o.order_number)+'</h3><div>الحالة: <b>'+esc(o.status)+'</b></div><div>👤 '+esc(c.name||'عميل')+(c.phone?' — '+esc(c.phone):'')+'</div><div>💰 '+esc(o.total)+' جنيه</div><div>📍 '+esc(a.address_line||'العنوان غير متاح')+'</div><div class="row" style="margin-top:12px">'+(ready?'<button class="btn ready" data-ready="'+o.id+'">جاهز</button>':'')+(assignable?'<select id="d_'+o.id+'"><option value="">اختر السائق</option>'+drivers.filter(d=>d.is_active&&d.is_available).map(d=>'<option value="'+d.id+'">'+esc(d.name_ar)+'</option>').join('')+'</select><button class="btn" data-assign="'+o.id+'">إرسال للسائق</button>':'')+'</div></div>'}).join(''):'<div class="order center">لا توجد طلبات حاليًا.</div>')+'</div></div>';document.getElementById('refresh').onclick=render;document.querySelectorAll('[data-ready]').forEach(b=>b.onclick=()=>status(b.dataset.ready,'ready'));document.querySelectorAll('[data-assign]').forEach(b=>b.onclick=()=>assign(b.dataset.assign))}catch(e){if(String(e.message).includes('غير مصرح')){localStorage.removeItem('alban_admin_session');session=null;login()}else{app.innerHTML='<div class="card center"><h2>خطأ في برنامج المحل</h2><p class="msg">'+esc(e.message)+'</p><button class="btn" onclick="location.reload()">إعادة المحاولة</button></div>'}}}render();setInterval(()=>{if(session?.access_token)render()},15000)})();</script></body></html>
