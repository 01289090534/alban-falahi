function showLogin(){document.getElementById('modal').classList.add('hidden');document.getElementById('printSettingsModal').classList.add('hidden');app.innerHTML='<div class="login"><div class="brandLogo" style="text-align:center">🥛 ألبان فلاحي</div><h1>برنامج المحل</h1><p>تسجيل الدخول برقم الموبايل وكلمة المرور</p><div class="field"><label>رقم الموبايل</label><input id="phone" inputmode="tel" autocomplete="tel"></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password"></div><div id="loginErr" class="err"></div><button class="btn primary" style="width:100%;padding:15px" onclick="login()">تسجيل الدخول</button></div>'}
function normalize(p){p=String(p||'').replace(/\D/g,'');return p.startsWith('20')&&p.length===12?'0'+p.slice(2):p}
async function login(){const phone=normalize(document.getElementById('phone').value),password=document.getElementById('password').value,err=document.getElementById('loginErr');err.style.display='none';try{const r=await fetch(AUTH,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone,password})});const d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'تعذر تسجيل الدخول');session=d.session;me=d.user;localStorage.removeItem('af_shop_session');localStorage.removeItem('af_shop_user');localStorage.setItem('af_shop_session',JSON.stringify(session));localStorage.setItem('af_shop_user',JSON.stringify(me));location.href='/admin/index.html?role='+encodeURIComponent(me.role||'')}catch(e){err.textContent=e.message;err.style.display='block'}}
function pushKeyBytes(base64){const pad='='.repeat((4-base64.length%4)%4),s=(base64+pad).replace(/-/g,'+').replace(/_/g,'/');const raw=atob(s);return Uint8Array.from(raw,c=>c.charCodeAt(0))}
async function registerShopPush(promptPermission=false){try{if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window)||!session?.access_token)return false;if(Notification.permission==='default'&&promptPermission)await Notification.requestPermission();if(Notification.permission!=='granted')return false;const reg=await navigator.serviceWorker.register('/shop-push-sw.js',{scope:'/admin/'});const pk=await fetch(PUSH).then(r=>r.json());if(!pk.public_key)return false;let sub=await reg.pushManager.getSubscription();if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:pushKeyBytes(pk.public_key)});const r=await fetch(PUSH,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify({action:'subscribe',subscription:sub.toJSON()})});return r.ok}catch(e){console.warn('shop push',e);return false}}
function enableSound(){enabledSound=true;audioCtx=new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume();document.getElementById('modal').classList.add('hidden');beep(660,.12);registerShopPush(true);setTimeout(syncPendingAlarm,150)}
function beep(freq=880,dur=.18){if(!enabledSound||!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=freq;o.type='sine';g.gain.setValueAtTime(.0001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.2,audioCtx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur+.02)}
function startAlarm(o){if(!enabledSound||alarmOrder===o.id)return;alarmOrder=o.id;clearInterval(alarmTimer);alarmTimer=setInterval(()=>{if(orders.some(x=>x.id===o.id&&x.status==='pending'))beep(880,.18);else{clearInterval(alarmTimer);alarmOrder=null}},2500)}
function syncPendingAlarm(){const p=orders.find(o=>o.status==='pending');if(p)startAlarm(p)}
function fmtTime(v){return new Date(v).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})}
function fmtDate(v){return new Date(v).toLocaleDateString('ar-EG')}
function money(v){return Number(v||0).toLocaleString('ar-EG',{minimumFractionDigits:2,maximumFractionDigits:2})+' ج'}
function statusLabel(s){return ({pending:'جديد',preparing:'قيد التحضير',ready:'جاهز',delivered:'تم التسليم',cancelled:'ملغي',rejected:'مرفوض'})[s]||s}
function timerText(o){if(!o.prep_started_at)return '';const now=Date.now(),start=new Date(o.prep_started_at).getTime(),initialEnd=start+(Number(o.prep_initial_minutes||15)*60000),final=o.prep_deadline_at?new Date(o.prep_deadline_at).getTime():initialEnd;let target=final;let label='متبقي';if(now>=final){label='الوقت انتهى'}else if(now>=initialEnd){label='وقت إضافي متبقي'}let sec=Math.max(0,Math.floor((target-now)/1000)),m=Math.floor(sec/60),s=sec%60;return label+' '+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function card(o){const isNew=o.status==='pending',isPrep=o.status==='preparing';if(isNew)startAlarm(o);const cls=isNew?'new':isPrep?'prep':o.status==='ready'?'ready':'';let buttons='';if(isNew)buttons='<button class="btn green" onclick="acceptOrder(\''+o.id+'\')">✅ قبول الطلب</button><button class="btn red" onclick="rejectOrder(\''+o.id+'\')">❌ رفض</button><button class="btn gold" onclick="transferOrder(\''+o.id+'\')">🔄 تحويل لفرع</button>';if(isPrep)buttons='<button class="btn green" onclick="readyOrder(\''+o.id+'\')">📦 الطلب جاهز</button><button class="btn gold" onclick="extendOrder(\''+o.id+'\')">⏱️ إضافة وقت</button><button class="btn white" onclick="transferOrder(\''+o.id+'\')">🔄 تحويل</button>';if(o.status==='ready')buttons='<button class="btn primary" onclick="assignDriver(\''+o.id+'\')">🚗 تعيين سائق</button><button class="btn gold" onclick="transferOrder(\''+o.id+'\')">🔄 تحويل</button>';buttons+='<button class="btn white" onclick="printPreparationById(\''+o.id+'\')">🖨️ طباعة التحضير</button>';const items=(o.order_items||[]).map(i=>'<div class="item"><span class="itemQty">'+i.quantity+'</span><span class="itemX">×</span><span class="itemName">'+escapeHtml(i.product_name_ar||i.product_name_en||'منتج')+'</span><b class="itemPrice">'+money(i.line_total)+'</b></div>').join('');return '<div class="card"><div class="orderHead"><div class="num">#'+o.order_number+'</div><span class="badge '+cls+'">'+statusLabel(o.status)+'</span><span class="spacer"></span><span class="muted">'+fmtTime(o.created_at)+'</span></div><div style="margin-top:8px"><b>'+escapeHtml(o.customers?.profiles?.full_name||'عميل')+'</b> — '+escapeHtml(o.customers?.phone||'')+'</div><div class="muted" style="margin-top:5px">'+escapeHtml(o.addresses?.address_text||'استلام/عنوان غير محدد')+'</div><div class="items">'+items+'</div>'+(isPrep?'<div id="timer-'+o.id+'" class="timer '+(new Date(o.prep_deadline_at||0).getTime()<=Date.now()?'dangerTimer':'')+'">'+timerText(o)+'</div>':'')+'<div><b>الإجمالي: '+money(o.total)+'</b></div><div class="actions">'+buttons+'</div></div>'}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function renderNotifications(){const c=document.getElementById('content');if(me?.role!=='admin'){c.innerHTML='<div class="card err" style="display:block">غير مصرح.</div>';return}c.innerHTML='<div class="card pushCard"><h2>📢 إرسال إشعار للعملاء</h2><div class="pushHint">سيصل الإشعار لكل العملاء الذين فعّلوا إشعارات البرنامج، وسيظهر أيضًا داخل قسم إشعارات العميل.</div><div class="pushField"><label>عنوان الإشعار</label><input id="pushTitle" maxlength="120" placeholder="مثال: عرض جديد من ألبان فلاحي"></div><div class="pushField"><label>الرسالة</label><textarea id="pushBody" maxlength="500" placeholder="اكتب رسالة قصيرة وواضحة للعملاء"></textarea></div><div class="pushField"><label>عند الضغط على الإشعار</label><select id="pushUrl"><option value="/orders.html">طلباتك</option><option value="/">الرئيسية</option><option value="/account.html">حسابك</option></select></div><div class="pushPreview"><b id="pushPreviewTitle">معاينة الإشعار</b><small id="pushPreviewBody">ستظهر هنا معاينة الرسالة.</small></div><button id="pushSendBtn" class="btn green" style="width:100%;padding:14px" onclick="sendCustomerBroadcast()">📢 إرسال للعملاء</button><div id="pushResult" style="display:none"></div></div>';const t=document.getElementById('pushTitle'),b=document.getElementById('pushBody'),pt=document.getElementById('pushPreviewTitle'),pb=document.getElementById('pushPreviewBody');const sync=()=>{pt.textContent=t.value.trim()||'معاينة الإشعار';pb.textContent=b.value.trim()||'ستظهر هنا معاينة الرسالة.'};t.oninput=sync;b.oninput=sync}
async function sendCustomerBroadcast(){const t=document.getElementById('pushTitle'),b=document.getElementById('pushBody'),u=document.getElementById('pushUrl'),btn=document.getElementById('pushSendBtn'),res=document.getElementById('pushResult'),title=t.value.trim(),body=b.value.trim();res.style.display='none';if(!title||!body)return alert('اكتب عنوان الإشعار والرسالة أولًا');if(!confirm('إرسال الإشعار الآن لكل العملاء؟'))return;btn.disabled=true;btn.textContent='جاري الإرسال...';try{const r=await fetch(SUPA+'/functions/v1/customer-push',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify({action:'broadcast',title,body,url:u.value})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.success)throw Error(d.error||'تعذر إرسال الإشعار');res.className='pushResult ok';res.textContent='تم الإرسال ✅ — تم تسجيل الإشعار لـ '+(d.customers||0)+' عميل، وتم إرسال Push إلى '+(d.sent||0)+' جهاز.'+(d.gone?' وتم تنظيف '+d.gone+' اشتراكات منتهية.':'');res.style.display='block';t.value='';b.value='';document.getElementById('pushPreviewTitle').textContent='معاينة الإشعار';document.getElementById('pushPreviewBody').textContent='ستظهر هنا معاينة الرسالة.'}catch(e){res.className='pushResult err';res.textContent='⚠️ '+e.message;res.style.display='block'}finally{btn.disabled=false;btn.textContent='📢 إرسال للعملاء'}}
function renderOrders(){const active=orders.filter(o=>!['delivered','cancelled','rejected'].includes(o.status));document.getElementById('content').innerHTML='<div class="grid">'+(active.length?active.map(card).join(''):'<div class="card empty">لا توجد طلبات حالية</div>')+'</div>';setTimeout(updateTimers,500)}
function renderArchive(){const d=archiveDate==='today'?new Date():new Date(archiveDate);const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');const list=orders.filter(o=>['delivered','cancelled','rejected'].includes(o.status)&&String(o.created_at||'').slice(0,10)===y+'-'+m+'-'+day);document.getElementById('content').innerHTML='<div class="card"><div class="actions"><button class="btn white" onclick="setArchiveDate(\'today\')">اليوم</button><input type="date" value="'+y+'-'+m+'-'+day+'" onchange="setArchiveDate(this.value)" style="padding:10px;border:1px solid #ddd;border-radius:10px"></div></div><div class="grid" style="margin-top:14px">'+(list.length?list.map(card).join(''):'<div class="card empty">لا توجد طلبات مؤرشفة لهذا اليوم</div>')+'</div>'}
function renderProducts(){document.getElementById('content').innerHTML='<div class="card"><h3>🟢🔴 توفر المنتجات</h3><p class="muted">تعديل التوفر متاح من برنامج المحل.</p></div>';loadProducts()}
async function loadProducts(){try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify({action:'products',branch_id:me.branch_id})});const d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'تعذر تحميل المنتجات');const c=document.getElementById('content');c.innerHTML='<div class="grid">'+(d.products||[]).map(p=>'<div class="card product"><div class="productInfo"><b>'+escapeHtml(p.name_ar||p.name_en||'منتج')+'</b><div class="muted">'+money(p.price)+'</div></div><button class="btn toggle '+(p.available?'green':'red')+'" onclick="toggleProduct(\''+p.id+'\','+(p.available?'false':'true')+')">'+(p.available?'متاح':'غير متاح')+'</button></div>').join('')+'</div>'}catch(e){document.getElementById('content').innerHTML='<div class="card err" style="display:block">'+escapeHtml(e.message)+'</div>'}}
async function toggleProduct(id,available){try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify({action:'toggle_product',branch_id:me.branch_id,product_id:id,available})});const d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'تعذر تحديث التوفر');renderProducts()}catch(e){alert(e.message)}}
function setView(v){view=v;render();if(v==='products'&&typeof loadProducts==='function')loadProducts()}
function setArchiveDate(v){archiveDate=v||'today';renderArchive()}
function updateTimers(){orders.filter(o=>o.status==='preparing').forEach(o=>{const el=document.getElementById('timer-'+o.id);if(el){el.textContent=timerText(o);el.classList.toggle('dangerTimer',new Date(o.prep_deadline_at||0).getTime()<=Date.now())}});if(orders.some(o=>o.status==='preparing'))setTimeout(updateTimers,1000)}
async function loadOrders(){try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify({action:'orders'})});const d=await r.json();if(!r.ok)throw Error(d.error||d.message||'تعذر تحميل الطلبات');orders=Array.isArray(d)?d:(d.orders||d.data||[]);render();if(enabledSound)syncPendingAlarm()}catch(e){console.error('loadOrders',e);document.getElementById('content').innerHTML='<div class="card err" style="display:block">'+escapeHtml(e.message)+'</div>'}}
async function updateOrder(id,status,extra={}){try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify(Object.assign({action:'update_order',order_id:id,status},extra))});const d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'تعذر تحديث الطلب');await loadOrders()}catch(e){alert(e.message)}}
function acceptOrder(id){const o=orders.find(x=>x.id===id);updateOrder(id,'preparing',{prep_initial_minutes:15,prep_deadline_at:new Date(Date.now()+15*60000).toISOString()}).then(()=>{if(getPrintSettings().autoPrint&&o)printPreparation(o)})}
function rejectOrder(id){if(confirm('تأكيد رفض الطلب؟'))updateOrder(id,'rejected')}
function readyOrder(id){updateOrder(id,'ready')}
function extendOrder(id){const o=orders.find(x=>x.id===id);if(!o)return;const current=new Date(o.prep_deadline_at||Date.now()).getTime();updateOrder(id,'preparing',{prep_deadline_at:new Date(current+10*60000).toISOString()})}
async function transferOrder(id){const name=prompt('اكتب كود الفرع أو branch_id للتحويل');if(name)updateOrder(id,'pending',{transfer_to:name})}
async function assignDriver(id){const name=prompt('اكتب رقم السائق أو اسمه');if(name)updateOrder(id,'ready',{driver:name})}
function logout(){clearInterval(alarmTimer);if(liveChannel)sb.removeChannel(liveChannel);session=null;me=null;localStorage.removeItem('af_shop_session');localStorage.removeItem('af_shop_user');showLogin()}
async function initRealtime(){try{if(liveChannel)sb.removeChannel(liveChannel);liveChannel=sb.channel('shop-orders-'+(me.branch_id||'main')).on('postgres_changes',{event:'*',schema:'public',table:'orders'},()=>loadOrders()).subscribe(s=>{if(s==='CHANNEL_ERROR'){clearTimeout(liveRetry);liveRetry=setTimeout(initRealtime,5000)}})}catch(e){console.warn('realtime',e)}}
function init(){document.getElementById('modal').classList.remove('hidden');if(!session||!me){showLogin();return}render();loadOrders();initRealtime();updatePrintSettingsUI();registerShopPush(false)}
init();
</script><script src="/admin/products-categories.js?v=20260920-15"></script></body></html>
