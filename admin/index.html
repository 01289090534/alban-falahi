<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>ألبان فلاحي | برنامج المحل</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="manifest" href="/store-manifest.webmanifest"><style>body{margin:0;background:#f7f4ee;font-family:Arial,sans-serif;color:#222}.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box}.box{width:min(420px,100%);background:#fff;border-radius:22px;padding:28px;box-shadow:0 10px 35px #0001;text-align:center}.logo{font-size:28px;font-weight:800;margin-bottom:8px}.sub{color:#777;margin-bottom:24px}.field{text-align:right;margin:14px 0}.field label{display:block;margin-bottom:7px;font-weight:700}.field input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ddd;border-radius:12px;font-size:16px}.btn{width:100%;border:0;border-radius:12px;padding:14px;background:#222;color:#fff;font-size:17px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.6}.msg{margin-top:14px;color:#b00020}.loading{font-size:18px}</style></head><body><div id="app"><div class="wrap"><div class="box"><div class="logo">🥛 ألبان فلاحي</div><div class="sub">برنامج المحل</div><div class="field"><label>البريد الإلكتروني</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password"></div><button class="btn" id="login">دخول</button><div class="msg" id="msg"></div></div></div></div><script>const AUTH='https://qxwvuxkbcghbkztjrzon.supabase.co/functions/v1/admin-auth';const $=id=>document.getElementById(id);$('login').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value,msg=$('msg'),btn=$('login');if(!email||!password){msg.textContent='أدخل البريد الإلكتروني وكلمة المرور';return}btn.disabled=true;btn.textContent='جارٍ الدخول...';msg.textContent='';try{const r=await fetch(AUTH,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.error||'تعذر تسجيل الدخول');localStorage.setItem('alban_admin_session',JSON.stringify({...d.session,user:d.user}));location.href='/admin.html?app=store&v=20260917'}catch(e){msg.textContent=e.message}finally{btn.disabled=false;btn.textContent='دخول'}};$('password').addEventListener('keydown',e=>{if(e.key==='Enter')$('login').click()});</script></body></html>
