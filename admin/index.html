function renderShift(){const c=document.getElementById('content');if(!currentShift){c.innerHTML='<div class="card empty">جاري تحميل بيانات الوردية...</div>';return}const s=currentShift.stats||{},sh=currentShift.shift||{},pending=s.pending_total||0,active=s.active||[];c.innerHTML='<div class="ordersToolbar"><div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><div style="font-size:20px;font-weight:900">💵 تقفيل الوردية</div><div class="muted" style="margin-top:4px">الوردية مفتوحة منذ '+escapeHtml(fmtDate(sh.started_at))+'</div></div><span class="badge prep">🟢 وردية مفتوحة</span></div><div class="summaryGrid"><div class="summaryChip"><b>'+s.delivered_order_count+'</b>طلبات مسلّمة</div><div class="summaryChip"><b>'+money(s.total_sales)+'</b>إجمالي المبيعات</div><div class="summaryChip"><b>'+money(s.cash_total)+'</b>إجمالي الكاش</div><div class="summaryChip"><b>'+money(s.card_total)+'</b>إجمالي الفيزا</div></div></div><div class="grid"><div class="card"><h3>💵 الكاش</h3><div class="orderMeta"><span class="metaChip">الإجمالي: <b>'+money(s.cash_total)+'</b></span><span class="metaChip">🟢 تم الاستلام: <b>'+money(s.cash_confirmed)+'</b></span><span class="metaChip">🔴 لم يتم الاستلام: <b>'+money(s.cash_pending)+'</b></span></div></div><div class="card"><h3>💳 الفيزا / الأونلاين</h3><div class="orderMeta"><span class="metaChip">الإجمالي: <b>'+money(s.card_total)+'</b></span><span class="metaChip">🟢 تم التأكد: <b>'+money(s.card_confirmed)+'</b></span><span class="metaChip">🟠 لم يتم التأكد: <b>'+money(s.card_pending)+'</b></span></div></div><div class="card"><h3>🔴 المبالغ خارج الوردية / غير مؤكدة</h3><div style="font-size:28px;font-weight:900;margin:8px 0">'+money(pending)+'</div><div class="muted">كاش غير محصل + فيزا لم يتم التأكد منها.</div></div><div class="card"><h3>🔴 الطلبات الحالية</h3><div style="font-size:28px;font-weight:900;margin:8px 0">'+active.length+'</div><div class="muted">'+(active.length?'لا يمكن إغلاق الوردية قبل إنهاء هذه الطلبات.':'لا توجد طلبات حالية تمنع التقفيل.')+'</div></div></div>'+(active.length?'<div class="card err" style="display:block;margin-top:14px">⚠️ لا يمكن تقفيل الوردية الآن. أنهِ الطلبات الحالية أولًا.</div>':'')+(pending?'<div class="card" style="margin-top:14px"><b>⚠️ يوجد '+money(pending)+' جنيه لم يتم تحصيله/التأكد منه.</b><div class="muted" style="margin-top:5px">يمكن تقفيل الوردية، وسيتم تثبيت هذه المبالغ داخل ملخص الوردية.</div></div>':'')+'<div class="actions" style="justify-content:flex-end;margin-top:14px"><button class="btn red" '+(active.length?'disabled':'')+' onclick="closeShift()">🔒 إغلاق الوردية</button></div></div>'}
async function closeShift(){if(!currentShift?.shift)return;if((currentShift.stats?.active||[]).length)return alert('لا يمكن تقفيل الوردية قبل إنهاء الطلبات الحالية');if(!confirm('تأكيد إغلاق الوردية؟ سيتم حفظ ملخص ثابت للوردية ولا يمكن تعديل أرقامه.'))return;try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify({action:'close_shift',branch_id:me?.branch_id})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.success){if(d.active_orders?.length){view='current';render();alert('لا يمكن تقفيل الوردية: يوجد طلبات حالية لم تنته بعد.')}else throw Error(d.message||d.error||'تعذر إغلاق الوردية');return}lastClosedShift=d.shift;currentShift=null;renderClosedShift(d.shift)}catch(e){alert(e.message)}}
function renderClosedShift(sh){const n=sh.snapshot||{},c=document.getElementById('content');c.innerHTML='<div class="card" style="max-width:760px;margin:18px auto;text-align:center"><div style="font-size:52px">✅</div><h2>تم تقفيل الوردية بنجاح</h2><div class="muted">تم حفظ ملخص ثابت للوردية رقم '+escapeHtml(String(sh.id).slice(0,8))+'</div><div class="summaryGrid" style="text-align:center;margin-top:18px"><div class="summaryChip"><b>'+n.delivered_order_count+'</b>طلبات مسلّمة</div><div class="summaryChip"><b>'+money(n.total_sales)+'</b>إجمالي المبيعات</div><div class="summaryChip"><b>'+money(n.cash_total)+'</b>إجمالي الكاش</div><div class="summaryChip"><b>'+money(n.card_total)+'</b>إجمالي الفيزا</div><div class="summaryChip"><b>'+money(n.cash_pending)+'</b>كاش لم يتم استلامه</div><div class="summaryChip"><b>'+money(n.card_pending)+'</b>فيزا لم يتم التأكد منها</div></div><div class="actions" style="justify-content:center;margin-top:18px"><button class="btn primary" onclick="printShiftSummary(lastClosedShift)">🖨️ طباعة ملخص الوردية</button><button class="btn white" onclick="setView(&quot;current&quot;)">العودة للطلبات الحالية</button></div></div>'}
function printShiftSummary(sh){if(!sh||sh.status!=='closed'||!sh.snapshot)return;const n=sh.snapshot,s=getPrintSettings(),pending=n.pending_orders||[],rows=pending.map(o=>'<div class="printItem"><div class="printName"><b>#'+escapeHtml(o.order_number)+'</b> — '+escapeHtml(shiftPaymentLabel(o.payment_method))+' — '+money(o.total)+'<div class="printNote">'+escapeHtml(o.driver?'السائق: '+o.driver:'لم يتم التأكد/الاستلام')+'</div></div></div>').join(''),area=document.getElementById('printArea');area.innerHTML='<div class="printSheet size'+(s.size==='58'?'58':'80')+'"><div class="printTitle">ألبان فلاحي</div><div class="printOrderNo">ملخص تقفيل الوردية</div><div class="printMeta"><b>رقم الوردية:</b> '+escapeHtml(String(sh.id).slice(0,8))+'<br><b>الموظف:</b> '+escapeHtml(me?.full_name||'')+'<br><b>الفرع:</b> '+escapeHtml(me?.branch_name_ar||me?.branch_name||me?.branch_id||'')+'<br><b>بداية الوردية:</b> '+escapeHtml(fmtDate(n.started_at))+'<br><b>نهاية الوردية:</b> '+escapeHtml(fmtDate(n.closed_at))+'</div><div class="printMeta" style="border-top:2px solid #000;padding-top:8px"><div><b>الطلبات المسلّمة:</b> '+n.delivered_order_count+'</div><div><b>إجمالي المبيعات:</b> '+money(n.total_sales)+'</div><div><b>إجمالي الكاش:</b> '+money(n.cash_total)+'</div><div><b>كاش تم الاستلام:</b> '+money(n.cash_confirmed)+'</div><div><b>كاش لم يتم الاستلام:</b> '+money(n.cash_pending)+'</div><div><b>إجمالي الفيزا/الأونلاين:</b> '+money(n.card_total)+'</div><div><b>فيزا تم التأكد منها:</b> '+money(n.card_confirmed)+'</div><div><b>فيزا لم يتم التأكد منها:</b> '+money(n.card_pending)+'</div><div style="font-size:19px;font-weight:900;margin-top:7px"><b>إجمالي المبالغ المعلقة:</b> '+money(n.pending_total)+'</div></div>'+(pending.length?'<div class="printMeta" style="border-top:2px solid #000;margin-top:8px;padding-top:8px"><b>الطلبات ذات المبالغ المعلقة</b></div><div class="printItems">'+rows+'</div>':'')+'<div class="printFooter">وردية مغلقة — هذا الملخص ثابت وقت التقفيل</div></div>';const cleanup=()=>{area.innerHTML='';window.removeEventListener('afterprint',cleanup)};window.addEventListener('afterprint',cleanup);setTimeout(()=>window.print(),80)}
function collectionEligible(o){return o.status==='delivered'&&!['cancelled','rejected'].includes(o.status)}
function collectionPendingCount(){return orders.filter(o=>collectionEligible(o)&&o.payment_method&&o.collection_status!=='confirmed').length}
function renderCollection(){const c=document.getElementById('content');const list=orders.filter(collectionEligible);const pending=list.filter(o=>o.collection_status!=='confirmed');const cash=pending.filter(o=>o.payment_method==='cash'),visa=pending.filter(o=>['card','online'].includes(o.payment_method));c.innerHTML='<div class="ordersToolbar"><div style="font-size:19px;font-weight:900">💵 التحصيل</div><div class="muted" style="margin-top:4px">مراجعة استلام الكاش والتأكد من عمليات الفيزا للطلبات التي تم تسليمها.</div><div class="summaryGrid"><div class="summaryChip"><b>'+cash.length+'</b>كاش يحتاج استلام</div><div class="summaryChip"><b>'+visa.length+'</b>فيزا تحتاج تأكيد</div><div class="summaryChip"><b>'+pending.length+'</b>إجمالي يحتاج مراجعة</div><div class="summaryChip"><b>'+list.length+'</b>طلبات مسلّمة</div></div></div><div class="grid">'+(pending.length?pending.map(collectionCard).join(''):'<div class="card empty"><div style="font-size:42px">✅</div><h2>كل التحصيلات مكتملة</h2><div class="muted">لا توجد طلبات تحتاج إجراء حاليًا.</div></div>')+'</div>'}
function collectionCard(o){const isCash=o.payment_method==='cash',label=isCash?'💵 الكاش':'💳 الفيزا',action=isCash?'🟢 تم الاستلام':'🟢 تم التأكد',name=o.customers?.profiles?.full_name||'عميل';return '<div class="card"><div class="orderHead"><div class="num">#'+escapeHtml(o.order_number)+'</div><span class="badge ready">تم التسليم</span></div><div class="orderMeta"><span class="metaChip">👤 '+escapeHtml(name)+'</span><span class="metaChip">💰 '+money(o.total||0)+'</span><span class="metaChip">'+label+'</span><span class="metaChip">🚚 '+escapeHtml(o.drivers?.name_ar||o.drivers?.name_en||'المندوب')+'</span></div><div class="executionBox"><b>'+label+'</b><div class="muted" style="margin-top:5px">'+(isCash?'المطلوب تأكيد استلام الكاش من المندوب.':'المطلوب التأكد من عملية الفيزا/إيصال الـPOS.')+'</div></div><div class="actions"><button class="btn green" onclick="confirmCollection(\''+escapeHtml(o.id)+'\')">'+action+'</button><button class="btn white" onclick="viewArchiveOrder(\''+escapeHtml(o.id)+'\')">عرض الطلب</button></div></div>'}
async function confirmCollection(id){const o=orders.find(x=>String(x.id)===String(id));if(!o)return;try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify({action:'confirm_collection',order_id:id})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.success)throw Error(d.message||d.error||'تعذر تأكيد التحصيل');o.collection_status='confirmed';o.collection_confirmed_at=d.collection?.collection_confirmed_at||new Date().toISOString();render()}catch(e){alert(e.message)}}
function renderArchive(){const d=archiveDate==='today'?new Date():new Date(archiveDate);const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');const key=y+'-'+m+'-'+day;const list=orders.filter(o=>['delivered','cancelled','rejected'].includes(o.status)&&String(o.created_at||'').slice(0,10)===key);const rows=list.map(o=>{const status=statusLabel(o.status),name=o.customers?.profiles?.full_name||'عميل',phone=o.customers?.phone||'',total=money(o.total||0),time=fmtTime(o.created_at);return '<div class="archiveRow"><div><b>#'+escapeHtml(o.order_number)+'</b><span class="badge '+(o.status==='delivered'?'ready':'new')+'">'+escapeHtml(status)+'</span></div><div><b>'+escapeHtml(name)+'</b><span class="muted">'+escapeHtml(phone)+'</span></div><div><span class="muted">'+escapeHtml(time)+'</span><b>'+total+'</b></div><button class="btn white" onclick="viewArchiveOrder(\''+escapeHtml(o.id)+'\')">عرض التفاصيل</button></div>'}).join('');document.getElementById('content').innerHTML='<div class="archiveToolbar"><div><div style="font-size:19px;font-weight:900">🗂️ أرشيف الطلبات</div><div class="muted" style="margin-top:4px">الطلبات المنتهية: تم التسليم، ملغي، مرفوض.</div></div><div class="archiveFilters"><button class="btn white" onclick="setArchiveDate(\'today\')">اليوم</button><input type="date" value="'+key+'" onchange="setArchiveDate(this.value)"></div></div><div class="archiveList">'+(rows||'<div class="card empty">لا توجد طلبات مؤرشفة لهذا اليوم</div>')+'</div>'}
function viewArchiveOrder(id){const o=orders.find(x=>String(x.id)===String(id));if(!o)return;const c=document.getElementById('content');c.innerHTML='<div class="archiveDetail"><div class="actions"><button class="btn white" onclick="renderArchive()">← رجوع للأرشيف</button></div>'+card(o)+'</div>'}
function renderProducts(){document.getElementById('content').innerHTML='<div class="card"><h3>🟢🔴 توفر المنتجات</h3><p class="muted">تعديل التوفر متاح من برنامج المحل.</p></div>';loadProducts()}
async function loadProducts(){try{const token=await getShopAccessToken();if(!token)throw Error('انتهت جلسة الدخول، برجاء تسجيل الدخول مرة أخرى');const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({action:'products'})});const d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'تعذر تحميل المنتجات');const c=document.getElementById('content');c.innerHTML='<div class="grid">'+(d.products||[]).map(p=>'<div class="card product"><div class="productInfo"><b>'+escapeHtml(p.name_ar||p.name_en||'منتج')+'</b><div class="muted">'+money(p.price)+'</div></div><button class="btn toggle '+(p.available?'green':'red')+'" onclick="toggleProduct(\''+p.id+'\','+(p.available?'false':'true')+')">'+(p.available?'متاح':'غير متاح')+'</button></div>').join('')+'</div>'}catch(e){document.getElementById('content').innerHTML='<div class="card err" style="display:block">'+escapeHtml(e.message)+'</div>'}}
async function toggleProduct(id,available){try{const token=await getShopAccessToken();if(!token)throw Error('انتهت جلسة الدخول، برجاء تسجيل الدخول مرة أخرى');const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({action:'toggle_product',product_id:id,available})});const d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'تعذر تحديث التوفر');renderProducts()}catch(e){alert(e.message)}}
function setView(v){view=v;render();if(v==='products'&&typeof loadProducts==='function')loadProducts();if(v==='shift')loadShiftStatus()}
function setArchiveDate(v){archiveDate=v||'today';renderArchive()}
function timerAlertKey(o){return 'af_prep_timer_alert_'+String(o.id)}function timerAlertState(o){try{const key=timerAlertKey(o),deadline=String(o.prep_deadline_at||'');const raw=JSON.parse(localStorage.getItem(key)||'null');if(!raw||raw.deadline!==deadline)return{deadline,warned:false,expired:false,lastOverdueMinute:null};return raw}catch{return{deadline:String(o.prep_deadline_at||''),warned:false,expired:false,lastOverdueMinute:null}}}function saveTimerAlertState(o,state){try{localStorage.setItem(timerAlertKey(o.id),JSON.stringify(state))}catch{}}function updateTimerAlerts(o){if(!enabledSound||!o.prep_deadline_at)return;const deadline=new Date(o.prep_deadline_at).getTime(),now=Date.now(),remaining=deadline-now;let state=timerAlertState(o);if(remaining>0&&remaining<=5*60000&&!state.warned){beep(660,.22);state.warned=true;saveTimerAlertState(o,state)}if(remaining<=0){if(!state.expired){beep(1040,.5);state.expired=true;state.lastOverdueMinute=Math.floor((-remaining)/60000);saveTimerAlertState(o,state)}else{const minute=Math.floor((-remaining)/60000);if(minute!==state.lastOverdueMinute){beep(920,.35);state.lastOverdueMinute=minute;saveTimerAlertState(o,state)}}}}function updateTimers(){orders.filter(o=>o.status==='preparing').forEach(o=>{const el=document.getElementById('timer-'+o.id);if(el){const deadline=new Date(o.prep_deadline_at||0).getTime(),remaining=deadline-Date.now();el.textContent=timerText(o);el.classList.toggle('dangerTimer',remaining<=0);el.classList.toggle('warningTimer',remaining>0&&remaining<=5*60000);updateTimerAlerts(o)}});if(orders.some(o=>o.status==='preparing'))setTimeout(updateTimers,1000)}
async function getShopAccessToken(){try{const {data}=await sb.auth.getSession();if(data?.session?.access_token){session={access_token:data.session.access_token,refresh_token:data.session.refresh_token||session?.refresh_token,expires_in:data.session.expires_in||session?.expires_in};localStorage.setItem('af_shop_session',JSON.stringify(session));return data.session.access_token}}catch(e){console.warn('shop current session',e)}return session?.access_token||''}async function loadOrders(){if(ordersLoading){ordersRefreshQueued=true;return new Promise(resolve=>ordersLoadWaiters.push(resolve))}ordersLoading=true;try{const token=await getShopAccessToken();if(!token)throw Error('انتهت جلسة الدخول، برجاء تسجيل الدخول مرة أخرى');const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({action:'orders'})});const d=await r.json();if(!r.ok)throw Error(d.error||d.message||'تعذر تحميل الطلبات');const previousPending=new Set(orders.filter(o=>o.status==='pending').map(o=>o.id));orders=Array.isArray(d)?d:(d.orders||d.data||[]);applyCollectionState();const newPending=orders.find(o=>o.status==='pending'&&!previousPending.has(o.id));render();if(enabledSound)syncPendingAlarm();if(newPending&&session&&me){currentAutoOpenId=newPending.id;view='current';render();setTimeout(()=>{const el=document.getElementById('order-'+CSS.escape(String(newPending.id)));if(el)el.scrollIntoView({behavior:'smooth',block:'center'})},120)}}catch(e){console.error('loadOrders',e);document.getElementById('content').innerHTML='<div class="card err" style="display:block">'+escapeHtml(e.message)+'</div>'}finally{ordersLoading=false;const waiters=ordersLoadWaiters.splice(0);waiters.forEach(resolve=>resolve());if(ordersRefreshQueued){ordersRefreshQueued=false;loadOrders()}}}
async function updateOrder(id,status,extra={}){try{const token=await getShopAccessToken();if(!token)throw Error('انتهت جلسة الدخول، برجاء تسجيل الدخول مرة أخرى');const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify(Object.assign({action:'update_order',order_id:id,status},extra))});const d=await r.json();if(!r.ok||!d.success)throw Error(d.error||d.message||'تعذر تحديث الطلب');await loadOrders()}catch(e){alert(e.message)}}
function acceptOrder(id){const o=orders.find(x=>x.id===id);updateOrder(id,'preparing',{prep_initial_minutes:15,prep_deadline_at:new Date(Date.now()+15*60000).toISOString()}).then(()=>{if(getPrintSettings().autoPrint&&o)printPreparation(o)})}
function rejectOrder(id){if(confirm('تأكيد رفض الطلب؟'))updateOrder(id,'rejected')}
function readyOrder(id){updateOrder(id,'ready')}
async function extendOrder(id){const o=orders.find(x=>x.id===id);if(!o)return;const current=new Date(o.prep_deadline_at||Date.now()).getTime();try{const token=await getShopAccessToken();if(!token)throw Error('انتهت جلسة الدخول، برجاء تسجيل الدخول مرة أخرى');const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({action:'extend_prep',order_id:id,minutes:10})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.success)throw Error(d.error||d.message||'تعذر إضافة الوقت');await loadOrders()}catch(e){alert(e.message)}}
async function transferOrder(id){const name=prompt('اكتب كود الفرع أو branch_id للتحويل');if(name)updateOrder(id,'pending',{transfer_to:name})}
async function assignDriver(id){const name=prompt('اكتب رقم السائق أو اسمه');if(name)updateOrder(id,'ready',{driver:name})}
async function logout(){clearInterval(alarmTimer);clearInterval(ordersPollTimer);if(liveChannel)sb.removeChannel(liveChannel);try{await sb.auth.signOut()}catch{}session=null;me=null;localStorage.removeItem('af_shop_session');localStorage.removeItem('af_shop_user');showLogin()}
async function initRealtime(){try{if(liveChannel)await sb.removeChannel(liveChannel);liveChannel=sb.channel('shop-orders-'+(me.branch_id||'main')).on('postgres_changes',{event:'*',schema:'public',table:'orders'},()=>loadOrders()).subscribe(s=>{if(['CHANNEL_ERROR','TIMED_OUT','CLOSED'].includes(s)){clearTimeout(liveRetry);liveRetry=setTimeout(initRealtime,5000)}})}catch(e){console.warn('realtime',e);clearTimeout(liveRetry);liveRetry=setTimeout(initRealtime,5000)}}
function startOrdersUiRefresh(){clearInterval(ordersPollTimer);ordersPollTimer=setInterval(()=>{if(document.visibilityState==='visible'&&session&&me)loadOrders()},10000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&session&&me){loadOrders();initRealtime()}});window.addEventListener('focus',()=>{if(session&&me)loadOrders()})}
async function init(){document.getElementById('modal').classList.remove('hidden');if(!session||!me){showLogin();return}try{if(window.__AF_SESSION_READY)await window.__AF_SESSION_READY}catch{}if(!session||!me){showLogin();return}await restoreShopSession();if(!session||!me){showLogin();return}view='current';render();loadOrders();loadShiftStatus();initRealtime();startOrdersUiRefresh();updatePrintSettingsUI();registerShopPush(false)}
</script><script src="/admin/products-categories.js?v=20260920-15"></script><script src="/admin/products-categories.js?v=1"></script><script>init();</script></body></html>
