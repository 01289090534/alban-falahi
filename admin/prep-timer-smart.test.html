<!doctype html><meta charset="utf-8"><title>Smart Prep Timer Test</title><body style="font-family:Arial;padding:20px"><h2>اختبار مؤقت التجهيز — Branch فقط</h2><pre id="out"></pre><script src="./prep-timer-smart.js"></script><script>
const out=document.getElementById('out'); const log=x=>out.textContent+=x+'\n';
localStorage.removeItem('alban_falahi_smart_prep_v1');
const T=AlbanFalahiSmartPrep;
let now=Date.UTC(2026,8,21,15,0,0);
let s=T.start('TEST',15,now); if(s.deadlineAt!==now+900000) throw Error('start failed'); log('PASS 1: 15-minute start');
let w=T.snapshot('TEST',now+600000); if(!w.warning||w.overdue) throw Error('warning failed'); log('PASS 2: 5-minute warning');
let o=T.snapshot('TEST',now+900000); if(!o.overdue||o.overdueMs!==0) throw Error('overdue failed'); log('PASS 3: 15-minute expiry');
T.extend('TEST',10,now+900000); let e=T.snapshot('TEST',now+900000); if(e.overdue||e.remainingMs!==600000) throw Error('extension failed'); log('PASS 4: +10 minutes replaces overdue state');
let e2=T.snapshot('TEST',now+1500000); if(!e2.overdue||e2.overdueMs!==0) throw Error('extended expiry failed'); log('PASS 5: extended deadline expiry');
T.acknowledge('TEST'); if(!T.get('TEST').acknowledged) throw Error('ack failed'); log('PASS 6: acknowledge');
T.stop('TEST'); if(T.get('TEST')!==null) throw Error('stop failed'); log('PASS 7: stop/cleanup');
log('\nAll isolated timer tests passed. No main integration performed.');
</script>
