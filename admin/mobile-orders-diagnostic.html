<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تشخيص برنامج المحل</title><style>body{font-family:Arial,Tahoma,sans-serif;background:#f5f1e9;margin:0;padding:16px;color:#222}.card{max-width:760px;margin:0 auto 14px;background:#fff;border-radius:18px;padding:18px;box-shadow:0 4px 18px #0001}.ok{color:#176b3b}.bad{color:#a00000}.muted{color:#777}.row{padding:10px 0;border-bottom:1px solid #eee}.value{font-weight:800;word-break:break-word}button{border:0;border-radius:10px;padding:12px 16px;font-weight:800;cursor:pointer;background:#222;color:#fff}</style></head><body><div class="card"><h2>🔎 تشخيص برنامج المحل</h2><div class="muted">صفحة تشخيص مؤقتة — لا تغيّر أي بيانات.</div><p><button onclick="run()">↻ إعادة الفحص</button></p></div><div id="out"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const SUPA='https://qxwvuxkbcghbkztjrzon.supabase.co',KEY='sb_publishable_JI9lC4YPTCQ8CwMxzvHNIA_C24ULpWH',API=SUPA+'/functions/v1/shop-api';const sb=window.supabase.createClient(SUPA,KEY);const out=document.getElementById('out');const esc=x=>String(x??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]||c));function row(k,v,ok=null){return '<div class="row"><b>'+esc(k)+'</b><div class="value '+(ok===true?'ok':ok===false?'bad':'')+'">'+esc(v)+'</div></div>'}async function run(){out.innerHTML='<div class="card">جاري الفحص...</div>';let session=JSON.parse(localStorage.getItem('af_shop_session')||'null'),me=JSON.parse(localStorage.getItem('af_shop_user')||'null'),html='';html+='<div class="card">'+row('الحساب المحفوظ',me?.phone||'غير موجود',!!me?.phone)+row('الدور',me?.role||'غير موجود')+row('الفرع',me?.branch_id||'غير موجود',!!me?.branch_id)+row('Access Token',session?.access_token?'موجود':'غير موجود',!!session?.access_token)+'</div>';if(!session?.access_token){out.innerHTML=html;return}try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify({action:'orders'})});const text=await r.text();let d;try{d=JSON.parse(text)}catch{}html+='<div class="card">'+row('shop-api HTTP',r.status+' '+r.statusText,r.ok)+row('shop-api response type',Array.isArray(d)?'array':typeof d)+row('عدد الطلبات',Array.isArray(d)?d.length:(d?.orders?.length??d?.data?.length??'غير معروف'),r.ok)+row('رسالة الخطأ',r.ok?'لا يوجد':(d?.message||d?.error||text.slice(0,500)),r.ok)+'</div>';if(Array.isArray(d)){html+='<div class="card"><h3>آخر الطلبات التي رجعها الـAPI</h3>'+(d.slice(0,10).map(o=>'<div class="row">#'+esc(o.order_number)+' — '+esc(o.status)+' — branch_id: '+esc(o.branch_id)+'</div>').join('')||'<div class="muted">لا توجد طلبات</div>')+'</div>'}}catch(e){html+='<div class="card">'+row('خطأ الشبكة/JavaScript',e?.message||e,false)+'</div>'}try{const ch=sb.channel('mobile-diagnostic-'+Date.now()).on('postgres_changes',{event:'*',schema:'public',table:'orders'},()=>{});const status=await new Promise(resolve=>{let done=false;const finish=x=>{if(!done){done=true;resolve(x)}};ch.subscribe(s=>{if(['SUBSCRIBED','CHANNEL_ERROR','TIMED_OUT','CLOSED'].includes(s))finish(s)});setTimeout(()=>finish('TIMEOUT_WAITING_FOR_REALTIME'),5000)});html+='<div class="card">'+row('Realtime channel',status,status==='SUBSCRIBED')+'</div>';await sb.removeChannel(ch)}catch(e){html+='<div class="card">'+row('Realtime error',e?.message||e,false)+'</div>'}out.innerHTML=html}run();</script></body></html>
