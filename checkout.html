function totals(){let s=0;cart.forEach(x=>{const p=products.find(p=>String(p.id)===String(x.product_id));if(p)s+=n(p.base_price)*n(x.quantity)});const gd=calcGlobalDiscount(s),bd=Math.min(Math.max(0,s-gd),useBonus?bonusBalance*bonusValue:0),service=Math.round(s*.02*100)/100,delivery=s>=500?0:25;return{sub:s,gd,bd,service,delivery,total:Math.max(0,s-gd-bd)+service+delivery+tipAmount}}
function renderSum(){const t=totals();const displayedSubtotal=t.sub+t.service;$('summary').innerHTML='<div class="line"><span>الإجمالي الفرعي</span><b>'+m(displayedSubtotal)+' ج.م</b></div>'+(t.gd?'<div class="line discount"><span>🔥 خصم العرض</span><b>- '+m(t.gd)+' ج.م</b></div>':'')+(t.bd?'<div class="line discount"><span>🎁 خصم البونص</span><b>- '+m(t.bd)+' ج.م</b></div>':'')+'<div class="line"><span>التوصيل</span><b>'+m(t.delivery)+' ج.م</b></div>'+(tipAmount?'<div class="line"><span>🚚 مكافأة السائق</span><b>'+m(tipAmount)+' ج.م</b></div>':'')+'<div class="total line"><span>الإجمالي النهائي</span><b>'+m(t.total)+' ج.م</b></div>'}
async function order(){if(!cart.length)return err('السلة فارغة');if(payMethod!=='cash'&&payMethod!=='card')return err('اختار طريقة الدفع: كاش أو Visa');if(!$('branch').value)return err('تعذر تحديد فرع التوصيل حاليًا، حاول مرة أخرى');if(!selectedAddress)return err('اختار أو أضف عنوان التوصيل');const t=totals(),b=$('confirm');b.disabled=true;b.textContent='جاري تأكيد الطلب...';try{const j=await fn('create-order',{customer_id:cid,customer_address:selectedAddress.address_line||selectedAddress.address,branch_id:$('branch').value,payment_method:payMethod,tip_amount:tipAmount,notes:$('notes').value.trim(),delivery_notes:$('notes').value.trim(),promo_code:$('promo').value.trim(),points_used:useBonus?Math.floor(Math.min(bonusBalance,t.sub/bonusValue)):0,items:cart.map(x=>({product_id:x.product_id,quantity:n(x.quantity),notes:x.note||''}))});localStorage.removeItem('alban_cart_v1');cart=[];const orderData=j.order||{};const originalDelivery=orderData.delivery_fee_original!=null?Number(orderData.delivery_fee_original):Number(orderData.delivery_fee||0);const originalTotal=Number(orderData.subtotal||t.sub||0)+originalDelivery;const actualTotal=Number(orderData.total||t.total||0);const service=Number(orderData.service_fee||0);const tip=Number(orderData.tip_amount||0);const discountSaved=Math.max(0,Math.round((originalTotal-actualTotal+service+tip)*100)/100);$('successSaved').textContent=m(discountSaved)+' ج.م';$('success').classList.add('show');$('confirm').style.display='none';$('successText').innerHTML='رقم الطلب: <strong>#'+esc(orderData.order_number)+'</strong><br>الإجمالي النهائي: <strong>'+m(orderData.total)+' ج.م</strong>';clearTimeout(window.__afSuccessTimer);window.__afSuccessTimer=setTimeout(()=>{location.href='index.html'},5000);}catch(e){err(e.message)}finally{b.disabled=false;b.textContent='تأكيد الطلب ❤️'}}
async function chooseNearestCheckoutBranch(){try{if(!navigator.geolocation){const d=branches.find(b=>String(b.name_ar||'').includes('سموحة'))||branches[0];if(d){$('branch').value=String(d.id);localStorage.setItem('alban_gps_branch_id',String(d.id))}return;}const bs=branches.filter(b=>Number.isFinite(Number(b.latitude))&&Number.isFinite(Number(b.longitude)));if(!bs.length)return;const pos=await new Promise((resolve,reject)=>navigator.geolocation.getCurrentPosition(resolve,reject,{enableHighAccuracy:true,timeout:10000,maximumAge:60000}));const R=6371,p=Math.PI/180,d=(a,b,c,e)=>{const x=(c-a)*p,y=(e-b)*p,q=Math.sin(x/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(q))};const nearest=bs.reduce((best,b)=>{const z=d(pos.coords.latitude,pos.coords.longitude,Number(b.latitude),Number(b.longitude));return !best||z<best.d?{b,d:z}:best},null);if(nearest){$('branch').value=String(nearest.b.id);localStorage.setItem('alban_gps_branch_id',String(nearest.b.id));$('branch').dispatchEvent(new Event('change',{bubbles:true}));$('branchMsg').textContent='📍 تم اختيار أقرب فرع حسب موقعك: '+(nearest.b.name_ar||nearest.b.name_en||'الفرع')}}catch(e){const d=branches.find(b=>String(b.name_ar||'').includes('سموحة'))||branches[0];if(d){$('branch').value=String(d.id);localStorage.setItem('alban_gps_branch_id',String(d.id))}console.log('checkout GPS',e)}}
async function init(){if(!cid||!session?.access_token){location.replace('login.html');return}cart=cart.filter(x=>n(x.quantity)>0);localStorage.setItem('alban_cart_v1',JSON.stringify(cart));renderItems();try{products=await api('products?select=id,category_id,name_ar,name_en,base_price,image_url,is_active&is_active=eq.true&order=sort_order.asc,id.asc');renderItems()}catch(e){err('تعذر تحميل المنتجات حاليًا.')}try{branches=await api('branches?select=id,name_ar,name_en,latitude,longitude,opens_at,closes_at&is_active=eq.true&order=id.asc');renderBranches();await chooseNearestCheckoutBranch();await loadRecommendations()}catch(e){renderBranches();err('تعذر تحميل الفروع حاليًا.')}await loadAccount();await loadGlobalDiscount();restoreCheckoutChoices();await loadRecommendations()}
window.addEventListener('load',init);
</script></body></html>
