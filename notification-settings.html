<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إعدادات الإشعارات - ألبان فلاحي</title><style>*{box-sizing:border-box}body{margin:0;background:#f8f5ef;color:#222;font-family:Arial,Tahoma,sans-serif;padding-bottom:30px}.wrap{max-width:620px;margin:auto;padding:16px}.card{background:#fff;border-radius:22px;padding:20px;margin-bottom:14px;box-shadow:0 5px 20px rgba(0,0,0,.07)}.head{display:flex;align-items:center;gap:12px}.back{border:0;background:#f0eee9;border-radius:12px;padding:10px 12px;font-weight:800;cursor:pointer}.brand{font-size:22px;font-weight:900}.title{font-size:24px;font-weight:900;margin:8px 0}.muted{color:#777;font-size:13px;line-height:1.6}.notice{background:#fff8e8;border:1px solid #f0dfb0;border-radius:15px;padding:12px;font-size:13px;margin-top:12px}.item{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 0;border-bottom:1px solid #eee}.item:last-child{border-bottom:0}.name{font-weight:900;font-size:16px}.desc{font-size:12px;color:#777;margin-top:4px}.icon{font-size:25px}.switch{position:relative;width:52px;height:30px;flex:0 0 auto}.switch input{opacity:0;width:0;height:0}.slider{position:absolute;inset:0;background:#ccc;border-radius:30px;cursor:pointer;transition:.2s}.slider:before{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 4px rgba(0,0,0,.2)}input:checked+.slider{background:#d35400}input:checked+.slider:before{transform:translateX(22px)}.save{width:100%;border:0;border-radius:14px;padding:14px;background:#d35400;color:#fff;font-weight:900;font-size:16px;cursor:pointer}.save:disabled{opacity:.6}.status{text-align:center;min-height:20px;font-size:13px;margin-top:10px;color:#777}.all{display:flex;gap:8px;margin-top:12px}.all button{flex:1;border:1px solid #ddd;background:#fff;border-radius:12px;padding:10px;font-weight:800;cursor:pointer}</style><link rel="stylesheet" href="brand.css"><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="manifest" href="manifest.webmanifest"></head><body><div class="wrap"><div class="card"><div class="head"><button class="back" onclick="history.back()">↩ رجوع</button><div><div class="brand">🥛 ألبان فلاحي</div><div id="customer" class="muted">إعدادات حسابك</div></div></div></div><div class="card"><div class="title">🔔 إشعارات تغيّر حالة الطلب</div><div class="muted">اختار الإشعارات التي تحب توصلك داخل حسابك عند انتقال طلبك بين المراحل.</div><div class="notice">يمكنك تشغيل أو إيقاف كل حالة بشكل مستقل. الإعداد الافتراضي هو تشغيل كل الإشعارات.</div><div id="list"></div><div class="all"><button onclick="setAll(true)">تشغيل الكل</button><button onclick="setAll(false)">إيقاف الكل</button></div><button id="save" class="save" onclick="save()">💾 حفظ إعدادات الإشعارات</button><div id="msg" class="status"></div></div></div><script>const BASE='https://qxwvuxkbcghbkztjrzon.supabase.co',KEY='sb_publishable_JI9lC4YPTCQ8CwMxzvHNIA_C24ULpWH',CID=localStorage.getItem('alban_customer_id');const defs=[['preparing','👨‍🍳','قيد التحضير','عند بدء تجهيز طلبك'],['ready','🎉','جاهز','عندما يصبح طلبك جاهزًا'],['out_for_delivery','🚗','في الطريق','عندما يبدأ المندوب التوصيل'],['delivered','❤️','تم التوصيل','عند اكتمال توصيل الطلب']];let prefs={preparing:true,ready:true,out_for_delivery:true,delivered:true};if(!CID)location.href='index.html';function headers(){return{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'}}function render(){document.getElementById('list').innerHTML=defs.map(d=>`<div class="item"><div><span class="icon">${d[1]}</span> <span class="name">${d[2]}</span><div class="desc">${d[3]}</div></div><label class="switch"><input id="p-${d[0]}" type="checkbox" ${prefs[d[0]]?'checked':''}><span class="slider"></span></label></div>`).join('')}async function load(){try{const r=await fetch(BASE+'/rest/v1/rpc/customer_account_get',{method:'POST',headers:headers(),body:JSON.stringify({_customer_id:CID})});const d=await r.json();if(!r.ok)throw Error(d.message||'تعذر تحميل الإعدادات');const p=d.notification_preferences||d.customer?.notification_preferences||{};prefs={preparing:p.preparing!==false,ready:p.ready!==false,out_for_delivery:p.out_for_delivery!==false,delivered:p.delivered!==false};document.getElementById('customer').textContent=(d.customer?.full_name?'أهلاً '+d.customer.full_name+' • ':'')+'إعدادات حسابك';render()}catch(e){document.getElementById('msg').textContent='⚠️ '+e.message;render()}}function setAll(v){defs.forEach(d=>document.getElementById('p-'+d[0]).checked=v)}async function save(){const b=document.getElementById('save'),m=document.getElementById('msg');b.disabled=true;m.textContent='جاري الحفظ...';const payload={_customer_id:CID,_preparing:document.getElementById('p-preparing').checked,_ready:document.getElementById('p-ready').checked,_out_for_delivery:document.getElementById('p-out_for_delivery').checked,_delivered:document.getElementById('p-delivered').checked};try{const r=await fetch(BASE+'/rest/v1/rpc/customer_account_update_notification_preferences',{method:'POST',headers:headers(),body:JSON.stringify(payload)});const d=await r.json();if(!r.ok||!d.success)throw Error(d.message||d.error||'تعذر حفظ الإعدادات');prefs={...prefs,preparing:payload._preparing,ready:payload._ready,out_for_delivery:payload._out_for_delivery,delivered:payload._delivered};m.textContent='تم حفظ إعدادات الإشعارات بنجاح ✅'}catch(e){m.textContent='⚠️ '+e.message}finally{b.disabled=false}}load();</script></body></html>
