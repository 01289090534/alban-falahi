<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة التقييمات - ألبان فلاحي</title><style>body{margin:0;background:#f5f2ea;font-family:Arial,Tahoma,sans-serif;color:#222}.wrap{max-width:900px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 4px 18px #0000000d}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.btn{border:0;border-radius:12px;padding:10px 15px;font-weight:700;cursor:pointer}.dark{background:#222;color:#fff}.danger{background:#b42318;color:#fff}.muted{color:#777;font-size:13px}.summary{font-size:28px;font-weight:900}.review{border:1px solid #eee;border-radius:15px;padding:15px;margin-top:10px}.stars{letter-spacing:2px;font-size:20px}.comment{margin-top:8px;line-height:1.7}.row{display:flex;justify-content:space-between;gap:10px;margin:6px 0}.empty{text-align:center;padding:30px;color:#777}.login input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:8px 0;font-size:16px}.hidden{display:none}</style></head><body><div class="wrap"><div class="card top"><div><b>⭐ إدارة تقييمات ألبان فلاحي</b><div class="muted">تقييم الأكل ظاهر للعملاء — تقييم الدليفري داخلي فقط</div></div><button class="btn dark" onclick="location.href='menu.html'">المنيو</button></div><div id="login" class="card login"><h3>دخول الإدارة</h3><input id="key" type="password" placeholder="كود الإدارة"><button class="btn dark" onclick="enter()">دخول</button></div><main id="app" class="hidden"><div class="card"><div class="summary" id="avg">0.0 / 5 ⭐</div><div class="muted" id="count">0 تقييم</div><div style="margin-top:12px">🚚 متوسط الدليفري: <b id="delivery">0.0 / 5</b> <span class="muted">(للإدارة فقط)</span></div></div><div id="list"></div></main></div><script>const API='https://qxwvuxkbcghbkztjrzon.supabase.co/functions/v1/reviews-api';let adminKey=sessionStorage.getItem('alban_admin_review_key')||'';function stars(n){n=Number(n||0);return '★'.repeat(n)+'☆'.repeat(5-n)}function enter(){const k=document.getElementById('key').value.trim();if(!k)return alert('اكتب كود الإدارة');adminKey=k;sessionStorage.setItem('alban_admin_review_key',k);load()}async function load(){try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'admin_list',admin_key:adminKey})});const d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'تعذر الدخول');document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('avg').textContent=Number(d.summary.food_average||0).toFixed(1)+' / 5 ⭐';document.getElementById('count').textContent=(d.summary.food_count||0)+' تقييم';document.getElementById('delivery').textContent=Number(d.summary.delivery_average||0).toFixed(1)+' / 5';const box=document.getElementById('list');if(!d.reviews.length){box.innerHTML='<div class="card empty">لا توجد تقييمات حتى الآن</div>';return}box.innerHTML=d.reviews.map(x=>`<div class="card review"><div class="row"><b>${escapeHtml(x.customer_name||'عميل')}</b><span class="muted">طلب #${x.order_id}</span></div><div class="stars">${stars(x.food_rating)}</div><div class="comment">${x.food_comment?escapeHtml(x.food_comment):'<span class="muted">بدون تعليق</span>'}</div><div class="muted" style="margin-top:8px">🚚 الدليفري: ${stars(x.delivery_rating)} • ${new Date(x.created_at).toLocaleDateString('ar-EG')}</div><button class="btn danger" style="margin-top:12px" onclick="del(${x.id})">🗑️ حذف التقييم</button></div>`).join('')}catch(e){sessionStorage.removeItem('alban_admin_review_key');document.getElementById('login').classList.remove('hidden');alert(e.message)}}function escapeHtml(s){return String(s).replace(/[&<>\'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[m]))}async function del(id){if(!confirm('متأكد إنك عايز تمسح التقييم ده؟'))return;const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'admin_delete',admin_key:adminKey,review_id:id})});const d=await r.json();if(!r.ok||!d.success)return alert(d.error||'تعذر الحذف');load()}if(adminKey)load();</script></body></html>
