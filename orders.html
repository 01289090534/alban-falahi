<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>طلباتك - ألبان فلاحي</title><style>*{box-sizing:border-box}body{margin:0;background:#f8f5ef;color:#222;font-family:Arial,Tahoma,sans-serif;padding-bottom:78px}.container{max-width:700px;margin:auto;padding:16px}.header,.card{background:#fff;border-radius:22px;padding:18px;box-shadow:0 5px 20px rgba(0,0,0,.07)}.header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}.brand{font-size:23px;font-weight:900}.muted{font-size:13px;color:#777;margin-top:5px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:15px}.tab{border:1px solid #ddd;background:#fff;border-radius:13px;padding:12px;font-weight:900;cursor:pointer}.tab.active{background:#222;color:#fff}.order{border:1px solid #e9e9e9;border-radius:17px;padding:14px;margin-top:11px}.order-head{display:flex;justify-content:space-between;align-items:center;gap:8px}.tag{background:#f0f0f0;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800}.item,.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #eee;font-size:14px}.total{font-size:17px;font-weight:900}.empty{text-align:center;color:#777;padding:35px 10px}.btn{border:0;border-radius:12px;padding:10px 13px;background:#eee;font-weight:800;cursor:pointer}.tracking{margin-top:10px;background:#effcfb;border-radius:13px;padding:12px;font-size:13px}.trackbox{margin-top:10px;background:#f5faf6;border:1px solid #cfe5d3;border-radius:15px;padding:12px}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:10px 0}.step{font-size:11px;text-align:center;padding:8px 3px;border-radius:9px;background:#eee;color:#777}.step.done{background:#dff2e2;color:#237332;font-weight:900}.mapbtn{display:block;text-align:center;text-decoration:none;background:#222;color:#fff;border-radius:11px;padding:11px;margin-top:9px;font-weight:900}.driverline{display:flex;justify-content:space-between;gap:8px;align-items:center}.review-box{margin-top:14px;background:#f3fbfc;border:1px solid #bde9e6;border-radius:16px;padding:14px}.review-title{font-size:18px;font-weight:900;text-align:center}.review-label{font-size:13px;font-weight:900;margin-top:12px}.stars{display:flex;direction:rtl;justify-content:center;gap:6px;margin-top:8px}.stars button{border:0;background:#fff;border-radius:10px;width:42px;height:42px;font-size:25px;cursor:pointer;opacity:.45}.stars button.active{opacity:1;background:#ffe5a8}.review-text{width:100%;border:1px solid #ddd;border-radius:12px;padding:11px;margin-top:8px;min-height:75px;resize:vertical;font-family:inherit}.review-submit{width:100%;border:0;border-radius:12px;padding:12px;background:linear-gradient(135deg,#0877b9,#16b8b0);color:#fff;font-weight:900;font-size:16px;margin-top:10px;cursor:pointer}.review-submit:disabled{opacity:.6}.review-msg{text-align:center;font-size:13px;color:#666;margin-top:8px;min-height:18px}.notif-wrap{margin-bottom:15px}.notif-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.notif-title{font-size:18px;font-weight:900}.badge{background:#0877b9;color:#fff}.notif-list{display:grid;gap:8px}.notif{background:#fff;border:1px solid #eee;border-radius:15px;padding:12px;cursor:pointer}.notif.unread{border-color:#bde9e6;background:#f7fffe}.notif-top{display:flex;justify-content:space-between;gap:8px}.notif-title2{font-weight:900}.notif-body{font-size:13px;color:#555;margin-top:5px}.notif-time{font-size:11px;color:#999;margin-top:7px}.notif-read{font-size:11px;color:#888}.bottom-nav{position:fixed;z-index:100;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;box-shadow:0 -4px 18px rgba(0,0,0,.1);height:68px}.bottom-inner{width:min(700px,100%);height:100%;margin:auto;display:grid;grid-template-columns:repeat(3,1fr)}.bottom-nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;color:#777;font-size:12px;font-weight:800;gap:3px}.bottom-nav a.active{color:#d35400}.icon{font-size:22px;line-height:1}@media(max-width:500px){.container{padding:12px}.brand{font-size:20px}.steps{grid-template-columns:repeat(2,1fr)}}</style><link rel="stylesheet" href="brand.css"><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="manifest" href="manifest.webmanifest"><style id="alban-orders-brand">

</style><script src="customer-branding.js?v=20260918-2300"></script></head><body><div class="container"><div class="header"><div><div class="brand"><span class="orders-brand-logo" aria-hidden="true"></span><span>ألبان فلاحي</span></div><div id="customer" class="muted">جاري تحميل الطلبات...</div></div><button class="btn" onclick="location.href='menu.html'">🛒 المنيو</button></div><section class="notif-wrap"><div class="card"><div class="notif-head"><div class="notif-title">🔔 إشعاراتك <span id="notifBadge" class="badge" style="display:none">0</span></div><button class="btn" onclick="readAllNotifications()">تعليم الكل كمقروء</button></div><div id="notifList" class="notif-list"><div class="muted">جاري تحميل الإشعارات...</div></div></div></section><div class="tabs"><button id="activeTab" class="tab active" onclick="showTab('active')">📦 طلباتك الحالية</button><button id="pastTab" class="tab" onclick="showTab('past')">🕘 طلباتك السابقة</button></div><div id="loading" class="card empty">جاري تحميل طلباتك...</div><div id="error" class="card empty" style="display:none;color:#a40018"></div><div id="orders" style="display:none"></div></div><nav class="bottom-nav"><div class="bottom-inner"><a href="menu.html"><span class="icon">🏠</span><span>الرئيسية</span></a><a class="active" href="orders.html"><span class="icon">📦</span><span>طلباتك</span></a><a href="account.html"><span class="icon">⭐</span><span>حسابك</span></a></div></nav><script>const ACCOUNT_API='https://qxwvuxkbcghbkztjrzon.supabase.co/functions/v1/customer-account-secure',TRACK_API='https://qxwvuxkbcghbkztjrzon.supabase.co/functions/v1/customer-tracking-secure',NOTIF_API='https://qxwvuxkbcghbkztjrzon.supabase.co/functions/v1/customer-notifications-secure',REVIEWS_API='https://qxwvuxkbcghbkztjrzon.supabase.co/functions/v1/customer-reviews-secure',customerId=localStorage.getItem('alban_customer_id');let authSession=null;try{authSession=JSON.parse(localStorage.getItem('alban_auth_session')||'null')}catch{}let allOrders=[],currentTab='active',pendingReviews=new Set(),reviewState={};if(!customerId||!authSession?.access_token)location.href='index.html';function authHeaders(){return{'Content-Type':'application/json','Authorization':'Bearer '+authSession.access_token}}function handleAuthResponse(r){if(r.status===401){localStorage.removeItem('alban_auth_session');location.href='index.html';return false}return true}function money(n){return Number(n||0).toFixed(2)+' ج'}function num(n){return Number(n||0).toLocaleString('ar-EG')}function dateTime(v){try{return new Date(v).toLocaleString('ar-EG',{year:'numeric',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}catch{return v||''}}function statusText(s){return({new:'تم استلام الطلب',confirmed:'تم تأكيد الطلب',preparing:'جاري التحضير',ready:'الطلب جاهز',assigned:'تم تعيين المندوب',out_for_delivery:'المندوب في الطريق 🚗',delivered:'تم التوصيل',cancelled:'تم إلغاء الطلب',rejected:'تم رفض الطلب'})[s]||s||''}function paymentText(s){return({cash:'كاش',card:'Visa / Mastercard',wallet:'محفظة'})[s]||s||''}function showTab(tab){currentTab=tab;document.getElementById('activeTab').classList.toggle('active',tab==='active');document.getElementById('pastTab').classList.toggle('active',tab==='past');render()}function stars(orderId,type){const key=orderId+'_'+type;const val=reviewState[key]||0;return [5,4,3,2,1].map(n=>`<button type="button" class="${val===n?'active':''}" onclick="setRating(${orderId},'${type}',${n})">★</button>`).join('')}function setRating(id,type,n){reviewState[id+'_'+type]=n;const el=document.getElementById('review-'+id);if(el){el.querySelector('.food-stars').innerHTML=stars(id,'food');el.querySelector('.delivery-stars').innerHTML=stars(id,'delivery')}}function reviewCard(o){if(!pendingReviews.has(Number(o.id))||o.status!=='delivered')return '';return `<div class="review-box" id="review-${o.id}"><div class="review-title">⭐ قيّم طلبك</div><div class="review-label">تقييم الأكل</div><div class="stars food-stars">${stars(o.id,'food')}</div><div class="review-label">تقييم التوصيل</div><div class="stars delivery-stars">${stars(o.id,'delivery')}</div><div class="review-label">رأيك في الأكل (اختياري)</div><textarea id="comment-${o.id}" class="review-text" maxlength="1000" placeholder="اكتب رأيك هنا..."></textarea><button class="review-submit" onclick="submitReview(${o.id})">إرسال التقييم</button><div id="review-msg-${o.id}" class="review-msg"></div></div>`}function trackBox(o){if(['delivered','cancelled','rejected'].includes(o.status))return '';const idx={new:0,confirmed:1,preparing:1,ready:2,assigned:3,out_for_delivery:3}[o.status]??0;return `<div class="trackbox"><div><b>📦 متابعة الطلب</b></div><div class="steps"><div class="step ${idx>=0?'done':''}">استلام</div><div class="step ${idx>=1?'done':''}">تحضير</div><div class="step ${idx>=2?'done':''}">جاهز</div><div class="step ${idx>=3?'done':''}">التوصيل</div></div><div id="track-${o.id}">جاري تحديث موقع المندوب...</div></div>`}async function refreshTrack(o){if(['delivered','cancelled','rejected'].includes(o.status))return;try{const r=await fetch(TRACK_API,{method:'POST',headers:authHeaders(),body:JSON.stringify({customer_id:customerId,order_id:o.id})});if(!handleAuthResponse(r))return;const d=await r.json();const el=document.getElementById('track-'+o.id);if(!el||!d.success)return;if(d.driver){const has=d.driver.current_latitude!=null&&d.driver.current_longitude!=null;const link=has?'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(d.driver.current_latitude+','+d.driver.current_longitude):'';el.innerHTML=`<div class="driverline"><span>🚗 المندوب: <b>${d.driver.name_ar||'مندوب ألبان فلاحي'}</b></span><span>${d.driver.is_available?'متاح':'في مهمة'}</span></div>${has?`<a class="mapbtn" href="${link}" target="_blank" rel="noopener">🗺️ فتح موقع المندوب على الخريطة</a><div class="muted">آخر تحديث: ${dateTime(d.driver.last_location_at)}</div>`:'المندوب لم يرسل موقعه بعد.'}`}else el.innerHTML='⏳ جاري تجهيز المندوب لطلبك...'}catch{}}async function loadNotifications(){try{const r=await fetch(NOTIF_API,{method:'POST',headers:authHeaders(),body:JSON.stringify({customer_id:customerId,action:'list'})});if(!handleAuthResponse(r))return;const d=await r.json();if(!r.ok||!d.success)return;const badge=document.getElementById('notifBadge');badge.textContent=d.unread_count||0;badge.style.display=d.unread_count?'inline-flex':'none';const list=document.getElementById('notifList');const ns=d.notifications||[];list.innerHTML=ns.length?ns.map(n=>`<div class="notif ${n.read_at?'':'unread'}" onclick="openNotification('${n.id}',${JSON.stringify(n.data||{})})"><div class="notif-top"><span class="notif-title2">${n.title||'إشعار'}</span><span class="notif-read">${n.read_at?'مقروء':'جديد'}</span></div><div class="notif-body">${n.body||''}</div><div class="notif-time">${dateTime(n.created_at)}</div></div>`).join(''):'<div class="muted">لا توجد إشعارات حتى الآن ❤️</div>'}catch{}}async function openNotification(id,data){try{const r=await fetch(NOTIF_API,{method:'POST',headers:authHeaders(),body:JSON.stringify({customer_id:customerId,action:'read',notification_id:id})});if(!handleAuthResponse(r))return}catch{}if(data?.order_id){const el=[...document.querySelectorAll('.order')].find(x=>x.innerHTML.includes(String(data.order_id)));if(el)el.scrollIntoView({behavior:'smooth',block:'center'});}loadNotifications()}async function readAllNotifications(){try{const r=await fetch(NOTIF_API,{method:'POST',headers:authHeaders(),body:JSON.stringify({customer_id:customerId,action:'read_all'})});if(!handleAuthResponse(r))return}catch{}loadNotifications()}async function load(){try{const r=await fetch(ACCOUNT_API,{method:'POST',headers:authHeaders(),body:JSON.stringify({customer_id:customerId,ts:Date.now()})});if(!handleAuthResponse(r))return;const d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'تعذر تحميل الطلبات');document.getElementById('loading').style.display='none';document.getElementById('orders').style.display='block';document.getElementById('error').style.display='none';document.getElementById('error').textContent='';allOrders=d.orders||[];document.getElementById('customer').textContent='كل طلباتك الحالية والسابقة';const rr=await fetch(REVIEWS_API,{method:'POST',headers:authHeaders(),body:JSON.stringify({action:'pending',customer_id:customerId})});if(!handleAuthResponse(rr))return;const rd=await rr.json();pendingReviews=new Set((rd.orders||[]).map(x=>Number(x.id)));render();allOrders.filter(o=>!['delivered','cancelled','rejected'].includes(o.status)).forEach(refreshTrack);loadNotifications()}catch(e){document.getElementById('loading').style.display='none';const er=document.getElementById('error');er.style.display='block';er.textContent='⚠️ '+e.message}}function render(){const box=document.getElementById('orders'),active=allOrders.filter(o=>!['delivered','cancelled','rejected'].includes(o.status)),past=allOrders.filter(o=>['delivered','cancelled','rejected'].includes(o.status)),list=currentTab==='active'?active:past;if(!list.length){box.innerHTML=`<div class="card empty">${currentTab==='active'?'مفيش طلبات حالية دلوقتي ❤️':'لسه مفيش طلبات سابقة'}</div>`;return}box.innerHTML=list.map(o=>`<div class="order"><div class="order-head"><strong>طلب #${o.id}</strong><span class="tag">${statusText(o.status)}</span></div><div class="muted">${dateTime(o.created_at)}${o.branch_name?' • '+o.branch_name:''}</div>${(o.items||[]).map(i=>`<div class="item"><span>${i.product_name||''} × ${num(i.quantity)}</span><strong>${money(i.line_total)}</strong></div>`).join('')}<div class="row"><span>إجمالي الأصناف</span><strong>${money(o.subtotal)}</strong></div><div class="row"><span>الخدمة</span><strong>${money(o.service_fee)}</strong></div><div class="row"><span>التوصيل</span><strong>${Number(o.delivery_fee)>0?money(o.delivery_fee):'مجاني 🎉'}</strong></div>${Number(o.tip_amount)>0?`<div class="row"><span>البقشيش</span><strong>${money(o.tip_amount)}</strong></div>`:''}<div class="row total"><span>الإجمالي</span><strong>${money(o.total)}</strong></div><div class="muted">الدفع: ${paymentText(o.payment_method)}${Number(o.points_earned)>0?' • ⭐ '+num(o.points_earned)+' نقطة':''}</div>${!['delivered','cancelled','rejected'].includes(o.status)&&o.estimated_delivery_at?`<div class="tracking">⏱️ الموعد المتوقع: <strong>${dateTime(o.estimated_delivery_at)}</strong></div>`:''}${trackBox(o)}${reviewCard(o)}</div>`).join('');list.filter(o=>!['delivered','cancelled','rejected'].includes(o.status)).forEach(refreshTrack)}async function submitReview(id){const food=reviewState[id+'_food']||0,delivery=reviewState[id+'_delivery']||0,msg=document.getElementById('review-msg-'+id),btn=document.querySelector('#review-'+id+' .review-submit');if(!food||!delivery){msg.textContent='اختار تقييم الأكل والتوصيل أولاً';return}btn.disabled=true;msg.textContent='جاري إرسال التقييم...';try{const r=await fetch(REVIEWS_API,{method:'POST',headers:authHeaders(),body:JSON.stringify({action:'submit',customer_id:customerId,order_id:id,food_rating:food,delivery_rating:delivery,food_comment:document.getElementById('comment-'+id)?.value||''})});if(!handleAuthResponse(r))return;const d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'تعذر إرسال التقييم');pendingReviews.delete(Number(id));msg.textContent='تم إرسال تقييمك ❤️';render()}catch(e){msg.textContent='⚠️ '+e.message;btn.disabled=false}}load();setInterval(load,5000);setInterval(loadNotifications,5000);</script><script src="tracking-map.js"></script></body></html>
