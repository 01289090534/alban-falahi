<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>طلباتك - ألبان فلاحي</title><style>*{box-sizing:border-box}body{margin:0;background:#f8f5ef;color:#222;font-family:Arial,Tahoma,sans-serif;padding-bottom:78px}.container{max-width:700px;margin:auto;padding:16px}.header,.card{background:#fff;border-radius:22px;padding:18px;box-shadow:0 5px 20px rgba(0,0,0,.07)}.header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}.brand{font-size:23px;font-weight:900}.muted{font-size:13px;color:#777;margin-top:5px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:15px}.tab{border:1px solid #ddd;background:#fff;border-radius:13px;padding:12px;font-weight:900;cursor:pointer}.tab.active{background:#222;color:#fff}.order{border:1px solid #e9e9e9;border-radius:17px;padding:14px;margin-top:11px}.order-head{display:flex;justify-content:space-between;align-items:center;gap:8px}.tag{background:#f0f0f0;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800}.item,.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #eee;font-size:14px}.total{font-size:17px;font-weight:900}.empty{text-align:center;color:#777;padding:35px 10px}.btn{border:0;border-radius:12px;padding:10px 13px;background:#eee;font-weight:800;cursor:pointer}.tracking{margin-top:10px;background:#fff9e8;border-radius:13px;padding:10px;font-size:13px}.review-box{margin-top:14px;background:#fff8ed;border:1px solid #f1d6b2;border-radius:16px;padding:14px}.review-title{font-size:18px;font-weight:900;text-align:center}.review-label{font-size:13px;font-weight:900;margin-top:12px}.stars{display:flex;direction:rtl;justify-content:center;gap:6px;margin-top:8px}.stars button{border:0;background:#fff;border-radius:10px;width:42px;height:42px;font-size:25px;cursor:pointer;opacity:.45}.stars button.active{opacity:1;background:#ffe5a8}.review-text{width:100%;border:1px solid #ddd;border-radius:12px;padding:11px;margin-top:8px;min-height:75px;resize:vertical;font-family:inherit}.review-submit{width:100%;border:0;border-radius:12px;padding:12px;background:#d35400;color:#fff;font-weight:900;font-size:16px;margin-top:10px;cursor:pointer}.review-submit:disabled{opacity:.6}.review-msg{text-align:center;font-size:13px;color:#666;margin-top:8px;min-height:18px}.bottom-nav{position:fixed;z-index:100;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;box-shadow:0 -4px 18px rgba(0,0,0,.1);height:68px}.bottom-inner{width:min(700px,100%);height:100%;margin:auto;display:grid;grid-template-columns:repeat(3,1fr)}.bottom-nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;color:#777;font-size:12px;font-weight:800;gap:3px}.bottom-nav a.active{color:#d35400}.icon{font-size:22px;line-height:1}@media(max-width:500px){.container{padding:12px}.brand{font-size:20px}}</style></head><body><div class="container"><div class="header"><div><div class="brand">🥛 ألبان فلاحي</div><div id="customer" class="muted">جاري تحميل الطلبات...</div></div><button class="btn" onclick="location.href='menu.html'">🛒 المنيو</button></div><div class="tabs"><button id="activeTab" class="tab active" onclick="showTab('active')">📦 طلباتك الحالية</button><button id="pastTab" class="tab" onclick="showTab('past')">🕘 طلباتك السابقة</button></div><div id="loading" class="card empty">جاري تحميل طلباتك...</div><div id="error" class="card empty" style="display:none;color:#a40018"></div><div id="orders" style="display:none"></div></div><nav class="bottom-nav"><div class="bottom-inner"><a href="menu.html"><span class="icon">🏠</span><span>الرئيسية</span></a><a class="active" href="orders.html"><span class="icon">📦</span><span>طلباتك</span></a><a href="account.html"><span class="icon">⭐</span><span>حسابك</span></a></div></nav><script>const ACCOUNT_API='https://qxwvuxkbcghbkztjrzon.supabase.co/functions/v1/customer-account',REVIEWS_API='https://qxwvuxkbcghbkztjrzon.supabase.co/functions/v1/reviews-api',customerId=localStorage.getItem('alban_customer_id');let allOrders=[],currentTab='active',pendingReviews=new Set(),reviewState={};if(!customerId)location.href='index.html';function money(n){return Number(n||0).toFixed(2)+' ج'}function num(n){return Number(n||0).toLocaleString('ar-EG')}function dateTime(v){try{return new Date(v).toLocaleString('ar-EG',{year:'numeric',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}catch{return v||''}}function statusText(s){return({new:'تم استلام الطلب',confirmed:'تم تأكيد الطلب',preparing:'جاري التحضير',ready:'الطلب جاهز',out_for_delivery:'المندوب استلم الطلب • في الطريق',delivered:'تم التوصيل',cancelled:'تم إلغاء الطلب'})[s]||s||''}function paymentText(s){return({cash:'كاش',card:'Visa / Mastercard',wallet:'محفظة'})[s]||s||''}function showTab(tab){currentTab=tab;document.getElementById('activeTab').classList.toggle('active',tab==='active');document.getElementById('pastTab').classList.toggle('active',tab==='past');render()}function stars(orderId,type){const key=orderId+'_'+type;const val=reviewState[key]||0;return [5,4,3,2,1].map(n=>`<button type="button" class="${val===n?'active':''}" onclick="setRating(${orderId},'${type}',${n})">★</button>`).join('')}function setRating(id,type,n){reviewState[id+'_'+type]=n;const el=document.getElementById('review-'+id);if(el){el.querySelector('.food-stars').innerHTML=stars(id,'food');el.querySelector('.delivery-stars').innerHTML=stars(id,'delivery')}}function reviewCard(o){if(!pendingReviews.has(Number(o.id))||o.status!=='delivered')return '';return `<div class="review-box" id="review-${o.id}"><div class="review-title">⭐ قيّم طلبك</div><div class="review-label">تقييم الأكل</div><div class="stars food-stars">${stars(o.id,'food')}</div><div class="review-label">تقييم التوصيل</div><div class="stars delivery-stars">${stars(o.id,'delivery')}</div><div class="review-label">رأيك في الأكل (اختياري)</div><textarea id="comment-${o.id}" class="review-text" maxlength="1000" placeholder="اكتب رأيك هنا..."></textarea><button class="review-submit" onclick="submitReview(${o.id})">إرسال التقييم</button><div id="review-msg-${o.id}" class="review-msg"></div></div>`}async function submitReview(id){const food=reviewState[id+'_food']||0,delivery=reviewState[id+'_delivery']||0,msg=document.getElementById('review-msg-'+id),btn=document.querySelector('#review-'+id+' .review-submit');if(!food||!delivery){msg.textContent='من فضلك اختار تقييم الأكل والتوصيل ⭐';return}btn.disabled=true;msg.textContent='جاري إرسال التقييم...';try{const r=await fetch(REVIEWS_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'submit',customer_id:customerId,order_id:id,food_rating:food,delivery_rating:delivery,food_comment:document.getElementById('comment-'+id).value})}),d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'تعذر إرسال التقييم');pendingReviews.delete(Number(id));msg.textContent='❤️ شكرًا لتقييمك!';document.querySelector('#review-'+id).innerHTML='<div class="review-title">❤️ تم استلام تقييمك، شكرًا ليك</div>'}catch(e){msg.textContent='⚠️ '+e.message;btn.disabled=false}}function render(){const box=document.getElementById('orders'),active=allOrders.filter(o=>!['delivered','cancelled'].includes(o.status)),past=allOrders.filter(o=>['delivered','cancelled'].includes(o.status)),list=currentTab==='active'?active:past;if(!list.length){box.innerHTML=`<div class="card empty">${currentTab==='active'?'مفيش طلبات حالية دلوقتي ❤️':'لسه مفيش طلبات سابقة'}</div>`;return}box.innerHTML=list.map(o=>`<div class="order"><div class="order-head"><strong>طلب #${o.id}</strong><span class="tag">${statusText(o.status)}</span></div><div class="muted">${dateTime(o.created_at)}${o.branch_name?' • '+o.branch_name:''}</div>${(o.items||[]).map(i=>`<div class="item"><span>${i.product_name||''} × ${num(i.quantity)}</span><strong>${money(i.line_total)}</strong></div>`).join('')}<div class="row"><span>إجمالي الأصناف</span><strong>${money(o.subtotal)}</strong></div><div class="row"><span>الخدمة</span><strong>${money(o.service_fee)}</strong></div><div class="row"><span>التوصيل</span><strong>${Number(o.delivery_fee)>0?money(o.delivery_fee):'مجاني 🎉'}</strong></div>${Number(o.tip_amount)>0?`<div class="row"><span>البقشيش</span><strong>${money(o.tip_amount)}</strong></div>`:''}<div class="row total"><span>الإجمالي</span><strong>${money(o.total)}</strong></div><div class="muted">الدفع: ${paymentText(o.payment_method)}${Number(o.points_earned)>0?' • ⭐ '+num(o.points_earned)+' نقطة':''}</div>${!['delivered','cancelled'].includes(o.status)&&o.estimated_delivery_at?`<div class="tracking">⏱️ الموعد المتوقع: <strong>${dateTime(o.estimated_delivery_at)}</strong></div>`:''}${reviewCard(o)}</div>`).join('')}async function load(){try{const r=await fetch(ACCOUNT_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customer_id:customerId,ts:Date.now()})}),d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'تعذر تحميل الطلبات');document.getElementById('loading').style.display='none';document.getElementById('orders').style.display='block';allOrders=d.orders||[];document.getElementById('customer').textContent='كل طلباتك الحالية والسابقة';const rr=await fetch(REVIEWS_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'pending',customer_id:customerId})});const rd=await rr.json();pendingReviews=new Set((rd.orders||[]).map(x=>Number(x.id)));render()}catch(e){document.getElementById('loading').style.display='none';const er=document.getElementById('error');er.style.display='block';er.textContent='⚠️ '+e.message}}load();setInterval(load,5000);</script></body></html>
