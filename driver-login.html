<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ألبان فلاحي | دخول السائق</title><link rel="stylesheet" href="driver.css?v=9"></head><body><main id="app"><div class="login"><div class="card" style="width:100%;max-width:520px;margin:auto"><div class="head"><h1>ألبان فلاحي</h1><div class="muted">دخول السائق</div></div><div class="field"><label>رقم الموبايل</label><input id="phone" inputmode="tel" autocomplete="tel" placeholder="01xxxxxxxxx"></div><div class="field"><label>PIN</label><input id="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password" placeholder="6 أرقام"></div><button class="btn" id="go">دخول</button><div id="msg" style="margin-top:12px"></div></div></div></main><script>const AUTH='https://qxwvuxkbcghbkztjrzon.supabase.co/functions/v1/driver-auth',KEY='sb_publishable_JI9lC4YPTCQ8CwMxzvHNIA_C24ULpWH';const $=id=>document.getElementById(id);$('go').onclick=async()=>{const b=$('go'),m=$('msg'),phone=$('phone').value.trim().replace(/\s+/g,''),pin=$('pin').value.trim().replace(/\s+/g,'');if(!/^01\d{9}$/.test(phone)||!/^[0-9]{6}$/.test(pin)){m.innerHTML='<div class="error">رقم الموبايل أو PIN غير صحيح.</div>';return}b.disabled=true;b.textContent='جاري التحقق...';m.innerHTML='';const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),12000);try{const r=await fetch(AUTH,{method:'POST',mode:'cors',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({phone,pin}),signal:ctl.signal});const text=await r.text();let j={};try{j=JSON.parse(text)}catch{}if(!r.ok||!j.access_token)throw Error(j.message||j.error_description||('الخادم رفض الطلب ('+r.status+')'));localStorage.setItem('af_driver_token',j.access_token);m.innerHTML='<div style="color:green;font-weight:700">تم تسجيل الدخول بنجاح، جاري فتح شاشة السائق...</div>';setTimeout(()=>location.href='driver-screen.html?v=13',300)}catch(e){m.innerHTML='<div class="error">'+(e.name==='AbortError'?'انتهى وقت الاتصال بالخادم.':'خطأ: '+(e.message||e))+'</div>';b.disabled=false;b.textContent='دخول'}finally{clearTimeout(timer)}};</script></body></html>
