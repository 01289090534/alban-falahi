<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ألبان فلاحي | السائق</title><link rel="stylesheet" href="driver.css?v=6"></head><body><main id="app"><div class="login"><div class="card" style="width:100%;max-width:520px;margin:auto"><div class="head"><h1>ألبان فلاحي</h1><div class="muted">دخول السائق</div></div><div class="field"><label>رقم الموبايل</label><input id="driverPhone" inputmode="tel" autocomplete="tel" placeholder="01xxxxxxxxx"></div><div class="field"><label>PIN</label><input id="driverPin" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password" placeholder="6 أرقام"></div><button class="btn" id="loginFallback">دخول</button><div id="loginFallbackErr"></div></div></div></main><script>const SB='https://qxwvuxkbcghbkztjrzon.supabase.co',KEY='sb_publishable_JI9lC4YPTCQ8CwMxzvHNIA_C24ULpWH',AUTH=SB+'/functions/v1/driver-auth',API=SB+'/functions/v1/driver-api';document.getElementById('loginFallback').onclick=async function(){const b=this,e=document.getElementById('loginFallbackErr');const phone=document.getElementById('driverPhone').value.trim(),pin=document.getElementById('driverPin').value.trim();if(!/^01\\d{9}$/.test(phone)||!/^\\d{6}$/.test(pin)){e.innerHTML='<div class="error">اكتب رقم الموبايل وPIN صحيحين.</div>';return}b.disabled=true;b.textContent='جاري الدخول...';e.innerHTML='';try{const r=await fetch(AUTH,{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY},body:JSON.stringify({phone,pin})}),t=await r.text();let j={};try{j=JSON.parse(t)}catch{}if(!r.ok||!j.access_token)throw Error(j.message||'تعذر تسجيل الدخول');localStorage.setItem('af_driver_token',j.access_token);location.href='driver.html?v=9'}catch(x){e.innerHTML='<div class="error">'+String(x.message||x)+'</div>';b.disabled=false;b.textContent='دخول'}};</script><script src="driver.js?v=9" defer></script></body></html>
