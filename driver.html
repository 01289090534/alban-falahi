<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ألبان فلاحي | السائق</title><link rel="stylesheet" href="driver.css?v=5"></head><body><main id="app"><div class="login"><div class="card" style="width:100%;max-width:520px;margin:auto"><div class="head"><h1>ألبان فلاحي</h1><div class="muted">دخول السائق</div></div><div class="field"><label>رقم الموبايل</label><input id="driverPhone" inputmode="tel" autocomplete="tel" placeholder="01xxxxxxxxx"></div><div class="field"><label>PIN</label><input id="driverPin" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password" placeholder="6 أرقام"></div><button class="btn" id="loginFallback">دخول</button><div id="loginFallbackErr"></div><div id="driverBoot" class="muted" style="text-align:center;margin-top:10px">جاري تشغيل شاشة السائق...</div></div></div></main><script src="driver.js?v=8" defer></script><script>setTimeout(function(){var e=document.getElementById('driverBoot');if(e)e.textContent='أدخل رقم الموبايل وPIN للمتابعة';var b=document.getElementById('loginFallback');if(b)b.onclick=function(){var p=document.getElementById('driverPhone').value.trim(),n=document.getElementById('driverPin').value.trim(),m=document.getElementById('loginFallbackErr');m.innerHTML='<div class="error">لو زر الدخول لا يعمل، أعد تحميل الصفحة مرة واحدة.</div>';};},5000);</script></body></html>
