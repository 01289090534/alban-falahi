<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>منيو ألبان فلاحي - تجربة</title><style>*{box-sizing:border-box}body{margin:0;background:#f8f5ef;font-family:Arial,sans-serif;color:#222;padding-bottom:100px}.wrap{max-width:700px;margin:auto;padding:16px}.head,.cart{background:#fff;border-radius:20px;padding:18px;box-shadow:0 4px 18px #0001}.logo{font-size:25px;font-weight:900}.sub{color:#777;margin-top:6px}.title{font-size:22px;font-weight:900;margin:20px 0 12px}.products{display:grid;grid-template-columns:1fr 1fr;gap:12px}.p{background:#fff;border-radius:18px;padding:12px;box-shadow:0 3px 14px #0001}.p img{width:100%;height:140px;object-fit:cover;border-radius:14px;background:#eee}.name{font-weight:900;margin-top:9px}.desc{font-size:13px;color:#777;min-height:30px;margin-top:4px}.foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px}.add,.q button{border:0;background:#222;color:#fff;border-radius:10px;font-weight:900;cursor:pointer}.add{width:40px;height:40px;font-size:23px}.q{display:flex;align-items:center;gap:8px}.q button{width:32px;height:32px}.cart{display:none;margin-top:20px}.cart.open{display:block}.line{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #eee}.sum{margin-top:12px}.total{font-size:21px;font-weight:900}.bar{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);width:min(680px,calc(100% - 24px));background:#222;color:#fff;padding:13px 15px;border-radius:16px;display:none;justify-content:space-between;align-items:center;box-shadow:0 8px 25px #0004;cursor:pointer}.bar.show{display:flex}@media(max-width:500px){.p img{height:115px}.products{gap:9px}}</style></head><body><div class="wrap"><div class="head"><div class="logo">🥛 ألبان فلاحي</div><div class="sub">منيو تجريبي — الأصناف الحقيقية الموجودة حاليًا</div></div><div class="title">🛍️ الأصناف</div><div id="products" class="products"><div>جاري التحميل...</div></div><div id="cart" class="cart"><div class="title" style="margin-top:0">🛒 السلة</div><div id="items"></div><div id="sum" class="sum"></div></div></div><div id="bar" class="bar" onclick="toggleCart()"><b>🛒 <span id="count">0</span> صنف</b><b id="barTotal">0.00 ج.م</b><span>فتح السلة</span></div><script>const U='https://qxwvuxkbcghbkztjrzon.supabase.co';const K='sb_publishable_JI9lC4YPTCQ8CwMxzvHNIA_C24ULpWH';const s=supabase.createClient(U,K);let ps=[],cart=[];function esc(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}function money(n){return Math.round(Number(n)*100)/100}async function load(){const r=await s.from('products').select('*').eq('active',true).order('id');if(r.error){document.getElementById('products').innerHTML='<div>تعذر تحميل الأصناف</div>';return}ps=r.data||[];const wanted=[1,2,3];ps=[...wanted.map(id=>ps.find(p=>Number(p.id)===id)).filter(Boolean),...ps.filter(p=>!wanted.includes(Number(p.id)))];render()}function nm(p){return p.name_ar||p.name||''}function ds(p){return p.description_ar||p.description||''}function render(){document.getElementById('products').innerHTML=ps.map(p=>{const q=cart.find(x=>x.id===p.id)?.q||0;return `<div class="p"><img src="${esc(p.image_url||'')}" onerror="this.style.display='none'"><div class="name">${esc(nm(p))}</div><div class="desc">${esc(ds(p))}</div><div class="foot"><b>${money(p.price).toFixed(2)} ج.م</b>${q?`<div class="q"><button onclick="chg(${p.id},-1)">−</button><b>${q}</b><button onclick="chg(${p.id},1)">+</button></div>`:`<button class="add" onclick="chg(${p.id},1)">+</button>`}</div></div>`}).join('');cartRender()}function chg(id,d){let x=cart.find(x=>x.id===id);if(!x&&d>0){cart.push({id,q:1})}else if(x){x.q+=d;if(x.q<=0)cart=cart.filter(y=>y.id!==id)}render()}function cartRender(){const n=cart.reduce((a,x)=>a+x.q,0),sub=money(cart.reduce((a,x)=>{const p=ps.find(p=>p.id===x.id);return a+(p?Number(p.price)*x.q:0)},0));document.getElementById('count').textContent=n;document.getElementById('barTotal').textContent=sub.toFixed(2)+' ج.م';document.getElementById('bar').classList.toggle('show',n>0);document.getElementById('items').innerHTML=cart.map(x=>{const p=ps.find(p=>p.id===x.id);return `<div class="line"><span>${esc(nm(p))} × ${x.q}</span><b>${money(Number(p.price)*x.q).toFixed(2)} ج.م</b></div>`}).join('');const delivery=sub>=500?0:25,service=money(sub*.02);document.getElementById('sum').innerHTML=cart.length?`<div class="line"><span>إجمالي الأصناف</span><b>${sub.toFixed(2)} ج.م</b></div><div class="line"><span>رسوم خدمة الطلب</span><b>${service.toFixed(2)} ج.م</b></div><div class="line"><span>التوصيل</span><b>${delivery?'25.00 ج.م':'مجاني 🎉'}</b></div><div class="line total"><span>الإجمالي</span><b>${money(sub+service+delivery).toFixed(2)} ج.م</b></div>`:''}function toggleCart(){if(!cart.length)return;document.getElementById('cart').classList.toggle('open')}load()</script></body></html>
