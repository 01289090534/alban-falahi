<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meta Checkout Test — ألبان فلاحي</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f6f7f8;color:#222}.top{padding:14px;background:#fff;position:sticky;top:0;z-index:5;border-bottom:1px solid #ddd}.top h2{margin:0 0 6px;font-size:18px}.top p{margin:0;font-size:13px;color:#666}.log{margin:10px;padding:10px;background:#111;color:#eee;border-radius:12px;min-height:70px;font:12px/1.6 monospace;white-space:pre-wrap}.frame{width:100%;height:calc(100vh - 145px);border:0;background:#fff}.ok{color:#8fda8f}.warn{color:#ffd27a}</style></head><body><div class="top"><h2>اختبار Meta — InitiateCheckout / Purchase</h2><p>اختبر الطلب من المنيو بالأسفل. هذه الصفحة على فرع <b>feature/meta-pixel-capi</b> فقط.</p></div><div id="log" class="log">جاري تجهيز الاختبار...</div><iframe id="app" class="frame" src="menu.html?meta-test=20260922"></iframe><script>(function(){const logEl=document.getElementById('log');const lines=[];function log(s){lines.push(s);while(lines.length>8)lines.shift();logEl.textContent=lines.join('\n')}function fmt(v){try{return JSON.stringify(v)}catch{return String(v)}}const frame=document.getElementById('app');frame.addEventListener('load',function(){const w=frame.contentWindow;log('تم تحميل المنيو.');if(typeof w.albanMetaTrack!=='function'){log('لم يتم العثور على albanMetaTrack');return}const originalTrack=w.albanMetaTrack;w.albanMetaTrack=function(name,params){if(name==='InitiateCheckout'||name==='Purchase'||name==='AddToCart'||name==='ViewContent')log('EVENT '+name+'  '+fmt(params));return originalTrack.apply(this,arguments)};let checkoutSnapshot=null;if(typeof w.order==='function'){const originalOrder=w.order;w.order=async function(){const cart=Array.isArray(w.cart)?w.cart:[];const ids=cart.map(x=>String(x.product_id));const count=cart.reduce((a,x)=>a+(Number(x.quantity)||0),0);let total=0;cart.forEach(x=>{const p=(w.products||[]).find(p=>String(p.id)===String(x.product_id));total+=(Number(p&&p.base_price)||0)*(Number(x.quantity)||0)});checkoutSnapshot={content_ids:ids,num_items:count,value:total,currency:'EGP'};w.albanMetaTrack('InitiateCheckout',checkoutSnapshot);log('InitiateCheckout تم إطلاقه قبل تأكيد الطلب.');return await originalOrder.apply(this,arguments)};log('جاهز: اضغط «تأكيد الطلب» في المنيو.')}else log('لم يتم العثور على order()');const success=w.document.getElementById('success');if(success){let sent=false;new MutationObserver(function(){if(!sent&&getComputedStyle(success).display!=='none'&&checkoutSnapshot){sent=true;w.albanMetaTrack('Purchase',{content_ids:checkoutSnapshot.content_ids,num_items:checkoutSnapshot.num_items,value:checkoutSnapshot.value,currency:'EGP'});log('Purchase تم إطلاقه بعد نجاح الطلب.')}}).observe(success,{attributes:true,childList:true,subtree:true})}})})();</script></body></html>
