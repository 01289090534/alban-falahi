<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meta Checkout Test — ألبان فلاحي</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f6f7f8;color:#222}.top{padding:14px;background:#fff;position:sticky;top:0;z-index:5;border-bottom:1px solid #ddd}.top h2{margin:0 0 6px;font-size:18px}.top p{margin:0;font-size:13px;color:#666}.log{margin:10px;padding:10px;background:#111;color:#eee;border-radius:12px;min-height:70px;font:12px/1.6 monospace;white-space:pre-wrap}.frame{width:100%;height:calc(100vh - 145px);border:0;background:#fff}</style></head><body><div class="top"><h2>اختبار Meta — InitiateCheckout / Purchase</h2><p>هذه صفحة اختبار فقط على فرع <b>feature/meta-pixel-capi</b>. سنضع منتجًا حقيقيًا في السلة تلقائيًا ثم نختبر الطلب.</p></div><div id="log" class="log">جاري تجهيز المنتج التجريبي...</div><iframe id="app" class="frame" src="menu.html?meta-test=20260922-v2"></iframe><script>(async function(){const U='https://qxwvuxkbcghbkztjrzon.supabase.co',K='sb_publishable_JI9lC4YPTCQ8CwMxzvHNIA_C24ULpWH';const logEl=document.getElementById('log');const lines=[];function log(s){lines.push(s);while(lines.length>8)lines.shift();logEl.textContent=lines.join('\n')}function fmt(v){try{return JSON.stringify(v)}catch{return String(v)}}async function api(path){const r=await fetch(U+'/rest/v1/'+path,{cache:'no-store',headers:{apikey:K,Authorization:'Bearer '+K,'Cache-Control':'no-cache'}});if(!r.ok)throw Error(await r.text());return r.json()}try{const [products,branches,categories]=await Promise.all([api('products?select=*&is_active=eq.true&order=sort_order.asc,id.asc'),api('branches?select=id,name_ar,name_en,latitude,longitude,opens_at,closes_at&is_active=eq.true&order=id.asc'),api('categories?select=*&is_active=eq.true&order=sort_order.asc,id.asc')]);const product=products.find(p=>Number(p.base_price)>0)||products[0];if(!product)throw Error('لم نجد منتجًا متاحًا');log('تم تحميل '+products.length+' منتجًا من قاعدة البيانات.');const frame=document.getElementById('app');frame.addEventListener('load',async function(){const w=frame.contentWindow;log('تم تحميل المنيو.');if(typeof w.albanMetaTrack!=='function'){log('خطأ: Meta tracking غير موجود في المنيو.');return}const originalTrack=w.albanMetaTrack;w.albanMetaTrack=function(name,params){if(['InitiateCheckout','Purchase','AddToCart','ViewContent'].includes(name))log('EVENT '+name+'  '+fmt(params));return originalTrack.apply(this,arguments)};w.products=products;w.categories=categories;w.branches=branches;w.cart=[{product_id:product.id,quantity:1}];try{if(typeof w.renderCats==='function')w.renderCats();if(typeof w.renderProducts==='function')w.renderProducts();if(typeof w.renderBranches==='function')w.renderBranches();if(typeof w.loadAccount==='function')await w.loadAccount();if(typeof w.renderCart==='function')w.renderCart()}catch(e){log('تجهيز السلة: '+e.message)}let checkoutSnapshot=null;if(typeof w.order==='function'){const originalOrder=w.order;w.order=async function(){const cart=Array.isArray(w.cart)?w.cart:[];const ids=cart.map(x=>String(x.product_id));const count=cart.reduce((a,x)=>a+(Number(x.quantity)||0),0);let total=0;cart.forEach(x=>{const p=(w.products||[]).find(p=>String(p.id)===String(x.product_id));total+=(Number(p&&p.base_price)||0)*(Number(x.quantity)||0)});checkoutSnapshot={content_ids:ids,num_items:count,value:total,currency:'EGP'};w.albanMetaTrack('InitiateCheckout',checkoutSnapshot);log('InitiateCheckout تم إطلاقه.');return await originalOrder.apply(this,arguments)};log('جاهز — المنتج موجود في السلة. افتح السلة وأكمل الطلب.')}else log('خطأ: order() غير موجود');const success=w.document.getElementById('success');if(success){let sent=false;new MutationObserver(function(){if(!sent&&getComputedStyle(success).display!=='none'&&checkoutSnapshot){sent=true;w.albanMetaTrack('Purchase',checkoutSnapshot);log('Purchase تم إطلاقه بعد نجاح الطلب.')}}).observe(success,{attributes:true,childList:true,subtree:true})}})}catch(e){log('خطأ: '+e.message)}})();</script></body></html>
