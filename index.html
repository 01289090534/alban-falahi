function normalizeEgyptPhone(phone){

    phone = phone.trim().replace(/\s+/g,"");

    if(phone.startsWith("+20")){
        return phone;
    }

    if(phone.startsWith("20")){
        return "+" + phone;
    }

    if(phone.startsWith("0")){
        return "+20" + phone.substring(1);
    }

    return "+20" + phone;
}
