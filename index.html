<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ألبان فلاحي | طلبات العملاء</title>
<meta name="theme-color" content="#0877b9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="customer-manifest.json?v=20260918-2350">
<link rel="stylesheet" href="brand.css">
<script src="customer-branding.js?v=20260918-2315"></script>
<style>
:root{--b:#0877b9;--t:#16b8b0;--ink:#17324a;--muted:#70838d;--bg:#f5fbfc;--line:#e1eef1}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;color:var(--ink);background:var(--bg)}body{overflow-x:hidden}button,input{font:inherit}button{cursor:pointer}
.page{min-height:100vh;background:linear-gradient(180deg,#edfafd 0,#f7fcfd 52%,#fff 100%);position:relative;overflow:hidden}.page:before,.page:after{content:"";position:absolute;border-radius:50%;pointer-events:none}.page:before{width:330px;height:330px;top:-210px;left:-150px;background:rgba(22,184,176,.13)}.page:after{width:300px;height:300px;right:-180px;bottom:50px;background:rgba(8,119,185,.08)}
.shell{width:min(100%,820px);margin:auto;padding:14px 14px 30px;position:relative;z-index:1}.topbar{height:52px;display:flex;align-items:center;justify-content:space-between}.afp-brand-mini{display:flex;align-items:center;gap:9px;color:var(--b);font-weight:950}.afp-logo-img{width:42px;height:42px;border-radius:12px;object-fit:contain;background:#fff;border:1px solid #dfeff2;box-shadow:0 7px 18px rgba(8,119,185,.12)}.brand-name{font-size:15px}.lang-mini{border:1px solid #d5e9ed;background:#fff;color:var(--b);border-radius:14px;padding:9px 13px;font-size:12px;font-weight:900}
.afp-hero{margin-top:12px;min-height:330px;border-radius:30px;padding:28px 23px;display:flex;align-items:flex-end;position:relative;overflow:hidden;color:#fff;background:linear-gradient(135deg,#0877b9,#16b8b0);background-position:center;background-size:cover;box-shadow:0 24px 60px rgba(8,119,185,.22)}.afp-hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,119,185,.18) 0,rgba(4,54,76,.70) 100%);z-index:0}.hero-content{position:relative;z-index:1;max-width:610px}.hero-kicker{display:inline-flex;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);padding:7px 11px;border-radius:999px;font-size:11px;font-weight:900}.hero h1{font-size:clamp(30px,7vw,50px);line-height:1.08;margin:15px 0 9px;letter-spacing:-1px}.hero p{font-size:14px;line-height:1.85;margin:0;color:rgba(255,255,255,.92)}
.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}.quick-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:15px 10px;box-shadow:0 12px 30px rgba(8,119,185,.07);text-align:center}.quick-icon{width:42px;height:42px;display:grid;place-items:center;margin:0 auto 8px;border-radius:14px;background:#effafa;font-size:21px}.quick-card b{font-size:11px;display:block}.quick-card span{display:block;color:var(--muted);font-size:9px;margin-top:4px;line-height:1.4}
.panel{background:#fff;border:1px solid var(--line);border-radius:28px;padding:21px 17px;margin-top:12px;box-shadow:0 16px 42px rgba(8,119,185,.075)}.panel-head{text-align:center}.panel-head h2{font-size:21px;margin:0 0 6px}.panel-head p{margin:0;color:var(--muted);font-size:12px;line-height:1.7}.language-buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:17px}.language-button{height:57px;border:1px solid #d2e8ec;border-radius:16px;background:#fff;color:var(--b);font-weight:950;box-shadow:0 6px 16px rgba(8,119,185,.05);transition:transform .12s}.language-button:first-child{color:#fff;border-color:transparent;background:linear-gradient(135deg,var(--b),var(--t));box-shadow:0 10px 22px rgba(8,119,185,.18)}.language-button:active,.main-button:active{transform:scale(.985)}
.login-panel{max-width:550px;margin-left:auto;margin-right:auto}.brand-login{text-align:center;margin-bottom:18px}.login-brand-mark{display:block;width:88px;height:88px;margin:0 auto 10px;border-radius:23px;background:linear-gradient(135deg,var(--b),var(--t));background-size:contain;background-repeat:no-repeat;background-position:center;background-color:#fff!important;border:1px solid #dfedf0;box-shadow:0 12px 28px rgba(8,119,185,.15)}.brand-login strong{font-size:20px;color:var(--b)}.form-title{text-align:center;font-size:21px;font-weight:950;margin:0 0 18px}.field{margin-bottom:13px}.field label{display:block;font-size:13px;font-weight:900;margin-bottom:7px}.field input{width:100%;height:53px;border:1px solid #d7e9ed;border-radius:15px;background:#fbfeff;padding:0 14px;outline:0;color:var(--ink);transition:border-color .15s,box-shadow .15s}.field input:focus{border-color:var(--t);box-shadow:0 0 0 4px rgba(22,184,176,.10);background:#fff}.main-button{width:100%;height:54px;border:0;border-radius:16px;background:linear-gradient(135deg,var(--b),var(--t));color:#fff;font-weight:950;box-shadow:0 10px 22px rgba(8,119,185,.18)}.main-button:disabled{opacity:.65}.error{display:none;background:#fff1f1;border:1px solid #ffdada;color:#a00000;padding:10px 12px;border-radius:12px;margin:9px 0;font-size:13px;line-height:1.5}.footer{text-align:center;color:#8b9aa1;font-size:10px;margin-top:14px;padding-bottom:5px}
@media(min-width:650px){.shell{padding:20px 22px 40px}.afp-hero{min-height:380px;padding:40px}.quick-grid{gap:12px}.quick-card{padding:18px}.panel{padding:27px}.login-panel{padding-left:34px;padding-right:34px}}
@media(max-width:470px){.shell{padding:10px 10px 25px}.afp-hero{min-height:310px;border-radius:26px;padding:22px 17px}.hero h1{font-size:30px}.hero p{font-size:12.5px}.quick-grid{gap:6px}.quick-card{padding:12px 5px;border-radius:17px}.quick-icon{width:37px;height:37px;border-radius:12px;font-size:19px}.quick-card b{font-size:10px}.quick-card span{font-size:8px}.panel{border-radius:24px;padding:19px 14px}.language-buttons{grid-template-columns:1fr}.login-brand-mark{width:80px;height:80px}}
</style>
</head>
<body>
<div class="page"><main class="shell">
<header class="topbar"><div class="afp-brand-mini"><img class="afp-logo-img" src="" alt="ألبان فلاحي"><span class="brand-name">ألبان فلاحي</span></div><button class="lang-mini" id="langMini" type="button" onclick="toggleLanguage()">English</button></header>
<section class="afp-hero"><div class="hero-content"><span class="hero-kicker" id="heroKicker">🥛 طبيعي • فريش • فلاحي</span><h1 id="heroTitle">كل اللي بتحبه من ألبان فلاحي</h1><p id="heroText">منتجاتك اليومية من اللبن والأجبان والحلويات والمخبوزات، فريش يوم بيوم وتوصلك لحد باب بيتك.</p></div></section>
<section class="quick-grid"><div class="quick-card"><div class="quick-icon">🥛</div><b id="q1">طبيعي وفريش</b><span id="q1s">إنتاج يوم بيوم</span></div><div class="quick-card"><div class="quick-icon">🚚</div><b id="q2">توصيل للبيت</b><span id="q2s">اطلب بسهولة</span></div><div class="quick-card"><div class="quick-icon">🎁</div><b id="q3">بونص وعروض</b><span id="q3s">استفيد من طلباتك</span></div></section>
<div id="app"></div><div class="footer" id="footerText">ألبان فلاحي • طلبات العملاء</div>
</main></div>
<script>
const app=document.getElementById('app');const API='https://qxwvuxkbcghbkztjrzon.supabase.co/functions/v1/customer-auth';let lang=localStorage.getItem('alban_lang')||'';
function hasSession(){try{const s=JSON.parse(localStorage.getItem('alban_auth_session')||'null');return !!(localStorage.getItem('alban_customer_id')&&s?.access_token)}catch(e){return !!localStorage.getItem('alban_customer_id')}}
function applyLanguage(){const en=lang==='en';document.documentElement.lang=en?'en':'ar';document.documentElement.dir=en?'ltr':'rtl';const t={heroKicker:en?'🥛 Natural • Fresh • Local':'🥛 طبيعي • فريش • فلاحي',heroTitle:en?'Everything you love from Alban Falahi':'كل اللي بتحبه من ألبان فلاحي',heroText:en?'Daily milk, cheese, desserts and bakery favorites — fresh every day and delivered to your door.':'منتجاتك اليومية من اللبن والأجبان والحلويات والمخبوزات، فريش يوم بيوم وتوصلك لحد باب بيتك.',q1:en?'Natural & Fresh':'طبيعي وفريش',q1s:en?'Made fresh every day':'إنتاج يوم بيوم',q2:en?'Home Delivery':'توصيل للبيت',q2s:en?'Order with ease':'اطلب بسهولة',q3:en?'Bonus & Offers':'بونص وعروض',q3s:en?'Get more from your orders':'استفيد من طلباتك',footer:en?'Alban Falahi • Customer Orders':'ألبان فلاحي • طلبات العملاء'};Object.entries({heroKicker:'heroKicker',heroTitle:'heroTitle',heroText:'heroText',q1:'q1',q1s:'q1s',q2:'q2',q2s:'q2s',q3:'q3',q3s:'q3s',footerText:'footer'}).forEach(([id,key])=>document.getElementById(id).textContent=t[key]);document.getElementById('langMini').textContent=en?'العربية':'English'}
function toggleLanguage(){setLang(lang==='en'?'ar':'en')}function setLang(x){lang=x;localStorage.setItem('alban_lang',x);applyLanguage();render()}
function render(){applyLanguage();if(hasSession()){location.replace('menu.html');return}if(!lang){app.innerHTML='<section class="panel"><div class="panel-head"><h2>أهلاً بك في ألبان فلاحي 👋</h2><p>ابدأ باختيار اللغة، وبعدها ادخل لحسابك واستكشف المنيو والطلبات.</p></div><div class="language-buttons"><button class="language-button" onclick="setLang(\'ar\')">العربية</button><button class="language-button" onclick="setLang(\'en\')">English</button></div></section>';return}const en=lang==='en';app.innerHTML='<section class="panel login-panel"><div class="brand-login"><span class="login-brand-mark" aria-hidden="true"></span><strong>'+(en?'Welcome back':'أهلاً بيك من جديد')+'</strong></div><div class="form-title">'+(en?'Customer Login':'دخول العميل')+'</div><div class="field"><label>'+(en?'Mobile Number':'رقم الموبايل')+'</label><input id="mobile" inputmode="tel" autocomplete="tel" placeholder="01xxxxxxxxx"></div><div class="field"><label>'+(en?'6-digit PIN':'الـPIN (6 أرقام)')+'</label><input id="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password" placeholder="••••••"></div><div id="err" class="error"></div><button id="loginBtn" class="main-button" onclick="login()">'+(en?'Continue':'متابعة')+'</button></section>'}
function normalizePhone(v){let p=String(v||'').replace(/\D/g,'');if(p.startsWith('20')&&p.length===12)p='0'+p.slice(2);return p}
async function login(){const mobile=normalizePhone(document.getElementById('mobile').value),pin=document.getElementById('pin').value.trim(),err=document.getElementById('err'),btn=document.getElementById('loginBtn');err.style.display='none';if(!/^01[0125]\d{8}$/.test(mobile)){err.textContent=lang==='en'?'Enter a valid mobile number':'اكتب رقم موبايل صحيح';err.style.display='block';return}if(!/^\d{6}$/.test(pin)){err.textContent=lang==='en'?'PIN must be 6 digits':'الـPIN لازم يكون 6 أرقام';err.style.display='block';return}btn.disabled=true;btn.textContent=lang==='en'?'Signing in...':'جاري الدخول...';try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',phone:mobile,pin})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.success)throw Error(d.error||'تعذر تسجيل الدخول');localStorage.setItem('alban_auth_session',JSON.stringify(d.session));localStorage.setItem('alban_customer_id',d.customer.id);localStorage.setItem('alban_customer_name',d.customer.full_name||'');localStorage.setItem('alban_customer_phone',d.customer.phone||mobile);location.href='menu.html'}catch(e){err.textContent=e.message;err.style.display='block'}finally{btn.disabled=false;btn.textContent=lang==='en'?'Continue':'متابعة'}}
render();
</script>
</body></html>
