<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ألبان فلاحي</title>
<style>
*{box-sizing:border-box}html,body{min-height:100%}
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(145deg,#eef9fb 0%,#f7fbfc 48%,#eaf7fb 100%);color:#17324a;position:relative;overflow-x:hidden}
body:before{content:"";position:fixed;width:260px;height:260px;border-radius:50%;background:rgba(22,184,176,.10);top:-110px;left:-100px;pointer-events:none}
body:after{content:"";position:fixed;width:220px;height:220px;border-radius:50%;background:rgba(8,119,185,.08);bottom:-100px;right:-90px;pointer-events:none}
.container{width:100%;max-width:500px;margin:auto;padding:28px 16px 30px;position:relative;z-index:1}
.card{background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-radius:30px;padding:28px 20px 22px;margin-top:12px;box-shadow:0 18px 50px rgba(8,119,185,.12);border:1px solid rgba(8,119,185,.10)}
.logo .af-customer-logo{display:none!important}.logo{text-align:center;font-size:30px;font-weight:950;margin-top:4px;color:#0877b9}.subtitle{text-align:center;color:#6d7f88;margin-top:7px;font-size:14px}.welcome{margin:22px auto 0;max-width:390px;text-align:center}.welcome-title{font-size:18px;font-weight:950;color:#17324a}.welcome-text{font-size:13px;color:#71818a;line-height:1.7;margin-top:5px}.trust-row{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:16px}.trust-item{background:#f4fffe;border:1px solid #dceff2;border-radius:14px;padding:10px 5px;font-size:11px;font-weight:900;color:#176b72}.quick-links{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.quick-link{border:1px solid #dceff2;background:#fff;border-radius:14px;padding:11px 8px;color:#0877b9;font-weight:900;cursor:pointer}.quick-link small{display:block;color:#71818a;font-weight:600;margin-top:3px}
.language-title,.form-title{font-weight:950}.language-title{text-align:center;font-size:21px;margin:30px 0 16px;color:#17324a}
.language-buttons{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.language-button{border:1px solid #cfe9ed;background:#fff;padding:17px 10px;border-radius:16px;font-size:17px;font-weight:bold;cursor:pointer;color:#0877b9;transition:.18s}
.language-button:active{transform:scale(.98)}.quick-link:active{transform:scale(.98)}.welcome{animation:welcomeIn .35s ease-out}@keyframes welcomeIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.form-title{font-size:23px;margin:28px 0 17px;color:#17324a}.field{margin-bottom:14px}.field label{display:block;font-weight:bold;margin-bottom:7px;font-size:14px}
.field input{width:100%;padding:15px;border:1px solid #d7e9ed;border-radius:15px;font-size:17px;outline:0;background:#fbfeff;transition:.18s}
.field input:focus{border-color:#16b8b0;box-shadow:0 0 0 4px rgba(22,184,176,.11);background:#fff}
.main-button{width:100%;border:0;background:linear-gradient(135deg,#0877b9,#16b8b0);color:#fff;padding:16px;border-radius:16px;font-size:17px;font-weight:950;cursor:pointer;box-shadow:0 9px 20px rgba(8,119,185,.20);transition:.18s}
.main-button:disabled{opacity:.65}.error{display:none;background:#fff0f0;color:#a00000;padding:11px;border-radius:12px;margin:10px 0;font-size:14px}
@media(max-width:480px){.container{padding:20px 11px 24px}.card{margin-top:4px;padding:24px 16px 18px;border-radius:26px}.logo{font-size:27px}.language-title{margin-top:27px}.form-title{font-size:21px}}
</style>
<style id="alban-home-pro-polish">
:root{--af-blue:#0877b9;--af-teal:#16b8b0;--af-ink:#17324a}
body{background:radial-gradient(circle at 12% 8%,rgba(22,184,176,.14),transparent 25%),radial-gradient(circle at 88% 88%,rgba(8,119,185,.12),transparent 28%),linear-gradient(145deg,#edf9fb 0%,#f8fcfd 52%,#eaf7fb 100%)}
.container{max-width:540px;padding:22px 14px 30px}
.card{padding:30px 22px 24px;border-radius:32px;box-shadow:0 22px 65px rgba(8,119,185,.14);border:1px solid rgba(22,184,176,.16)}
.card:after{content:"";position:absolute;inset:auto -35px -70px;width:180px;height:180px;border-radius:50%;background:rgba(22,184,176,.055);pointer-events:none}
.logo .login-brand-mark{width:104px;height:104px;border-radius:27px;margin-bottom:14px;box-shadow:0 14px 34px rgba(8,119,185,.18)}
.logo>span:last-child{font-size:30px;letter-spacing:-.5px}
.subtitle{color:#5f7580;font-weight:700;margin-top:9px}
.welcome{margin-top:25px}.welcome-title{font-size:20px;letter-spacing:-.2px}.welcome-text{font-size:14px;line-height:1.8}
.trust-row{gap:8px;margin-top:18px}.trust-item{min-height:58px;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#fff,#f2fffe);border-color:#d5eeee;box-shadow:0 5px 14px rgba(8,119,185,.055)}
.language-title{font-size:20px;margin:28px 0 14px}.language-buttons{gap:10px}
.language-button{min-height:56px;border:1px solid #cfe8ec;background:linear-gradient(180deg,#fff,#f8ffff);box-shadow:0 6px 16px rgba(8,119,185,.06)}
.language-button:first-child{background:linear-gradient(135deg,#0877b9,#16b8b0);color:#fff;border-color:transparent;box-shadow:0 9px 20px rgba(8,119,185,.18)}
.form-title{text-align:center;margin-top:25px;font-size:22px}.field{margin-bottom:13px}.field input{box-shadow:0 3px 12px rgba(8,119,185,.035)}.main-button{min-height:54px;margin-top:3px}
@media(max-width:480px){.container{padding:14px 10px 22px}.card{padding:25px 15px 19px;border-radius:28px}.logo .login-brand-mark{width:90px;height:90px;border-radius:23px}.logo>span:last-child{font-size:27px}.trust-item{font-size:10.5px}}
</style><style id="alban-login-polish">
.login-brand-mark{display:block;width:92px;height:92px;margin:0 auto 13px;background:var(--af-login-logo,linear-gradient(135deg,#0877b9,#16b8b0));background-size:cover;background-position:center;border-radius:24px;box-shadow:0 12px 28px rgba(8,119,185,.17);border:1px solid #e1f2f5}
.logo{display:flex!important;flex-direction:column;align-items:center;gap:0}
.subtitle{font-size:15px}
.card{position:relative;overflow:hidden}
.card:before{content:"";position:absolute;inset:0 0 auto;height:5px;background:linear-gradient(90deg,#0877b9,#16b8b0)}
.language-button:hover{border-color:#16b8b0;background:#effcfb}
.main-button:active{transform:translateY(1px)}
</style><script src="customer-branding.js?v=20260918-2315"></script><link rel="stylesheet" href="brand.css"><link rel="manifest" href="customer-manifest.json?v=20260918-2350"><meta name="theme-color" content="#0877b9"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"></head>
<body>
<div class="container"><div class="card"><div class="logo"><span class="login-brand-mark" aria-hidden="true"></span><span>ألبان فلاحي</span></div><div class="subtitle">طلباتك اليومية من ألبان فلاحي</div><div id="app"></div></div></div>
<script>
const app=document.getElementById('app');let lang=localStorage.getItem('alban_lang')||'';const API='https://qxwvuxkbcghbkztjrzon.supabase.co/functions/v1/customer-auth';
function hasSession(){try{const s=JSON.parse(localStorage.getItem('alban_auth_session')||'null');return !!(localStorage.getItem('alban_customer_id')&&s?.access_token)}catch(e){return !!localStorage.getItem('alban_customer_id')}}function render(){if(hasSession()){location.replace('menu.html');return}if(!lang){app.innerHTML='<div class="welcome"><div class="welcome-title">أهلاً بك في ألبان فلاحي 👋</div><div class="welcome-text">منتجات طبيعية وفريش يوم بيوم، وطلباتك توصلك بسهولة.</div><div class="trust-row"><div class="trust-item">🥛 طبيعي 100%</div><div class="trust-item">🚚 توصيل سريع</div><div class="trust-item">🎁 بونص وعروض</div></div><div class="language-title">اختر اللغة</div><div class="language-buttons"><button class="language-button" onclick="setLang(\'ar\')">العربية</button><button class="language-button" onclick="setLang(\'en\')">English</button></div>';return}app.innerHTML=lang==='en'?'<div class="form-title">Customer Login</div><div class="field"><label>Mobile Number</label><input id="mobile" inputmode="tel" autocomplete="tel"></div><div class="field"><label>6-digit PIN</label><input id="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password"></div><div id="err" class="error"></div><button id="loginBtn" class="main-button" onclick="login()">Continue</button>':'<div class="form-title">دخول العميل</div><div class="field"><label>رقم الموبايل</label><input id="mobile" inputmode="tel" autocomplete="tel"></div><div class="field"><label>الـPIN (6 أرقام)</label><input id="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password"></div><div id="err" class="error"></div><button id="loginBtn" class="main-button" onclick="login()">متابعة</button>'}
function setLang(x){lang=x;localStorage.setItem('alban_lang',x);render()}
function normalizePhone(v){let p=String(v||'').replace(/\D/g,'');if(p.startsWith('20')&&p.length===12)p='0'+p.slice(2);return p}
async function login(){const mobile=normalizePhone(document.getElementById('mobile').value),pin=document.getElementById('pin').value.trim(),err=document.getElementById('err'),btn=document.getElementById('loginBtn');err.style.display='none';if(!/^01[0125]\d{8}$/.test(mobile)){err.textContent=lang==='en'?'Enter a valid mobile number':'اكتب رقم موبايل صحيح';err.style.display='block';return}if(!/^\d{6}$/.test(pin)){err.textContent=lang==='en'?'PIN must be 6 digits':'الـPIN لازم يكون 6 أرقام';err.style.display='block';return}btn.disabled=true;btn.textContent=lang==='en'?'Signing in...':'جاري الدخول...';try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',phone:mobile,pin})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.success)throw Error(d.error||'تعذر تسجيل الدخول');localStorage.setItem('alban_auth_session',JSON.stringify(d.session));localStorage.setItem('alban_customer_id',d.customer.id);localStorage.setItem('alban_customer_name',d.customer.full_name||'');localStorage.setItem('alban_customer_phone',d.customer.phone||mobile);location.href='menu.html'}catch(e){err.textContent=e.message;err.style.display='block'}finally{btn.disabled=false;btn.textContent=lang==='en'?'Continue':'متابعة'}}
render();
</script>
</body>
</html>
