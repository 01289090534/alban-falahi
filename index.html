<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>منيو ألبان فلاحي</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f8f5ef;
    color:#222;
}

header{
    background:white;
    padding:18px;
    position:sticky;
    top:0;
    z-index:10;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.logo{
    text-align:center;
    font-size:28px;
    font-weight:bold;
}

.subtitle{
    text-align:center;
    color:#777;
    margin-top:5px;
}

.container{
    max-width:900px;
    margin:auto;
    padding:18px;
}

.search{
    width:100%;
    padding:15px;
    border:1px solid #ddd;
    border-radius:14px;
    font-size:16px;
    margin-bottom:15px;
}

.categories{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:12px;
}

.category{
    border:0;
    background:white;
    padding:10px 16px;
    border-radius:20px;
    white-space:nowrap;
    cursor:pointer;
}

.category.active{
    background:#222;
    color:white;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
    gap:14px;
}

.product{
    background:white;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.product img{
    width:100%;
    height:150px;
    object-fit:cover;
    background:#eee;
}

.product-content{
    padding:12px;
}

.product-name{
    font-size:17px;
    font-weight:bold;
    margin-bottom:6px;
}

.product-description{
    font-size:13px;
    color:#777;
    min-height:35px;
}

.price{
    font-size:18px;
    font-weight:bold;
    margin-top:10px;
}

.add{
    width:100%;
    border:0;
    background:#222;
    color:white;
    padding:11px;
    border-radius:10px;
    margin-top:10px;
    cursor:pointer;
}

.loading,
.empty,
.error{
    text-align:center;
    padding:40px 10px;
    color:#777;
}

.cart{
    position:fixed;
    left:18px;
    bottom:18px;
    background:#222;
    color:white;
    padding:14px 20px;
    border-radius:30px;
    box-shadow:0 4px 15px rgba(0,0,0,.25);
    cursor:pointer;
    font-weight:bold;
}

.cart-count{
    background:white;
    color:#222;
    padding:3px 7px;
    border-radius:50%;
    margin-right:5px;
}
</style>
</head>

<body>

<header>
    <div class="logo">🥛 ألبان فلاحي</div>
    <div class="subtitle">طبيعي 100% • فريش يوم بيوم</div>
</header>

<div class="container">

    <input
        id="search"
        class="search"
        type="search"
        placeholder="🔎 ابحث عن منتج..."
    >

    <div id="categories" class="categories"></div>

    <div id="products" class="products">
        <div class="loading">جاري تحميل المنيو...</div>
    </div>

</div>

<div class="cart" onclick="openCart()">
    🛒 السلة
    <span id="cartCount" class="cart-count">0</span>
</div>


<script>

const SUPABASE_URL =
"https://qxwvuxkbcghbkztjrzon.supabase.co";

const SUPABASE_KEY =
"sb_publishable_JI9lC4YPTCQ8CwMxzvHNIA_C24ULpWH";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


let categories = [];
let products = [];
let cart = [];

let selectedCategory = "all";


// تحميل البيانات
async function loadMenu(){

    const categoriesResult =
        await supabaseClient
        .from("categories")
        .select("*")
        .eq("active", true)
        .order("sort_order", {
            ascending:true
        });

    if(categoriesResult.error){

        document.getElementById("products").innerHTML =
            `<div class="error">
                حصل خطأ في تحميل الأقسام
            </div>`;

        console.log(categoriesResult.error);

        return;
    }


    categories =
        categoriesResult.data || [];


    const productsResult =
        await supabaseClient
        .from("products")
        .select("*")
        .eq("active", true)
        .order("sort_order", {
            ascending:true
        });


    if(productsResult.error){

        document.getElementById("products").innerHTML =
            `<div class="error">
                حصل خطأ في تحميل الأصناف
            </div>`;

        console.log(productsResult.error);

        return;
    }


    products =
        productsResult.data || [];


    renderCategories();
    renderProducts();
}


// الأقسام
function renderCategories(){

    const box =
        document.getElementById("categories");

    box.innerHTML = "";


    const allButton =
        document.createElement("button");

    allButton.className =
        "category active";

    allButton.innerText =
        "كل الأصناف";

    allButton.onclick = function(){

        selectedCategory = "all";

        document
            .querySelectorAll(".category")
            .forEach(btn =>
                btn.classList.remove("active")
            );

        allButton.classList.add("active");

        renderProducts();
    };

    box.appendChild(allButton);


    categories.forEach(category => {

        const button =
            document.createElement("button");

        button.className =
            "category";

        button.innerText =
            category.name_ar ||
            category.name ||
            category.name_en ||
            "قسم";


        button.onclick = function(){

            selectedCategory =
                category.id;

            document
                .querySelectorAll(".category")
                .forEach(btn =>
                    btn.classList.remove("active")
                );

            button.classList.add("active");

            renderProducts();
        };


        box.appendChild(button);

    });

}


// عرض المنتجات
function renderProducts(){

    const box =
        document.getElementById("products");

    const search =
        document
        .getElementById("search")
        .value
        .trim()
        .toLowerCase();


    let filtered =
        products.filter(product => {

            const categoryMatch =
                selectedCategory === "all" ||
                product.category_id === selectedCategory;


            const name =
                (
                    product.name_ar ||
                    product.name ||
                    product.name_en ||
                    ""
                ).toLowerCase();


            const description =
                (
                    product.description_ar ||
                    product.description ||
                    ""
                ).toLowerCase();


            const searchMatch =
                !search ||
                name.includes(search) ||
                description.includes(search);


            return categoryMatch && searchMatch;

        });


    if(filtered.length === 0){

        box.innerHTML =
            `<div class="empty">
                لا توجد أصناف حاليًا
            </div>`;

        return;
    }


    box.innerHTML = "";


    filtered.forEach(product => {

        const card =
            document.createElement("div");

        card.className =
            "product";


        const image =
            product.image_url ||
            "https://placehold.co/600x400?text=Alban+Falahi";


        const name =
            product.name_ar ||
            product.name ||
            product.name_en ||
            "منتج";


        const description =
            product.description_ar ||
            product.description ||
            "";


        card.innerHTML = `

            <img
                src="${image}"
                alt="${name}"
            >

            <div class="product-content">

                <div class="product-name">
                    ${name}
                </div>

                <div class="product-description">
                    ${description}
                </div>

                <div class="price">
                    ${product.price} جنيه
                </div>

                <button
                    class="add"
                    onclick="addToCart(${product.id})"
                >
                    + أضف للسلة
                </button>

            </div>
        `;


        box.appendChild(card);

    });

}


// إضافة للسلة
function addToCart(productId){

    const product =
        products.find(
            p => p.id === productId
        );


    if(!product) return;


    const existing =
        cart.find(
            item => item.id === productId
        );


    if(existing){

        existing.quantity++;

    }else{

        cart.push({

            id:product.id,

            name:
                product.name_ar ||
                product.name ||
                product.name_en,

            price:Number(product.price),

            quantity:1

        });

    }


    updateCartCount();

}


// عدد المنتجات
function updateCartCount(){

    const count =
        cart.reduce(
            (total,item) =>
                total + item.quantity,
            0
        );


    document.getElementById("cartCount")
        .innerText = count;

}


// السلة - هنكملها في الخطوة القادمة
function openCart(){

    if(cart.length === 0){

        alert("السلة فاضية 🛒");

        return;
    }


    let text =
        "محتويات السلة:\\n\\n";


    let total = 0;


    cart.forEach(item => {

        const line =
            item.price * item.quantity;

        total += line;


        text +=
            `${item.name} × ${item.quantity} = ${line} جنيه\\n`;

    });


    text +=
        `\\nالإجمالي: ${total} جنيه`;


    alert(text);

}


// البحث
document
    .getElementById("search")
    .addEventListener(
        "input",
        renderProducts
    );


// بدء تحميل المنيو
loadMenu();

</script>

</body>
</html>
