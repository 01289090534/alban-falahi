<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ألبان فلاحي</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f8f5ef;
    color:#222;
}

.container{
    max-width:480px;
    margin:auto;
    padding:25px 18px;
}

.logo{
    text-align:center;
    font-size:32px;
    font-weight:bold;
    margin:25px 0 5px;
}

.subtitle{
    text-align:center;
    color:#777;
    margin-bottom:25px;
}

.card{
    background:white;
    padding:22px;
    border-radius:18px;
    box-shadow:0 4px 18px rgba(0,0,0,.08);
}

h2{
    margin-top:0;
}

input{
    width:100%;
    padding:15px;
    margin:8px 0;
    border:1px solid #ddd;
    border-radius:12px;
    font-size:16px;
}

button{
    width:100%;
    padding:15px;
    margin-top:12px;
    border:0;
    border-radius:12px;
    background:#222;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

button.secondary{
    background:#eee;
    color:#222;
}

.message{
    text-align:center;
    margin-top:15px;
    font-weight:bold;
}

.hidden{
    display:none;
}

.switch{
    text-align:center;
    margin-top:18px;
    color:#555;
    cursor:pointer;
}

.note{
    text-align:center;
    color:#777;
    font-size:13px;
    margin-top:15px;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">🥛 ألبان فلاحي</div>

    <div class="subtitle">
        طبيعي 100% • فريش يوم بيوم
    </div>

    <!-- تسجيل جديد -->
    <div class="card" id="registerBox">

        <h2>إنشاء حساب 👋</h2>

        <p>سجل بياناتك علشان تقدر تطلب بسهولة.</p>

        <input
            id="registerName"
            type="text"
            placeholder="الاسم بالكامل"
        >

        <input
            id="registerPhone"
            type="tel"
            placeholder="رقم الموبايل"
        >

        <input
            id="registerPin"
            type="password"
            inputmode="numeric"
            maxlength="4"
            placeholder="PIN سري 4 أرقام"
        >

        <input
            id="registerPinConfirm"
            type="password"
            inputmode="numeric"
            maxlength="4"
            placeholder="تأكيد الـ PIN"
        >

        <button onclick="register()">
            إنشاء الحساب
        </button>

        <div class="switch" onclick="showLogin()">
            عندك حساب؟ تسجيل الدخول
        </div>

    </div>


    <!-- تسجيل الدخول -->
    <div class="card hidden" id="loginBox">

        <h2>تسجيل الدخول 🔐</h2>

        <p>ادخل برقم الموبايل والـ PIN.</p>

        <input
            id="loginPhone"
            type="tel"
            placeholder="رقم الموبايل"
        >

        <input
            id="loginPin"
            type="password"
            inputmode="numeric"
            maxlength="4"
            placeholder="الـ PIN"
        >

        <button onclick="login()">
            دخول
        </button>

        <div class="switch" onclick="showRegister()">
            لسه معندكش حساب؟ إنشاء حساب
        </div>

    </div>


    <div id="message" class="message"></div>

    <div class="note">
        بياناتك محفوظة بشكل آمن.
    </div>

</div>


<script>

const SUPABASE_URL =
"https://qxwvuxkbcghbkztjrzon.supabase.co";

const SUPABASE_KEY =
"sb_publishable_JI9lC4YPTCQ8CwMxzvHNIA_C24ULpWH";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


// تحويل رقم الموبايل لصيغة مصرية
function normalizePhone(phone){

    phone = phone.trim();

    if(phone.startsWith("01")){
        return "+20" + phone.substring(1);
    }

    if(phone.startsWith("0020")){
        return "+" + phone.substring(2);
    }

    if(phone.startsWith("+20")){
        return phone;
    }

    return phone;
}


// رسالة للمستخدم
function showMessage(text, success=false){

    const box =
        document.getElementById("message");

    box.innerText = text;

    box.style.color =
        success ? "green" : "red";
}


// إظهار التسجيل
function showRegister(){

    document
        .getElementById("registerBox")
        .classList.remove("hidden");

    document
        .getElementById("loginBox")
        .classList.add("hidden");

    showMessage("");
}


// إظهار الدخول
function showLogin(){

    document
        .getElementById("registerBox")
        .classList.add("hidden");

    document
        .getElementById("loginBox")
        .classList.remove("hidden");

    showMessage("");
}


// إنشاء الحساب
async function register(){

    const name =
        document.getElementById("registerName")
        .value.trim();

    const phone =
        normalizePhone(
            document.getElementById("registerPhone")
            .value
        );

    const pin =
        document.getElementById("registerPin")
        .value.trim();

    const pinConfirm =
        document.getElementById("registerPinConfirm")
        .value.trim();


    if(!name){

        showMessage("اكتب الاسم بالكامل");

        return;
    }


    if(!phone){

        showMessage("اكتب رقم الموبايل");

        return;
    }


    if(!/^\+20\d{10}$/.test(phone)){

        showMessage(
            "اكتب رقم موبايل مصري صحيح مثل 010xxxxxxxx"
        );

        return;
    }


    if(!/^\d{4}$/.test(pin)){

        showMessage(
            "الـ PIN لازم يكون 4 أرقام"
        );

        return;
    }


    if(pin !== pinConfirm){

        showMessage(
            "الـ PIN وتأكيده مش متطابقين"
        );

        return;
    }


    showMessage("جاري إنشاء الحساب...", true);


    const { data, error } =
        await supabaseClient.auth.signUp({

            phone: phone,

            password: pin,

            options:{
                data:{
                    full_name:name
                }
            }

        });


    if(error){

        showMessage(
            "حصل خطأ: " + error.message
        );

        return;
    }


    // حفظ بيانات العميل في customer_profiles
    if(data.user){

        const { error: profileError } =
            await supabaseClient
            .from("customer_profiles")
            .upsert({

                id:data.user.id,

                phone:phone,

                full_name:name

            });


        if(profileError){

            console.log(profileError);

        }
    }


    showMessage(
        "تم إنشاء الحساب بنجاح ❤️",
        true
    );


    setTimeout(()=>{

        showLogin();

        document
            .getElementById("loginPhone")
            .value =
            document
            .getElementById("registerPhone")
            .value;

    },1200);

}


// تسجيل الدخول
async function login(){

    const phone =
        normalizePhone(
            document.getElementById("loginPhone")
            .value
        );

    const pin =
        document.getElementById("loginPin")
        .value.trim();


    if(!phone){

        showMessage("اكتب رقم الموبايل");

        return;
    }


    if(!pin){

        showMessage("اكتب الـ PIN");

        return;
    }


    showMessage(
        "جاري تسجيل الدخول...",
        true
    );


    const { data, error } =
        await supabaseClient.auth
        .signInWithPassword({

            phone:phone,

            password:pin

        });


    if(error){

        showMessage(
            "رقم الموبايل أو الـ PIN غير صحيح"
        );

        return;
    }


    showMessage(
        "تم تسجيل الدخول بنجاح ❤️",
        true
    );


    // مؤقتًا نعرض رسالة نجاح
    // وبعدها هنربطه بالمنيو

    setTimeout(()=>{

        window.location.href =
        "menu.html";

    },1000);

}

</script>

</body>
</html>
