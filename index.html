<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ألبان فلاحي | طلبات العملاء</title>
<meta name="theme-color" content="#0877b9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="customer-manifest.json?v=20260918-2350">
<link rel="stylesheet" href="brand.css">
<script src="customer-branding.js?v=20260918-2315"></script>
<style>
:root{--blue:#0877b9;--teal:#16b8b0;--ink:#17324a;--muted:#6f828d;--line:#e1eef1;--soft:#f3fbfc;--white:#fff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#f5fbfc;color:var(--ink)}
body{overflow-x:hidden}
button,input{font:inherit}
button{cursor:pointer}
.page{min-height:100vh;position:relative;overflow:hidden;background:linear-gradient(180deg,#eaf9fb 0,#f8fcfd 43%,#fff 100%)}
.page:before{content:"";position:absolute;width:330px;height:330px;border-radius:50%;background:rgba(22,184,176,.13);top:-185px;left:-130px}
.page:after{content:"";position:absolute;width:280px;height:280px;border-radius:50%;background:rgba(8,119,185,.09);right:-150px;bottom:100px}
.shell{position:relative;z-index:1;width:min(100%,760px);margin:auto;padding:18px 16px 34px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;height:48px}
.brand-mini{display:flex;align-items:center;gap:10px;font-weight:950;color:var(--blue)}
.brand-mini .brand-mini-mark{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--blue),var(--teal));background-size:cover;background-position:center;box-shadow:0 7px 18px rgba(8,119,185,.16)}
.lang-mini{border:1px solid rgba(8,119,185,.14);background:rgba(255,255,255,.76);backdrop-filter:blur(10px);color:var(--blue);border-radius:14px;padding:9px 12px;font-size:12px;font-weight:900}
.hero{margin-top:14px;background:linear-gradient(145deg,var(--blue),#0995bd 54%,var(--teal));border-radius:32px;padding:30px 24px 24px;color:#fff;position:relative;overflow:hidden;box-shadow:0 24px 55px rgba(8,119,185,.22)}
.hero:before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.10);top:-150px;left:-70px}
.hero:after{content:"";position:absolute;width:190px;height:190px;border-radius:50%;border:30px solid rgba(255,255,255,.07);right:-90px;bottom:-95px}
.hero-content{position:relative;z-index:1;max-width:570px}
.hero-kicker{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:7px 11px;font-size:11px;font-weight:900}
.hero h1{font-size:clamp(30px,7vw,48px);line-height:1.08;margin:17px 0 10px;letter-spacing:-1px}
.hero p{margin:0;color:rgba(255,255,255,.9);font-size:14px;line-height:1.9;max-width:490px}
.hero-badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.hero-badge{background:#fff;color:var(--blue);border-radius:13px;padding:9px 11px;font-size:11px;font-weight:900;box-shadow:0 6px 16px rgba(0,0,0,.08)}
.card{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:28px;box-shadow:0 18px 48px rgba(8,119,185,.09);padding:22px;margin-top:14px}
.welcome{text-align:center}.welcome h2{font-size:20px;margin:0 0 7px}.welcome p{margin:0;color:var(--muted);font-size:13px;line-height:1.8}
.features{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:17px}
.feature{background:var(--soft);border:1px solid #dceff1;border-radius:17px;padding:13px 7px;text-align:center}.feature-icon{font-size:22px;display:block;margin-bottom:7px}.feature b{font-size:11px;color:#246a72}
.section-title{text-align:center;font-size:19px;font-weight:950;margin:22px 0 14px}
.language-buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.language-button{min-height:58px;border:1px solid #d6e9ed;border-radius:17px;background:#fff;color:var(--blue);font-weight:950;transition:.18s;box-shadow:0 6px 15px rgba(8,119,185,.05)}
.language-button:first-child{background:linear-gradient(135deg,var(--blue),var(--teal));color:#fff;border-color:transparent;box-shadow:0 10px 22px rgba(8,119,185,.18)}
.language-button:active,.main-button:active{transform:scale(.985)}
.login-title{text-align:center;font-size:22px;margin:2px 0 19px;font-weight:950}
.field{margin-bottom:13px}.field label{display:block;font-size:13px;font-weight:900;margin-bottom:7px}.field input{width:100%;height:53px;border:1px solid #d8e9ed;border-radius:15px;background:#fbfeff;color:var(--ink);padding:0 15px;outline:none;transition:.18s}.field input:focus{border-color:var(--teal);box-shadow:0 0 0 4px rgba(22,184,176,.10);background:#fff}
.main-button{width:100%;height:54px;border:0;border-radius:16px;background:linear-gradient(135deg,var(--blue),var(--teal));color:#fff;font-weight:950;box-shadow:0 11px 23px rgba(8,119,185,.18);transition:.18s}.main-button:disabled{opacity:.65}
.error{display:none;background:#fff1f1;border:1px solid #ffd9d9;color:#a00000;padding:11px 12px;border-radius:13px;margin:10px 0;font-size:13px;line-height:1.5}
.brand-login{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:19px}.login-brand-mark{display:block;width:76px;height:76px;border-radius:22px;margin-bottom:11px;background:linear-gradient(135deg,var(--blue),var(--teal));background-size:cover;background-position:center;box-shadow:0 10px 24px rgba(8,119,185,.17);border:1px solid #e0f0f3}.brand-login strong{font-size:20px;color:var(--blue)}
.footer{text-align:center;color:#8a9aa2;font-size:11px;margin-top:16px}
@media(min-width:650px){.shell{padding:22px 22px 40px}.hero{padding:42px 40px}.card{padding:28px}.login-card{max-width:540px;margin-left:auto;margin-right:auto}}
@media(max-width:430px){.shell{padding:12px 10px 26px}.hero{border-radius:27px;padding:25px 18px 20px}.hero h1{font-size:31px}.hero p{font-size:13px}.card{border-radius:24px;padding:19px 15px}.features{gap:6px}.feature{padding:11px 4px}.feature-icon{font-size:20px}.feature b{font-size:10px}.language-buttons{grid-template-columns:1fr}.language-button:first-child{order:0}}
</style>
</head>
<body>
<div class="page">
<main class="shell">
<header class="topbar">
<div class="brand-mini"><span class="brand-mini-mark" aria-hidden="true"></span><span>ألبان فلاحي</span></div>
<button class="lang-mini" id="langMini" type="button" onclick="toggleLanguage()">English</button>
</header>
<section class="hero">
<div class="hero-content">
<div class="hero-kicker">🥛 طبيعي • فريش • فلاحي</div>
<h1 id="heroTitle">كل اللي بتحبه من ألبان فلاحي</h1>
<p id="heroText">اطلب منتجاتك اليومية بسهولة، واستمتع بمنتجات طبيعية وفريش يوم بيوم، مع توصيل لحد باب بيتك.</p>
<div class="hero-badges"><span class="hero-badge">🚚 توصيل سريع</span><span class="hero-badge">🎁 بونص وعروض</span><span class="hero-badge">🧀 منتجات طبيعية</span></div>
</div>
</section>
<div id="app"></div>
<div class="footer" id="footerText">ألبان فلاحي • طلبات العملاء</div>
</main>
</div>
<script>
const app=document.getElementById('app');
const API='https://qxwvuxkbcghbkztjrzon.supabase.co/functions/v1/customer-auth';
let lang=localStorage.getItem('alban_lang')||'';
function hasSession(){try{const s=JSON.parse(localStorage.getItem('alban_auth_session')||'null');return !!(localStorage.getItem('alban_customer_id')&&s?.access_token)}catch(e){return !!localStorage.getItem('alban_customer_id')}}
function applyLanguage(){
 const en=lang==='en';
 document.documentElement.lang=en?'en':'ar';document.documentElement.dir=en?'ltr':'rtl';
 document.getElementById('heroTitle').textContent=en?'Everything you love from Alban Falahi':'كل اللي بتحبه من ألبان فلاحي';
 document.getElementById('heroText').textContent=en?'Order your daily favorites easily, with fresh natural products delivered to your door.':'اطلب منتجاتك اليومية بسهولة، واستمتع بمنتجات طبيعية وفريش يوم بيوم، مع توصيل لحد باب بيتك.';
 document.getElementById('langMini').textContent=en?'العربية':'English';
 document.getElementById('footerText').textContent=en?'Alban Falahi • Customer Orders':'ألبان فلاحي • طلبات العملاء';
}
function toggleLanguage(){setLang(lang==='en'?'ar':'en')}
function setLang(x){lang=x;localStorage.setItem('alban_lang',x);applyLanguage();render()}
function render(){
 applyLanguage();
 if(hasSession()){location.replace('menu.html');return}
 if(!lang){
  app.innerHTML='<section class="card welcome"><h2>أهلاً بك في ألبان فلاحي 👋</h2><p>ابدأ باختيار اللغة، وبعدها سجّل دخولك للوصول إلى المنيو والطلبات.</p><div class="features"><div class="feature"><span class="feature-icon">🥛</span><b>طبيعي 100%</b></div><div class="feature"><span class="feature-icon">🚚</span><b>توصيل سريع</b></div><div class="feature"><span class="feature-icon">🎁</span><b>بونص وعروض</b></div></div><div class="section-title">اختار اللغة</div><div class="language-buttons"><button class="language-button" onclick="setLang(\'ar\')">العربية</button><button class="language-button" onclick="setLang(\'en\')">English</button></div></section>';
  return;
 }
 const en=lang==='en';
 app.innerHTML='<section class="card login-card"><div class="brand-login"><span class="login-brand-mark" aria-hidden="true"></span><strong>'+ (en?'Welcome back':'أهلاً بيك من جديد') +'</strong></div><div class="login-title">'+(en?'Customer Login':'دخول العميل')+'</div><div class="field"><label>'+ (en?'Mobile Number':'رقم الموبايل') +'</label><input id="mobile" inputmode="tel" autocomplete="tel" placeholder="01xxxxxxxxx"></div><div class="field"><label>'+ (en?'6-digit PIN':'الـPIN (6 أرقام)') +'</label><input id="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password" placeholder="••••••"></div><div id="err" class="error"></div><button id="loginBtn" class="main-button" onclick="login()">'+(en?'Continue':'متابعة')+'</button></section>';
}
function normalizePhone(v){let p=String(v||'').replace(/\D/g,'');if(p.startsWith('20')&&p.length===12)p='0'+p.slice(2);return p}
async function login(){
 const mobile=normalizePhone(document.getElementById('mobile').value),pin=document.getElementById('pin').value.trim(),err=document.getElementById('err'),btn=document.getElementById('loginBtn');
 err.style.display='none';
 if(!/^01[0125]\d{8}$/.test(mobile)){err.textContent=lang==='en'?'Enter a valid mobile number':'اكتب رقم موبايل صحيح';err.style.display='block';return}
 if(!/^\d{6}$/.test(pin)){err.textContent=lang==='en'?'PIN must be 6 digits':'الـPIN لازم يكون 6 أرقام';err.style.display='block';return}
 btn.disabled=true;btn.textContent=lang==='en'?'Signing in...':'جاري الدخول...';
 try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',phone:mobile,pin})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.success)throw Error(d.error||'تعذر تسجيل الدخول');localStorage.setItem('alban_auth_session',JSON.stringify(d.session));localStorage.setItem('alban_customer_id',d.customer.id);localStorage.setItem('alban_customer_name',d.customer.full_name||'');localStorage.setItem('alban_customer_phone',d.customer.phone||mobile);location.href='menu.html'}catch(e){err.textContent=e.message;err.style.display='block'}finally{btn.disabled=false;btn.textContent=lang==='en'?'Continue':'متابعة'}
}
render();
</script>
</body>
</html>
