<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
(function(){
  var p=location.pathname.toLowerCase().replace(/\/+$/,'');
  if(p==='/admin'){
    location.replace('/admin.html?app=store');
  }
})();
</script>
<title>ألبان فلاحي</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f8f5ef;
    color:#222;
}

.container{
    max-width:480px;
    margin:auto;
    padding:25px 18px;
}

.card{
    background:white;
    border-radius:24px;
    padding:25px 20px;
    margin-top:30px;
    box-shadow:0 5px 25px rgba(0,0,0,.08);
}

.logo{
    text-align:center;
    font-size:32px;
    font-weight:bold;
    margin-top:20px;
}

.subtitle{
    text-align:center;
    color:#777;
    margin-top:8px;
}

.language-title{
    text-align:center;
    font-size:22px;
    font-weight:bold;
    margin-bottom:18px;
}

.language-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.language-button{
    border:1px solid #ddd;
    background:white;
    padding:18px 10px;
    border-radius:15px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.language-button:hover{
    background:#222;
    color:white;
}

.form-title{
    font-size:24px;
    font-weight:bold;
    margin-bottom:18px;
}

.field{
    margin-bottom:14px;
}

.field label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
}

.field input{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:12px;
    font-size:16px;
}

.main-button{
    width:100%;
    border:0;
    background:#222;
    color:white;
    padding:15px;
    border-radius:13px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}
</style>
</head>
<body>
<div class="container">
<div class="card">
<div class="logo">🥛 ألبان فلاحي</div>
<div class="subtitle">برنامج ألبان فلاحي</div>
<div id="app"></div>
</div>
</div>
<script>
const app=document.getElementById('app');
let lang=localStorage.getItem('alban_lang')||'';
function render(){
 if(!lang){app.innerHTML='<div class="language-title">اختر اللغة</div><div class="language-buttons"><button class="language-button" onclick="setLang(\'ar\')">العربية</button><button class="language-button" onclick="setLang(\'en\')">English</button></div>';return}
 if(lang==='en'){
   app.innerHTML='<div class="form-title">Customer Login</div><div class="field"><label>Mobile Number</label><input id="mobile" inputmode="tel"></div><button class="main-button" onclick="alert(\'Customer login is available from the customer menu.\')">Continue</button>';
 }else{
   app.innerHTML='<div class="form-title">دخول العميل</div><div class="field"><label>رقم الموبايل</label><input id="mobile" inputmode="tel"></div><button class="main-button" onclick="alert(\'دخول العميل متاح من برنامج العميل.\')">متابعة</button>';
 }
}
function setLang(x){lang=x;localStorage.setItem('alban_lang',x);render()}
render();
</script>
</body>
</html>
