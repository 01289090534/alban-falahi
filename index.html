<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ألبان فلاحي</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f8f5ef;
    color:#222;
}

.container{
    max-width:480px;
    margin:auto;
    padding:25px 18px;
}

.card{
    background:white;
    border-radius:24px;
    padding:25px 20px;
    margin-top:30px;
    box-shadow:0 5px 25px rgba(0,0,0,.08);
}

.logo{
    text-align:center;
    font-size:32px;
    font-weight:bold;
    margin-top:20px;
}

.subtitle{
    text-align:center;
    color:#777;
    margin-top:8px;
}

.language-title{
    text-align:center;
    font-size:22px;
    font-weight:bold;
    margin-bottom:18px;
}

.language-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.language-button{
    border:1px solid #ddd;
    background:white;
    padding:18px 10px;
    border-radius:15px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.language-button:hover{
    background:#222;
    color:white;
}

.form-title{
    font-size:24px;
    font-weight:bold;
    margin-bottom:18px;
}

.field{
    margin-bottom:14px;
}

.field label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
}

.field input{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:12px;
    font-size:16px;
}

.main-button{
    width:100%;
    border:0;
    background:#222;
    color:white;
    padding:15px;
    border-radius:13px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    margin-top:5px;
}

.secondary-button{
    width:100%;
    border:1px solid #ddd;
    background:white;
    color:#222;
    padding:14px;
    border-radius:13px;
    font-size:16px;
    cursor:pointer;
    margin-top:10px;
}

.message{
    text-align:center;
    margin-top:14px;
    font-size:14px;
    min-height:20px;
}

.language-switch{
    text-align:center;
    margin-top:15px;
}

.language-switch button{
    border:0;
    background:none;
    color:#555;
    cursor:pointer;
    font-size:14px;
}

.hidden{
    display:none;
}

.pin-note{
    font-size:12px;
    color:#777;
    margin-top:5px;
}

@media(max-width:400px){
    .language-buttons{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="container">

<div class="logo">
🥛 ألبان فلاحي
</div>

<div id="subtitle" class="subtitle">
طبيعي 100% • فريش يوم بيوم
</div>

<!-- LANGUAGE -->

<div id="languageCard" class="card">

<div id="languageTitle" class="language-title">
اختر اللغة
</div>

<div class="language-buttons">

<button class="language-button"
onclick="chooseLanguage('ar')">
🇪🇬 العربية
</button>

<button class="language-button"
onclick="chooseLanguage('en')">
🇬🇧 English
</button>

</div>

</div>


<!-- AUTH -->

<div id="authCard" class="card hidden">

<div id="formTitle" class="form-title">
تسجيل الدخول
</div>


<div id="nameField" class="field hidden">

<label id="nameLabel">
الاسم
</label>

<input
id="nameInput"
type="text"
autocomplete="name">

</div>


<div class="field">

<label id="phoneLabel">
رقم الموبايل
</label>

<input
id="phoneInput"
type="tel"
inputmode="tel"
placeholder="01xxxxxxxxx"
autocomplete="tel">

</div>


<div class="field">

<label id="pinLabel">
الرقم السري
</label>

<input
id="pinInput"
type="password"
inputmode="numeric"
maxlength="6"
autocomplete="off">

<div id="pinNote" class="pin-note">
استخدم رقم سري من 6 أرقام
</div>

</div>


<div id="confirmPinField" class="field hidden">

<label id="confirmPinLabel">
تأكيد الرقم السري
</label>

<input
id="confirmPinInput"
type="password"
inputmode="numeric"
maxlength="6"
autocomplete="off">

</div>


<button
id="mainButton"
class="main-button"
onclick="submitAuth()">
دخول
</button>


<button
id="switchButton"
class="secondary-button"
onclick="toggleMode()">
إنشاء حساب جديد
</button>


<div id="message" class="message"></div>


<div class="language-switch">

<button onclick="changeLanguage()">
🌐 <span id="changeLanguageText">تغيير اللغة</span>
</button>

</div>

</div>

</div>


<script>

const AUTH_URL =
"https://qxwvuxkbcghbkztjrzon.supabase.co/functions/v1/customer-auth";


let currentLanguage =
localStorage.getItem("alban_language");

let registerMode = false;


/* =========================
TRANSLATIONS
========================= */

const translations = {

ar:{

subtitle:
"طبيعي 100% • فريش يوم بيوم",

languageTitle:
"اختر اللغة",

login:
"تسجيل الدخول",

register:
"إنشاء حساب جديد",

name:
"الاسم",

phone:
"رقم الموبايل",

pin:
"الرقم السري",

confirmPin:
"تأكيد الرقم السري",

pinNote:
"استخدم رقم سري من 6 أرقام",

loginButton:
"دخول",

registerButton:
"إنشاء الحساب",

createAccount:
"إنشاء حساب جديد",

alreadyAccount:
"عندي حساب بالفعل",

changeLanguage:
"تغيير اللغة",

enterName:
"من فضلك اكتب اسمك.",

enterPhone:
"من فضلك اكتب رقم الموبايل.",

invalidPhone:
"رقم الموبايل غير صحيح.",

invalidPin:
"الرقم السري يجب أن يكون 6 أرقام.",

pinMismatch:
"الرقمان السريان غير متطابقين.",

accountCreated:
"تم إنشاء الحساب بنجاح ✅",

loginSuccess:
"تم تسجيل الدخول بنجاح ✅",

loginError:
"رقم الموبايل أو الرقم السري غير صحيح.",

registerError:
"حصل خطأ أثناء إنشاء الحساب. حاول مرة أخرى."

},

en:{

subtitle:
"100% Natural • Fresh Every Day",

languageTitle:
"Choose your language",

login:
"Login",

register:
"Create Account",

name:
"Name",

phone:
"Mobile Number",

pin:
"PIN",

confirmPin:
"Confirm PIN",

pinNote:
"Use a 6-digit PIN",

loginButton:
"Login",

registerButton:
"Create Account",

createAccount:
"Create a new account",

alreadyAccount:
"I already have an account",

changeLanguage:
"Change language",

enterName:
"Please enter your name.",

enterPhone:
"Please enter your mobile number.",

invalidPhone:
"Invalid mobile number.",

invalidPin:
"PIN must contain 6 digits.",

pinMismatch:
"PINs do not match.",

accountCreated:
"Account created successfully ✅",

loginSuccess:
"Logged in successfully ✅",

loginError:
"Incorrect mobile number or PIN.",

registerError:
"Something went wrong. Please try again."

}

};


/* =========================
PHONE
========================= */

function normalizeEgyptianPhone(phone){

phone =
phone
.replace(/\s+/g,"")
.replace(/-/g,"");

if(phone.startsWith("+20")){

phone =
"0" +
phone.substring(3);

}

if(
phone.startsWith("20") &&
phone.length === 12
){

phone =
"0" +
phone.substring(2);

}

return phone;

}


function validEgyptianPhone(phone){

return /^01[0125][0-9]{8}$/.test(phone);

}


/* =========================
LANGUAGE
========================= */

function chooseLanguage(language){

currentLanguage =
language;

localStorage.setItem(
"alban_language",
language
);

showAuth();

}


function changeLanguage(){

localStorage.removeItem(
"alban_language"
);

location.reload();

}


/* =========================
SHOW AUTH
========================= */

function showAuth(){

const t =
translations[currentLanguage];

document.documentElement.lang =
currentLanguage;

document.documentElement.dir =
currentLanguage === "ar"
? "rtl"
: "ltr";

document.getElementById("subtitle")
.innerText =
t.subtitle;

document.getElementById("languageCard")
.classList.add("hidden");

document.getElementById("authCard")
.classList.remove("hidden");

updateAuthUI();

}


/* =========================
AUTH UI
========================= */

function updateAuthUI(){

const t =
translations[currentLanguage];

document.getElementById("formTitle")
.innerText =
registerMode
? t.register
: t.login;

document.getElementById("nameLabel")
.innerText =
t.name;

document.getElementById("phoneLabel")
.innerText =
t.phone;

document.getElementById("pinLabel")
.innerText =
t.pin;

document.getElementById("confirmPinLabel")
.innerText =
t.confirmPin;

document.getElementById("pinNote")
.innerText =
t.pinNote;

document.getElementById("mainButton")
.innerText =
registerMode
? t.registerButton
: t.loginButton;

document.getElementById("switchButton")
.innerText =
registerMode
? t.alreadyAccount
: t.createAccount;

document.getElementById("changeLanguageText")
.innerText =
t.changeLanguage;

document.getElementById("nameField")
.classList.toggle(
"hidden",
!registerMode
);

document.getElementById("confirmPinField")
.classList.toggle(
"hidden",
!registerMode
);

clearMessage();

}


/* =========================
TOGGLE
========================= */

function toggleMode(){

registerMode =
!registerMode;

clearInputs();

updateAuthUI();

}


/* =========================
MESSAGE
========================= */

function showMessage(text){

document.getElementById("message")
.innerText =
text;

}


function clearMessage(){

document.getElementById("message")
.innerText =
"";

}


function clearInputs(){

document.getElementById("nameInput").value="";
document.getElementById("phoneInput").value="";
document.getElementById("pinInput").value="";
document.getElementById("confirmPinInput").value="";

}


/* =========================
API
========================= */

async function callAuth(payload){

const response =
await fetch(
AUTH_URL,
{
method:"POST",

headers:{
"Content-Type":"application/json"
},

body:
JSON.stringify(payload)
}
);

let result;

try{

result =
await response.json();

}catch(e){

result = {};

}

if(!response.ok){

throw new Error(
result.error ||
"حدث خطأ"
);

}

return result;

}


/* =========================
SUBMIT
========================= */

async function submitAuth(){

const t =
translations[currentLanguage];

clearMessage();

const name =
document.getElementById("nameInput")
.value
.trim();

let phone =
document.getElementById("phoneInput")
.value
.trim();

const pin =
document.getElementById("pinInput")
.value
.trim();

const confirmPin =
document.getElementById("confirmPinInput")
.value
.trim();


if(registerMode && !name){

showMessage(t.enterName);

return;

}


if(!phone){

showMessage(t.enterPhone);

return;

}


phone =
normalizeEgyptianPhone(phone);


if(!validEgyptianPhone(phone)){

showMessage(t.invalidPhone);

return;

}


if(!/^[0-9]{6}$/.test(pin)){

showMessage(t.invalidPin);

return;

}


if(registerMode){

if(pin !== confirmPin){

showMessage(t.pinMismatch);

return;

}

await registerCustomer(
name,
phone,
pin
);

}else{

await loginCustomer(
phone,
pin
);

}

}


/* =========================
REGISTER
========================= */

async function registerCustomer(
name,
phone,
pin
){

const t =
translations[currentLanguage];

const button =
document.getElementById("mainButton");

button.disabled = true;
button.innerText =
currentLanguage === "ar"
? "جاري إنشاء الحساب..."
: "Creating account...";


try{

const result =
await callAuth({

action:"register",

full_name:name,

phone:phone,

pin:pin

});


if(result.success){

localStorage.setItem(
"alban_customer_id",
result.customer.id
);

localStorage.setItem(
"alban_customer_name",
result.customer.full_name
);

localStorage.setItem(
"alban_customer_phone",
result.customer.phone
);

showMessage(
t.accountCreated
);

setTimeout(
()=>{
window.location.href =
"menu.html";
},
700
);

}

}catch(error){

console.log(error);

showMessage(
error.message ||
t.registerError
);

}finally{

button.disabled = false;

updateAuthUI();

}

}


/* =========================
LOGIN
========================= */

async function loginCustomer(
phone,
pin
){

const t =
translations[currentLanguage];

const button =
document.getElementById("mainButton");

button.disabled = true;
button.innerText =
currentLanguage === "ar"
? "جاري الدخول..."
: "Logging in...";


try{

const result =
await callAuth({

action:"login",

phone:phone,

pin:pin

});


if(result.success){

localStorage.setItem(
"alban_customer_id",
result.customer.id
);

localStorage.setItem(
"alban_customer_name",
result.customer.full_name
);

localStorage.setItem(
"alban_customer_phone",
result.customer.phone
);

showMessage(
t.loginSuccess
);

setTimeout(
()=>{
window.location.href =
"menu.html";
},
500
);

}

}catch(error){

console.log(error);

showMessage(
error.message ||
t.loginError
);

}finally{

button.disabled = false;

updateAuthUI();

}

}


/* =========================
START
========================= */

if(currentLanguage){

showAuth();

}else{

document.documentElement.lang =
"ar";

document.documentElement.dir =
"rtl";

}

</script>

</body>
</html>
