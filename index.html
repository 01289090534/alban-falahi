<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ألبان فلاحي</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f8f5ef;
    color:#222;
}
.container{
    max-width:480px;
    margin:auto;
    padding:25px 18px;
}
.logo{
    text-align:center;
    font-size:32px;
    font-weight:bold;
    margin:25px 0 5px;
}
.subtitle{
    text-align:center;
    color:#777;
    margin-bottom:25px;
}
.card{
    background:white;
    padding:22px;
    border-radius:18px;
    box-shadow:0 4px 18px rgba(0,0,0,.08);
}
input{
    width:100%;
    box-sizing:border-box;
    padding:15px;
    margin:8px 0;
    border:1px solid #ddd;
    border-radius:12px;
    font-size:16px;
}
button{
    width:100%;
    padding:15px;
    margin-top:12px;
    border:0;
    border-radius:12px;
    background:#222;
    color:white;
    font-size:17px;
    font-weight:bold;
}
.message{
    margin-top:15px;
    padding:12px;
    border-radius:10px;
    text-align:center;
}
.hidden{
    display:none;
}
</style>
</head>

<body>

<div class="container">

<div class="logo">🥛 ألبان فلاحي</div>

<div class="subtitle">
طبيعي 100% • فريش يوم بيوم
</div>

<div class="card">

<div id="register">

<h2>أهلاً بيك 👋</h2>

<p>أنشئ حسابك برقم الموبايل</p>

<input id="name" type="text" placeholder="الاسم بالكامل">

<input id="phone" type="tel" placeholder="رقم الموبايل">

<button onclick="sendCode()">
إرسال كود التحقق
</button>

</div>

<div id="verify" class="hidden">

<h2>🔐 تأكيد رقم الموبايل</h2>

<p>اكتب الكود اللي وصلك على الموبايل</p>

<input id="code" type="text" inputmode="numeric" maxlength="6" placeholder="كود التحقق">

<button onclick="verifyCode()">
تأكيد الكود
</button>

</div>

<div id="message"></div>

</div>
</div>

<script>

const SUPABASE_URL =
"https://qxwvuxkbcghbkztjrzon.supabase.co";

const SUPABASE_KEY =
"sb_publishable_JI9lC4YPTCQ8CwMxzvHNIA_C24ULpWH";

let savedName = "";
let savedPhone = "";

function normalizePhone(phone){

    phone = phone.trim().replace(/\s/g,"");

    if(phone.startsWith("+20")){
        return phone;
    }

    if(phone.startsWith("20")){
        return "+" + phone;
    }

    if(phone.startsWith("0")){
        return "+20" + phone.substring(1);
    }

    return "+20" + phone;
}

function message(text){

    document.getElementById("message").innerHTML =
        "<div class='message'>" + text + "</div>";
}

async function sendCode(){

    savedName =
        document.getElementById("name").value.trim();

    let phone =
        document.getElementById("phone").value.trim();

    if(savedName === ""){
        message("من فضلك اكتب الاسم بالكامل");
        return;
    }

    if(phone === ""){
        message("من فضلك اكتب رقم الموبايل");
        return;
    }

    savedPhone = normalizePhone(phone);

    message("جاري إرسال كود التحقق...");

    try{

        const response = await fetch(
            SUPABASE_URL + "/auth/v1/otp",
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json",
                    "apikey":SUPABASE_KEY
                },
                body:JSON.stringify({
                    phone:savedPhone
                })
            }
        );

        const result = await response.json();

        if(!response.ok){

            message(
                "لم يتم إرسال الكود: " +
                (result.msg || result.message || "حدث خطأ")
            );

            return;
        }

        document.getElementById("register")
            .classList.add("hidden");

        document.getElementById("verify")
            .classList.remove("hidden");

        message("تم إرسال كود التحقق ✅");

    }catch(error){

        message("حصل خطأ في الاتصال بسيرفر الحسابات");

    }
}

async function verifyCode(){

    const code =
        document.getElementById("code").value.trim();

    if(code === ""){

        message("اكتب كود التحقق");

        return;
    }

    message("جاري التأكد من الكود...");

    try{

        const response = await fetch(
            SUPABASE_URL + "/auth/v1/verify",
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json",
                    "apikey":SUPABASE_KEY
                },
                body:JSON.stringify({
                    phone:savedPhone,
                    token:code,
                    type:"sms"
                })
            }
        );

        const result = await response.json();

        if(!response.ok){

            message(
                "الكود غير صحيح: " +
                (result.msg || result.message || "حاول مرة أخرى")
            );

            return;
        }

        message(
            "تم إنشاء حسابك بنجاح يا " +
            savedName +
            " 🎉"
        );

    }catch(error){

        message("حصل خطأ أثناء تأكيد الكود");

    }
}

</script>

</body>
</html>
