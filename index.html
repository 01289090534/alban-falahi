<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ألبان فلاحي</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f8f5ef;
    color:#222;
}

.container{
    max-width:480px;
    margin:auto;
    padding:25px 18px;
}

.logo{
    text-align:center;
    font-size:32px;
    font-weight:bold;
    margin:25px 0 5px;
}

.subtitle{
    text-align:center;
    color:#777;
    margin-bottom:25px;
}

.card{
    background:white;
    padding:22px;
    border-radius:18px;
    box-shadow:0 4px 18px rgba(0,0,0,.08);
}

input{
    width:100%;
    box-sizing:border-box;
    padding:15px;
    margin:8px 0;
    border:1px solid #ddd;
    border-radius:12px;
    font-size:16px;
}

button{
    width:100%;
    padding:15px;
    margin-top:12px;
    border:0;
    border-radius:12px;
    background:#222;
    color:white;
    font-size:17px;
    font-weight:bold;
}

button:disabled{
    opacity:.5;
}

.hidden{
    display:none;
}

.message{
    margin-top:15px;
    padding:12px;
    border-radius:10px;
    text-align:center;
    word-break:break-word;
}

.success{
    background:#e8f7e8;
    color:#267326;
}

.error{
    background:#fdeaea;
    color:#a22;
}
</style>
</head>

<body>

<div class="container">

<div class="logo">🥛 ألبان فلاحي</div>

<div class="subtitle">
طبيعي 100% • فريش يوم بيوم
</div>

<div class="card">

<div id="registerBox">

<h2>أهلاً بيك 👋</h2>

<p>أنشئ حسابك برقم الموبايل</p>

<input
id="name"
type="text"
placeholder="الاسم بالكامل">

<input
id="phone"
type="tel"
placeholder="رقم الموبايل مثال 01012345678">

<button id="sendButton" onclick="sendCode()">
إرسال كود التحقق
</button>

</div>


<div id="verifyBox" class="hidden">

<h2>🔐 تأكيد رقم الموبايل</h2>

<p>اكتب كود التحقق اللي وصلك على الموبايل</p>

<input
id="code"
type="text"
inputmode="numeric"
maxlength="6"
placeholder="كود التحقق">

<button id="verifyButton" onclick="verifyCode()">
تأكيد الكود
</button>

<button onclick="changePhone()">
تغيير رقم الموبايل
</button>

</div>


<div id="message"></div>

</div>

</div>


<script>

const SUPABASE_URL =
"https://qxwvuxkbcghbkztjrzon.supabase.co";

const SUPABASE_KEY =
"sb_publishable_JI9lC4YPTCQ8CwMxzvHNIA_C24ULpWH";


let customerName = "";
let customerPhone = "";


function showMessage(text, type){

    const box =
        document.getElementById("message");

    box.className =
        "message " + type;

    box.textContent = text;
}


function normalizePhone(phone){

    phone =
        phone.trim().replace(/\s+/g,"");

    if(phone.startsWith("+20")){
        return phone;
    }

    if(phone.startsWith("20")){
        return "+" + phone;
    }

    if(phone.startsWith("0")){
        return "+20" + phone.substring(1);
    }

    return "+20" + phone;
}


async function sendCode(){

    const name =
        document.getElementById("name").value.trim();

    const phone =
        document.getElementById("phone").value.trim();

    const button =
        document.getElementById("sendButton");


    if(!name){

        showMessage(
            "من فضلك اكتب الاسم بالكامل",
            "error"
        );

        return;
    }


    if(!phone){

        showMessage(
            "من فضلك اكتب رقم الموبايل",
            "error"
        );

        return;
    }


    customerName = name;

    customerPhone =
        normalizePhone(phone);


    button.disabled = true;

    button.textContent =
        "جاري إرسال الكود...";


    try{

        const response =
            await fetch(
                SUPABASE_URL + "/auth/v1/otp",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "apikey":
                            SUPABASE_KEY
                    },

                    body:JSON.stringify({
                        phone:customerPhone
                    })
                }
            );


        const result =
            await response.json();


        if(!response.ok){

            const errorText =
                result.msg ||
                result.message ||
                result.error_description ||
                result.error ||
                JSON.stringify(result);


            showMessage(
                "لم يتم إرسال الكود ❌\n" +
                errorText,
                "error"
            );

            button.disabled = false;

            button.textContent =
                "إرسال كود التحقق";

            return;
        }


        document
            .getElementById("registerBox")
            .classList.add("hidden");


        document
            .getElementById("verifyBox")
            .classList.remove("hidden");


        showMessage(
            "تم إرسال كود التحقق ✅",
            "success"
        );


    }catch(error){

        showMessage(
            "حصل خطأ في الاتصال بسيرفر الحسابات:\n" +
            error.message,
            "error"
        );

    }


    button.disabled = false;

    button.textContent =
        "إرسال كود التحقق";
}


async function verifyCode(){

    const code =
        document.getElementById("code")
        .value
        .trim();

    const button =
        document.getElementById("verifyButton");


    if(!code){

        showMessage(
            "من فضلك اكتب كود التحقق",
            "error"
        );

        return;
    }


    button.disabled = true;

    button.textContent =
        "جاري التأكد...";


    try{

        const response =
            await fetch(
                SUPABASE_URL + "/auth/v1/verify",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "apikey":
                            SUPABASE_KEY
                    },

                    body:JSON.stringify({
                        phone:customerPhone,
                        token:code,
                        type:"sms"
                    })
                }
            );


        const result =
            await response.json();


        if(!response.ok){

            const errorText =
                result.msg ||
                result.message ||
                result.error_description ||
                result.error ||
                JSON.stringify(result);


            showMessage(
                "الكود غير صحيح ❌\n" +
                errorText,
                "error"
            );

            button.disabled = false;

            button.textContent =
                "تأكيد الكود";

            return;
        }


        showMessage(
            "تم تأكيد رقم الموبايل بنجاح 🎉",
            "success"
        );


        document
            .getElementById("verifyBox")
            .innerHTML =

            "<h2>أهلاً بيك يا " +
            customerName +
            " 👋</h2>" +

            "<p>تم إنشاء حسابك بنجاح.</p>" +

            "<p>دلوقتي نقدر نكمل المنيو والطلب 🛒🥛</p>";


    }catch(error){

        showMessage(
            "حصل خطأ أثناء تأكيد الكود:\n" +
            error.message,
            "error"
        );

        button.disabled = false;

        button.textContent =
            "تأكيد الكود";
    }
}


function changePhone(){

    document
        .getElementById("verifyBox")
        .classList.add("hidden");


    document
        .getElementById("registerBox")
        .classList.remove("hidden");


    document.getElementById("code").value = "";

    document.getElementById("message").textContent = "";

}

</script>

</body>
</html>
