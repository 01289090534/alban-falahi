<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ألبان فلاحي</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f8f5ef;
    color:#222;
}
.container{
    max-width:480px;
    margin:auto;
    padding:25px 18px;
}
.logo{
    text-align:center;
    font-size:32px;
    font-weight:bold;
    margin:25px 0 5px;
}
.subtitle{
    text-align:center;
    color:#777;
    margin-bottom:25px;
}
.card{
    background:white;
    padding:22px;
    border-radius:18px;
    box-shadow:0 4px 18px rgba(0,0,0,.08);
}
h2{
    margin-top:0;
}
input{
    width:100%;
    box-sizing:border-box;
    padding:15px;
    margin:8px 0;
    border:1px solid #ddd;
    border-radius:12px;
    font-size:16px;
}
button{
    width:100%;
    padding:15px;
    margin-top:12px;
    border:0;
    border-radius:12px;
    background:#222;
    color:white;
    font-size:17px;
    font-weight:bold;
}
.note{
    text-align:center;
    color:#777;
    font-size:13px;
    margin-top:15px;
}
</style>
</head>

<body>

<div class="container">

<div class="logo">🥛 ألبان فلاحي</div>
<div class="subtitle">طبيعي 100% • فريش يوم بيوم</div>

<div class="card">

<h2>أهلاً بيك 👋</h2>

<p>أنشئ حسابك أو ادخل برقم الموبايل</p>

<input type="text" placeholder="الاسم بالكامل">

<input type="tel" placeholder="رقم الموبايل">

<button>إرسال كود التحقق</button>

<div class="note">
هنستخدم رقم الموبايل لتأكيد الحساب وتسهيل الدخول بعد كده.
</div>

</div>

</div>

</body>
</html>
