<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ألبان فلاحي</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f6f9fa;color:#17324a}.container{max-width:480px;margin:auto;padding:25px 18px}.card{background:#fff;border-radius:26px;padding:25px 20px;margin-top:30px;box-shadow:0 8px 30px rgba(8,119,185,.09);border:1px solid #e3f1f4}.logo{text-align:center;font-size:32px;font-weight:bold;margin-top:20px;color:#0877b9}.subtitle{text-align:center;color:#6d7f88;margin-top:8px}.language-title,.form-title{font-weight:bold}.language-title{text-align:center;font-size:22px;margin-bottom:18px;color:#0877b9}.language-buttons{display:grid;grid-template-columns:1fr 1fr;gap:12px}.language-button{border:1px solid #cfe9ed;background:#fff;padding:18px 10px;border-radius:15px;font-size:17px;font-weight:bold;cursor:pointer;color:#0877b9}.language-button:active{transform:scale(.98)}.form-title{font-size:24px;margin-bottom:18px;color:#0877b9}.field{margin-bottom:14px}.field label{display:block;font-weight:bold;margin-bottom:7px}.field input{width:100%;padding:14px;border:1px solid #d7e9ed;border-radius:12px;font-size:16px;outline:0}.field input:focus{border-color:#16b8b0;box-shadow:0 0 0 3px rgba(22,184,176,.12)}.main-button{width:100%;border:0;background:linear-gradient(135deg,#0877b9,#16b8b0);color:white;padding:15px;border-radius:13px;font-size:17px;font-weight:bold;cursor:pointer;box-shadow:0 6px 16px rgba(8,119,185,.18)}.main-button:disabled{opacity:.65}.error{display:none;background:#fff0f0;color:#a00000;padding:11px;border-radius:12px;margin:10px 0;font-size:14px}
</style>
</head>
<body>
<div class="container"><div class="card"><div class="logo">🥛 ألبان فلاحي</div><div class="subtitle">برنامج ألبان فلاحي</div><div id="app"></div></div></div>
<script>
const app=document.getElementById('app');let lang=localStorage.getItem('alban_lang')||'';const API='https://qxwvuxkbcghbkztjrzon.supabase.co/functions/v1/customer-auth';
function hasSession(){try{const s=JSON.parse(localStorage.getItem('alban_auth_session')||'null');return !!(localStorage.getItem('alban_customer_id')&&s?.access_token)}catch(e){return !!localStorage.getItem('alban_customer_id')}}function render(){if(hasSession()){location.replace('menu.html');return}if(!lang){app.innerHTML='<div class="language-title">اختر اللغة</div><div class="language-buttons"><button class="language-button" onclick="setLang(\'ar\')">العربية</button><button class="language-button" onclick="setLang(\'en\')">English</button></div>';return}app.innerHTML=lang==='en'?'<div class="form-title">Customer Login</div><div class="field"><label>Mobile Number</label><input id="mobile" inputmode="tel" autocomplete="tel"></div><div class="field"><label>6-digit PIN</label><input id="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password"></div><div id="err" class="error"></div><button id="loginBtn" class="main-button" onclick="login()">Continue</button>':'<div class="form-title">دخول العميل</div><div class="field"><label>رقم الموبايل</label><input id="mobile" inputmode="tel" autocomplete="tel"></div><div class="field"><label>الـPIN (6 أرقام)</label><input id="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password"></div><div id="err" class="error"></div><button id="loginBtn" class="main-button" onclick="login()">متابعة</button>'}
function setLang(x){lang=x;localStorage.setItem('alban_lang',x);render()}
function normalizePhone(v){let p=String(v||'').replace(/\D/g,'');if(p.startsWith('20')&&p.length===12)p='0'+p.slice(2);return p}
async function login(){const mobile=normalizePhone(document.getElementById('mobile').value),pin=document.getElementById('pin').value.trim(),err=document.getElementById('err'),btn=document.getElementById('loginBtn');err.style.display='none';if(!/^01[0125]\d{8}$/.test(mobile)){err.textContent=lang==='en'?'Enter a valid mobile number':'اكتب رقم موبايل صحيح';err.style.display='block';return}if(!/^\d{6}$/.test(pin)){err.textContent=lang==='en'?'PIN must be 6 digits':'الـPIN لازم يكون 6 أرقام';err.style.display='block';return}btn.disabled=true;btn.textContent=lang==='en'?'Signing in...':'جاري الدخول...';try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',phone:mobile,pin})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.success)throw Error(d.error||'تعذر تسجيل الدخول');localStorage.setItem('alban_auth_session',JSON.stringify(d.session));localStorage.setItem('alban_customer_id',d.customer.id);localStorage.setItem('alban_customer_name',d.customer.full_name||'');localStorage.setItem('alban_customer_phone',d.customer.phone||mobile);location.href='menu.html'}catch(e){err.textContent=e.message;err.style.display='block'}finally{btn.disabled=false;btn.textContent=lang==='en'?'Continue':'متابعة'}}
render();
</script>
</body>
</html>
