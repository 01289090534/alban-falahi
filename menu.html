<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>منيو ألبان فلاحي</title><style>*{box-sizing:border-box}body{margin:0;background:#f8f5ef;color:#222;font-family:Arial,sans-serif;padding-bottom:100px}.wrap{max-width:720px;margin:auto;padding:16px}.box,.card{background:#fff;border-radius:20px;box-shadow:0 4px 18px #00000012}.header{padding:18px}.logo{font-size:25px;font-weight:900}.hello{color:#666;margin-top:6px}.points{display:inline-block;margin-top:8px;padding:8px 12px;border-radius:999px;background:#fff8df;border:1px solid #f0d98a;color:#765400;font-weight:900}.info{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.info span{background:#f3f3f3;border-radius:12px;padding:8px 10px;font-size:13px}.free{margin-top:10px;padding:12px;background:#fff3df;border-radius:14px;text-align:center;font-weight:900;color:#c95000}.title{font-size:21px;font-weight:900;margin:20px 0 10px}.cats{display:flex;gap:8px;overflow:auto;padding-bottom:5px}.cat{border:1px solid #ddd;background:#fff;border-radius:999px;padding:10px 14px;white-space:nowrap;font-weight:800;cursor:pointer}.cat.active{background:#222;color:#fff}.products{display:grid;grid-template-columns:1fr 1fr;gap:11px}.product{padding:11px;cursor:pointer}.pic{height:135px;border-radius:14px;background:#eee;display:grid;place-items:center;overflow:hidden;font-size:42px}.pic img{width:100%;height:100%;object-fit:cover}.name{font-weight:900;margin-top:9px}.desc{font-size:12px;color:#777;min-height:30px;margin-top:4px}.bottom{display:flex;align-items:center;justify-content:space-between;margin-top:9px}.price{font-weight:900}.qty{display:flex;align-items:center;gap:6px}.qty button,.add{border:0;background:#222;color:#fff;border-radius:10px;cursor:pointer}.qty button{width:30px;height:30px}.add{width:38px;height:38px;font-size:22px}.cart{display:none;padding:16px;margin-top:20px}.cart.show{display:block}.cartrow{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid #eee}.cartqty{display:flex;gap:8px;align-items:center}.cartqty button{border:0;background:#eee;border-radius:8px;width:28px;height:28px}.sum{margin-top:18px;padding-top:14px;border-top:2px solid #eee}.sum div{display:flex;justify-content:space-between;margin:9px 0}.total{font-size:21px;font-weight:900;padding-top:10px;border-top:2px solid #222}.form{margin-top:18px;padding-top:18px;border-top:1px solid #eee}.input,.select,.textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;font-size:15px;background:#fff}.textarea{min-height:85px}.label{font-weight:900;font-size:14px;margin:12px 0 6px;display:block}.pay{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pay button,.tip button,.bonusBtn{padding:11px;border:1px solid #ddd;background:#fff;border-radius:12px;font-weight:900;cursor:pointer}.pay .active,.tip .active,.bonusBtn.active{background:#222;color:#fff}.tip{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.addr{border:2px solid #eee;border-radius:13px;padding:10px;margin-bottom:8px;cursor:pointer}.addr.active{border-color:#d35400;background:#fff8f1}.newaddr{display:none;background:#fafafa;border-radius:13px;padding:10px}.newaddr.show{display:block}.save,.confirm{width:100%;border:0;background:#222;color:#fff;border-radius:12px;padding:13px;font-size:16px;font-weight:900;margin-top:9px;cursor:pointer}.error{display:none;background:#fff0f0;color:#a00000;padding:11px;border-radius:11px;margin-top:10px}.success{display:none;text-align:center;padding:22px;margin-top:18px}.bar{display:none;position:fixed;z-index:20;bottom:80px;left:50%;transform:translateX(-50%);width:min(680px,calc(100% - 20px));background:#222;color:#fff;border-radius:17px;padding:11px 13px;justify-content:space-between;align-items:center;box-shadow:0 8px 28px #0004;cursor:pointer}.bar.show{display:flex}.nav{position:fixed;z-index:30;bottom:0;left:0;right:0;height:74px;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:center}.navin{width:100%;max-width:720px;display:grid;grid-template-columns:repeat(3,1fr)}.nav a{text-decoration:none;color:#777;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;gap:3px}.nav a.active{color:#222}.bonus{margin-top:12px;padding:13px;border:2px solid #f0d98a;background:#fffdf3;border-radius:15px}.bonusLine{display:flex;justify-content:space-between;gap:10px;align-items:center}.bonusHint{font-size:12px;color:#777;margin-top:6px}.discount{color:#137333;font-weight:900}@media(max-width:480px){.pic{height:115px}.logo{font-size:22px}.tip button{font-size:12px;padding:9px 3px}.pay button{font-size:12px;padding:9px 3px}}</style></head><body><main class="wrap"><header class="box header"><div class="logo">🥛 ألبان فلاحي <span id="rating">⭐ —/5</span></div><div id="hello" class="hello"></div><div id="points" class="points">🎁 البونص: <strong>0 نقطة = 0.00 ج</strong></div><div class="info"><span id="eta">🕐 20 - 30 دقيقة</span><span>🚚 25 ج.م</span><span id="status">📍 جاري تحديد الفرع</span></div><div class="free">🎁 توصيل مجانًا عند 500 ج أو أكثر ❤️</div></header><section><div class="title">الفئات</div><div id="cats" class="cats"></div></section><section><div class="title">الأصناف</div><div id="products" class="products"></div></section><section id="cart" class="box cart"><div class="title" style="margin-top:0">🛒 السلة</div><div id="items"></div><div class="form"><label class="label">الفرع</label><select id="branch" class="select" onchange="branchChanged()"></select><div id="branchMsg" style="font-size:12px;color:#777;margin-top:6px"></div><label class="label">📍 عنوان التوصيل</label><div id="addresses"></div><button class="save" onclick="toggleAddress()">＋ إضافة عنوان جديد</button><div id="newaddr" class="newaddr"><label class="label">اسم العنوان</label><input id="addrLabel" class="input" value="البيت"><label class="label">اسم المستلم</label><input id="recipient" class="input"><label class="label">الموبايل</label><input id="addrPhone" class="input" inputmode="tel"><label class="label">المدينة</label><input id="city" class="input" value="الإسكندرية"><label class="label">المنطقة</label><input id="area" class="input"><label class="label">العنوان بالتفصيل</label><textarea id="addrLine" class="textarea" placeholder="الشارع، رقم العمارة، الدور، الشقة..."></textarea><label class="label">ملاحظات العنوان</label><input id="addrNotes" class="input"><button class="save" onclick="saveAddress()">حفظ العنوان واستخدامه ❤️</button></div><label class="label">طريقة الدفع</label><div class="pay"><button id="cash" class="active" onclick="payment('cash',this)">💵 كاش</button><button id="card" onclick="payment('card',this)">💳 Visa</button><button id="wallet" onclick="payment('wallet',this)">📱 محفظة</button></div><div id="walletHint" style="font-size:12px;color:#a00000;margin-top:5px;display:none">الحد الأدنى للدفع بالمحفظة 50 جنيه</div><div class="bonus"><div class="bonusLine"><div><strong>🎁 استخدم البونص</strong><div id="bonusText" class="bonusHint">متاح 0 نقطة</div></div><button id="bonusBtn" class="bonusBtn" onclick="toggleBonus()">استخدام البونص</button></div><div id="bonusDiscount" class="bonusHint"></div></div><label class="label">🎁 كود الخصم</label><div style="display:flex;gap:7px"><input id="promo" class="input" placeholder="اكتب الكود"><button class="save" style="width:auto;margin:0" onclick="promoMsg()">تطبيق</button></div><div id="promoMsg" style="font-size:12px;color:#777;margin-top:6px"></div><label class="label">❤️ بقشيش للكابتن</label><div class="tip"><button class="active" onclick="tip(0,this)">0</button><button onclick="tip(5,this)">5</button><button onclick="tip(10,this)">10</button><button onclick="tip(15,this)">15</button><button onclick="tip(20,this)">20</button></div><label class="label">📝 ملاحظات التوصيل</label><textarea id="notes" class="textarea" placeholder="اتصل قبل الوصول..."></textarea><div id="err" class="error"></div><button id="confirm" class="confirm" onclick="order()">تأكيد الطلب ❤️</button><div id="summary"></div></div></section><section id="success" class="box success"><div style="font-size:50px">🎉</div><h2>تم استلام طلبك بنجاح</h2><div id="successText"></div></section></main><div id="bar" class="bar" onclick="toggleCart()"><strong id="barCount">0 صنف</strong><span id="barTotal">0.00 ج.م</span><b>فتح السلة 🛒</b></div><nav class="nav"><div class="navin"><a class="active" href="menu.html">🏠<span>الرئيسية</span></a><a href="orders.html">📦<span>طلباتك</span></a><a href="account.html">⭐<span>حسابك</span></a></div></nav><script>const U='https://qxwvuxkbcghbkztjrzon.supabase.co',K='sb_publishable_JI9lC4YPTCQ8CwMxzvHNIA_C24ULpWH',API=U+'/functions/v1/';let cid=localStorage.getItem('alban_customer_id'),cname=localStorage.getItem('alban_customer_name')||'',cphone=localStorage.getItem('alban_customer_phone')||'',products=[],categories=[],branches=[],addresses=[],cart=JSON.parse(localStorage.getItem('alban_cart_v1')||'[]'),payMethod='cash',tipAmount=0,selectedAddress=null,bonusBalance=0,bonusValue=.005,useBonus=false;const $=id=>document.getElementById(id),num=n=>{const v=Number(n);return Number.isFinite(v)?v:0},money=n=>(Math.round(num(n)*100)/100).toFixed(2),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function fn(name,body){const r=await fetch(API+name,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let j={};try{j=await r.json()}catch{}if(!r.ok||j.error)throw Error(j.error||'حدث خطأ');return j}async function api(path,opt={}){const r=await fetch(U+'/rest/v1/'+path,{...opt,headers:{apikey:K,Authorization:'Bearer '+K,...(opt.headers||{})}});if(!r.ok)throw Error(await r.text());return r.json()}function saveCart(){localStorage.setItem('alban_cart_v1',JSON.stringify(cart))}async function init(){if(!cid){location.href='index.html';return}$('hello').textContent=cname?'أهلاً يا '+cname+' ❤️':'';await load()}async function load(){try{[categories,products,branches]=await Promise.all([api('categories?select=*&active=eq.true&order=sort_order.asc,id.asc'),api('products?select=*&active=eq.true&order=sort_order.asc,id.asc'),api('branches?select=id,name,latitude,longitude,opening_time,closing_time,manual_status,rush_active,rush_minutes,eta_min_minutes,eta_max_minutes&active=eq.true&order=id.asc')]);cart=cart.filter(x=>products.some(p=>Number(p.id)===Number(x.product_id)));saveCart();renderCats();renderProducts();renderBranches();await loadAccount();renderCart()}catch(e){$('products').innerHTML='<div class="box" style="padding:20px">تعذر تحميل المنيو حاليًا. '+esc(e.message)+'</div>'}}function renderCats(){$('cats').innerHTML='<button class="cat active" onclick="filterCat(null,this)">الكل</button>'+categories.map(c=>'<button class="cat" onclick="filterCat('+c.id+',this)">'+esc(c.name_ar||c.name)+'</button>').join('')}function filterCat(id,el){document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));el.classList.add('active');document.querySelectorAll('.product').forEach(x=>x.style.display=(!id||Number(x.dataset.cat)===Number(id))?'block':'none')}function renderProducts(){$('products').innerHTML=products.map(card).join('')}function card(p){let q=cart.find(x=>Number(x.product_id)===Number(p.id))?.quantity||0;return '<article class="card product" data-cat="'+p.category_id+'"><div onclick="openModal('+p.id+')"><div class="pic">'+(p.image_url?'<img src="'+esc(p.image_url)+'" onerror="this.parentElement.innerHTML=\'🥛\'">':'🥛')+'</div><div class="name">'+esc(p.name_ar||p.name)+'</div><div class="desc">'+esc(p.description_ar||p.description||'')+'</div></div><div class="bottom"><span class="price">'+money(p.price)+' ج.م</span><span>'+(q?'<span class="qty"><button onclick="change('+p.id+',-1)">−</button><b>'+q+'</b><button onclick="change('+p.id+',1)">+</button></span>':'<button class="add" onclick="change('+p.id+',1)">+</button>')+'</span></div></article>'}function change(id,d){let x=cart.find(x=>Number(x.product_id)===Number(id));if(x){x.quantity+=d;if(x.quantity<=0)cart=cart.filter(y=>Number(y.product_id)!==Number(id))}else if(d>0)cart.push({product_id:Number(id),quantity:1,note:''});saveCart();renderProducts();renderCart()}function openModal(id){let p=products.find(x=>Number(x.id)===Number(id));if(!p)return;const note=prompt((p.name_ar||p.name)+'\n\nملاحظة على الصنف (اختياري):',cart.find(x=>Number(x.product_id)===Number(id))?.note||'');if(note!==null){let x=cart.find(x=>Number(x.product_id)===Number(id));if(!x)cart.push({product_id:Number(id),quantity:1,note:note});else x.note=note;saveCart();renderCart()}}function renderBranches(){$('branch').innerHTML=branches.map(b=>'<option value="'+b.id+'">'+esc(b.name)+'</option>').join('');branchChanged()}function branchChanged(){const b=branches.find(x=>Number(x.id)===Number($('branch').value));if(!b)return;const o=b.opening_time?.slice(0,5)||'10:00',c=b.closing_time?.slice(0,5)||'01:00';$('branchMsg').textContent='مواعيد الفرع: '+o+' - '+c;$('status').textContent='📍 '+b.name;$('eta').textContent='🕐 '+(num(b.eta_min_minutes)||20)+' - '+(num(b.eta_max_minutes)||30)+' دقيقة'}async function loadAccount(){try{const j=await fn('customer-account',{action:'get',customer_id:cid});addresses=Array.isArray(j.addresses)?j.addresses:[];bonusBalance=Math.max(0,num(j.points?.balance??j.customer?.points??0));bonusValue=num(j.points?.point_value??.005);if(bonusValue<=0)bonusValue=.005;$('points').innerHTML='🎁 البونص: <strong>'+bonusBalance+' نقطة = '+money(bonusBalance*bonusValue)+' ج</strong>';$('bonusText').textContent='متاح '+bonusBalance+' نقطة = '+money(bonusBalance*bonusValue)+' جنيه';renderAddresses();if(addresses.length){selectedAddress=addresses.find(a=>a.is_default)||addresses[0];fillSelectedAddress()}}catch(e){console.log(e)}}function renderAddresses(){$('addresses').innerHTML=addresses.length?addresses.map(a=>'<div class="addr '+(selectedAddress&&Number(selectedAddress.id)===Number(a.id)?'active':'')+'" onclick="selectAddress('+a.id+')"><strong>'+esc(a.label||'عنوان')+'</strong><div>'+esc(a.address_line||a.address||'')+'</div><small>'+esc(a.area||'')+' '+esc(a.city||'')+'</small></div>').join(''):'<div style="color:#777;font-size:13px">لا يوجد عنوان محفوظ، أضف عنوانك ❤️</div>'}function selectAddress(id){selectedAddress=addresses.find(a=>Number(a.id)===Number(id));fillSelectedAddress();renderAddresses()}function fillSelectedAddress(){if(!selectedAddress)return;$('addrLabel').value=selectedAddress.label||'البيت';$('recipient').value=selectedAddress.recipient_name||cname;$('addrPhone').value=selectedAddress.phone||cphone;$('city').value=selectedAddress.city||'الإسكندرية';$('area').value=selectedAddress.area||'';$('addrLine').value=selectedAddress.address_line||selectedAddress.address||'';$('addrNotes').value=selectedAddress.notes||''}function toggleAddress(){$('newaddr').classList.toggle('show')}async function saveAddress(){try{const j=await fn('customer-account',{action:'save_address',customer_id:cid,address:{label:$('addrLabel').value.trim()||'البيت',recipient_name:$('recipient').value.trim()||cname,phone:$('addrPhone').value.trim()||cphone,city:$('city').value.trim()||'الإسكندرية',area:$('area').value.trim(),address_line:$('addrLine').value.trim(),notes:$('addrNotes').value.trim(),is_default:true}});addresses=j.addresses||addresses;selectedAddress=addresses.find(a=>a.is_default)||addresses[addresses.length-1];renderAddresses();$('newaddr').classList.remove('show');fillSelectedAddress();renderCart()}catch(e){showErr(e.message)}}function payment(v,el){payMethod=v;document.querySelectorAll('.pay button').forEach(x=>x.classList.remove('active'));el.classList.add('active');$('walletHint').style.display=v==='wallet'?'block':'none'}function toggleBonus(){if(!bonusBalance){useBonus=false;$('bonusBtn').classList.remove('active');$('bonusBtn').textContent='استخدام البونص';$('bonusDiscount').textContent='لا يوجد رصيد بونص متاح حاليًا';renderCart();return}useBonus=!useBonus;$('bonusBtn').classList.toggle('active',useBonus);$('bonusBtn').textContent=useBonus?'تم استخدام البونص ✓':'استخدام البونص';renderCart()}function promoMsg(){const v=$('promo').value.trim();$('promoMsg').textContent=v?'سيتم التحقق من الكود عند تأكيد الطلب':'اكتب كود الخصم أولًا';renderCart()}function tip(v,el){tipAmount=num(v);document.querySelectorAll('.tip button').forEach(x=>x.classList.remove('active'));el.classList.add('active');renderCart()}function totals(){let subtotal=0;cart.forEach(x=>{const p=products.find(p=>Number(p.id)===Number(x.product_id));if(p)subtotal+=num(p.price)*Math.max(0,num(x.quantity))});subtotal=num(subtotal);const availablePoints=Math.max(0,num(bonusBalance));const pointsToUse=useBonus?availablePoints:0;const rawBonus=pointsToUse*num(bonusValue);const bonusDiscount=Math.min(Math.max(0,rawBonus),subtotal);const service=Math.round(subtotal*.02*100)/100;const delivery=subtotal>=500?0:25;const tipValue=Math.max(0,num(tipAmount));const total=Math.max(0,subtotal-bonusDiscount)+service+delivery+tipValue;return{subtotal,bonusPoints:pointsToUse,bonusDiscount,service,delivery,tip:tipValue,total}}function renderCart(){const t=totals();$('items').innerHTML=cart.length?cart.map(x=>{const p=products.find(p=>Number(p.id)===Number(x.product_id));return '<div class="cartrow"><div><strong>'+esc(p?.name_ar||p?.name||'صنف')+'</strong><div style="font-size:12px;color:#777">'+money(p?.price||0)+' ج × '+num(x.quantity)+'</div></div><div class="cartqty"><button onclick="change('+x.product_id+',-1)">−</button><b>'+num(x.quantity)+'</b><button onclick="change('+x.product_id+',1)">+</button></div></div>'}).join(''):'<div style="padding:12px;color:#777">السلة فارغة</div>';const encouragement=t.subtotal<500?'🚚 زوّد '+money(500-t.subtotal)+' جنيه واحصل على توصيل مجاني 🎉':'🎉 مبروك! حصلت على توصيل مجاني';$('summary').innerHTML='<div class="sum"><div><span>الإجمالي الفرعي</span><b>'+money(t.subtotal)+' ج.م</b></div>'+(t.bonusDiscount>0?'<div class="discount"><span>🎁 خصم البونص</span><b>- '+money(t.bonusDiscount)+' ج.م</b></div>':'')+'<div><span>رسوم خدمة الطلب</span><b>'+money(t.service)+' ج.م</b></div><div><span>التوصيل</span><b>'+money(t.delivery)+' ج.م</b></div>'+(t.tip>0?'<div><span>بقشيش</span><b>'+money(t.tip)+' ج.م</b></div>':'')+'<div class="free" style="margin-top:10px">'+encouragement+'</div><div class="total"><span>الإجمالي النهائي</span><b>'+money(t.total)+' ج.م</b></div></div>';$('barCount').textContent=cart.reduce((s,x)=>s+num(x.quantity),0)+' صنف';$('barTotal').textContent=money(t.total)+' ج.م';$('bar').classList.toggle('show',cart.length>0);$('bonusDiscount').textContent=useBonus&&t.bonusDiscount>0?'سيتم خصم '+money(t.bonusDiscount)+' جنيه من قيمة الطلب ❤️':useBonus?'لا يمكن خصم أكثر من قيمة المنتجات':' '}function toggleCart(){$('cart').classList.toggle('show');$('cart').scrollIntoView({behavior:'smooth'})}async function order(){const t=totals();if(!cart.length)return showErr('السلة فارغة');if(!selectedAddress)return showErr('اختار أو أضف عنوان التوصيل');if(payMethod==='wallet'&&t.subtotal<50)return showErr('الحد الأدنى للطلب عند الدفع بالمحفظة هو 50 جنيه');const btn=$('confirm');btn.disabled=true;btn.textContent='جاري تأكيد الطلب...';try{const j=await fn('create-order',{customer_id:cid,customer_address:selectedAddress.address_line||selectedAddress.address,branch_id:Number($('branch').value),payment_method:payMethod,tip_amount:t.tip,notes:$('notes').value.trim(),delivery_notes:$('notes').value.trim(),promo_code:$('promo').value.trim(),points_used:t.bonusPoints,items:cart.map(x=>({product_id:x.product_id,quantity:x.quantity,notes:x.note||''}))});localStorage.removeItem('alban_cart_v1');cart=[];useBonus=false;$('cart').classList.remove('show');$('bar').classList.remove('show');$('success').style.display='block';$('successText').innerHTML='رقم الطلب: <strong>#'+j.order.id+'</strong><br>خصم البونص: <strong>'+money(j.points_discount||0)+' ج.م</strong><br>الإجمالي النهائي: <strong>'+money(j.order.total)+' ج.م</strong><br>🎁 رصيد البونص المتبقي: <strong>'+num(j.points_balance||0)+' نقطة</strong>';window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}catch(e){showErr(e.message)}finally{btn.disabled=false;btn.textContent='تأكيد الطلب ❤️'}}function showErr(m){$('err').textContent=m;$('err').style.display='block';setTimeout(()=>$('err').style.display='none',5000)}window.addEventListener('load',init);</script></body></html>
