<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>منيو ألبان فلاحي</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f8f5ef;color:#222}.container{max-width:700px;margin:auto;padding:18px}.header,.cart-box,.order-success{background:#fff;border-radius:22px;padding:18px;box-shadow:0 5px 20px rgba(0,0,0,.08)}.header{margin-bottom:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.logo{font-size:25px;font-weight:bold}.customer{font-size:13px;color:#666;margin-top:5px}.customer-phone{display:none}.phone-points{display:flex;align-items:center;justify-content:flex-start;gap:7px;flex-wrap:wrap;margin-top:3px;direction:ltr}.points-mini{display:flex;gap:7px;flex-wrap:wrap;direction:ltr}.points-badge{display:inline-block;background:#fff7dd;border:1px solid #f0dfaa;color:#6d5200;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800}.brand-rating{display:inline-flex;align-items:center;gap:4px;margin-top:6px;border:1px solid #f0dfaa;background:#fff7dd;color:#6d5200;border-radius:999px;padding:5px 9px;cursor:pointer;font-size:11px;font-weight:800}.header-actions{display:flex;gap:7px;align-items:center}.account-btn,.logout{border:0;padding:9px 12px;border-radius:10px;cursor:pointer;font-weight:bold}.account-btn{background:#222;color:#fff}.logout{background:#eee;color:#222}.header-info{display:flex;align-items:center;gap:7px;flex-wrap:nowrap;margin-top:9px;white-space:nowrap}.eta-box,.delivery-box{display:flex;align-items:center;gap:7px;background:#f3f3f3;border-radius:12px;padding:9px 11px;font-size:13px;color:#444;flex-shrink:0}.eta-box strong,.delivery-box strong{color:#222}.rating-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;padding:18px;align-items:center;justify-content:center}.rating-modal.show{display:flex}.rating-modal-box{background:#fff;width:min(560px,100%);max-height:80vh;overflow:auto;border-radius:22px;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.25)}.rating-modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.rating-close{border:0;background:#eee;border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:bold}.rating-summary{text-align:center;padding:12px 0}.rating-average{font-size:30px;font-weight:900}.rating-stars{color:#f5b400;letter-spacing:2px;font-size:20px}.rating-count{font-size:12px;color:#777;margin-top:4px}.review-list{margin-top:8px}.public-review{border-top:1px solid #eee;padding:11px 0}.public-review:first-child{border-top:0}.review-name{font-weight:800}.review-date{font-size:11px;color:#999}.review-comment{margin-top:5px;line-height:1.6;font-size:14px}.section-title{font-size:22px;font-weight:bold;margin:20px 0 12px}.categories{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}.category{border:1px solid #ddd;background:#fff;padding:10px 15px;border-radius:20px;white-space:nowrap;cursor:pointer}.category.active{background:#222;color:#fff}.products{display:grid;grid-template-columns:1fr 1fr;gap:12px}.product{background:#fff;border-radius:18px;padding:12px;box-shadow:0 4px 15px rgba(0,0,0,.06)}.product-image{width:100%;height:140px;object-fit:cover;border-radius:14px;background:#eee}.product-name{font-weight:bold;margin-top:10px;font-size:16px}.product-description{font-size:12px;color:#777;margin-top:5px;min-height:30px}.product-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:10px}.price{font-weight:bold}.add{border:0;background:#222;color:#fff;width:38px;height:38px;border-radius:12px;font-size:22px;cursor:pointer}.cart-box{margin-top:22px}.cart-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #eee}.qty{display:flex;align-items:center;gap:8px}.qty button{border:0;background:#eee;width:30px;height:30px;border-radius:9px;cursor:pointer}.summary-row{display:flex;justify-content:space-between;margin-top:10px}.total{font-size:21px;font-weight:bold;margin-top:15px}.delivery-message{background:#f3f3f3;padding:12px;border-radius:12px;margin-top:12px;font-size:14px}.empty{text-align:center;color:#777;padding:30px}.checkout{margin-top:20px;padding-top:20px;border-top:1px solid #eee}.form-group{margin-top:14px}.form-label{display:block;font-weight:bold;margin-bottom:7px;font-size:14px}.input,.select,.textarea{width:100%;border:1px solid #ddd;border-radius:12px;padding:13px;font-size:15px;background:#fff;outline:none}.textarea{min-height:90px;resize:vertical}.payment-options,.tip-options{display:grid;gap:8px}.payment-options{grid-template-columns:1fr 1fr 1fr}.tip-options{grid-template-columns:repeat(5,1fr);gap:7px}.payment-option,.tip-option{border:1px solid #ddd;border-radius:12px;padding:12px 7px;text-align:center;cursor:pointer;background:#fff;font-size:14px}.tip-option{border-radius:10px;padding:10px 4px;font-size:13px}.payment-option.active,.tip-option.active{background:#222;color:#fff;border-color:#222}.promo-row{display:flex;gap:8px}.promo-row .input{flex:1}.promo-btn{border:0;background:#222;color:#fff;border-radius:12px;padding:0 15px;cursor:pointer;white-space:nowrap}.promo-message{font-size:13px;margin-top:7px}.confirm-btn{width:100%;border:0;background:#222;color:#fff;padding:16px;border-radius:14px;font-size:18px;font-weight:bold;margin-top:20px;cursor:pointer}.confirm-btn:disabled{opacity:.6;cursor:not-allowed}.order-success{display:none;margin-top:20px;text-align:center}.success-icon{font-size:55px}.order-number{font-size:22px;font-weight:bold;margin-top:10px}.error-box{background:#fff0f0;color:#b00020;padding:12px;border-radius:12px;margin-top:12px;display:none;font-size:14px}@media(max-width:500px){.product-image{height:120px}.points-badge{font-size:11px;padding:6px 8px}.header{align-items:flex-start}.logo{font-size:22px}.account-btn,.logout{padding:8px 9px;font-size:11px}.brand-rating{font-size:10px;padding:5px 8px}.header-info{gap:6px}.eta-box,.delivery-box{font-size:12px;padding:8px 10px}}</style></head><body><div class="container"><div class="header"><div><div class="logo">🥛 ألبان فلاحي</div><button class="brand-rating" onclick="openRatings()">⭐ <span id="miniRating">—/5 (0)</span></button><div id="customerName" class="customer"></div><div class="phone-points"><div id="customerPhone" class="customer-phone"></div><div id="customerPoints" class="points-mini" style="display:none"></div></div><div class="header-info"><div id="etaBox" class="eta-box"><span>🕐</span><strong>35 - 50 دقيقة</strong></div><div id="deliveryBox" class="delivery-box"><span>🚚</span><strong>25 ج.م</strong></div></div><div style="height:10px"></div></div><div class="header-actions"><button class="account-btn" onclick="openAccount()">⭐ حسابي</button><button class="logout" onclick="logout()">خروج</button></div></div><div id="ratingModal" class="rating-modal" onclick="if(event.target===this)closeRatings()"><div class="rating-modal-box"><div class="rating-modal-head"><strong>⭐ تقييم عملائنا لأكل ألبان فلاحي</strong><button class="rating-close" onclick="closeRatings()">إغلاق</button></div><div class="rating-summary"><div id="ratingAverage" class="rating-average">— / 5</div><div id="ratingStars" class="rating-stars">☆☆☆☆☆</div><div id="ratingCount" class="rating-count">جاري تحميل التقييمات...</div></div><div id="reviewList" class="review-list"></div></div></div><div class="section-title">الأصناف</div><div id="categories" class="categories"></div><div id="products" class="products"><div class="empty">جاري تحميل الأصناف...</div></div><div class="cart-box"><div class="section-title" style="margin-top:0">🛒 السلة</div><div id="cart"></div><div id="summary"></div><div id="checkout" class="checkout" style="display:none"><div class="section-title" style="margin-top:0">📦 بيانات التوصيل</div><div class="form-group"><label class="form-label">الفرع</label><select id="branch" class="select"><option value="">جاري تحميل الفروع...</option></select></div><div class="form-group"><label class="form-label">العنوان بالتفصيل</label><textarea id="address" class="textarea" placeholder="اكتب العنوان بالتفصيل: المنطقة، الشارع، رقم العقار، الدور، الشقة..."></textarea></div><div class="form-group"><label class="form-label">طريقة الدفع</label><div class="payment-options"><div class="payment-option active" onclick="selectPayment('cash',this)">💵 كاش</div><div class="payment-option" onclick="selectPayment('card',this)">💳 Visa</div><div class="payment-option" onclick="selectPayment('wallet',this)">📱 محفظة</div></div></div><div class="form-group"><label class="form-label">🎁 كود الخصم</label><div class="promo-row"><input id="promoCode" class="input" placeholder="اكتب كود الخصم"><button class="promo-btn" onclick="checkPromo()">تطبيق</button></div><div id="promoMessage" class="promo-message"></div></div><div class="form-group"><label class="form-label">❤️ بقشيش للكابتن</label><div class="tip-options"><div class="tip-option active" onclick="selectTip(0,this)">0 ج</div><div class="tip-option" onclick="selectTip(5,this)">5 ج</div><div class="tip-option" onclick="selectTip(10,this)">10 ج</div><div class="tip-option" onclick="selectTip(15,this)">15 ج</div><div class="tip-option" onclick="selectTip(20,this)">20 ج</div></div></div><div class="form-group"><label class="form-label">📝 ملاحظات التوصيل</label><textarea id="deliveryNotes" class="textarea" placeholder="مثال: اتصل قبل الوصول، سيب الطلب عند البواب، متخبطش على الباب،..."></textarea></div><div id="orderError" class="error-box"></div><button id="confirmBtn" class="confirm-btn" onclick="submitOrder()">تأكيد الطلب ❤️</button></div></div><div id="orderSuccess" class="order-success"><div class="success-icon">✅</div><div style="font-size:20px;font-weight:bold">تم استلام طلبك بنجاح</div><div class="order-number">رقم الطلب: <span id="orderNumber"></span></div><div style="color:#777;margin-top:10px">شكرًا لاختيارك ألبان فلاحي ❤️</div><button class="confirm-btn" onclick="location.reload()">العودة للمنيو</button></div></div><script>const SUPABASE_URL="https://qxwvuxkbcghbkztjrzon.supabase.co",SUPABASE_KEY="sb_publishable_JI9lC4YPTCQ8CwMxzvHNIA_C24ULpWH",CREATE_ORDER_URL=SUPABASE_URL+"/functions/v1/create-order",REVIEWS_URL=SUPABASE_URL+"/functions/v1/reviews-api",ACCOUNT_URL=SUPABASE_URL+"/functions/v1/customer-account",supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let categories=[],products=[],branches=[],cart=[],selectedCategory=null,selectedPayment="cash",selectedTip=0,appliedPromo="";const customerId=localStorage.getItem("alban_customer_id"),customerName=localStorage.getItem("alban_customer_name"),customerPhone=localStorage.getItem("alban_customer_phone");if(!customerId)location.href="index.html";document.getElementById("customerName").innerText=customerName?`أهلاً ${customerName} 👋`:"";document.getElementById("customerPhone").innerText="";function openAccount(){location.href="account.html"}function logout(){["alban_customer_id","alban_customer_name","alban_customer_phone"].forEach(k=>localStorage.removeItem(k));location.href="index.html"}function openRatings(){document.getElementById("ratingModal").classList.add("show");loadRatings()}function closeRatings(){document.getElementById("ratingModal").classList.remove("show")}function esc(t){return String(t||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;").replace(/'/g,"&#039;")}function stars(n){n=Math.max(0,Math.min(5,Number(n||0)));return '★'.repeat(n)+'☆'.repeat(5-n)}async function loadCustomerPoints(){try{const r=await fetch(ACCOUNT_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({customer_id:customerId,ts:Date.now()})}),d=await r.json();if(!r.ok||!d.success)throw Error();const p=d.points||{},points=Number(p.total_points||0).toLocaleString('ar-EG'),value=Number(p.value_egp||0).toFixed(2),el=document.getElementById("customerPoints");el.style.display="flex";el.innerHTML=`<span class="points-badge">⭐ ${points} نقطة</span><span class="points-badge">💰 معاك ${value} ج</span>`}catch(e){}}async function loadRatings(){try{const r=await fetch(REVIEWS_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"summary"})}),d=await r.json();if(!r.ok||!d.success)throw Error();const avg=Number(d.summary.food_average||0),count=Number(d.summary.food_count||0);document.getElementById("miniRating").textContent=avg.toFixed(1)+"/5 ("+count+")";document.getElementById("ratingAverage").textContent=avg.toFixed(1)+" / 5";document.getElementById("ratingStars").textContent=stars(Math.round(avg));document.getElementById("ratingCount").textContent=count+" تقييم للأكل";const box=document.getElementById("reviewList");box.innerHTML=(d.comments||[]).map(x=>`<div class="public-review"><div><span class="review-name">${esc(x.customer_name||"عميل")}</span> <span class="review-date">• ${new Date(x.created_at).toLocaleDateString('ar-EG')}</span></div><div class="rating-stars">${stars(x.food_rating)}</div><div class="review-comment">${esc(x.food_comment)}</div></div>`).join("");if(!box.innerHTML)box.innerHTML='<div class="muted">لسه مفيش تعليقات — مستنيين رأيك ❤️</div>'}catch(e){document.getElementById("miniRating").textContent="—/5 (0)";document.getElementById("ratingCount").textContent="تعذر تحميل التقييمات"}}async function loadData(){await loadCategories();await loadBranches();await loadProducts();await loadCustomerPoints();loadRatings()}async function loadCategories(){const{data,error}=await supabaseClient.from("categories").select("*").eq("active",true).order("sort_order",{ascending:true});if(error)throw error;categories=data||[];selectedCategory=categories[0]?.id||null;renderCategories()}function renderCategories(){const el=document.getElementById("categories");el.innerHTML=categories.map(c=>`<button class="category ${c.id===selectedCategory?'active':''}" onclick="selectCategory(${c.id})">${esc(c.name_ar||c.name||c.name_en||'')}</button>`).join("")}function selectCategory(id){selectedCategory=id;renderCategories();renderProducts()}async function loadProducts(){const{data,error}=await supabaseClient.from("products").select("*").eq("active",true).order("sort_order",{ascending:true});if(error)throw error;products=data||[];renderProducts()}function renderProducts(){const list=products.filter(p=>p.category_id===selectedCategory);const el=document.getElementById("products");el.innerHTML=list.length?list.map(p=>`<div class="product">${p.image_url?`<img class="product-image" src="${esc(p.image_url)}" alt="${esc(p.name_ar||p.name||'')}">`:''}<div class="product-name">${esc(p.name_ar||p.name||p.name_en||'')}</div><div class="product-description">${esc(p.description_ar||p.description||p.description_en||'')}</div><div class="product-bottom"><div class="price">${Number(p.price||0).toLocaleString('ar-EG')} ج.م</div><button class="add" onclick="addToCart(${p.id})">+</button></div></div>`).join(""):'<div class="empty">لا توجد أصناف في هذا القسم حاليًا</div>'}function addToCart(id){const p=products.find(x=>x.id===id);if(!p)return;const item=cart.find(x=>x.product_id===id);if(item)item.quantity++;else cart.push({product_id:p.id,name:p.name_ar||p.name||p.name_en||'',unit_price:Number(p.price||0),quantity:1});renderCart()}function changeQty(id,delta){const item=cart.find(x=>x.product_id===id);if(!item)return;item.quantity+=delta;if(item.quantity<=0)cart=cart.filter(x=>x.product_id!==id);renderCart()}function calcSubtotal(){return cart.reduce((s,x)=>s+x.unit_price*x.quantity,0)}function renderCart(){const el=document.getElementById("cart"),summary=document.getElementById("summary"),checkout=document.getElementById("checkout");if(!cart.length){el.innerHTML='<div class="empty">السلة فاضية</div>';summary.innerHTML="";checkout.style.display="none";return}el.innerHTML=cart.map(x=>`<div class="cart-item"><div><strong>${esc(x.name)}</strong><div>${x.unit_price.toLocaleString('ar-EG')} ج × ${x.quantity}</div></div><div class="qty"><button onclick="changeQty(${x.product_id},-1)">−</button><strong>${x.quantity}</strong><button onclick="changeQty(${x.product_id},1)">+</button></div></div>`).join("");const subtotal=calcSubtotal(),delivery=subtotal>=500?0:25,service=subtotal*.02,total=subtotal+delivery+service;let msg=subtotal>=500?'🎉 مبروك! حصلت على توصيل مجاني':subtotal>=450?'🚚 فاضلك 50 جنيه وتوصيلك مجانًا 🎉':`🚚 زوّد ${Math.max(0,500-subtotal).toLocaleString('ar-EG')} جنيه واحصل على توصيل مجاني 🎉`;summary.innerHTML=`<div class="summary-row"><span>الإجمالي قبل الرسوم</span><strong>${subtotal.toLocaleString('ar-EG')} ج.م</strong></div><div class="summary-row"><span>رسوم خدمة الطلب</span><strong>${service.toFixed(2)} ج.م</strong></div><div class="summary-row"><span>التوصيل</span><strong>${delivery===0?'مجاني':delivery.toLocaleString('ar-EG')+' ج.م'}</strong></div><div class="delivery-message">${msg}</div><div class="summary-row total"><span>الإجمالي</span><strong>${total.toFixed(2)} ج.م</strong></div>`;checkout.style.display="block"}async function loadBranches(){const{data,error}=await supabaseClient.from("branches").select("*").eq("active",true).order("id");if(error)throw error;branches=data||[];document.getElementById("branch").innerHTML='<option value="">اختر الفرع</option>'+branches.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join("")}function selectPayment(v,el){selectedPayment=v;document.querySelectorAll('.payment-option').forEach(x=>x.classList.remove('active'));el.classList.add('active')}function selectTip(v,el){selectedTip=v;document.querySelectorAll('.tip-option').forEach(x=>x.classList.remove('active'));el.classList.add('active')}async function checkPromo(){const code=document.getElementById('promoCode').value.trim();const m=document.getElementById('promoMessage');if(!code){appliedPromo="";m.textContent="اكتب كود الخصم أولاً";return}appliedPromo=code;m.textContent="تم إدخال الكود وسيتم التحقق عند تأكيد الطلب"}async function submitOrder(){const btn=document.getElementById('confirmBtn'),err=document.getElementById('orderError');err.style.display='none';const branchId=Number(document.getElementById('branch').value),address=document.getElementById('address').value.trim(),deliveryNotes=document.getElementById('deliveryNotes').value.trim();if(!branchId)return showError('اختار الفرع');if(!address)return showError('اكتب العنوان بالتفصيل');if(!cart.length)return showError('السلة فاضية');btn.disabled=true;try{const r=await fetch(CREATE_ORDER_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customer_id:customerId,branch_id:branchId,customer_name:customerName,customer_phone:customerPhone,customer_address:address,payment_method:selectedPayment,tip_amount:selectedTip,delivery_notes:deliveryNotes,promo_code:appliedPromo,items:cart.map(x=>({product_id:x.product_id,quantity:x.quantity}))})}),d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'تعذر إرسال الطلب');document.getElementById('orderNumber').textContent=d.order?.id||'';document.querySelector('.container>.header').style.display='none';document.querySelector('.container>.section-title').style.display='none';document.getElementById('categories').style.display='none';document.getElementById('products').style.display='none';document.querySelector('.cart-box').style.display='none';document.getElementById('orderSuccess').style.display='block'}catch(e){showError(e.message||'حدث خطأ أثناء إرسال الطلب');btn.disabled=false}}function showError(t){const e=document.getElementById('orderError');e.textContent=t;e.style.display='block'}loadData().catch(e=>console.error(e));</script></body></html>
