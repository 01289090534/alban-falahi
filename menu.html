d:#fff;border-top:1px solid #ddd;display:flex;justify-content:center}.navin{width:100%;max-width:720px;display:grid;grid-template-columns:repeat(3,1fr)}.nav a{text-decoration:none;color:#777;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;gap:3px}.nav a.active{color:#222}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:50;padding:15px;align-items:center;justify-content:center}.modal.show{display:flex}.modalbox{background:#fff;border-radius:20px;padding:16px;width:min(560px,100%);max-height:90vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:#eee;border-radius:10px;padding:8px 12px}@media(max-width:480px){.pic{height:115px}.logo{font-size:22px}.tip button{font-size:12px;padding:9px 3px}}</style></head><body><main class="wrap"><header class="box header"><div class="logo">🥛 ألبان فلاحي <span id="rating">⭐ —/5</span></div><div id="hello" class="hello"></div><div id="points" class="points">⭐ نقاطك: <strong>0 نقطة = 0.00 ج</strong></div><div class="info"><span id="eta">🕐 20 - 30 دقيقة</span><span>🚚 25 ج.م</span><span id="status">📍 جاري تحديد الفرع</span></div><div class="free">🎁 توصيل مجانًا عند 500 ج أو أكثر ❤️</div></header><section><div class="title">الفئات</div><div id="cats" class="cats"></div></section><section><div class="title">الأصناف</div><div id="products" class="products"></div></section><section id="cart" class="box cart"><div class="title" style="margin-top:0">🛒 السلة</div><div id="items"></div><div id="summary"></div><div class="form"><label class="label">الفرع</label><select id="branch" class="select" onchange="branchChanged()"></select><div id="branchMsg" style="font-size:12px;color:#777;margin-top:6px"></div><label class="label">📍 عنوان التوصيل</label><div id="addresses"></div><button class="save" onclick="toggleAddress()">＋ إضافة عنوان جديد</button><div id="newaddr" class="newaddr"><label class="label">اسم العنوان</label><in dex.html';return}$('hello').textContent=cname?'أهلاً يا '+cname+' ❤️':'';load()}async function load(){try{[categories,products,branches]=await Promise.all([api('categories?select=*&active=eq.true&order=sort_order.asc,id.asc'),api('products?select=*&active=eq.true&order=sort_order.asc,id.asc'),api('branches?select=id,name,latitude,longitude,opening_time,closing_time,manual_status,rush_active,rush_minutes,eta_min_minutes,eta_max_minutes&active=eq.true&order=id.asc')]);cart=cart.filter(x=>products.some(p=>Number(p.id)===Number(x.product_id)));saveCart();renderCats();renderProducts();renderBranches();await loadAccount();renderCart()}catch(e){$('products').innerHTML='<div class="box" style="padding:20px">تعذر تحميل المنيو حاليًا. '+esc(e.message)+'</div>'}}function renderCats(){ $('cats').innerHTML='<button class="cat active" onclick="filterCat(null,this)">الكل</button>'+categories.map(c=>'<button class="cat" onclick="filterCat('+c.id+',this)">'+esc(c.name_ar||c.name)+'</button>').join('')}function filterCat(id,el){document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));el.classList.add('active');document.querySelectorAll('.product').forEach(x=>x.style.display=(!id||Number(x.dataset.cat)===Number(id))?'block':'none')}function renderProducts(){ $('products').innerHTML=products.map(p=>card(p)).join('')}function card(p){let q=cart.find(x=>Number(x.product_id)===Number(p.id))?.quantity||0;return '<article class="card product" data-cat="'+p.category_id+'" onclick="openModal('+p.id+')"><div class="pic">'+(p.image_url?'<img src="'+esc(p.image_url)+'" onerror="this.parentElement.innerHTML=\'🥛\'">':'🥛')+'</div><div class="name">'+esc(p.name_ar||p.name)+'</div><div class="desc">'+esc(p.description_ar||p.description||'')+'</div><div class="bottom"><span class="price">'+money(p.price)+' ج.م</span><span onclick="event.stopPropagation()">'+(q?'<span class="qty"><button onclick="change('+p.id+',-1)">−</button><b>'+q+'</b><button onclick="change('+p.id+',1)">+</button></span>':'<button class="add" onclick="change('+p.id+',1)">+</button>')+'</span></div></article>'}function change(id,d){let x=cart.find(x=>Number(x.product_id)===Number(id));if(x){x.quantity+=d;if(x.quantity<=0)cart=cart.filter(y=>Number(y.product_id)!==Number(id))}else if(d>0)cart.push({product_id:Number(id),quantity:1,note:''});saveCart();renderProducts();renderCart()}function openModal(id){modalProduct=products.find(p=>Number(p.id)===Number(id));if(!modalProduct)return;let x=cart.find(x=>Number(x.product_id)===Number(id));mqty=x?.quantity||1;$('mname').textContent=modalProduct.name_ar||modalProduct.name;$('mdesc').textContent=modalProduct.description_ar||modalProduct.description||'';$('mimg').style.display=modalProduct.image_url?'block':'none';$('mimg').src=modalProduct.image_url||'';$('mqty').textContent=mqty;$('mnote').value=x?.note||'';$('modal').classList.add('show')}function closeModal(){$('modal').classList.remove('show');modalProduct=null}function modalQty(d){mqty=Math.max(1,Math.min(50,mqty+d));$('mqty').textContent=mqty}function addModal(){if(!modalProduct)return;let x=cart.find(x=>Number(x.product_id)===Number(modalProduct.id));if(x){x.quantity=mqty;x.note=$('mnote').value.trim()}else cart.push({product_id:Number(modalProduct.id),quantity:mqty,note:$('mnote').value.trim()});saveCart();closeModal();renderProducts();renderCart()}function renderBranches(){ $('branch').innerHTML='<option value="">اختر الفرع</option>'+branches.map(b=>'<option value="'+b.id+'">'+esc(b.name)+'</option>').join('');if(branches[0]){$('branch').value=branches[0].id;branchChanged()}}function branchState(b){if(b.manual_status==='closed')return{open:false,rush:false};if(b.manual_status==='open')return{open:true,rush:!!b.rush_active};let n=new Date(),v=n.getHours()*60+n.getMinutes(),o=b.opening_time?.slice(0,5).split(':').map(Number),c=b.closing_time?.slice(0,5).split(':').map(Number);if(!o||!c)return{open:true,rush:!!b.rush_active};let om=o[0]*60+o[1],cm=c[0]*60+c[1],open=om<cm?v>=om&&v<cm:v>=om||v<cm;return{open,rush:open&&!!b.rush_active}}function branchChanged(){let b=branches.find(x=>Number(x.id)===Number($('branch').value));if(!b)return;$('branchMsg').textContent=branchState(b).open?(branchState(b).rush?'🟡 مفتوح — زحمة، الوقت يزيد '+(b.rush_minutes||30)+' دقيقة':'🟢 الفرع مفتوح'):'🔴 الفرع مغلق — يمكنك الطلب وسيبدأ التوصيل مع الفتح';let s=branchState(b),extra=s.rush?Number(b.rush_minutes||30):0;$('status').textContent=s.open?(s.rush?'🟡 مفتوح — زحمة':'🟢 مفتوح'):'🔴 مغلق';$('status').className=s.open?(s.rush?'rush':'open'):'closed';$('eta').textContent=s.open?'🕐 '+(Number(b.eta_min_minutes||20)+extra)+' - '+(Number(b.eta_max_minutes||30)+extra)+' دقيقة':'📅 التوصيل يبدأ '+String(b.opening_time||'10:00').slice(0,5)}function loadAccount(){return fetch(API+'customer-account',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customer_id:cid,action:'get'})}).then(r=>r.json()).then(d=>{if(!d.success)return;addresses=d.addresses||[];selectedAddress=(addresses.find(a=>a.is_default)||addresses[0])?.id||null;let pts=Number(d.points?.total_points||0),val=Number(d.points?.value_egp||pts*.005);$('points').innerHTML='⭐ نقاطك: <strong>'+pts+' نقطة = '+val.toFixed(2)+' ج</strong>';renderAddresses()}).catch(()=>{})}function renderAddresses(){$('addresses').innerHTML=addresses.length?addresses.map(a=>'<div class="addr '+(Number(a.id)===Number(selectedAddress)?'active':'')+'" onclick="selectAddress('+a.id+')"><b>📍 '+esc(a.label||'العنوان')+'</b><div style="font-size:13px;color:#666;margin-top:4px">'+esc([a.address_line,a.area,a.city,a.country].filter(Boolean).join(' — '))+'</div></div>').join(''):'<div style="font-size:13px;color:#777;padding:8px">لا توجد عناوين محفوظة</div>'}function selectAddress(id){selectedAddress=id;renderAddresses()}function toggleAddress(){$('newaddr').classList.toggle('show');if($('newaddr').classList.contains('show'))selectedAddress=null}async function saveAddress(){let line=$('addrLine').value.trim();if(!line){showErr('اكتب العنوان بالتفصيل');return}let address={label:$('addrLabel').value.trim()||'البيت',recipient_name:$('recipient').value.trim()||cname,phone:$('addrPhone').value.trim()||cphone,address_line:line,area:$('area').value.trim()||null,city:$('city').value.trim()||'الإسكندرية',country:'Egypt',notes:$('addrNotes').value.trim()||null,is_default:addresses.length===0};try{let r=await fetch(API+'customer-account',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customer_id:cid,action:'save_address',address})}),d=await r.json();if(!d.success)throw Error(d.error||'تعذر حفظ العنوان');addresses.push(d.address);selectedAddress=d.address.id;$('newaddr').classList.remove('show');renderAddresses();hideErr()}catch(e){showErr(e.message)}}function renderCart(){let count=cart.reduce((s,x)=>s+x.quantity,0),sub=cart.reduce((s,x)=>{let p=products.find(p=>Number(p.id)===Number(x.product_id));return s+(p?Number(p.price)*x.quantity:0)},0);$('bar').classList.toggle('show',count>0);$('barCount').textContent=count+' صنف';$('barTotal').textContent=money(sub)+' ج.م';if(!cart.length){$('cart').classList.remove('show');return}$('items').innerHTML=cart.map(x=>{let p=products.find(p=>Number(p.id)===Number(x.product_id));return p?'<div class="cartrow"><span>'+esc(p.name_ar||p.name)+'</span><span>'+money(Number(p.price)*x.quantity)+' ج.م <span class="cartqty"><button onclick="change('+p.id+',-1)">−</button>'+x.quantity+'<button onclick="change('+p.id+',1)">+</button></span></span></div>':''}).join('');let delivery=sub>=500?0:25,service=sub*.02,total=sub+delivery+service+tipAmount;$('summary').innerHTML='<div class="sum"><div><span>إجمالي الأصناف</span><b>'+money(sub)+' ج.م</b></div><div><span>رسوم خدمة الطلب</span><b>'+money(service)+' ج.م</b></div><div><span>التوصيل</span><b>'+(delivery?'25.00 ج.م':'مجاني 🎉')+'</b></div>'+(tipAmount?'<div><span>البقشيش</span><b>'+money(tipAmount)+' ج.م</b></div>':'')+'<div class="total"><span>الإجمالي</span><b>'+money(total)+' ج.م</b></div><div style="background:#f3f3f3;padding:10px;border-radius:10px;font-size:13px">'+(sub>=500?'🎉 مبروك! حصلت على توصيل مجاني':'🚚 زوّد '+Math.max(0,500-sub).toFixed(0)+' جنيه واحصل على توصيل مجاني 🎉')+'</div></div>';$('cart').classList.add('show');branchChanged()}function toggleCart(){$('cart').classList.toggle('show',cart.length>0);if($('cart').classList.contains('show'))$('cart').scrollIntoView({behavior:'smooth'})}function payment(v,el){payMethod=v;document.querySelectorAll('.pay button').forEach(x=>x.classList.remove('active'));el.classList.add('active')}function tip(v,el){tipAmount=v;document.querySelectorAll('.tip button').forEach(x=>x.classList.remove('active'));el.classList.add('active');renderCart()}function promoMsg(){$('promoMsg').textContent=$('promo').value.trim()?'سيتم التحقق من الكود عند تأكيد الطلب ❤️':''}function showErr(t){$('err').textContent=t;$('err').style.display='block'}function hideErr(){$('err').style.display='none'}async function order(){if(!cart.length)return;let addr=addresses.find(a=>Number(a.id)===Number(selectedAddress));let address=addr?[addr.address_line,addr.area,addr.city,addr.country,addr.recipient_name,addr.phone,addr.notes].filter(Boolean).join(' — '):$('addrLine').value.trim();let branchId=Number($('branch').value);if(!branchId||!address){showErr('من فضلك اختر الفرع واكتب العنوان');return}let btn=$('confirm');btn.disabled=true;hideErr();let payload={customer_id:cid,customer_name:cname,customer_phone:cphone,branch_id:branchId,customer_address:address,payment_method:payMethod,tip_amount:tipAmount,promo_code:$('promo').value.trim(),delivery_notes:$('notes').value.trim(),items:cart.map(x=>({product_id:x.product_id,quantity:x.quantity,notes:x.note||''}))};try{let r=await fetch(API+(payMethod==='card'?'card-order':'create-order'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}),d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'تعذر إنشاء الطلب');if(payMethod==='card'){if(!
