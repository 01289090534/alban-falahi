<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>منيو ألبان فلاحي</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Arial,sans-serif;background:#f8f5ef;color:#222;padding-bottom:85px}.container{max-width:700px;margin:auto;padding:18px}.header,.cart-box{background:#fff;border-radius:22px;padding:18px;box-shadow:0 5px 20px rgba(0,0,0,.08)}.header{margin-bottom:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}.header>div:first-child{flex:1}.logo{font-size:25px;font-weight:bold}.customer{font-size:13px;color:#666;margin-top:5px}.header-actions{display:flex;gap:7px}.account-btn,.logout{border:0;padding:9px 12px;border-radius:10px;cursor:pointer;font-weight:bold}.account-btn{background:#222;color:#fff}.logout{background:#eee}.header-info{display:flex;gap:7px;margin-top:9px}.eta-box,.delivery-box{background:#f3f3f3;border-radius:12px;padding:9px 11px;font-size:13px}.free-delivery-note{width:100%;display:block;margin-top:7px;padding:12px 10px;background:#fff3df;border-radius:14px;text-align:center;font-size:17px;font-weight:900;color:#d35400}.points-badge{display:inline-block;background:#fff7dd;border:1px solid #f0dfaa;color:#6d5200;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800;margin-top:4px}.section-title{font-size:22px;font-weight:bold;margin:20px 0 12px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.section-link{border:0;background:transparent;color:#d35400;font-weight:900;cursor:pointer}.categories{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}.category{border:1px solid #ddd;background:#fff;padding:10px 15px;border-radius:20px;white-space:nowrap;cursor:pointer}.category.active{background:#222;color:#fff}.category-section{scroll-margin-top:12px;margin-top:25px}.category-title{font-size:21px;font-weight:900;margin:0 0 12px}.products{display:grid;grid-template-columns:1fr 1fr;gap:12px}.product{background:#fff;border-radius:18px;padding:12px;box-shadow:0 4px 15px rgba(0,0,0,.06);position:relative;cursor:pointer}.product-image{width:100%;height:140px;object-fit:cover;border-radius:14px;background:#eee}.product-name{font-weight:bold;margin-top:10px;font-size:16px}.product-description{font-size:12px;color:#777;margin-top:5px;min-height:30px}.product-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:10px}.price{font-weight:bold}.add-wrap{display:flex;align-items:center;gap:5px}.add{border:0;background:#222;color:#fff;width:38px;height:38px;border-radius:12px;font-size:22px;cursor:pointer}.qty-mini{display:flex;align-items:center;background:#f1f1f1;border-radius:12px;overflow:hidden}.qty-mini button{width:30px;height:34px;border:0;background:#eee;cursor:pointer;font-size:18px;font-weight:bold}.qty-mini span{min-width:28px;text-align:center;font-weight:900}.recommend-section{background:#fff;border-radius:20px;padding:16px;margin-top:18px;box-shadow:0 4px 15px rgba(0,0,0,.06);border:1px solid #eee}.recommend-title{display:flex;align-items:center;gap:8px;font-size:21px;font-weight:900;margin-bottom:8px}.fire{font-size:28px}.recommend-text{font-size:13px;color:#777;margin-bottom:12px}.repeat-section{display:none;background:#fff;border-radius:20px;padding:16px;margin-top:18px;box-shadow:0 4px 15px rgba(0,0,0,.06)}.repeat-section.show{display:block}.repeat-title{font-size:21px;font-weight:900;margin-bottom:10px}.repeat-products{display:grid;grid-template-columns:1fr 1fr;gap:10px}.repeat-item{border:1px solid #eee;border-radius:14px;padding:10px}.repeat-item button{width:100%;border:0;background:#222;color:#fff;border-radius:10px;padding:9px;cursor:pointer;font-weight:bold}.repeat-meta{font-size:12px;color:#777;margin:5px 0 8px}.product-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.52);z-index:1000;padding:18px;align-items:center;justify-content:center}.product-modal.show{display:flex}.product-modal-box{background:#fff;width:min(560px,100%);max-height:90vh;overflow:auto;border-radius:22px;padding:18px}.product-modal-head{display:flex;justify-content:space-between;align-items:center}.product-close{border:0;background:#eee;border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:bold}.product-modal-image{width:100%;max-height:320px;object-fit:cover;border-radius:16px;margin-top:12px;background:#eee}.product-modal-name{font-size:24px;font-weight:900;margin-top:14px}.product-modal-description{color:#666;line-height:1.7;margin-top:8px}.modal-qty{display:flex;align-items:center;justify-content:center;gap:16px;margin:20px 0}.modal-qty button{width:48px;height:48px;border:0;border-radius:14px;background:#222;color:#fff;font-size:26px;cursor:pointer}.modal-qty strong{font-size:25px;min-width:40px;text-align:center}.form-label{display:block;font-weight:bold;margin-bottom:7px;font-size:14px}.item-note{width:100%;border:1px solid #ddd;border-radius:14px;padding:13px;font-size:15px;min-height:90px;resize:vertical;outline:none}.modal-add{width:100%;border:0;background:#d35400;color:#fff;padding:15px;border-radius:14px;font-size:18px;font-weight:900;cursor:pointer;margin-top:12px}.cart-box{display:none;margin-top:20px}.cart-box.open{display:block}.cart-item{padding:12px 0;border-bottom:1px solid #eee}.cart-item-main{display:flex;justify-content:space-between;align-items:center;gap:10px}.cart-item-note{font-size:12px;color:#777;margin-top:5px;background:#f7f7f7;padding:7px 9px;border-radius:9px}.qty{display:flex;align-items:center;gap:8px}.qty button{border:0;background:#eee;width:30px;height:30px;border-radius:9px;cursor:pointer}.summary-row{display:flex;justify-content:space-between;margin-top:10px}.total{font-size:21px;font-weight:bold;margin-top:15px}.delivery-message{background:#f3f3f3;padding:12px;border-radius:12px;margin-top:12px;font-size:14px}.empty{text-align:center;color:#777;padding:20px}.checkout{margin-top:20px;padding-top:20px;border-top:1px solid #eee}.form-group{margin-top:14px}.input,.select,.textarea{width:100%;border:1px solid #ddd;border-radius:12px;padding:13px;font-size:15px;background:#fff;outline:none}.textarea{min-height:90px;resize:vertical}.payment-options,.tip-options{display:grid;gap:8px}.payment-options{grid-template-columns:1fr 1fr 1fr}.tip-options{grid-template-columns:repeat(5,1fr)}.payment-option,.tip-option{border:1px solid #ddd;border-radius:12px;padding:12px 7px;text-align:center;cursor:pointer;background:#fff}.payment-option.active,.tip-option.active{background:#222;color:#fff;border-color:#222}.promo-row{display:flex;gap:8px}.promo-row .input{flex:1}.promo-btn{border:0;background:#222;color:#fff;border-radius:12px;padding:0 15px;cursor:pointer}.confirm-btn{width:100%;border:0;background:#222;color:#fff;padding:16px;border-radius:14px;font-size:18px;font-weight:bold;margin-top:20px;cursor:pointer}.confirm-btn:disabled{opacity:.6}.error-box{background:#fff0f0;color:#b00020;padding:12px;border-radius:12px;margin-top:12px;display:none}.order-success{background:#fff;border-radius:22px;padding:25px;text-align:center;display:none;margin-top:20px}.cart-bar{position:fixed;z-index:900;bottom:10px;left:50%;transform:translateX(-50%);width:min(664px,calc(100% - 20px));background:#222;color:#fff;border-radius:18px;padding:11px 13px;box-shadow:0 8px 30px rgba(0,0,0,.25);display:none;align-items:center;justify-content:space-between;gap:8px;cursor:pointer}.cart-bar.show{display:flex}.cart-bar-open{background:#fff;color:#222;border-radius:12px;padding:10px 13px;font-weight:900}.cart-bar-total,.cart-bar-count{font-weight:900;white-space:nowrap}@media(max-width:500px){.product-image{height:120px}.logo{font-size:22px}.product-modal-name{font-size:21px}.cart-bar{font-size:12px}.cart-bar-open{padding:9px 10px}.cart-bar-total{font-size:13px}}</style></head><body><div class="container"><div class="header"><div><div class="logo">🥛 ألبان فلاحي</div><div id="customerName" class="customer"></div><div id="customerPoints"></div><div class="header-info"><div class="eta-box">🕐 <strong>35 - 50 دقيقة</strong></div><div class="delivery-box">🚚 <strong>25 ج.م</strong></div></div><div class="free-delivery-note">🎁 توصيل مجانًا عند 500 ج أو أكثر ❤️</div></div><div class="header-actions"><button class="account-btn" onclick="openAccount()">⭐ حسابي</button><button class="logout" onclick="logout()">خروج</button></div></div><div id="repeatSection" class="repeat-section"><div class="repeat-title">🔄 اطلب مجددًا</div><div class="repeat-products" id="repeatProducts"></div></div><div class="recommend-section"><div class="recommend-title"><span class="fire">🔥</span> اختيارات على ذوقك</div><div class="recommend-text">اختيارات مميزة رشحناها لك ❤️</div><div id="recommendProducts" class="products"></div></div><div class="section-head"><div class="section-title">الفئات</div></div><div id="categories" class="categories"></div><div id="categorySections"></div><div id="cartBox" class="cart-box"><div class="section-title" style="margin-top:0">🛒 السلة</div><div id="cartItems"></div><div id="summary"></div><div class="checkout"><div class="section-title" style="margin-top:0">📦 بيانات التوصيل</div><div class="form-group"><label class="form-label">الفرع</label><select id="branch" class="select"></select></div><div class="form-group"><label class="form-label">العنوان بالتفصيل</label><textarea id="address" class="textarea" placeholder="اكتب العنوان بالتفصيل..."></textarea></div><div class="form-group"><label class="form-label">طريقة الدفع</label><div class="payment-options"><div class="payment-option active" onclick="selectPayment('cash',this)">💵 كاش</div><div class="payment-option" onclick="selectPayment('card',this)">💳 Visa</div><div class="payment-option" onclick="selectPayment('wallet',this)">📱 محفظة</div></div></div><div class="form-group"><label class="form-label">🎁 كود الخصم</label><div class="promo-row"><input id="promoCode" class="input" placeholder="اكتب كود الخصم"><button class="promo-btn" onclick="checkPromo()">تطبيق</button></div><div id="promoMessage"></div></div><div class="form-group"><label class="form-label">❤️ بقشيش للكابتن</label><div class="tip-options"><div class="tip-option active" onclick="selectTip(0,this)">0 ج</div><div class="tip-option" onclick="selectTip(5,this)">5 ج</div><div class="tip-option" onclick="selectTip(10,this)">10 ج</div><div class="tip-option" onclick="selectTip(15,this)">15 ج</div><div class="tip-option" onclick="selectTip(20,this)">20 ج</div></div></div><div class="form-group"><label class="form-label">📝 ملاحظات التوصيل</label><textarea id="deliveryNotes" class="textarea" placeholder="مثال: اتصل قبل الوصول..."></textarea></div><div id="orderError" class="error-box"></div><button id="confirmBtn" class="confirm-btn" onclick="submitOrder()">تأكيد الطلب ❤️</button></div></div><div id="orderSuccess" class="order-success"><div style="font-size:50px">🎉</div><h2>تم استلام طلبك بنجاح</h2><div id="orderNumber"></div><button class="confirm-btn" onclick="openAccount()">متابعة الطلب</button></div></div><div id="productModal" class="product-modal" onclick="if(event.target===this)closeProductModal()"><div class="product-modal-box"><div class="product-modal-head"><strong>تفاصيل الصنف</strong><button class="product-close" onclick="closeProductModal()">إغلاق</button></div><img id="modalImage" class="product-modal-image"><div id="modalName" class="product-modal-name"></div><div id="modalDescription" class="product-modal-description"></div><div class="modal-qty"><button onclick="modalQty(-1)">−</button><strong id="modalQtyValue">1</strong><button onclick="modalQty(1)">+</button></div><label class="form-label">📝 ملاحظة على الصنف (اختياري)</label><textarea id="modalNote" class="item-note" maxlength="500" placeholder="مثال: بدون سكر، تقطيع معين..."></textarea><button class="modal-add" onclick="addModalItem()">إضافة للسلة 🛒</button></div></div><div id="cartBar" class="cart-bar" onclick="toggleCart()"><span id="cartBarCount" class="cart-bar-count">0 صنف</span><span class="cart-bar-open">اطلع على سلتك 🛒</span><span id="cartBarTotal" class="cart-bar-total">0.00 ج.م</span></div><script>const SUPABASE_URL='https://qxwvuxkbcghbkztjrzon.supabase.co';const SUPABASE_KEY='sb_publishable_JI9lC4YPTCQ8CwMxzvHNIA_C24ULpWH';const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const API=SUPABASE_URL+'/functions/v1/';let customerId=localStorage.getItem('alban_customer_id');let customerName=localStorage.getItem('alban_customer_name')||'';let products=[],categories=[],branches=[],cart=[],selectedPayment='cash',tipAmount=0,cartOpen=false,modalProduct=null,modalQuantity=1;const money=n=>Math.round((Number(n)+Number.EPSILON)*100)/100;function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function openAccount(){location.href='account.html'}function logout(){localStorage.removeItem('alban_customer_id');localStorage.removeItem('alban_customer_name');localStorage.removeItem('alban_customer_phone');location.href='index.html'}function init(){if(!customerId){location.href='index.html';return}document.getElementById('customerName').textContent=customerName?'أهلاً يا '+customerName+' ❤️':'';loadAll()}async function loadAll(){await Promise.all([loadProducts(),loadCategories(),loadBranches()]);renderCategoriesAndSections();renderRecommendations();await loadRepeatOrders();renderCart()}async function loadProducts(){const{data,error}=await sb.from('products').select('*').eq('active',true).order('sort_order',{ascending:true}).order('id',{ascending:true});if(error){console.error(error);return}products=data||[]}async function loadCategories(){const{data,error}=await sb.from('categories').select('*').eq('active',true).order('sort_order',{ascending:true}).order('id',{ascending:true});if(error){console.error(error);return}categories=data||[]}async function loadBranches(){const{data}=await sb.from('branches').select('id,name').eq('active',true).order('id');branches=data||[];document.getElementById('branch').innerHTML='<option value="">اختر الفرع</option>'+branches.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('')}function productName(p){return p.name_ar||p.name||''}function productDesc(p){return p.description_ar||p.description||''}function renderCategoriesAndSections(){const cat=document.getElementById('categories');cat.innerHTML=categories.map((c,i)=>`<button class="category" onclick="scrollToCategory(${c.id})">${esc(c.name_ar||c.name)}</button>`).join('');const wrap=document.getElementById('categorySections');wrap.innerHTML=categories.map(c=>{const ps=products.filter(p=>Number(p.category_id)===Number(c.id));if(!ps.length)return '';return `<section class="category-section" id="cat-${c.id}"><div class="category-title">${esc(c.name_ar||c.name)}</div><div class="products">${ps.map(productCard).join('')}</div></section>`}).join('');}function productCard(p){const q=cart.find(x=>x.product_id===p.id)?.quantity||0;return `<div class="product" onclick="openProduct(${p.id})"><img class="product-image" src="${esc(p.image_url||'')}" alt="${esc(productName(p))}" onerror="this.style.visibility='hidden'"><div class="product-name">${esc(productName(p))}</div><div class="product-description">${esc(productDesc(p))}</div><div class="product-bottom"><span class="price">${money(p.price).toFixed(2)} ج.م</span><div class="add-wrap" onclick="event.stopPropagation()">${q?`<div class="qty-mini"><button onclick="changeQty(${p.id},-1)">−</button><span>${q}</span><button onclick="changeQty(${p.id},1)">+</button></div>`:`<button class="add" onclick="changeQty(${p.id},1)">+</button>`}</div></div></div>`}function renderRecommendations(){let chosen=products.filter(p=>p.featured);if(!chosen.length)chosen=products.slice(0,6);document.getElementById('recommendProducts').innerHTML=chosen.map(productCard).join('')}async function loadRepeatOrders(){const{data,error}=await sb.from('orders').select('id,created_at').eq('customer_id',customerId).order('created_at',{ascending:false}).limit(20);if(error||!data?.length)return;const ids=[...new Set(data.map(o=>o.id))];const{data:items}=await sb.from('order_items').select('product_id,product_name,unit_price').in('order_id',ids);const seen=new Set();const repeat=(items||[]).filter(x=>x.product_id&&products.some(p=>p.id===x.product_id)).filter(x=>{if(seen.has(x.product_id))return false;seen.add(x.product_id);return true}).slice(0,8);if(!repeat.length)return;document.getElementById('repeatSection').classList.add('show');document.getElementById('repeatProducts').innerHTML=repeat.map(x=>`<div class="repeat-item"><strong>${esc(x.product_name)}</strong><div class="repeat-meta">${money(x.unit_price)} ج.م</div><button onclick="changeQty(${x.product_id},1)">أضف للسلة +</button></div>`).join('')}function scrollToCategory(id){document.getElementById('cat-'+id)?.scrollIntoView({behavior:'smooth',block:'start'})}function openProduct(id){modalProduct=products.find(p=>p.id===id);if(!modalProduct)return;const existing=cart.find(x=>x.product_id===id);modalQuantity=existing?.quantity||1;document.getElementById('modalImage').src=modalProduct.image_url||'';document.getElementById('modalName').textContent=productName(modalProduct);document.getElementById('modalDescription').textContent=productDesc(modalProduct);document.getElementById('modalQtyValue').textContent=modalQuantity;document.getElementById('modalNote').value=existing?.note||'';document.getElementById('productModal').classList.add('show')}function closeProductModal(){document.getElementById('productModal').classList.remove('show');modalProduct=null}function modalQty(d){modalQuantity=Math.max(1,Math.min(50,modalQuantity+d));document.getElementById('modalQtyValue').textContent=modalQuantity}function addModalItem(){if(!modalProduct)return;const note=document.getElementById('modalNote').value.trim();const ex=cart.find(x=>x.product_id===modalProduct.id);if(ex){ex.quantity=modalQuantity;ex.note=note}else cart.push({product_id:modalProduct.id,quantity:modalQuantity,note});closeProductModal();renderCategoriesAndSections();renderRecommendations();renderCart()}function changeQty(id,d){const ex=cart.find(x=>x.product_id===id);if(ex){ex.quantity+=d;if(ex.quantity<=0)cart=cart.filter(x=>x.product_id!==id)}else if(d>0)cart.push({product_id:id,quantity:1,note:''});renderCategoriesAndSections();renderRecommendations();renderCart()}function toggleCart(){if(!cart.length)return;cartOpen=!cartOpen;document.getElementById('cartBox').classList.toggle('open',cartOpen);if(cartOpen)setTimeout(()=>document.getElementById('cartBox').scrollIntoView({behavior:'smooth',block:'start'}),50)}function renderCart(){const count=cart.reduce((s,x)=>s+x.quantity,0);const subtotal=money(cart.reduce((s,x)=>{const p=products.find(p=>p.id===x.product_id);return s+(p?Number(p.price)*x.quantity:0)},0));const bar=document.getElementById('cartBar');bar.classList.toggle('show',count>0);document.getElementById('cartBarCount').textContent=count+' صنف';document.getElementById('cartBarTotal').textContent=subtotal.toFixed(2)+' ج.م';const ci=document.getElementById('cartItems');if(!cart.length){ci.innerHTML='';return}ci.innerHTML=cart.map(x=>{const p=products.find(p=>p.id===x.product_id);if(!p)return '';return `<div class="cart-item"><div class="cart-item-main"><strong>${esc(productName(p))}</strong><strong>${money(Number(p.price)*x.quantity).toFixed(2)} ج.م</strong></div><div class="qty"><button onclick="changeQty(${p.id},-1)">−</button><strong>${x.quantity}</strong><button onclick="changeQty(${p.id},1)">+</button></div>${x.note?`<div class="cart-item-note">📝 ${esc(x.note)}</div>`:''}</div>`}).join('');renderSummary(subtotal)}function renderSummary(subtotal){const free=subtotal>=500;const delivery=free?0:25;const service=money(subtotal*.02);const total=money(subtotal+service+delivery+tipAmount);document.getElementById('summary').innerHTML=`<div class="summary-row"><span>إجمالي الأصناف</span><strong>${subtotal.toFixed(2)} ج.م</strong></div><div class="summary-row"><span>رسوم خدمة الطلب</span><strong>${service.toFixed(2)} ج.م</strong></div><div class="summary-row"><span>التوصيل</span><strong>${delivery?delivery.toFixed(2)+' ج.م':'مجاني 🎉'}</strong></div>${tipAmount?`<div class="summary-row"><span>البقشيش</span><strong>${tipAmount.toFixed(2)} ج.م</strong></div>`:''}<div class="delivery-message">${free?'🎉 مبروك! حصلت على توصيل مجاني':'🚚 زوّد '+money(500-subtotal).toFixed(0)+' جنيه واحصل على توصيل مجاني 🎉'}</div><div class="summary-row total"><span>الإجمالي</span><strong>${total.toFixed(2)} ج.م</strong></div>`}function selectPayment(v,el){selectedPayment=v;document.querySelectorAll('.payment-option').forEach(x=>x.classList.remove('active'));el.classList.add('active')}function selectTip(v,el){tipAmount=v;document.querySelectorAll('.tip-option').forEach(x=>x.classList.remove('active'));el.classList.add('active');renderCart()}async function checkPromo(){const code=document.getElementById('promoCode').value.trim().toUpperCase();const msg=document.getElementById('promoMessage');if(!code){msg.textContent='اكتب كود الخصم';return}msg.textContent='سيتم التحقق من الكود عند تأكيد الطلب ❤️'}async function submitOrder(){if(!cart.length)return;const address=document.getElementById('address').value.trim();const branchId=document.getElementById('branch').value;if(!branchId||!address){showError('من فضلك اختر الفرع واكتب العنوان');return}const btn=document.getElementById('confirmBtn');btn.disabled=true;hideError();const payload={customer_id:customerId,branch_id:Number(branchId),customer_address:address,payment_method:selectedPayment,tip_amount:tipAmount,promo_code:document.getElementById('promoCode').value.trim(),delivery_notes:document.getElementById('deliveryNotes').value.trim(),items:cart.map(x=>({product_id:x.product_id,quantity:x.quantity,note:x.note||''}))};try{const r=await fetch(API+'create-order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok||!d.success){showError(d.error||'تعذر إنشاء الطلب');btn.disabled=false;return}document.getElementById('cartBox').classList.remove('open');document.getElementById('cartBar').classList.remove('show');document.getElementById('orderSuccess').style.display='block';document.getElementById('orderNumber').textContent='رقم الطلب: '+d.order.id;cart=[];window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}catch(e){showError('حدث خطأ في الاتصال، حاول مرة أخرى');btn.disabled=false}}function showError(t){const e=document.getElementById('orderError');e.textContent=t;e.style.display='block'}function hideError(){document.getElementById('orderError').style.display='none'}init();</script></body></html>
