<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>منيو ألبان فلاحي</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f8f5ef;color:#222}.container{max-width:700px;margin:auto;padding:18px}.header,.cart-box,.order-success{background:#fff;border-radius:22px;padding:18px;box-shadow:0 5px 20px rgba(0,0,0,.08)}.header{margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}.logo{font-size:25px;font-weight:bold}.customer{font-size:13px;color:#666;margin-top:5px}.customer-phone{font-size:12px;color:#999;margin-top:3px}.points-mini{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}.points-badge{display:inline-block;background:#fff7dd;border:1px solid #f0dfaa;color:#6d5200;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800}.header-actions{display:flex;flex-direction:column;gap:7px;align-items:stretch;min-width:92px}.account-btn,.logout,.rating-mini{border:0;padding:9px 12px;border-radius:10px;cursor:pointer;font-weight:bold}.account-btn{background:#222;color:#fff}.logout{background:#eee;color:#222}.rating-mini{background:#fff7dd;border:1px solid #f0dfaa;color:#6d5200;font-size:12px;white-space:nowrap}.rating-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;padding:18px;align-items:center;justify-content:center}.rating-modal.show{display:flex}.rating-modal-box{background:#fff;width:min(560px,100%);max-height:80vh;overflow:auto;border-radius:22px;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.25)}.rating-modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.rating-close{border:0;background:#eee;border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:bold}.rating-summary{text-align:center;padding:12px 0}.rating-average{font-size:30px;font-weight:900}.rating-stars{color:#f5b400;letter-spacing:2px;font-size:20px}.rating-count{font-size:12px;color:#777;margin-top:4px}.review-list{margin-top:8px}.public-review{border-top:1px solid #eee;padding:11px 0}.public-review:first-child{border-top:0}.review-name{font-weight:800}.review-date{font-size:11px;color:#999}.review-comment{margin-top:5px;line-height:1.6;font-size:14px}.section-title{font-size:22px;font-weight:bold;margin:20px 0 12px}.categories{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}.category{border:1px solid #ddd;background:#fff;padding:10px 15px;border-radius:20px;white-space:nowrap;cursor:pointer}.category.active{background:#222;color:#fff}.products{display:grid;grid-template-columns:1fr 1fr;gap:12px}.product{background:#fff;border-radius:18px;padding:12px;box-shadow:0 4px 15px rgba(0,0,0,.06)}.product-image{width:100%;height:140px;object-fit:cover;border-radius:14px;background:#eee}.product-name{font-weight:bold;margin-top:10px;font-size:16px}.product-description{font-size:12px;color:#777;margin-top:5px;min-height:30px}.product-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:10px}.price{font-weight:bold}.add{border:0;background:#222;color:#fff;width:38px;height:38px;border-radius:12px;font-size:22px;cursor:pointer}.cart-box{margin-top:22px}.cart-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #eee}.qty{display:flex;align-items:center;gap:8px}.qty button{border:0;background:#eee;width:30px;height:30px;border-radius:9px;cursor:pointer}.summary-row{display:flex;justify-content:space-between;margin-top:10px}.total{font-size:21px;font-weight:bold;margin-top:15px}.delivery-message{background:#f3f3f3;padding:12px;border-radius:12px;margin-top:12px;font-size:14px}.empty{text-align:center;color:#777;padding:30px}.checkout{margin-top:20px;padding-top:20px;border-top:1px solid #eee}.form-group{margin-top:14px}.form-label{display:block;font-weight:bold;margin-bottom:7px;font-size:14px}.input,.select,.textarea{width:100%;border:1px solid #ddd;border-radius:12px;padding:13px;font-size:15px;background:#fff;outline:none}.textarea{min-height:90px;resize:vertical}.payment-options,.tip-options{display:grid;gap:8px}.payment-options{grid-template-columns:1fr 1fr 1fr}.tip-options{grid-template-columns:repeat(5,1fr);gap:7px}.payment-option,.tip-option{border:1px solid #ddd;border-radius:12px;padding:12px 7px;text-align:center;cursor:pointer;background:#fff;font-size:14px}.tip-option{border-radius:10px;padding:10px 4px;font-size:13px}.payment-option.active,.tip-option.active{background:#222;color:#fff;border-color:#222}.promo-row{display:flex;gap:8px}.promo-row .input{flex:1}.promo-btn{border:0;background:#222;color:#fff;border-radius:12px;padding:0 15px;cursor:pointer;white-space:nowrap}.promo-message{font-size:13px;margin-top:7px}.confirm-btn{width:100%;border:0;background:#222;color:#fff;padding:16px;border-radius:14px;font-size:18px;font-weight:bold;margin-top:20px;cursor:pointer}.confirm-btn:disabled{opacity:.6;cursor:not-allowed}.order-success{display:none;margin-top:20px;text-align:center}.success-icon{font-size:55px}.order-number{font-size:22px;font-weight:bold;margin-top:10px}.error-box{background:#fff0f0;color:#b00020;padding:12px;border-radius:12px;margin-top:12px;display:none;font-size:14px}@media(max-width:500px){.product-image{height:120px}.points-badge{font-size:11px;padding:6px 8px}.header{align-items:flex-start}.logo{font-size:22px}.header-actions{min-width:82px}.account-btn,.logout,.rating-mini{padding:8px 9px;font-size:11px}}</style></head><body><div class="container"><div class="header"><div><div class="logo">🥛 ألبان فلاحي</div><div id="customerName" class="customer"></div><div id="customerPhone" class="customer-phone"></div><div id="customerPoints" class="points-mini" style="display:none"></div></div><div class="header-actions"><button class="rating-mini" onclick="openRatings()">⭐ <span id="miniRating">—/5</span></button><button class="account-btn" onclick="openAccount()">⭐ حسابي</button><button class="logout" onclick="logout()">خروج</button></div></div><div id="ratingModal" class="rating-modal" onclick="if(event.target===this)closeRatings()"><div class="rating-modal-box"><div class="rating-modal-head"><strong>⭐ تقييم عملائنا لأكل ألبان فلاحي</strong><button class="rating-close" onclick="closeRatings()">إغلاق</button></div><div class="rating-summary"><div id="ratingAverage" class="rating-average">— / 5</div><div id="ratingStars" class="rating-stars">☆☆☆☆☆</div><div id="ratingCount" class="rating-count">جاري تحميل التقييمات...</div></div><div id="reviewList" class="review-list"></div></div></div><div class="section-title">الأصناف</div><div id="categories" class="categories"></div><div id="products" class="products"><div class="empty">جاري تحميل الأصناف...</div></div><div class="cart-box"><div class="section-title" style="margin-top:0">🛒 السلة</div><div id="cart"></div><div id="summary"></div><div id="checkout" class="checkout" style="display:none"><div class="section-title" style="margin-top:0">📦 بيانات التوصيل</div><div class="form-group"><label class="form-label">الفرع</label><select id="branch" class="select"><option value="">جاري تحميل الفروع...</option></select></div><div class="form-group"><label class="form-label">العنوان بالتفصيل</label><textarea id="address" class="textarea" placeholder="اكتب العنوان بالتفصيل: المنطقة، الشارع، رقم العقار، الدور، الشقة..."></textarea></div><div class="form-group"><label class="form-label">طريقة الدفع</label><div class="payment-options"><div class="payment-option active" onclick="selectPayment('cash',this)">💵 كاش</div><div class="payment-option" onclick="selectPayment('card',this)">💳 Visa</div><div class="payment-option" onclick="selectPayment('wallet',this)">📱 محفظة</div></div></div><div class="form-group"><label class="form-label">🎁 كود الخصم</label><div class="promo-row"><input id="promoCode" class="input" placeholder="اكتب كود الخصم"><button class="promo-btn" onclick="checkPromo()">تطبيق</button></div><div id="promoMessage" class="promo-message"></div></div><div class="form-group"><label class="form-label">❤️ بقشيش للكابتن</label><div class="tip-options"><div class="tip-option active" onclick="selectTip(0,this)">0 ج</div><div class="tip-option" onclick="selectTip(5,this)">5 ج</div><div class="tip-option" onclick="selectTip(10,this)">10 ج</div><div class="tip-option" onclick="selectTip(15,this)">15 ج</div><div class="tip-option" onclick="selectTip(20,this)">20 ج</div></div></div><div class="form-group"><label class="form-label">📝 ملاحظات التوصيل</label><textarea id="deliveryNotes" class="textarea" placeholder="مثال: اتصل قبل الوصول، سيب الطلب عند البواب، متخبطش على الباب..."></textarea></div><div id="orderError" class="error-box"></div><button id="confirmBtn" class="confirm-btn" onclick="submitOrder()">تأكيد الطلب ❤️</button></div></div><div id="orderSuccess" class="order-success"><div class="success-icon">✅</div><div style="font-size:20px;font-weight:bold">تم استلام طلبك بنجاح</div><div class="order-number">رقم الطلب: <span id="orderNumber"></span></div><div style="color:#777;margin-top:10px">شكرًا لاختيارك ألبان فلاحي ❤️</div><button class="confirm-btn" onclick="location.reload()">العودة للمنيو</button></div></div><script>
const SUPABASE_URL="https://qxwvuxkbcghbkztjrzon.supabase.co",SUPABASE_KEY="sb_publishable_JI9lC4YPTCQ8CwMxzvHNIA_C24ULpWH",CREATE_ORDER_URL=SUPABASE_URL+"/functions/v1/create-order",REVIEWS_URL=SUPABASE_URL+"/functions/v1/reviews-api",ACCOUNT_URL=SUPABASE_URL+"/functions/v1/customer-account",supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let categories=[],products=[],branches=[],cart=[],selectedCategory=null,selectedPayment="cash",selectedTip=0,appliedPromo="";const customerId=localStorage.getItem("alban_customer_id"),customerName=localStorage.getItem("alban_customer_name"),customerPhone=localStorage.getItem("alban_customer_phone");if(!customerId)location.href="index.html";document.getElementById("customerName").innerText=customerName?`أهلاً ${customerName} 👋`:"";document.getElementById("customerPhone").innerText=customerPhone||"";function openAccount(){location.href="account.html"}function logout(){["alban_customer_id","alban_customer_name","alban_customer_phone"].forEach(k=>localStorage.removeItem(k));location.href="index.html"}function openRatings(){document.getElementById("ratingModal").classList.add("show");loadRatings()}function closeRatings(){document.getElementById("ratingModal").classList.remove("show")}function esc(t){return String(t||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;").replace(/'/g,"&#039;")}function stars(n){n=Math.max(0,Math.min(5,Number(n||0)));return '★'.repeat(n)+'☆'.repeat(5-n)}
async function loadCustomerPoints(){try{const r=await fetch(ACCOUNT_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({customer_id:customerId,ts:Date.now()})}),d=await r.json();if(!r.ok||!d.success)throw Error();const p=d.points||{},points=Number(p.total_points||0).toLocaleString('ar-EG'),value=Number(p.value_egp||0).toFixed(2),el=document.getElementById("customerPoints");el.style.display="flex";el.innerHTML=`<span class="points-badge">⭐ ${points} نقطة</span><span class="points-badge">💰 معاك ${value} ج</span>`}catch(e){}}
async function loadRatings(){try{const r=await fetch(REVIEWS_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"summary"})}),d=await r.json();if(!r.ok||!d.success)throw Error();const avg=Number(d.summary.food_average||0);document.getElementById("miniRating").textContent=avg.toFixed(1)+"/5";document.getElementById("ratingAverage").textContent=avg.toFixed(1)+" / 5";document.getElementById("ratingStars").textContent=stars(Math.round(avg));document.getElementById("ratingCount").textContent=(d.summary.food_count||0)+" تقييم للأكل";const box=document.getElementById("reviewList");box.innerHTML=(d.comments||[]).map(x=>`<div class="public-review"><div><span class="review-name">${esc(x.customer_name||"عميل")}</span> <span class="review-date">• ${new Date(x.created_at).toLocaleDateString('ar-EG')}</span></div><div class="rating-stars">${stars(x.food_rating)}</div><div class="review-comment">${esc(x.food_comment)}</div></div>`).join("");if(!box.innerHTML)box.innerHTML='<div class="muted">لسه مفيش تعليقات — مستنيين رأيك ❤️</div>'}catch(e){document.getElementById("miniRating").textContent="—/5";document.getElementById("ratingCount").textContent="تعذر تحميل التقييمات"}}
async function loadData(){await loadCategories();await loadProducts();await loadBranches();renderCategories();renderProducts();renderCart();loadRatings();loadCustomerPoints()}async function loadCategories(){const{data}=await supabaseClient.from("categories").select("*").eq("active",true).order("sort_order");categories=data||[]}function renderCategories(){const box=document.getElementById("categories");box.innerHTML="";const all=document.createElement("button");all.className="category active";all.innerText="كل الأصناف";all.onclick=()=>{selectedCategory=null;document.querySelectorAll(".category").forEach(x=>x.classList.remove("active"));all.classList.add("active");renderProducts()};box.appendChild(all);categories.forEach(c=>{const b=document.createElement("button");b.className="category";b.innerText=c.name_ar||c.name;b.onclick=()=>{selectedCategory=c.id;document.querySelectorAll(".category").forEach(x=>x.classList.remove("active"));b.classList.add("active");renderProducts()};box.appendChild(b)})}async function loadProducts(){const{data,error}=await supabaseClient.from("products").select("*").eq("active",true).order("sort_order");if(error){document.getElementById("products").innerHTML='<div class="empty">تعذر تحميل الأصناف</div>';return}products=data||[]}function renderProducts(){const box=document.getElementById("products");box.innerHTML="";let list=selectedCategory===null?products:products.filter(p=>p.category_id===selectedCategory);if(!list.length){box.innerHTML='<div class="empty">لا توجد أصناف هنا</div>';return}list.forEach(p=>{const card=document.createElement("div");card.className="product";card.innerHTML=(p.image_url?`<img class="product-image" src="${esc(p.image_url)}" alt="">`:'<div class="product-image"></div>')+`<div class="product-name">${esc(p.name_ar||p.name)}</div><div class="product-description">${esc(p.description_ar||p.description)}</div><div class="product-bottom"><div class="price">${Number(p.price).toFixed(0)} ج</div><button class="add">+</button></div>`;card.querySelector(".add").onclick=()=>addToCart(p.id);box.appendChild(card)})}async function loadBranches(){const{data,error}=await supabaseClient.from("branches").select("id,name").eq("active",true).order("id");const s=document.getElementById("branch");if(error){s.innerHTML='<option value="">تعذر تحميل الفروع</option>';return}branches=data||[];s.innerHTML='<option value="">اختر الفرع</option>';branches.forEach(b=>{const o=document.createElement("option");o.value=b.id;o.textContent=b.name;s.appendChild(o)})}function addToCart(id){const p=products.find(x=>x.id===id);if(!p)return;const e=cart.find(x=>x.product_id===id);if(e)e.quantity++;else cart.push({product_id:p.id,name:p.name_ar||p.name,price:Number(p.price),quantity:1});renderCart()}function changeQuantity(id,ch){const e=cart.find(x=>x.product_id===id);if(!e)return;e.quantity+=ch;if(e.quantity<=0)cart=cart.filter(x=>x.product_id!==id);renderCart()}function renderCart(){const box=document.getElementById("cart"),checkout=document.getElementById("checkout");box.innerHTML="";if(!cart.length){box.innerHTML='<div class="empty">السلة فاضية 🛒</div>';checkout.style.display="none";document.getElementById("summary").innerHTML="";return}checkout.style.display="block";cart.forEach(i=>{const r=document.createElement("div");r.className="cart-item";r.innerHTML=`<div><div>${esc(i.name)}</div><div style="font-size:13px;color:#777">${i.price.toFixed(0)} ج × ${i.quantity}</div></div><div class="qty"><button>-</button><strong>${i.quantity}</strong><button>+</button></div>`;const bs=r.querySelectorAll("button");bs[0].onclick=()=>changeQuantity(i.product_id,-1);bs[1].onclick=()=>changeQuantity(i.product_id,1);box.appendChild(r)});calculateSummary()}function calculateSummary(){const subtotal=cart.reduce((s,i)=>s+i.price*i.quantity,0),service=Math.round(subtotal*.02*100)/100,delivery=subtotal>=500?0:25,total=subtotal+service+delivery+selectedTip,msg=subtotal>=500?"🎉 مبروك! حصلت على توصيل مجاني":`🚚 زوّد ${(500-subtotal).toFixed(0)} جنيه واحصل على توصيل مجاني 🎉`;document.getElementById("summary").innerHTML=`<div class="summary-row"><span>المنتجات</span><strong>${subtotal.toFixed(0)} ج</strong></div><div class="summary-row"><span>رسوم خدمة الطلب</span><strong>${service.toFixed(0)} ج</strong></div><div class="summary-row"><span>التوصيل</span><strong>${delivery?delivery.toFixed(0)+" ج":"مجاني"}</strong></div>${selectedTip?`<div class="summary-row"><span>بقشيش الكابتن</span><strong>${selectedTip} ج</strong></div>`:""}<div class="total">الإجمالي: ${total.toFixed(0)} ج</div><div class="delivery-message">${msg}</div>`}function selectPayment(p,e){selectedPayment=p;document.querySelectorAll(".payment-option").forEach(x=>x.classList.remove("active"));e.classList.add("active")}function selectTip(n,e){selectedTip=n;document.querySelectorAll(".tip-option").forEach(x=>x.classList.remove("active"));e.classList.add("active");calculateSummary()}function checkPromo(){const code=document.getElementById("promoCode").value.trim().toUpperCase(),m=document.getElementById("promoMessage");if(!code){appliedPromo="";m.innerText="اكتب كود الخصم أولاً";m.style.color="#b00020";return}appliedPromo=code;m.innerText="✅ تم حفظ الكود وسيتم التحقق منه عند تأكيد الطلب";m.style.color="#188038"}function showOrderError(m){const b=document.getElementById("orderError");b.innerText="⚠️ "+m;b.style.display="block"}async function submitOrder(){const btn=document.getElementById("confirmBtn"),err=document.getElementById("orderError");err.style.display="none";if(!cart.length)return showOrderError("السلة فاضية");const branchId=document.getElementById("branch").value,address=document.getElementById("address").value.trim(),notes=document.getElementById("deliveryNotes").value.trim();if(!branchId)return showOrderError("من فضلك اختر الفرع");if(!address)return showOrderError("من فضلك اكتب عنوان التوصيل بالتفصيل");btn.disabled=true;btn.innerText="جاري تأكيد الطلب...";try{const r=await fetch(CREATE_ORDER_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({customer_id:customerId,branch_id:Number(branchId),customer_address:address,payment_method:selectedPayment,delivery_notes:notes,promo_code:appliedPromo,tip_amount:selectedTip,items:cart.map(i=>({product_id:i.product_id,quantity:i.quantity}))})}),result=await r.json();if(!r.ok||!result.success)throw Error(result.error||"تعذر إنشاء الطلب");document.getElementById("orderNumber").innerText=result.order?.id||"";document.getElementById("orderSuccess").style.display="block";document.querySelector(".cart-box").style.display="none";window.scrollTo({top:0,behavior:"smooth"});cart=[]}catch(e){showOrderError(e.message||"حدث خطأ أثناء إرسال الطلب");btn.disabled=false;btn.innerText="تأكيد الطلب ❤️"}}loadData();setInterval(loadCustomerPoints,5000);</script></body></html>
