<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>منيو ألبان فلاحي</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f8f5ef;
    color:#222;
}

.container{
    max-width:700px;
    margin:auto;
    padding:18px;
}

.header{
    background:#fff;
    border-radius:22px;
    padding:18px;
    margin-bottom:18px;
    box-shadow:0 5px 20px rgba(0,0,0,.07);
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.logo{
    font-size:25px;
    font-weight:bold;
}

.customer{
    font-size:13px;
    color:#666;
}

.section-title{
    font-size:22px;
    font-weight:bold;
    margin:20px 0 12px;
}

.categories{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:8px;
}

.category{
    border:1px solid #ddd;
    background:#fff;
    padding:10px 15px;
    border-radius:20px;
    white-space:nowrap;
    cursor:pointer;
}

.category.active{
    background:#222;
    color:#fff;
}

.products{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.product{
    background:#fff;
    border-radius:18px;
    padding:12px;
    box-shadow:0 4px 15px rgba(0,0,0,.06);
}

.product-image{
    width:100%;
    height:140px;
    object-fit:cover;
    border-radius:14px;
    background:#eee;
}

.product-name{
    font-weight:bold;
    margin-top:10px;
    font-size:16px;
}

.product-description{
    font-size:12px;
    color:#777;
    margin-top:5px;
    min-height:30px;
}

.product-bottom{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:10px;
}

.price{
    font-weight:bold;
}

.add{
    border:0;
    background:#222;
    color:#fff;
    width:38px;
    height:38px;
    border-radius:12px;
    font-size:22px;
    cursor:pointer;
}

.cart-box{
    background:#fff;
    border-radius:22px;
    padding:18px;
    margin-top:22px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.cart-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    padding:10px 0;
    border-bottom:1px solid #eee;
}

.qty{
    display:flex;
    align-items:center;
    gap:8px;
}

.qty button{
    border:0;
    background:#eee;
    width:30px;
    height:30px;
    border-radius:9px;
    cursor:pointer;
}

.summary-row{
    display:flex;
    justify-content:space-between;
    margin-top:10px;
}

.total{
    font-size:21px;
    font-weight:bold;
    margin-top:15px;
}

.delivery-message{
    background:#f3f3f3;
    padding:12px;
    border-radius:12px;
    margin-top:12px;
    font-size:14px;
}

.empty{
    text-align:center;
    color:#777;
    padding:30px;
}

.logout{
    border:0;
    background:#eee;
    padding:9px 12px;
    border-radius:10px;
    cursor:pointer;
}

@media(max-width:500px){
    .products{
        grid-template-columns:1fr 1fr;
    }

    .product-image{
        height:120px;
    }
}
</style>
</head>

<body>

<div class="container">

<div class="header">

<div>
<div class="logo">🥛 ألبان فلاحي</div>
<div id="customerName" class="customer"></div>
</div>

<button class="logout" onclick="logout()">
خروج
</button>

</div>


<div class="section-title">
الأصناف
</div>

<div id="categories" class="categories"></div>

<div id="products" class="products">
<div class="empty">جاري تحميل الأصناف...</div>
</div>


<div class="cart-box">

<div class="section-title" style="margin-top:0">
🛒 السلة
</div>

<div id="cart"></div>

<div id="summary"></div>

</div>

</div>


<script>

const SUPABASE_URL =
"https://qxwvuxkbcghbkztjrzon.supabase.co";

const SUPABASE_KEY =
"sb_publishable_JI9lC4YPTCQ8CwMxzvHNIA_C24ULpWH";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


let categories = [];
let products = [];
let cart = [];

let selectedCategory = null;


/* =========================
   CUSTOMER
========================= */

const customerId =
localStorage.getItem("alban_customer_id");

const customerName =
localStorage.getItem("alban_customer_name");

if(!customerId){

window.location.href =
"index.html";

}

document.getElementById("customerName")
.innerText =
customerName
? `أهلاً ${customerName} 👋`
: "";


/* =========================
   LOAD DATA
========================= */

async function loadData(){

await loadCategories();

await loadProducts();

renderCategories();

renderProducts();

renderCart();

}


/* =========================
   CATEGORIES
========================= */

async function loadCategories(){

const {
data,
error
} =
await supabaseClient
.from("categories")
.select("*")
.eq("active",true)
.order("sort_order");

if(error){

console.log(error);

return;

}

categories =
data || [];

}


function renderCategories(){

const box =
document.getElementById("categories");

box.innerHTML = "";

const all =
document.createElement("button");

all.className =
"category active";

all.innerText =
"كل الأصناف";

all.onclick = () => {

selectedCategory = null;

document
.querySelectorAll(".category")
.forEach(x =>
x.classList.remove("active")
);

all.classList.add("active");

renderProducts();

};

box.appendChild(all);


categories.forEach(category => {

const button =
document.createElement("button");

button.className =
"category";

button.innerText =
category.name_ar ||
category.name;

button.onclick = () => {

selectedCategory =
category.id;

document
.querySelectorAll(".category")
.forEach(x =>
x.classList.remove("active")
);

button.classList.add("active");

renderProducts();

};

box.appendChild(button);

});

}


/* =========================
   PRODUCTS
========================= */

async function loadProducts(){

const {
data,
error
} =
await supabaseClient
.from("products")
.select("*")
.eq("active",true)
.order("sort_order");

if(error){

console.log(error);

document.getElementById("products")
.innerHTML =
'<div class="empty">تعذر تحميل الأصناف</div>';

return;

}

products =
data || [];

}


function renderProducts(){

const box =
document.getElementById("products");

box.innerHTML = "";

let list =
products;

if(selectedCategory !== null){

list =
products.filter(
p => p.category_id === selectedCategory
);

}


if(!list.length){

box.innerHTML =
'<div class="empty">لا توجد أصناف هنا</div>';

return;

}


list.forEach(product => {

const card =
document.createElement("div");

card.className =
"product";

const image =
product.image_url
? `<img class="product-image" src="${product.image_url}" alt="">`
: `<div class="product-image"></div>`;

const name =
product.name_ar ||
product.name ||
"";

const description =
product.description_ar ||
product.description ||
"";

card.innerHTML = `

${image}

<div class="product-name">
${escapeHtml(name)}
</div>

<div class="product-description">
${escapeHtml(description)}
</div>

<div class="product-bottom">

<div class="price">
${Number(product.price).toFixed(0)} ج
</div>

<button class="add">
+
</button>

</div>

`;

card
.querySelector(".add")
.onclick = () =>
addToCart(product.id);

box.appendChild(card);

});

}


/* =========================
   CART
========================= */

function addToCart(productId){

const product =
products.find(
p => p.id === productId
);

if(!product) return;

const existing =
cart.find(
item => item.product_id === productId
);

if(existing){

existing.quantity++;

}else{

cart.push({

product_id:
product.id,

name:
product.name_ar ||
product.name,

price:
Number(product.price),

quantity:1

});

}

renderCart();

}


function changeQuantity(
productId,
change
){

const item =
cart.find(
x => x.product_id === productId
);

if(!item) return;

item.quantity += change;

if(item.quantity <= 0){

cart =
cart.filter(
x => x.product_id !== productId
);

}

renderCart();

}


/* =========================
   RENDER CART
========================= */

function renderCart(){

const box =
document.getElementById("cart");

const summary =
document.getElementById("summary");

box.innerHTML = "";

summary.innerHTML = "";


if(!cart.length){

box.innerHTML =
'<div class="empty">السلة فاضية 🛒</div>';

return;

}


cart.forEach(item => {

const row =
document.createElement("div");

row.className =
"cart-item";

row.innerHTML = `

<div>

<div>
${escapeHtml(item.name)}
</div>

<div style="font-size:13px;color:#777">
${item.price.toFixed(0)} ج × ${item.quantity}
</div>

</div>

<div class="qty">

<button>-</button>

<strong>
${item.quantity}
</strong>

<button>+</button>

</div>

`;

const buttons =
row.querySelectorAll("button");

buttons[0].onclick =
() =>
changeQuantity(
item.product_id,
-1
);

buttons[1].onclick =
() =>
changeQuantity(
item.product_id,
1
);

box.appendChild(row);

});


calculateSummary();

}


/* =========================
   SUMMARY
========================= */

function calculateSummary(){

const subtotal =
cart.reduce(
(sum,item) =>
sum +
(item.price * item.quantity),
0
);


const serviceFee =
Math.round(
subtotal * 0.02
* 100
) / 100;


const deliveryFee =
subtotal >= 500
? 0
: 25;


const total =
subtotal +
serviceFee +
deliveryFee;


const summary =
document.getElementById("summary");


let deliveryMessage = "";

if(subtotal >= 500){

deliveryMessage =
"🎉 مبروك! حصلت على توصيل مجاني";

}else{

const remaining =
500 - subtotal;

deliveryMessage =
`🚚 زوّد ${remaining.toFixed(0)} جنيه واحصل على توصيل مجاني 🎉`;

}


summary.innerHTML = `

<div class="summary-row">
<span>المنتجات</span>
<strong>${subtotal.toFixed(0)} ج</strong>
</div>

<div class="summary-row">
<span>رسوم خدمة الطلب</span>
<strong>${serviceFee.toFixed(0)} ج</strong>
</div>

<div class="summary-row">
<span>التوصيل</span>
<strong>
${deliveryFee === 0
? "مجاني"
: deliveryFee.toFixed(0)+" ج"}
</strong>
</div>

<div class="total">
الإجمالي: ${total.toFixed(0)} ج
</div>

<div class="delivery-message">
${deliveryMessage}
</div>

`;

}


/* =========================
   ESCAPE
========================= */

function escapeHtml(text){

return String(text)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================
   LOGOUT
========================= */

function logout(){

localStorage.removeItem(
"alban_customer_id"
);

localStorage.removeItem(
"alban_customer_name"
);

localStorage.removeItem(
"alban_customer_phone"
);

window.location.href =
"index.html";

}


/* =========================
   START
========================= */

loadData();

</script>

</body>
</html>
