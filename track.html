<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تتبع الطلب - ألبان فلاحي</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}body{margin:0;background:#f7f4ee;color:#222;font-family:Arial,Tahoma,sans-serif}.wrap{max-width:760px;margin:auto;padding:14px}.card{background:#fff;border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:0 5px 20px rgba(0,0,0,.08)}.brand{font-size:23px;font-weight:900}.muted{color:#777;font-size:13px;margin-top:5px}.status{margin-top:10px;font-weight:900;font-size:18px}.ok{color:#24733a}.wait{color:#9a6500}.bad{color:#a40018}.map{height:58vh;min-height:360px;border-radius:18px;overflow:hidden;margin-top:12px}.info{display:grid;grid-template-columns:1fr 1fr;gap:9px}.pill{background:#fafafa;border:1px solid #eee;border-radius:14px;padding:12px}.pill b{display:block;margin-bottom:5px}.btn{display:block;text-align:center;text-decoration:none;border:0;border-radius:13px;padding:12px;background:#d35400;color:#fff;font-weight:900;margin-top:10px}.back{background:#222}@media(max-width:520px){.info{grid-template-columns:1fr}.map{height:55vh}}</style></head><body><main class="wrap"><section class="card"><div class="brand">🥛 ألبان فلاحي</div><div id="subtitle" class="muted">تتبع طلبك لحظة بلحظة</div><div id="status" class="status wait">جاري تحميل بيانات الطلب...</div></section><section class="card"><div id="info" class="info"></div><div id="map" class="map"></div><div id="message" class="muted"></div><a class="btn back" href="orders.html">📦 الرجوع لطلباتك</a></section></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const API='https://qxwvuxkbcghbkztjrzon.supabase.co/functions/v1/customer-tracking';const customerId=localStorage.getItem('alban_customer_id');const orderRef=new URLSearchParams(location.search).get('order');let map,driverMarker,destinationMarker,routeLine,first=true;const statusText={new:'تم استلام الطلب',confirmed:'تم تأكيد الطلب',preparing:'جاري تحضير الطلب',ready:'الطلب جاهز',assigned:'تم تعيين المندوب',out_for_delivery:'🚗 المندوب في الطريق',delivered:'تم التوصيل',cancelled:'تم إلغاء الطلب'};function esc(s){return String(s??'').replace(/[&<>\"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[x]))}function setStatus(text,cls){const e=document.getElementById('status');e.textContent=text;e.className='status '+cls}function ensureMap(center){if(map)return;map=L.map('map').setView(center||[31.2001,29.9187],13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map)}function point(lat,lng){return lat!=null&&lng!=null&&Number.isFinite(Number(lat))&&Number.isFinite(Number(lng))?[Number(lat),Number(lng)]:null}function marker(existing,coords,label){if(!coords)return existing;if(!existing){const m=L.marker(coords).addTo(map);m.bindPopup(label);return m}existing.setLatLng(coords);existing.bindPopup(label);return existing}async function load(){if(!customerId){location.href='index.html';return}if(!orderRef){setStatus('رقم الطلب غير موجود','bad');return}try{const payload={customer_id:customerId,order_id:orderRef};if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(orderRef))payload.order_number=orderRef;const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'تعذر تحميل التتبع');const o=d.order||{};document.getElementById('subtitle').textContent='طلب #'+(o.order_number||o.id);setStatus(statusText[o.status]||o.status||'حالة الطلب',o.status==='cancelled'?'bad':'ok');const driver=point(d.driver?.current_latitude,d.driver?.current_longitude),dest=point(d.destination?.latitude,d.destination?.longitude),branch=point(d.branch?.latitude,d.branch?.longitude);ensureMap(driver||dest||branch);driverMarker=marker(driverMarker,driver,'🚗 '+(d.driver?.name_ar||'المندوب'));destinationMarker=marker(destinationMarker,dest,'📍 عنوان التوصيل');if(driver&&dest){if(routeLine)routeLine.setLatLngs([driver,dest]);else routeLine=L.polyline([driver,dest],{weight:4,dashArray:'8 8'}).addTo(map)}else if(routeLine){map.removeLayer(routeLine);routeLine=null}if(first){const pts=[driver,dest,branch].filter(Boolean);if(pts.length>1)map.fitBounds(L.latLngBounds(pts),{padding:[30,30]});else if(pts[0])map.setView(pts[0],15);first=false}document.getElementById('info').innerHTML='<div class="pill"><b>🚗 المندوب</b>'+esc(d.driver?.name_ar||'لم يتم التعيين بعد')+'</div><div class="pill"><b>📍 العنوان</b>'+esc(d.destination?.address_text||'العنوان محفوظ في الطلب')+'</div>';document.getElementById('message').textContent=d.driver?.last_location_at?'آخر تحديث لموقع المندوب: '+new Date(d.driver.last_location_at).toLocaleTimeString('ar-EG',{hour:'numeric',minute:'2-digit',second:'2-digit'}):(o.status==='out_for_delivery'?'المندوب لم يرسل موقعه بعد.':'سيظهر موقع المندوب بمجرد بدء التوصيل.');if(o.status==='delivered'||o.status==='cancelled')clearInterval(timer)}catch(e){setStatus('⚠️ '+e.message,'bad')}}let timer=setInterval(load,10000);load();</script></body></html>
